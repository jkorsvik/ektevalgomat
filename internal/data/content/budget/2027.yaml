findings:
  - topic: "Nødnett: nytt nett, nytt departement"
    statement_id: "utsagn-60"
    quote: "Digitaliserings- og forvaltningsdepartementet tok hausten 2025 over ansvaret for prosjektet for nytt nødnett."
    note: >
      Prosjektet for nytt nødnett flyttet fra Justis- og
      beredskapsdepartementet til Digitaliserings- og
      forvaltningsdepartementet høsten 2025, og skal bygges på 5G og
      skivedeling. Bevilgningen er kap. 1543, post 22 «Nytt nødnett» = 324
      mill. kroner, opp 224 mill. fra 2026.
    source_url: "https://www.regjeringen.no/contentassets/df4dc3a3497342129b6d1681ad6d4c9e/nn-no/pdfs/prp202620270001dfddddpdfs.pdf"
  - topic: "Nødnett: kommunene skjermes"
    statement_id: "utsagn-60"
    quote: "Regjeringa foreslår å løyve 85 mill. kroner til å skjerme dei kommunale og frivillige brukarane for høgare brukarbetaling og tilretteleggje for fortsatt bruk av Nødnett."
    note: >
      Dette gjelder dagens nødnett, ikke nytt nødnett. Statens kontrakt om
      drift av dagens nett løper til og med 2031, med opsjon på to års
      forlengelse. De 85 mill. kronene skal skjerme kommunale og frivillige
      brukere mot høyere brukerbetaling for dette eksisterende nettet. Nytt
      nødnett er en annen post med en annen tidshorisont (kap. 1543, post 22,
      eget funn over), og ingen av de to postene beviser alene at staten
      dekker alle framtidige investerings- og driftskostnader.
    source_url: "https://www.regjeringen.no/contentassets/b17d3233f9a34c6cb7591257db3cd415/nn-no/pdfs/prp202620270001_jddddpdfs.pdf"
  - topic: "Bredbånd: ingen ny bevilgning i forslaget"
    statement_id: "utsagn-61"
    quote: "99,3 pst. av husstandane og 98,9 pst. av verksemdene hadde tilbod om høghastigheits breiband med minst 100 Mbit/s nedlastingshastigheit ved utgangen av 2025."
    observed:
      - fiscal_year: 2026
        stage: forslag
        amount: 34110000
      - fiscal_year: 2026
        stage: saldert
        amount: 159110000
      - fiscal_year: 2027
        stage: forslag
        amount: 0
    note: >
      Kap. 1541, post 60 «Bredbåndsutbygging» finnes ikke i 2027-forslaget
      (0 kroner). Regjeringen begrunner det med nesten full dekning: resten
      dekkes av allerede bevilgede midler, lavbanesatellitt og ordningen for
      funksjonell internettilgang. Sammenligningsgrunnlaget må oppgis, for
      det er nettopp her det er lett å lese feil. Regjeringens opprinnelige
      forslag for 2026 var 34,1 mill. kroner, men Stortinget økte posten med
      125 mill. kroner i budsjettforliket, til 159,11 mill. kroner saldert
      2026. Endringen fra vedtatt 2026 er derfor 159,11 → 0, ikke 34,1 → 0.
      Begge tallene er hentet fra fagproposisjonen, som viser regnskap 2025,
      saldert budsjett 2026 og forslag 2027 side om side: der står post 60
      som 415 632, 159 110 og blank (tusen kroner). Dette er en endring i
      regjeringens forslag. Det er ikke et vedtak om å stanse all
      bredbåndsutbygging, og det er ikke i seg selv et løftebrudd.
    source_url: "https://www.regjeringen.no/contentassets/df4dc3a3497342129b6d1681ad6d4c9e/nn-no/pdfs/prp202620270001dfddddpdfs.pdf"
  - topic: "Norgespris økes kraftig"
    statement_id: "utsagn-12"
    quote: "Noregspris gir hushalda moglegheit til å velje ein fast pris per kWh som eit alternativ til straum stønadsordninga."
    note: >
      Energidepartementet foreslår 16 750 mill. kroner til stønads- og
      overføringsordninger på energiområdet, hvorav 12 760 mill. til
      Noregspris for strøm og fjernvarme og 3 600 mill. til strømstønad.
      På postnivå: kap. 1820, post 77 «Norgespris for strøm» = 12 000 mill.
      kroner, opp 2 900 mill. fra 2026. Staten bruker støtteordningen
      Norgespris, ikke en lovbestemt makspris. (Proposisjonen skriver
      «Noregspris»; postnavnet i Gul bok er «Norgespris for strøm».)
    source_url: "https://www.regjeringen.no/contentassets/54db15f0f46f48dbb8312c562cec7b72/nn-no/pdfs/prp202620270001_eddddpdfs.pdf"
  - topic: "Enova: overføringen til Klima- og energifondet kuttes"
    statement_id: ""
    quote: ""
    note: >
      Overføringen til Klima- og energifondet (kap. 1428, post 50) faller fra
      5 905 til 3 002 mill. kroner i forslaget, et kutt på 2 903 mill.
      «Enova halveres» ville være feil: dette er én overføring til fondet,
      ikke halvparten av all Enova-aktivitet. Fondet har en beholdning og
      andre inntekter, og Enova har flere oppgaver enn denne posten dekker.
      Regjeringen sier samtidig at satsingen på målrettede energitiltak i
      bygg gjennom Enova videreføres. Begge er sanne samtidig. Ingen utsagn
      dekker Enova direkte.
    source_url: "https://www.regjeringen.no/contentassets/e8b0bc2d43c24d02a28366b3b38aab17/no/pdfs/prp202620270001klddddpdfs.pdf"
  - topic: "Brann og beredskap"
    statement_id: "utsagn-45"
    quote: ""
    note: >
      Ingen egen bevilgning til brann. Strukturelt: 110-sentralene til
      brann- og redningsvesenet er samlokalisert med politiets 112 og
      helsetjenestens 113 i flere politidistrikt, og et stortingsvedtak ber
      regjeringen utrede en felles beredskapssatsing i Kirkenes for blant
      annet brann og redning, DSB og politiet. Ingen 2027-dokument bruker
      ordet «beredskapspakke».
    source_url: "https://www.regjeringen.no/contentassets/b17d3233f9a34c6cb7591257db3cd415/nn-no/pdfs/prp202620270001_jddddpdfs.pdf"
