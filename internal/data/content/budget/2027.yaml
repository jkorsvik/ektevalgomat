id: budsjett-2027
year: 2027
title: "Statsbudsjettet 2027"
presented: "2026-10-07"
source_name: "Prop. 1 S (2026–2027), Meld. St. 1 (2026–2027) og Prop. 1 LS, samlet for alle departementer"
source_url: "https://www.regjeringen.no/no/statsbudsjett/2027/id3172975/"
retrieved_at: "2026-10-12"
summary: >
  Regjeringen la fram forslaget til statsbudsjett for 2027 den 7. oktober
  2026: 20 dokumenter, 4 640 sider, og et maskinlesbart datagrunnlag (Gul
  bok) med hver kapittel og post. Dette er den samlede oversikten over
  forslaget. Statens tall er hentet fra 2027-filen (én beløpskolonne, ingen
  årskolonne) og sammenlignet med 2026-filen ved siden av, slik at hver post
  får en endring. Sammenligningen gjelder altså regjeringens to forslag.
  Stortinget har ikke vedtatt 2027-budsjettet ennå, og for poster som
  Stortinget endret i 2026, viser endringen mer enn forskjellen mellom
  vedtatt 2026 og foreslått 2027.

