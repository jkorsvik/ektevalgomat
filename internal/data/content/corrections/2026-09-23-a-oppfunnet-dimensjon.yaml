id: 2026-09-23-a-oppfunnet-dimensjon
date: "2026-09-23"
kind: rettelse
title: "Tre utsagn fikk nytt nummer, fordi dimensjonsnavnet var oppfunnet"
statements: ["43", "44", "45"]
what: >
  Tre utsagn var skrevet og nummerert 6, 7 og 8 under dimensjonsnavnet
  «Norsk handlefrihet». De ble flyttet ut av nummereringen 1 til 42 og
  fikk numrene 43, 44 og 45, med merkelappen «Tillegg (utenfor de 42)».
  Nummer 6 var energimarkedssuverenitet (ACER), 7 var digital
  suverenitet, 8 var forsvars- og beredskapssuverenitet.
reason: >
  Arbeidet ble satt i gang uten at forskningsnotatets egen liste over
  dimensjoner ble lest først. Prosjektet trodde navnet «Norsk
  handlefrihet» ikke fantes i notatet, og laget derfor et eget navn og en
  egen nummerering for de tre utsagnene.
effect: >
  De tre utsagnene byttet nummer og adresse. Ingenting ble slettet.
  Kildene bak dem var hentet og kontrollert direkte hos Stortinget, og de
  ble med videre. Ingen partiposisjon var kodet på dem på dette
  tidspunktet, fordi kildesakene var forslag Stortinget hadde fått, men
  ennå ikke behandlet.
