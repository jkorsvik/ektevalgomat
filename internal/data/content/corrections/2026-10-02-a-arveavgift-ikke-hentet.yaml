id: 2026-10-02-a-arveavgift-ikke-hentet
date: "2026-10-02"
kind: rettelse
title: "Arveavgiften var ikke «funnet og utelatt med vilje»"
statements: ["57"]
what: >
  En tidligere oppføring om utsagn 57 sa at stortingsvoteringen bak
  opphevelsen av arveavgiftsloven var funnet, og bevisst utelatt.
reason: >
  Den var aldri hentet eller vurdert. Oppføringen beskrev et
  research-resultat som ikke fantes.
effect: >
  Det står nå at voteringen ikke er hentet eller vurdert, ikke at den ble
  valgt bort. Partiposisjonene på utsagn 57 er uendret: 8 av 9 partier er
  kodet. Ap er fortsatt ukodet, fordi den eneste kilden er Vedums ord om
  Ap, ikke Ap sine egne.
