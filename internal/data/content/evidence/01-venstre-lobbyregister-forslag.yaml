scan_summary: "Venstre fremmet forslag om registreringsmodeller for påvirkning mot Stortinget."
claim_action: >
  Fremmet Dok. 8:53 S (2025–2026) om modeller for registrering av
  påvirkning mot Stortinget og politisk ledelse i regjeringen.
verbatim_excerpt: >
  Stortinget anmoder Stortingets presidentskap om å utrede mulige modeller for
  en registreringsordning for dem som oppsøker Stortinget og Stortingets
  representanter, på vegne av seg selv eller andre, for å påvirke Stortinget i
  saker som er til behandling. … Stortinget ber regjeringen utarbeide mulige
  modeller for en registreringsordning for dem som oppsøker den politiske
  ledelsen i departementene eller på Statsministerens kontor, på vegne av seg
  selv eller andre, for å påvirke regjeringen i saker som er til behandling.
