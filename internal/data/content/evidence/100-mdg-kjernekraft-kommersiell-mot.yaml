verbatim_excerpt: >
  "Komiteens medlemmer fra Arbeiderpartiet, Senterpartiet og
  Miljøpartiet De Grønne understreker at Norges kraftbehov på kort og
  mellomlang sikt må løses gjennom økt utbygging av fornybar kraft
  [...]. Selv i de mest optimistiske scenarioene vil kjernekraft
  tidligst kunne bidra i energisystemet fra 2040-tallet. [...] er disse
  medlemmer opptatt av at den politiske debatten om kjernekraft
  ikke forsinker tiltak som gir mer kraft på kort sikt."
