context_note: >
  Institusjonell kontekst, ikke en partiposisjon i seg selv. Sak_id
  103123 kryssjekket mot data.stortinget.no/eksport/voteringer?sakid=
  103123 (20 voteringer). Denne evidensfilen og partienes egne filer
  dekker kun votering_id 25387 (SVs forslag 19), fordi det er den
  ene voteringen som direkte og eksplisitt tester dette utsagnets
  konkrete krav (bindende plan, hele befolkningen, 2030-frist) — ikke
  Rødts egne, mer detaljerte forslag om frikort og fasing (Dokument
  8:157 S, delvis nedstemt, delvis videreført som del av tilrådingen),
  som tester en litt annen, mer operasjonell akse (mekanisme snarere
  enn tidsfrist/forpliktelse) og bør kodes separat om det bygges en
  egen statement for det. Merk: Ap og Sp stemte mot DETTE forslaget,
  men skriver samtidig i egen merknad at de "ønsker en gradvis
  utvidelse av den offentlige tannhelsetjenesten med mål om å
  likestille den med andre helsetjenester" — samme mål som SVs
  forslag, men uten bindende frist. Se partienes egne evidensfiler for
  hvorfor dette IKKE kodes som prinsipiell motstand mot universell
  tannhelse for disse to partiene.
