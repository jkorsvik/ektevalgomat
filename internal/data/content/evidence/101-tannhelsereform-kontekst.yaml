scan_summary: >
  Stortinget behandlet regjeringens forslag om lovfestet tannhelserett
  for 25-28-åringer sammen med to opposisjonsforslag om å gå videre
  mot en universell tannhelsetjeneste. SVs forslag om en forpliktende
  plan for hele befolkningen innen 2030 ble avvist 9 mot 94; komiteens
  faktiske vedtak var en vaguere, ikke-bindende stortingsmelding om
  "gradvis" utvidelse.
claim_action: >
  Prop. 124 L (2024–2025, regjeringen: lovfestet rett til nødvendig
  tannhelsehjelp for 25-28-åringer, 25 pst. egenbetaling), Dokument
  8:96 S (2024–2025, SV: Marian Hussein, Kirsti Bergstø, Ingrid
  Fiskaa, Grete Wold, "en videre utrulling av en tannhelsereform for
  hele befolkningen") og Dokument 8:157 S (2024–2025, Rødt: Seher
  Aydar, Marie Sneve Martinussen, "å gjennomføre en ordentlig
  tannhelsereform") ble behandlet samlet i Innst. 458 L (2024–2025,
  1669-linjers HTML-tekst lest i fulltekst). SVs forslag 1 (nummerert
  forslag 19 i innstillingen): "Stortinget ber regjeringen fullføre
  tannhelsereformen og legge frem en forpliktende plan som sikrer at
  hele befolkningen er omfattet av en universell rett til
  tannbehandling i det offentlige, på lik linje som med andre
  helsetjenester, innen 2030." Votering_id 25387: 9 for (SV 7, MDG 2),
  94 mot (Ap 29, Sp 18, H 22, FrP 12, R 5, V 5, KrF 2, PF 1). Komiteens
  faktiske tilråding (votering_id 25398-25401, vedtatt, backet av Ap,
  Sp, SV og Rødt) inneholder i stedet en langt svakere formulering
  (Vedtak B, romertall IV): "legge frem en stortingsmelding om
  oppfølging av anbefalingene i NOU 2024:18 [...] og gradvis utvide
  det offentlige ansvaret for tannhelsetjenester" — ingen frist, ingen
  bindende plan.
