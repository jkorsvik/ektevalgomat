claim_confidence: dokumentert
context_note: >
  Kodet +1, ikke +2: Rødts egen skriftlige merknad (delt med SV) sier
  eksplisitt at reformen "skal gjelde hele befolkningen" — samme
  universalistiske mål som SVs forslag 19 uttrykker, så Rødt deler i
  prinsippet IKKE det snudde utsagnets "gradvis, målrettet"-linje. Men
  Rødt stemte likevel mot dette SPESIFIKKE forslaget (den bindende
  2030-fristen), mest sannsynlig fordi de har sin egen konkurrerende
  mekanisme (frikort, fasing, se Dokument 8:157 S) og foretrakk sin egen
  operasjonalisering over SVs — den faktiske stemmen er derfor kodet +1
  (svakt enig i å IKKE binde seg til akkurat denne fristen), ikke et
  reelt +2 om innholdet. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
  2030-årstallsformulering, ikke fordi de er substansielt uenig i
  målet. Dette er en reell, dokumentert spenning mellom skriftlig
  merknad og avstemning som IKKE bør glattes over med en oppfunnet
  forklaring — se evidence/101-tannhelsereform-kontekst.yaml for
  hvorfor bare denne ene voteringen (av 20 på saken) er kodet, og
  merk at Rødts egne forslag om frikort/fasing (forslag 11-15) tester
  en litt annen akse (mekanisme) enn dette utsagnet (bindende frist).
