scan_summary: >
  Rødt stemte mot SVs spesifikke forslag om en 2030-frist, men skriver
  i egen (delt med SV og Pasientfokus) merknad at "en tannhelsereform
  skal gjelde hele befolkningen" — samme mål som SV. Rødt har sitt eget,
  mer detaljerte forslag (Dokument 8:157 S: frikort-mekanisme, fasing,
  gratis tannregulering for barn) i stedet for SVs bindende
  årstallsforpliktelse.
claim_action: >
  Votering_id 25387 (forslag 19, på vegne av SV): Rødt 0 for, 5 mot.
  Rødt fremmet i stedet egne forslag (forslag 11-15, delt med SV og
  Pasientfokus, bl.a. om frikort-ordning og gratis tannregulering for
  barn til 18 år) fra sitt eget Dokument 8:157 S.
verbatim_excerpt: >
  "Komiteens medlemmer fra Sosialistisk Venstreparti, Rødt og
  Pasientfokus mener det er behov for en ordentlig tannhelsereform
  som sikrer at det ikke koster mer å gå til tannlegen enn til
  fastlegen. [...] Disse medlemmer mener at en tannhelsereform skal
  gjelde hele befolkningen."
