scan_summary: >
  Ap stemte mot SVs bindende 2030-forslag, men skriver i egen (delt
  med Senterpartiet) merknad at de vil ha gradvis utvidelse av
  tannhelsetjenesten med mål om å likestille den med andre
  helsetjenester — samme mål, ingen bindende frist.
claim_action: >
  Votering_id 25387, Ap 0 for, 29 mot. Ap er del av
  fireparti-flertallet (med Sp, SV, Rødt) bak tilrådingens
  stortingsmelding-forpliktelse (Vedtak B, romertall IV: "gradvis
  utvide det offentlige ansvaret for tannhelsetjenester").
verbatim_excerpt: >
  "Komiteens medlemmer fra Arbeiderpartiet og Senterpartiet ønsker en
  gradvis utvidelse av den offentlige tannhelsetjenesten med mål om å
  likestille den med andre helsetjenester. Dette er bl.a. fordi
  sosiale helseforskjeller er særlig tydelig innen tann- og
  munnhelse."
status: forslag_avvist_stemte_mot
