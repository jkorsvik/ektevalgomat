claim_confidence: dokumentert
context_note: >
  Kodet +1, ikke +2: dette er nøyaktig Aps egen argumentasjon, gjengitt
  som det snudde utsagnet nå bygger på — Ap deler eksplisitt SVs MÅL
  (likestille tannhelse med andre helsetjenester), og har i denne
  stortingsperioden allerede sikret gratis/rabattert tannhelsehjelp for
  19-24-åringer og nå 25-28-åringer i praksis (1,5 mrd. kroner styrking
  totalt, ifølge egen merknad), men foretrekker et åpent "gradvis"-tempo
  fremfor en bindende 2030-frist. +1 ikke +2 fordi Ap fortsatt deler
  MÅLET om universell dekning, bare ikke fristbindingen. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1. Se evidence/101-tannhelsereform-kontekst.yaml.
