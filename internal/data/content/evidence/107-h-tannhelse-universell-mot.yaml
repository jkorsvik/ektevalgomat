scan_summary: >
  Høyre stemte mot SVs universaliseringsforslag, og går lenger enn de
  andre mot-partiene: de støtter ikke engang regjeringens egen, langt
  mer beskjedne lovfesting av tannhelserett for 25-28-åringer, og
  omprioriterte midlene bort fra tannhelse i sitt alternative budsjett.
claim_action: >
  Votering_id 25387, H 0 for, 22 mot. Høyre er ikke del av
  fireparti-flertallet bak tilrådingen (Ap, Sp, SV, Rødt).
verbatim_excerpt: >
  "Komiteens medlemmer fra Høyre støtter ikke en lovfesting av rett
  til tannhelsetjenester for unge voksne i alderen 25 til 28 år.
  Disse medlemmer vil føre en tannhelsepolitikk for de som trenger
  det mest [...]. Disse medlemmer mener tannhelsetjenesten i Norge
  fungerer godt. Tall fra Statistisk sentralbyrå (SSB) viser at
  nesten 80 pst. av den norske befolkningen har god tannhelse."
status: forslag_avvist_stemte_mot
position: 2
