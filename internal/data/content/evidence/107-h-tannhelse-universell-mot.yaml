source_name: "Innst. 458 L (2024–2025); votering_id 25387"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2024-2025/inns-202425-458l/?all=true"
claim_confidence: dokumentert
context_note: >
  Kodet +2, det klareste "enig"-signalet av de syv (nå snudde)
  mot-partiene: dette er nøyaktig Høyres egen argumentasjon, gjengitt
  som det snudde utsagnet nå hevder — Høyre avviser ikke bare SVs
  bindende 2030-mål, men også regjeringens egen, langt mer beskjedne
  lovfesting for 25-28-åringer, og omprioriterte i sitt alternative
  statsbudsjett for 2025 420 mill. kroner bort fra rabatterte
  tannhelsetilbud til unge voksne (21-24 år) og over til sykehusøkonomi.
  Dette er en substansielt annerledes posisjon enn Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -2 til +2.
  Ap/Sp/Rødt, som alle deler målet om likestilling med andre
  helsetjenester, bare med et annet tempo. Se
  evidence/101-tannhelsereform-kontekst.yaml.
