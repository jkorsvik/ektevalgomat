scan_summary: >
  FrP stemte mot SVs universaliseringsforslag. FrP har ingen egen
  skriftlig merknad om universell tannhelse i denne innstillingen,
  men fremmet i stedet et eget, målrettet forslag om en
  opptrappingsplan for rabatterte (ikke gratis/universelle)
  tannhelsetjenester for eldre og personer med tannsykdommer.
claim_action: >
  Votering_id 25387, FrP 0 for, 12 mot. FrP fremmet eget forslag
  (forslag 18, votering_id 25388, avvist): "Stortinget ber
  regjeringen legge frem en opptrappingsplan som sikrer rabatterte
  tannhelsetjenester til eldre og personer med tannsykdommer som
  krever omfattende behandling."
