context_note: >
  Kodet +1: KrF har ingen skriftlig begrunnelse spesifikt om
  universaliseringsspørsmålet i denne innstillingen. Deres eget forslag
  er avgrenset til navngitte sårbare grupper, ikke en universell
  rettighet for hele befolkningen — samme målrettede logikk som FrPs
  forslag, i tråd med det snudde utsagnets premiss. Lavere
  attribution_confidence av denne grunn. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1. Se evidence/101-tannhelsereform-kontekst.yaml.
