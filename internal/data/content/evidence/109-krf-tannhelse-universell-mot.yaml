scan_summary: >
  KrF stemte mot SVs universaliseringsforslag. KrF har ingen egen
  skriftlig merknad om universell tannhelse i denne innstillingen,
  men fremmet (sammen med Pasientfokus) et eget, avgrenset forslag om
  tannbehandling for spesifikke, særlig sårbare grupper (torturutsatte,
  rusmiddelavhengige) — ikke for hele befolkningen.
claim_action: >
  Votering_id 25387, KrF 0 for, 2 mot. KrF+Pasientfokus fremmet
  forslag 16-17 (votering_id 25389, avvist): styrket tannbehandling
  for personer med sterk angst for tannbehandling (inkl. torturutsatte)
  og gratis oppfølging for rusmiddelavhengige.
