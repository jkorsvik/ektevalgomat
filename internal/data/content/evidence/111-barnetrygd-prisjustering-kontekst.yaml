scan_summary: >
  Stortinget behandlet et bredt Venstre-forslag om 17 tiltak mot
  sosiale forskjeller for barnefamilier. SV og MDG fremmet i
  komitébehandlingen et eget forslag (nr. 4) om å lovfeste årlig
  prisjustering av barnetrygden i barnetrygdloven § 10 -- et tillegg
  Venstres eget opprinnelige dokument ikke inneholdt. Forslaget ble
  avvist 10 mot 91.
claim_action: >
  Dokument 8:11 S (2025–2026), representantforslag fra Abid Raja, Guri
  Melby og Grunde Almeland (alle Venstre) om "en helhetlig og
  forpliktende tiltakspakke for å utjevne og bekjempe sosiale
  forskjeller". Behandlet i Innst. 126 S (2025–2026, familie- og
  kulturkomiteen, 24 sider lest i fulltekst). Forslag 4 (fremmet av SV
  og MDG i komitébehandlingen, IKKE en del av Venstres opprinnelige
  17-punktsliste): "Stortinget ber regjeringen fremme forslag om å
  endre barnetrygdloven § 10 og sikre at barnetrygden prisjusteres
  årlig." Votering_id 26942 (3.3.2026): 10 for (SV 5, MDG 5), 91 mot
  (Ap 32, FrP 29, H 14, R 5, Sp 5, KrF 4, V 2). Komiteens tilråding
  (votering_id 26948, vedtatt av Ap, FrP og H-flertallet): hele
  representantforslaget vedtas ikke.
status: forslag_avvist
