context_note: >
  Institusjonell kontekst. Saken har 15 voteringer totalt (sakid
  104872); denne evidensfilen og partienes egne filer dekker kun
  votering_id 26942, den ene som direkte tester dette utsagnets
  konkrete krav (en lovfestet, automatisk indekseringsmekanisme) --
  ikke de andre 14 (kontantstøtte/ventestøtte, gratis barnehage for
  lavinntekt, sosialhjelpssatser, boligpolitikk for enslige
  forsørgere, osv.), som hver tester en annen, egen akse og bør
  eventuelt kodes som separate utsagn senere. Metodisk funn verdt å
  videreføre: en AI-mellomtjener (web_fetch) ga først en feilaktig
  oppsummering av denne innstillingens vedtak/tilrådingstekst (blandet
  sammen med et annet dokument) -- fanget opp og forkastet FØR noe ble
  skrevet til en evidensfil, ved å hente og lese rå HTML direkte i
  stedet for å stole på mellomtjenerens oppsummering. Se
  docs/roadmap.md "Phase 2i" for detaljer.
