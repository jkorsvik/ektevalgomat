scan_summary: >
  MDG fremmet forslag 4 sammen med SV om å lovfeste årlig
  prisjustering av barnetrygden, og stemte for. MDG fremmet også et
  eget, bredere forslag (15) om å kraftig øke og skattlegge
  barnetrygden, som SV ikke støttet.
claim_action: >
  Forslag 4 (med SV), votering_id 26942: MDG 5 for, 0 mot. MDG fremmet
  også, alene, forslag 15 (votering_id 26938, 5 for/96 mot) om å
  kraftig øke og skattlegge barnetrygden -- et bredere krav enn
  utsagn-31 tester.
