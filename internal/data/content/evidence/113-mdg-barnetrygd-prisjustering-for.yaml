claim_confidence: dokumentert
context_note: >
  Kodet -2 (sterkt uenig i at diskresjonære budsjettvedtak er godt
  nok): MDG er medforslagsstiller til forslag 4 (lovfestet indeksering),
  det motsatte av det snudde utsagnets premiss. MDGs eget forslag 15
  (skattlegging) er en distinkt, snevrere akse og telles ikke med
  her. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2. Se evidence/111-barnetrygd-prisjustering-kontekst.yaml.
