id: ev-2026-02-10-ap-barnetrygd-prisjustering-mot
statement_id: utsagn-31
party_id: ap
actor: "Arbeiderpartiet (familie- og kulturkomiteen)"
date: "2026-02-10"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  Ap stemte mot en lovfestet indekseringsplikt, men skriver samtidig
  at barnetrygden må forbli universell og ikke skattlegges, og
  fremhever egne diskresjonære økninger på 10,5 mrd. kroner siden
  2021. Ap er også del av flertallet (med FrP) som kaller
  representantforslagets tiltak "lite målrettede".
claim_action: >
  Votering_id 26942, Ap 0 for, 32 mot. Del av komiteens flertall
  (med FrP) bak vurderingen at forslagene er lite målrettede og vil
  øke offentlig pengebruk.
verbatim_excerpt: >
  "Disse medlemmer viser [...] at Arbeiderparti-regjeringen, sammen
  med det rødgrønne flertallet på Stortinget, har økt barnetrygden med
  10,5 mrd. kroner fra 2021 til 2025. [...] Komiteens medlemmer fra
  Arbeiderpartiet og Sosialistisk Venstreparti mener det er feil å
  skattlegge barnetrygden, men at barnetrygden må forbli en universell
  ordning."
status: forslag_avvist_stemte_mot
position: 1
source_tier: A
source_name: "Innst. 126 S (2025–2026); votering_id 26942"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2025-2026/inns-202526-126s/?all=true"
claim_confidence: dokumentert
context_note: >
  Kodet +1, ikke +2: dette er nøyaktig Aps egen argumentasjon, gjengitt
  som det snudde utsagnet nå bygger på — Ap foretrekker årlige politiske
  forhandlinger de selv kontrollerer fremfor en bindende, automatisk
  lovfestingsmekanisme, men deler fortsatt målet (universell,
  ikke-skattlagt barnetrygd, egne store diskresjonære økninger), derfor
  +1 ikke +2. Samme mønster som Ap/Sp i tannhelsesaken (evidence/105,
  106): foretrekker diskresjonær kontroll over automatisk forpliktelse,
  ikke uenig i selve målet. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1. Se evidence/111-barnetrygd-prisjustering-kontekst.yaml.
