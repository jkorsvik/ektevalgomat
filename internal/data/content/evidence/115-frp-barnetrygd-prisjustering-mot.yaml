scan_summary: >
  FrP stemte mot, og er del av komiteens flertall (med Ap) som kaller
  representantforslagets tiltak lite målrettede og en svekkelse av
  arbeidslinjen. FrP skriver eksplisitt at veien ut av fattigdom går
  gjennom arbeid, ikke økte offentlige overføringer, og vil heller
  kutte skatter enn utvide velferdsordninger.
claim_action: >
  Votering_id 26942, FrP 0 for, 29 mot. Del av komiteens flertall
  (med Ap).
verbatim_excerpt: >
  "Komiteens flertall, medlemmene fra Arbeiderpartiet og
  Fremskrittspartiet, [...] anerkjenner behovet for tiltak som styrker
  barn og unges oppvekstsvilkår, men mener at flere av forslagene er
  lite målrettede. Tiltakene vil etter flertallets syn føre til en
  betydelig økning i offentlig pengebruk og bidra til å svekke
  arbeidslinjen. [...] Veien ut av fattigdom går primært gjennom
  arbeid, ikke økt avhengighet av offentlige overføringer."
status: forslag_avvist_stemte_mot
