claim_confidence: dokumentert
context_note: >
  Kodet +2 (sterkt enig): dette er nøyaktig FrPs egen argumentasjon
  (delt med Ap i flertallsmerknaden), gjengitt som det snudde utsagnet
  nå hevder — FrPs begrunnelse er eksplisitt prinsipiell/ideologisk
  (arbeid fremfor offentlig avhengighet), ikke bare et spørsmål om
  mekanisme (bindende vs. diskresjonær) som hos Ap/H/KrF — FrP ønsker
  heller skattelettelser enn en varig, lovfestet utvidelse av en
  universell overføring, det sterkeste "enig"-signalet i saken. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -2 til +2. Se evidence/111-barnetrygd-prisjustering-kontekst.yaml.
