verbatim_excerpt: >
  "Komiteens medlemmer fra Fremskrittspartiet og Høyre [...] mener at
  dette sikres best ved å styrke kommunenes frie inntekter og ikke
  gjennom ytterligere øremerking fra Stortinget. [...] Disse medlemmer
  mener dette har budsjettmessige konsekvenser, og at slike tiltak må
  ses i sammenheng med arbeidet med statsbudsjettet."
