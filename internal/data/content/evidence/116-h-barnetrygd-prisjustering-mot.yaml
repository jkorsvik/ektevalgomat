scan_summary: >
  Høyre stemte mot. Til forskjell fra FrPs prinsipielle
  arbeidslinje-argument, begrunner Høyre sin motstand med at slike
  tiltak bør sikres gjennom kommunenes frie inntekter og den ordinære
  budsjettbehandlingen, ikke gjennom en Storting-fastsatt automatisk
  mekanisme.
claim_action: >
