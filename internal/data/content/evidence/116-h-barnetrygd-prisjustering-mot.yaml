context_note: >
  Kodet +1, ikke +2: Høyres egen begrunnelse er mer prosessuell
  (kommunal frihet, budsjettbehandling) enn FrPs prinsipielle
  arbeidslinje-argument, men peker samme vei som det snudde utsagnet —
  en mildere, mer strukturell innvending mot denne SPESIFIKKE bindende
  mekanismen, ikke en generell avvisning av offentlig omfordeling til
  barnefamilier. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1. Se evidence/111-barnetrygd-prisjustering-kontekst.yaml.
