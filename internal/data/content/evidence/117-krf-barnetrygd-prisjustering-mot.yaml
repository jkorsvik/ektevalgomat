id: ev-2026-02-10-krf-barnetrygd-prisjustering-mot
statement_id: utsagn-31
party_id: krf
actor: "Kristelig Folkeparti (familie- og kulturkomiteen)"
date: "2026-02-10"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  KrF stemte mot forslag 4 (lovfestet indeksering), men støtter en
  betydelig, egen diskresjonær økning av barnetrygden gjennom sitt
  alternative budsjett (til 2 250 kr/mnd), og fremmet forslag 1-3 med
  SV og MDG om andre barnefamilie-tiltak. KrF signerte ikke forslag 4
  selv, uten at det finnes en egen skriftlig begrunnelse spesifikt om
  hvorfor de valgte diskresjonær økning over lovfestet indeksering.
claim_action: >
  Votering_id 26942, KrF 0 for, 4 mot. KrF fremmet sammen med SV og
  MDG forslag 1-3 (økt grunnbemanning i barnehager, styrket
  minoritetsspråklig tilskudd, barnets-beste i sosialtjenesteloven) --
  ikke forslag 4.
verbatim_excerpt: >
  "Komiteens medlem fra Kristelig Folkeparti mener [...] at
  Kristelig Folkeparti i sitt alternative budsjett har prioritert en
  betydelig økning av barnetrygden til 2 250 kroner per måned. En slik
  økning vil løfte om lag 5 000 flere barn ut av vedvarende
  lavinntekt, ifølge tall fra Finansdepartementet."
status: forslag_avvist_stemte_mot
