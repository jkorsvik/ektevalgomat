claim_confidence: dokumentert
attribution_confidence: svakt_dokumentert
context_note: >
  Kodet +1 med lavere attribution_confidence: KrFs skriftlige begrunnelse
  gjelder BELØPET (en langt større, egen økning enn dagens nivå gjennom
  eget alternativt budsjett), ikke en direkte forklaring på hvorfor de
  avviser en lovfestet indekseringsplikt spesifikt — men stemmen mot
  forslag 4 er i tråd med det snudde utsagnets premiss. KrF er ikke
  prinsipielt mot høyere barnetrygd -- tvert imot -- men signerte ikke
  forslag 4. Samme diskresjon-over-automatikk-mønster som Ap/H, men
  uten en egen Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
  eksplisitt begrunnelse for VALGET av mekanisme. Se
  evidence/111-barnetrygd-prisjustering-kontekst.yaml.
