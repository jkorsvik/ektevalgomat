scan_summary: >
  Venstre stemte mot forslag 4, selv om de er opprinnelig forslagsstiller
  til hele saken (Dokument 8:11 S, ved Abid Raja, Guri Melby og Grunde
  Almeland). Forslag 4 er imidlertid IKKE en del av Venstres
  opprinnelige 17-punktsliste -- det ble lagt til av SV og MDG under
  komitébehandlingen -- så dette er ikke et tilfelle av at et parti
  stemmer mot sitt eget forslag.
claim_action: >
