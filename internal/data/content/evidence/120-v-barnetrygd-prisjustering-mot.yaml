context_note: >
  Kodet +1 utelukkende på stemmegivningen, i tråd med det snudde
  utsagnets premiss. Presisering for å unngå en feilslutning tilsvarende
  Phase 2g-funnet (parti stemmer "mot sitt eget forslag"): forslag 4 ble
  lagt TIL av SV/MDG under komitébehandlingen og var ikke en del av
  Venstres opprinnelige 17-punktsliste -- verifisert direkte mot
  dokumentets innledning. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1. Se evidence/111-barnetrygd-prisjustering-kontekst.yaml.
