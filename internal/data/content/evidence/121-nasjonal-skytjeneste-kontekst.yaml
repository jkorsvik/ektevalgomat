context_note: >
  Institusjonell kontekst. Saken har 22 voteringer totalt (sakid
  200036); denne evidensfilen og partienes egne filer dekker kun
  votering_id 27485 (forslag 11, SV+Rødt), den mest direkte testen av
  dette utsagnets konkrete krav (offentlig EIERSKAP og DRIFT av
  skyen) -- ikke de andre 21 (bl.a. forslag 1, FrP+SV+Rødts svakere
  "utrede først innen 2027"-versjon av samme idé, og forslag 14,
  Rødt+MDGs alternative "eierskapsmodell-agnostiske" versjon som
  krever tilgjengelig suveren infrastruktur uten å kreve statlig
  eierskap spesifikt). Disse to alternative forslagene er nevnt i
  partienes egne evidensfiler der de er relevante for å forklare et
  "mot"-stemme uten prinsipiell motstand mot digital suverenitet som
  mål. Statement 44 (digital suverenitet, utenfor de 42) bruker samme
  innstilling men et ANNET forslag (nr. 4, om norsk/europeisk
  jurisdiksjon) og er separat, uavhengig kodet -- se docs/roadmap.md
  "Explicitly NOT built yet" for hvorfor statement 44 fortsatt ikke er
  bygget (skop-mismatch, "europeisk" testet mot "nordisk" spurt).
