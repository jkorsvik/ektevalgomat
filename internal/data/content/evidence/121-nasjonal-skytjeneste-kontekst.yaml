scan_summary: >
  Stortinget behandlet SVs representantforslag om digital suverenitet.
  SV og Rødt fremmet i komitébehandlingen et konkret forslag om å
  etablere en nasjonal skytjeneste eid og driftet av det offentlige.
  Regjeringens egen konseptvalgutredning (KVU) hadde alt vurdert og
  frarådet nettopp en lukket, statlig skytjeneste som den dyreste
  løsningen. Forslaget ble avvist 10 mot 91.
claim_action: >
  Dokument 8:119 S (2025–2026), representantforslag fra Ingrid
  Fiskaa, Marthe Hammer, Sunniva Holmås Eidsvoll, Mirell
  Høyer-Berntsen, Kirsti Bergstø og Anne Lise Gjerstad Fredlund (alle
  SV) om "digital suverenitet i en urolig tid". Behandlet i Innst. 225
  S (2025–2026, kommunal- og forvaltningskomiteen, 17 sider lest i
  fulltekst). Forslag 11 (SV og Rødt): "Stortinget ber regjeringen
  sikre oppretting av en nasjonal skytjeneste som eies og driftes av
  det offentlige, for lagring av data og som et offentlig
  arbeidsverktøy." Votering_id 27485 (sakid 200036): 10 for (SV 5,
  Rødt 5), 91 mot (Ap 32, FrP 29, H 14, Sp 5, MDG 5, KrF 4, V 2).
  Statsrådens svarbrev viser til at en konseptvalgutredning (KVU) om
  nasjonal skytjeneste allerede er gjennomført, der en lukket statlig
  sky ble vurdert som den dyreste løsningen og ekstern kvalitetssikring
  anbefalte å ikke gå videre med konseptet. Komiteens tilråding
  (fremmet av FrP, H og SV; falt 47 mot 54 i votering_id 27496, se
  utsagn-59): regjeringen skulle kartlegge Norges digitale avhengigheter
  og levere første rapport til Stortinget innen utgangen av 2026 --
  ingen forpliktelse til å etablere egen skytjeneste.
