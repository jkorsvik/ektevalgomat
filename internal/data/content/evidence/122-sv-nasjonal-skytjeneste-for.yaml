  SV er selv forslagsstiller til hele saken og fremmet forslag 11
  sammen med Rødt om å etablere en statlig eid og driftet
  skytjeneste. SV mener det finnes nok IT-kompetanse i Norge og at
  dette er en forutsetning for nasjonal kontroll over data.
claim_action: >
  Forslag 11 (med Rødt), votering_id 27485: SV 5 for, 0 mot.
verbatim_excerpt: >
  "Komiteens medlemmer fra Sosialistisk Venstreparti og Rødt viser til
  at en rekke land nå er i ferd med å utvikle egne, nasjonale
  skytjenester [...] Disse medlemmer mener det finnes nok
  IT-kompetanse i Norge til å få til offentlige skytjenester laget og
  drevet i Norge, og at dette er en forutsetning for nasjonal
  kontroll."
