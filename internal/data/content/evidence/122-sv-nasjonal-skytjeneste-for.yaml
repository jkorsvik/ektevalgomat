context_note: >
  Kodet -2 (sterkt uenig i at smart suverenitet er godt nok): SV er
  forslagsstiller til hele Dokument 8:119 S og medforslagsstiller til
  forslag 11 spesifikt (statlig eid skytjeneste), med egen utfyllende
