context_note: >
  Kodet -2 (sterkt uenig i at smart suverenitet er godt nok): Rødt er
  medforslagsstiller til forslag 11 med egen, konkret historisk
  begrunnelse (covid-19/Microsoft-episoden), det motsatte av det snudde
  utsagnets premiss. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2. Se evidence/121-nasjonal-skytjeneste-kontekst.yaml.
