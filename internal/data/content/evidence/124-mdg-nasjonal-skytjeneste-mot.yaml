context_note: >
  Kodet +1: dette er en ekte, substansiell forskjell i POLITIKK (hvilken
  eiermodell), ikke bare en mekanisme-preferanse som i tannhelse- og
  barnetrygdsakene -- MDG argumenterer eksplisitt mot å låse valget til
  statlig eierskap, og fremmer en risikodifferensiert, eierskaps-agnostisk
  modell i stedet — nærmere det snudde utsagnets "smart suverenitet"
  enn et rent statlig alternativ, men MDG deler fortsatt målet (suveren
  infrastruktur, redusert avhengighet), bare ikke MIDDELET Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
