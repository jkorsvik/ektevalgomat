scan_summary: >
  MDG stemte mot forslag 11 (statlig eid og driftet sky), men deler
  fullt ut bekymringen for Norges digitale avhengighet av et fåtall
  utenlandske teknologiselskaper. MDG fremmet i stedet, sammen med
  Rødt, et eierskaps-agnostisk forslag 14: suveren infrastruktur skal
  være tilgjengelig for hele offentlig sektor, uten å låse valget til
  statlig eierskap spesifikt.
claim_action: >
  Votering_id 27485 (forslag 11), MDG 0 for, 5 mot. MDG fremmet i
  stedet forslag 14 (med Rødt, votering_id 27482, 10 for/91 mot).
verbatim_excerpt: >
  "Spørsmålet om nasjonal sky bør imidlertid ikke reduseres til et
  valg mellom full statlig alenegang og fortsatt avhengighet av
  kommersielle hyperscale-leverandører. Det avgjørende er at suveren
  infrastruktur er tilgjengelig for hele offentlig sektor [...] Hva
  slags eiermodell som velges, bør styres av risiko, behov og
  kapasitet."
