scan_summary: >
  FrP stemte mot forslag 11, men er sammen med SV og Rødt i en delt
  merknad som eksplisitt sier Norge trenger en nasjonal skytjeneste og
  viser til NSMs anbefaling siden 2023. FrP fremmet i stedet, sammen
  med SV og Rødt, en svakere versjon (forslag 1): utrede og komme
  tilbake til Stortinget innen statsbudsjett for 2027, i stedet for å
  forplikte til bygging nå.
claim_action: >
  Votering_id 27485 (forslag 11), FrP 0 for, 29 mot. FrP fremmet i
  stedet forslag 1 (med SV og Rødt, votering_id 27495, 44 for/57 mot):
  "utrede og komme tilbake til Stortinget innen statsbudsjett for
  2027 med en modell for offentlig skytjeneste."
verbatim_excerpt: >
  "Komiteens medlemmer fra Fremskrittspartiet og Rødt er enige i at
  Norge trenger en nasjonal skytjeneste, og viser til at Nasjonal
  sikkerhetsmyndighet, NSM, har anbefalt en nasjonal
  skylagringstjeneste i Norge siden 2023."
status: forslag_avvist_stemte_mot
position: 1
source_tier: A
source_name: "Innst. 225 S (2025–2026); votering_id 27485, 27495"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2025-2026/inns-202526-225s/?all=true"
claim_confidence: dokumentert
context_note: >
  Kodet +1, ikke +2: FrPs egen skriftlige merknad er eksplisitt FOR
  behovet for en nasjonal skytjeneste -- de stemte mot DENNE spesifikke,
  umiddelbart forpliktende versjonen (forslag 11), men stemte samtidig
  FOR en svakere "utred og kom tilbake i 2027"-versjon av samme idé
  (forslag 1). FrPs reelle posisjon er dermed svakere enig i det snudde
  utsagnet enn stemmen alene tilsier — partiet DELER målet om en statlig
  skyløsning, bare ikke bindingsgraden i akkurat dette forslaget, derfor
  +1 ikke +2. Samme "deler mål, ulik bindingsgrad"-mønster som gjentatte
  ganger i denne Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
  datasettet (Ap/Sp/H i tannhelsesaken, Ap/H/KrF i barnetrygdsaken),
  denne gangen fra en annen part av det politiske spekteret. Se
  evidence/121-nasjonal-skytjeneste-kontekst.yaml.
