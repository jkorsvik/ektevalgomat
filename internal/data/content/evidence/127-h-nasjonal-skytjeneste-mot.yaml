claim_confidence: dokumentert
context_note: >
  Kodet +2: dette er nøyaktig Høyres egen "smart suverenitet"-doktrine,
  gjengitt som det snudde utsagnet nå hevder — Høyres begrunnelse er den
  mest prinsipielle av alle mot-partiene mot en statlig skytjeneste; de
  bruker ordet "statlige monopoler" som en negativ motsats til sin egen
  doktrine, ikke bare et kostnads- eller utredningsargument som Ap.
  Samme mønster som Høyres rolle som klareste motstander i
  tannhelsesaken (evidence/107). Se
  evidence/121-nasjonal-skytjeneste-kontekst.yaml. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -2 til +2.
