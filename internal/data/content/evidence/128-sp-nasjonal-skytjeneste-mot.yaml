scan_summary: >
  Sp stemte mot forslag 11. Sp er med i to ulike delte merknader som
  ved første lesning kan se ut som en selvmotsigelse: en med FrP og
  Rødt som sier Norge trenger en dreining mot større digital
  egenevne, og en med Høyre som kaller de konkrete forslagene
  urealistiske og ikke kostnadseffektive.
claim_action: >
  Votering_id 27485, Sp 0 for, 5 mot.
verbatim_excerpt: >
  "Komiteens medlemmer fra Fremskrittspartiet, Senterpartiet og Rødt
  er enige i at det må tas grep for å sikre større digital
  suverenitet [...] Komiteens medlemmer fra Høyre og Senterpartiet
  deler intensjonen bak representantforslaget [...] Disse medlemmer
  vil likevel understreke at de konkrete forslagene som fremmes,
  verken er realistiske, kostnadseffektive eller egnet til å styrke
  Norges reelle digitale suverenitet i praksis."
status: forslag_avvist_stemte_mot
position: 1
source_tier: A
source_name: "Innst. 225 S (2025–2026); votering_id 27485"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2025-2026/inns-202526-225s/?all=true"
claim_confidence: dokumentert
context_note: >
  Kodet +1: dette er IKKE en selvmotsigelse -- Sp deler MÅLET (større
  digital egenevne/suverenitet, samme delte merknad som FrP+Rødt), men
  er skeptisk til at DENNE spesifikke løsningen (statlig eid sky) er
  realistisk eller kostnadseffektiv (samme delte merknad som Høyre) —
  nettopp den skepsisen det snudde utsagnet bygger på. Samme "deler mål,
  skeptisk til middel"-mønster gjentatt fra en tredje vinkel i samme
  sak. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1. Se
  evidence/121-nasjonal-skytjeneste-kontekst.yaml.
