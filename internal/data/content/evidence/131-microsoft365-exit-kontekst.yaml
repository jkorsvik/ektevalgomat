scan_summary: >
  Stortinget behandlet samme representantforslag om digital
  suverenitet som utsagn-19 (Innst. 225 S). SV, Rødt og MDG fremmet i
  komitébehandlingen et konkret forslag om en nasjonal exit-strategi
  fra store internasjonale IT-plattformer som Microsoft 365.
  Forslaget ble avvist 15 mot 86.
claim_action: >
  Votering_id 27490, forslag nr. 6 (registrert "på vegne av SV og
  R", men merknadsteksten identifiserer forslagsstillerne som
  komiteens medlemmer fra SV, Rødt og MDG samlet): "Stortinget ber
  regjeringen utarbeide en nasjonal exit-strategi for utfasing av
  store internasjonale kommersielle IT-plattformer, slik som
  Microsoft 365, i statsforvaltningen og i virksomheter med kritiske
  samfunnsfunksjoner, slik blant annet danske myndigheter gjør, med
  sikte på rask overgang til nye systemer." Avvist 15 for / 86 mot,
  fordelt SV 5, R 5, MDG 5 for; Ap, FrP, H, KrF, Sp, V mot (full
  fordeling i partikortene).
