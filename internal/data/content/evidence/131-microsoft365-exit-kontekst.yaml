context_note: >
  Institusjonell kontekst, ikke én enkelt partis posisjon — se
  evidence/121-nasjonal-skytjeneste-kontekst.yaml for samme sak,
  annet forslag (11 om offentlig eid sky, ikke leverandøruavhengighet
  som her). To forslag fra samme innstilling, testet som separate
  utsagn (19 og 20) fordi de tester ulike mekanismer under samme
  dimensjon: eierskap av infrastruktur (19) versus uavhengighet fra
  en navngitt leverandør (20). Samme innstilling har ytterligere 19
  voteringer (forslag 1-5, 7-10, 12-21) som ikke er bygget som egne
  utsagn — se docs/roadmap.md Phase 2j for kandidatlisten
  (leverandørlåsing/åpen kildekode-innkjøp, Palantir-forbud,
  Datatilsynets ressurser, uavhengig digitalt kriseråd, m.fl.).
