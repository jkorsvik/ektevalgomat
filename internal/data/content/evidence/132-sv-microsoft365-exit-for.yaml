context_note: >
  Kodet -2 (sterkt uenig i at mangfold og konkurranse er godt nok): SV
  er medforslagsstiller med egen, detaljert skriftlig begrunnelse
  (høringsinnspill fra Redd Barna og Personvernkommisjonens utredning
  navngitt konkret) for en rask exit-strategi, det motsatte av det
  snudde utsagnets premiss. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
