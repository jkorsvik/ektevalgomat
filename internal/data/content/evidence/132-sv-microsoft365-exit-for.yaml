scan_summary: >
  SV stemte for, som medforslagsstiller sammen med Rødt og MDG.
claim_action: >
  Votering_id 27490, SV 5 for, 0 mot. Fra komitémerknaden (SV, Rødt
  og MDG samlet): "Disse medlemmer viser til at svært mange av
  høringsinstansene peker på at Norge i altfor stor grad i dag er
  avhengig av store internasjonale teknologiaktører i Kina og USA.
  [...] Disse medlemmer viser til at Redd Barna i sitt høringsinnspill
  peker på at det er særlig problematisk at skolen i så stor grad er
  avhengig av noen få store teknologigiganter. De viser blant annet
  til at Personvernkommisjonens utredning pekte på at en ikke har god
  nok demokratisk kontroll over hvordan skolesektoren lager, deler og
  selger barns personopplysninger."
verbatim_excerpt: >
  Svært mange av høringsinstansene peker på at Norge i altfor stor
  grad i dag er avhengig av store internasjonale teknologiaktører i
  Kina og USA. Dette er aktører som på sin side igjen har et eget
  avhengighetsforhold til egne myndigheter, og som gjør tjenestene
  ytterlige sårbare.
