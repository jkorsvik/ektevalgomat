context_note: >
  Kodet -2 (sterkt uenig i at mangfold og konkurranse er godt nok),
  samme grunnlag som SV, det motsatte av det snudde utsagnets premiss.
  Rødt er dessuten den eneste partiet som i denne saken (Innst. 225 S)
  har stemt for både det statlig-eide-sky-forslaget (utsagn-19, forslag
  11) og dette leverandøruavhengighet-forslaget (forslag 6) —
  konsistent linje på tvers av begge mekanismene dimensjonen tester
  (eierskap og uavhengighet), i motsetning til f.eks. MDG som skiller
  mellom dem Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
  (se evidence/124 for MDGs alternative eierskapsmodell i utsagn-19).
