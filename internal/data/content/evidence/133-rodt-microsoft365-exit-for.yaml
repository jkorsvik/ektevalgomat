scan_summary: >
  Rødt stemte for, som medforslagsstiller sammen med SV og MDG.
claim_action: >
  Votering_id 27490, R 5 for, 0 mot. Samme delte merknad som SV (se
  evidence/132) — Rødt er medforslagsstiller, ikke bare medstemmer,
  og deler den samme skriftlige begrunnelsen om avhengighet av
  kinesisk- og amerikanskeide teknologiaktører og skolesektorens
  personvernsårbarhet.
verbatim_excerpt: >
  Det er allerede flere eksempler på at land og institusjoner,
  inkludert i Norge, har satt begrensninger for kinesiskeide aktører.
  I Europa ser en nå en rekke land som setter begrensninger for
  amerikanskeide selskaper, og som er godt i gang med å etablere
  egne exit-strategier.
