context_note: >
  Kodet -2 (sterkt uenig i at mangfold og konkurranse er godt nok): MDG
  er dokumentert medforslagsstiller i merknadsteksten selv om
  votering-metadataens korte tittel ("på vegne av SV og R") ikke nevner
  MDG eksplisitt — stemmefordelingen (MDG 5 for, 0 mot) bekrefter at
  hele MDGs gruppe stemte i tråd med den delte begrunnelsen, det
  motsatte av det snudde utsagnets premiss. Merk kontrasten til
  utsagn-19 der MDG stemte mot forslag 11 (statlig eid sky) og heller
  fremmet en egen, Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
  eierskapsagnostisk variant (forslag 14) — MDG skiller altså
  konsekvent mellom "uavhengighet fra en navngitt leverandør" (som
  denne saken, der de er helt med) og "bindende statlig eierskap som
  mekanisme" (som utsagn-19, der de har en alternativ løsning).
