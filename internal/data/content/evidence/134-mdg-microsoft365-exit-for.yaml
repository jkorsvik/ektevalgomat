  MDG stemte for, som medforslagsstiller sammen med SV og Rødt.
claim_action: >
  Votering_id 27490, MDG 5 for, 0 mot. Samme delte merknad som SV og
  Rødt (se evidence/132) — MDG er navngitt medforslagsstiller
  ("Komiteens medlemmer fra Sosialistisk Venstreparti, Rødt og
  Miljøpartiet De Grønne viser til...") på selve begrunnelsen forut
  for forslaget, selv om votering-systemets korte tittel bare nevner
  "SV og R".
