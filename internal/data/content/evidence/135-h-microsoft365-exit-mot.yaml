context_note: >
  Kodet +2 (sterkt enig): dette er nøyaktig Høyres egen argumentasjon,
  gjengitt som det snudde utsagnet nå hevder — Høyre er den eneste
  partiet i denne saken med en detaljert, saksspesifikk operasjonell
  begrunnelse (peker konkret på at det danske forbildet er et
  pilotprosjekt, ikke en hurtig nasjonal exit, og at ingen modne
  alternativer finnes) — samme rolle Høyre spilte i tannhelsesaken
  (Phase 2h, evidence/107-h-tannhelse-universell-mot.yaml) og i
  utsagn-19 for samme innstilling: Høyres egen skriftlige merknad er
  gjennomgående den mest eksplisitte og substansielt begrunnede
  posisjonen i denne innstillingen. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -2 til +2.
