id: ev-2026-04-28-h-microsoft365-exit-mot
statement_id: utsagn-20
party_id: h
actor: "Høyre (kommunal- og forvaltningskomiteen)"
date: "2026-04-28"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  Høyre stemte mot, med en detaljert skriftlig begrunnelse som
  konkret navngir Microsoft 365-eksemplet og avviser tempoet i
  forslaget som operasjonelt uforsvarlig.
claim_action: >
  Votering_id 27490, H 0 for, 14 mot. Fra Høyres egen merknad (delt
  innledning med Sp om "smart suverenitet", deretter Høyre alene):
  "Et illustrerende eksempel er forslaget om å fase ut Microsoft 365
  fra hele statsforvaltningen 'fortløpende i løpet av 2026'. Disse
  medlemmer vil påpeke at det danske eksempelet forslagsstillerne
  viser til, er et langsiktig pilotprosjekt – ikke en nasjonal
  exit-plan med en tidshorisont på få måneder. Det å gjennomføre en
  slik utfasing i den skalaen og det tempoet forslaget beskriver,
  ville medføre operasjonelt kaos og betydelige kostnader, uten at
  det finnes modne og skalerbare alternativer som kan erstatte
  eksisterende løsninger på en forsvarlig måte."
verbatim_excerpt: >
  Svaret på avhengighet av internasjonale teknologigiganter er
  mangfold og konkurranse – ikke statlige monopoler eller isolasjon
  fra den teknologiske utviklingen. [...] Disse medlemmer merker seg
  at flere høringsinnspill og fageksperter støtter intensjonen bak
  forslaget, men er skeptiske til de konkrete tiltakene som fremmes.
  Disse medlemmer deler denne vurderingen.
status: forslag_avvist_stemte_mot
