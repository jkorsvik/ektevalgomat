context_note: >
  Kodet +1 fra stemmetallet alene (32 mot forslaget om rask exit, 0
  for), i tråd med det snudde utsagnets premiss — ingen skriftlig
  Ap-begrunnelse i denne innstillingen for noe forslag, verken for
  dette eller for utsagn-19s forslag 11. Norsk innstillingspraksis: en
  komitémajoritet som støtter tilrådingen (avvisning) uten videre
  kommentar er ikke uvanlig og betyr ikke fravær av standpunkt — bare
  fravær av skriftlig begrunnelse utover selve stemmen. Lavere
  attribution_confidence enn Høyre/Sp av denne grunn, samme mønster som
  i utsagn-19 (evidence/126-ap-nasjonal-skytjeneste-mot.yaml, der Ap
  derimot HADDE en egen merknad som siterte regjeringens KVU — verdt å
  merke at Ap altså skriver merknader selektivt, ikke aldri). Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
retrieved_at: "2026-09-24"
