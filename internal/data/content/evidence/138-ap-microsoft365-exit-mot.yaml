scan_summary: >
  Ap stemte mot. Ap har ingen egen skriftlig merknad i denne
  innstillingen om verken dette forslaget eller saken generelt —
  innstillingen inneholder ingen "Flertallet"-merknad, og den
  komitémajoriteten som stemte mot (Ap, FrP, H, KrF, Sp, V)
  begrunner ikke tilrådingen om avvisning i fellesskap noe sted i
  teksten utover Høyre/Sps egne, delvis delte avsnitt.
claim_action: >
  Votering_id 27490, Ap 0 for, 32 mot — den klart største
  mot-blokken numerisk. Ingen egen Ap-merknad funnet i innstillingens
  fulltekst for dette eller andre forslag i saken.
