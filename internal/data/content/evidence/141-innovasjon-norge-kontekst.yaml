context_note: >
  Institusjonell kontekst, ikke én enkelt partis posisjon. Første
  utsagn i Dimensjon 5 (Innovasjon / omstillingsevne, 21-23), som til
  nå har vært helt tom. Saken er uvanlig godt differensiert: fire
  reelt distinkte argumentasjonslinjer er dokumentert i innstillingen,
  ikke bare "for" og "mot" med generiske begrunnelser — se
  evidence/145+146 (Ap/MDG: effektivitet/rolleavklaring), evidence/147
  (FrP: eksplisitt 1,6 mrd. kr nedskalering i alternativt budsjett),
  evidence/148+149 (H/KrF: deler målet, men mener Innovasjon Norge
  selv bør velge egen organisasjonsform — samme mønster som i
  tannhelse- og nasjonal sky-sakene der "mot" betyr uenighet om
  bindende styring, ikke om målet), og evidence/142+143+144 (SV/Sp/R:
  prinsipiell forsvar av desentralisering som en forutsetning for
  regional næringsutvikling "i et langstrakt land"). Forslag 2 i
  samme innstilling (om Vekst- og gründersenteret i Førde spesifikt)
  er ikke bygget som eget utsagn — en mer geografisk avgrenset
  variant av samme sak, kandidat for utsagn 22 eller 23 hvis en
  ønsker en mer konkret/lokal test av samme dimensjon.
