scan_summary: >
  Stortinget behandlet et representantforslag fra Sp om å sikre at
  Innovasjon Norge opprettholder en desentralisert struktur i møte
  med innsparinger. Forslaget ble avvist 15 mot 86; alternativ
  votering mellom innstillingen og forslaget ble vedtatt 86 mot 15.
claim_action: >
  Dokument 8:267 S (2025-2026), Innst. 424 S (2025-2026). Fremmet av
  Geir Pollestad, Erling Sande og Bent-Joacim Bentzen (Sp).
  Votering_id 28197, forslag nr. 1 fra SV, Sp og R: "Stortinget ber
  regjeringen sikre at Innovasjon Norge opprettholder en
  desentralisert struktur, og at nødvendige innsparinger ikke
  gjennomføres gjennom nedleggelse eller svekkelse av regionkontor
  eller regionale fagmiljø." Avvist 15 for / 86 mot, fordelt SV 5,
  Sp 5, R 5 for; Ap, FrP, H, KrF, MDG, V mot (full fordeling i
  partikortene).
