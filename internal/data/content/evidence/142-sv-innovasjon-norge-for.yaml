actor: "Sosialistisk Venstreparti (næringskomiteen)"
date: "2026-06-10"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  SV stemte for, som medforslagsstiller sammen med Sp og Rødt, med en
  prinsipiell begrunnelse om desentralisering som forutsetning for
  regional næringsutvikling.
claim_action: >
  Votering_id 28197, SV 5 for, 0 mot. Fra den delte merknaden (SV,
  Sp og Rødt): "Disse medlemmer mener det er et grunnleggende
  prinsipp at virkemiddelapparatet skal være desentralisert, med
  nærhet til bedrifter i hele landet. En slik organisering er
  spesielt viktig i et langstrakt land som Norge, med store
  geografiske forskjeller i både næringsstruktur og
  utviklingsbehov."
verbatim_excerpt: >
  Innovasjon Norge er en sentral aktør i det næringsrettede
  virkemiddelapparatet, og således viktig for utvikling, omstilling
  og verdiskaping i hele landet. [...] Disse medlemmer merker seg at
  Innovasjon Norge har varslet omfattende omstillingsgrep, inkludert
  betydelige kutt i årsverk og endringer i regionstrukturen.
