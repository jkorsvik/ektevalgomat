context_note: >
  Kodet -2 (sterkt uenig i at Innovasjon Norge selv bør velge
  organisasjonsform): SV er medforslagsstiller med en eksplisitt
  prinsipperklæring (desentralisering som "grunnleggende prinsipp"),
  det motsatte av det snudde utsagnets premiss. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
