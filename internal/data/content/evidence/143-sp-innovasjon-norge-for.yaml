context_note: >
  Kodet -2 (sterkt uenig i at Innovasjon Norge selv bør velge
  organisasjonsform): Sp er både opphavlig forslagsstiller på selve
  representantforslaget og medforslagsstiller på komitéforslaget —
  sterkeste mulige dokumentasjon av eierskap til den motsatte
  posisjonen blant de ni partiene i denne saken. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
