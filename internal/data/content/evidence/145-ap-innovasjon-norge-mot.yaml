id: ev-2026-06-10-ap-innovasjon-norge-mot
statement_id: utsagn-21
party_id: ap
actor: "Arbeiderpartiet (næringskomiteen)"
date: "2026-06-10"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  Ap stemte mot, med en effektivitets-basert begrunnelse: deler
  bekymringen for nærhet til næringslivet, men mener organiseringen
  må vurderes ut fra faktisk effekt, ikke lokalisering i seg selv.
claim_action: >
  Votering_id 28197, Ap 0 for, 32 mot. Fra delt merknad (Ap, Høyre og
  MDG): "Disse medlemmer legger til grunn at nærhet til bedrifter og
  regionale næringsmiljøer er viktig, men understreker samtidig at
  organiseringen av Innovasjon Norge må vurderes ut fra hva som gir
  størst effekt for verdiskaping og omstilling i hele landet." Videre,
  Ap+MDG alene: "Disse medlemmer viser til statsrådens redegjørelse
  og innspillene fra FIN – Foreningen for innovasjonsselskaper i
  Norge – som peker på at lokal tilstedeværelse alene ikke er
  tilstrekkelig dersom den ikke kombineres med tydelige oppdrag,
  tilstrekkelige ressurser og god samordning i virkemiddelapparatet."
verbatim_excerpt: >
  Disse medlemmer deler vurderingen av at bedre rolleavklaring og
  mindre overlapp mellom aktører kan gi et mer oversiktlig og
  effektivt system for bedriftene. [...] målet er å videreutvikle en
  regionalt forankret innsats innenfor en helhetlig nasjonal
  struktur, med fleksibilitet til å tilpasse virkemidler der det gir
  best effekt lokalt og regionalt.
status: forslag_avvist_stemte_mot
position: 1
