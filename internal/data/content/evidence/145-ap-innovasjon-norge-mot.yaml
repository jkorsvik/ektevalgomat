context_note: >
  Kodet +1 (enig, ikke sterkt enig): dette er nøyaktig Aps egen
  argumentasjon, gjengitt som det snudde utsagnet nå hevder — Ap deler
  eksplisitt bekymringen om nærhet til næringslivet ("nærhet [...] er
  viktig"), men avviser en Storting-bestemt bindende struktur til fordel
  for en effekt-/resultatbasert vurdering ("fleksibilitet til å tilpasse
  virkemidler der det gir best effekt") — samme "deler målet, ikke
  mekanismen"-mønster sett i tannhelse- (Phase 2h) og nasjonal
  sky-sakene (utsagn-19), men her med en tredje variant: enigheten er
  ikke om bindende versus frivillig styring, men om HVILKET kriterium
  (geografisk nærhet versus dokumentert effekt) som bør styre
  organiseringen. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
retrieved_at: "2026-09-24"
