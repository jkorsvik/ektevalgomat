context_note: >
  Kodet +1: samme grunnlag som Ap (se evidence/145 for full sitattekst
  og resonnement) — MDG er fullt medforfatter av begge lag av merknaden,
  ikke bare medstemmer, i tråd med det snudde utsagnets premiss. Merk
  kontrasten til MDGs posisjon i digitalsuverenitet-saken (utsagn-19/20),
  der MDG var på motsatt side sammen med SV og Rødt: MDG stemmer ikke
  systematisk med venstre-blokken i denne typen saker, men vurderer hver
  sak på egne Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
  premisser (her: effektivitetsargumentet fra Ap trumfer den
  regionalpolitiske bekymringen som ellers ofte samler SV/Sp/R/MDG).
