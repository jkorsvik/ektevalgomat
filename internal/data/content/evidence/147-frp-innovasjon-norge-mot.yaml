context_note: >
  Kodet +2 (sterkt enig): FrPs argumentasjon er ikke bare prinsipiell
  (redusert statlig innblanding), men tallfestet i eget alternativt
  statsbudsjett (1,6 mrd. kr i kutt), som gir det sterkeste
  dokumenterte "enig"-signalet for det snudde utsagnet — samme mønster
  som Ap i nasjonal sky-saken (evidence/126), der en fakta-forankret
  innvending (regjeringens KVU) gav Ap sterkere begrunnelse enn en ren
  prinsipperklæring ville gjort. Sterkeste dokumenterte posisjon i Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -2 til +2.
  denne saken, derfor -2, ikke -1.
