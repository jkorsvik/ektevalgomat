scan_summary: >
  FrP stemte mot, med den mest konkrete og tallfestede begrunnelsen i
  saken: viser til sitt eget alternative statsbudsjett, som foreslår
  en nedskalering av Innovasjon Norge på om lag 1,6 mrd. kroner.
claim_action: >
  Votering_id 28197, FrP 0 for, 29 mot. Fra delt merknad (FrP, Høyre
  og KrF): "Komiteens medlemmer fra Fremskrittspartiet, Høyre og
  Kristelig Folkeparti mener de beste forutsetningene for vekst og
  innovasjon kommer gjennom redusert statlig innblanding i form av
  krav, reguleringer, skatter og avgifter." FrP alene: "Komiteens
  medlemmer fra Fremskrittspartiet viser til Fremskrittspartiets
  alternative statsbudsjett, der det foreslås en nedskalering av
  Innovasjon Norges virksomhet som totalt innebærer kutt på om lag
  1,6 mrd. kroner fordelt på flere poster."
verbatim_excerpt: >
  Disse medlemmer mener den stadige veksten i statlige låne-,
  subsidie- og garantiordninger både er forstyrrende for
  markedsmekanismene og medfører risiko for skattebetalernes penger.
