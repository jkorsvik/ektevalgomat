context_note: >
  Kodet +1 (enig, ikke sterkt enig slik som FrP): dette er nøyaktig
  Høyres egen argumentasjon, gjengitt som det snudde utsagnet nå
  hevder — Høyre deler målet ("bør ha en desentralisert struktur") men
  mener Innovasjon Norge selv, ikke Stortinget, bør avgjøre HVORDAN —
  samme "deler målet, avviser bindende styring"-mønster Høyre viste i
  tannhelse- (Phase 2h) og nasjonal sky-sakene (utsagn-19/20), nå
  bekreftet en fjerde gang. Uvanlig i denne saken: Høyre er
  medforfatter av tre ulike merknad-lag Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
  samtidig (med Ap+MDG, med FrP+KrF, og med KrF alene) — bredere
  koalisjonsdeltakelse enn i noen tidligere sak i datasettet, verdt
  å følge som mønster: Høyre synes å samle seg med ulike blokker
  avhengig av hvilket spesifikt argument som fremmes, ikke en fast
  koalisjonspartner per sak.
