scan_summary: >
  Høyre stemte mot, og er medforfatter av tre separate merknad-lag i
  denne innstillingen: deler Ap/MDGs effektivitetsargument, deler
  FrP/KrFs bekymring for markedsmekanismer, og deler KrFs standpunkt
  om at Innovasjon Norge selv bør velge sin organisasjonsform.
claim_action: >
  Votering_id 28197, H 0 for, 14 mot. Tre lag av merknad: (1) med Ap
  og MDG: "organiseringen av Innovasjon Norge må vurderes ut fra hva
  som gir størst effekt". (2) med FrP og KrF: "de beste
  forutsetningene for vekst og innovasjon kommer gjennom redusert
  statlig innblanding". (3) med KrF alene: "Innovasjon Norge bør ha
  en desentralisert struktur, men de bør selv finne den
  organisasjonsformen de finner mest hensiktsmessig."
verbatim_excerpt: >
  Det er naturlig at Innovasjon Norge gjennomfører endringer i sin
  organisasjon som følge av Stortingets reduksjon i bevilgninger.
  Innovasjon Norge bør ha en desentralisert struktur, men de bør selv
  finne den organisasjonsformen de finner mest hensiktsmessig.
