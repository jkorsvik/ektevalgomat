context_note: >
  Kodet +1: KrF deler Høyres "la agenturet selv velge"-posisjon i sin
  helhet (medforfatter av samme setning), nøyaktig det snudde utsagnets
  premiss, samt FrP/Høyres generelle markedsmekanisme-bekymring — men
  har ingen egen, KrF-spesifikk begrunnelse utover disse to delte
  lagene, i motsetning til FrP som har et eget tallfestet
  budsjettforslag. Samme +/- 1 styrke som Ap, MDG og Høyre; klart
  svakere dokumentert enn FrP. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
