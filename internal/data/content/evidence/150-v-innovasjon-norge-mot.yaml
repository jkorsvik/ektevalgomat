context_note: >
  Kodet +1 fra stemmetallet alene, i tråd med det snudde utsagnets
  premiss. Venstre har ikke komitéplass i næringskomiteen — tredje sak
  i datasettet (etter utsagn-19 og utsagn-20, begge kommunal- og
  forvaltningskomiteen) der Venstre går udokumentert av samme grunn,
  men i en helt annen komité denne gangen. Bekrefter enda en gang at
  "hvilke partier går udokumentert" avhenger av komitésammensetning per
  sak, ikke av et Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
  fast mønster for hvilke saker Venstre generelt følger opp
  skriftlig.
