scan_summary: >
  Stortinget behandlet et representantforslag fra SV om å øke
  minstesatsen i obligatorisk tjenestepensjon (OTP) fra 2 til minimum
  4 prosent. Forslaget ble avvist 15 mot 86. Første utsagn i
  Dimensjon 9 (Generasjonsansvar, 37/40), som til nå har vært helt
  tom.
claim_action: >
  Dokument 8:206 S (2025-2026), Innst. 263 S (2025-2026). Fremmet av
  Marian Hussein og Ingrid Fiskaa (SV). Votering_id 27876, forslag
  nr. 1 fra SV, Rødt og MDG: "Stortinget ber regjeringen på egnet
  måte legge fram en sak om å øke pensjonsinnskuddssatsen i
  obligatorisk tjenestepensjon til minimum 4 pst." Avvist 15 for / 86
  mot, fordelt SV 5, R 5, MDG 5 for; Ap, FrP, H, KrF, Sp, V mot (full
  fordeling i partikortene). Finansminister Jens Stoltenberg svarte
  komiteen skriftlig 17. april 2026: 4 pst. tilsvarer om lag
  gjennomsnittlig innskuddssats i eksisterende ordninger, men mange
  bedrifter har lavere satser i praksis.
