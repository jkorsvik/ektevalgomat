context_note: >
  Institusjonell kontekst, ikke én enkelt partis posisjon. Saken
  tester dimensjonens spørsmål direkte: dagens OTP-minstesats (2 pst.,
  uendret siden 2006, sist bare utvidet i dekning ikke sats i 2022)
  er en typisk konsekvens-usynlig politikk — virkningen for den
  enkeltes pensjon materialiserer seg først etter et helt
  yrkesliv, 10-30+ år fram i tid, mens kostnaden (økte
  arbeidsgiverutgifter) er umiddelbar og synlig nå. Fire reelt
  distinkte posisjoner er dokumentert: (1) Flertallet (Ap, H, Sp, KrF,
  V) deler målet men vil ha en gradvis opptrapping etter grundig
  utredning i dialog med partene i arbeidslivet, se evidence/155-159;
  (2) FrP erkjenner den samme sosiale ulikheten i pensjon som SV/R/MDG
  peker på, men har ingen egen dokumentert løsning og stemte mot uten
  Flertallets gradvis-utrede-begrunnelse, se evidence/160 — en fjerde,
  distinkt variant av "deler diagnosen, ikke medisinen"-mønstret,
  forskjellig fra Flertallets "vent og utred"; (3) SV/Rødt (sterkest
  dokumentert) og (4) MDG (medforslagsstiller på selve forslaget, men
  ikke på SV/Rødts videre argumentasjon om LO-krav og
  pensjonsreformens historikk) — se evidence/152-154. Forslag 2 og 3 i
  samme innstilling (overtidsbetaling som pensjonsgivende inntekt;
  obligatorisk uførepensjon) er nært beslektede kandidater for utsagn
  40 (Generasjonsansvars andre og siste plass) uten å måtte åpne en ny
  kilde.
