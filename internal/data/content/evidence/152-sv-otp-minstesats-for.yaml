context_note: >
  Kodet -2 (sterkt uenig i at gradvis utredning er nok): SV er opphavlig
  forslagsstiller på selve representantforslaget om en direkte økning nå,
  med en detaljert begrunnelse som eksplisitt navngir 10-30-års-
  perspektivet dimensjonen tester — det motsatte av det snudde
  utsagnets premiss. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
