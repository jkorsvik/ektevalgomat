scan_summary: >
  SV stemte for, som opphavlig forslagsstiller (representantforslaget
  er fremmet av Marian Hussein og Ingrid Fiskaa, begge SV) og
  medforslagsstiller på komitéforslaget sammen med Rødt og MDG, med en
  detaljert begrunnelse om pensjonsreformens langsiktige
  ulikhetseffekt.
claim_action: >
  Votering_id 27876, SV 5 for, 0 mot. Fra SV+Rødts delte merknad:
  "Disse medlemmer mener dagens regler for OTP er for dårlige til å
  dekke opp for de store kuttene som har blitt gjort i folketrygden.
  Siden pensjonsreformen ble innført i 2011, har pensjonssystemet
  beveget seg i en mer individualisert og ulikhetsskapende retning.
  Disse medlemmer mener pensjonsreformen premierer høytlønte med
  komfortable kontoryrker, fremfor fagarbeidere i fysisk og psykisk
  slitsomme jobber. [...] Disse medlemmer viser til at LO krever at
  minstenivået økes fra dagens 2 pst. til 4 pst."
verbatim_excerpt: >
  Det er store lønnsforskjeller i Norge, og at det er uheldig med et
  lovverk som oppmuntrer til at disse ulikhetene forplanter seg til
  pensjonssystemet.
