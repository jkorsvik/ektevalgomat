context_note: >
  Kodet -2 (sterkt uenig i at gradvis utredning er nok): samme grunnlag
  som SV (se evidence/152), det motsatte av det snudde utsagnets
  premiss, pluss Rødts egen tidligere sak (sak 102062,
  "Representantforslag om å styrke obligatorisk tjenestepensjon (OTP)",
  2024-2025-sesjonen) — en direkte, navngitt historisk kontinuitet som
  styrker dokumentasjonen av at dette er en langsiktig, gjentatt
  prioritet for Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
