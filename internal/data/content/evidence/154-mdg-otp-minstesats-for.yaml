scan_summary: >
  MDG stemte for, som medforslagsstiller på selve forslaget sammen
  med SV og Rødt, men er ikke navngitt medforfatter av SV/Rødts
  videre argumentasjon om LO-kravet og pensjonsreformens historikk.
claim_action: >
  Votering_id 27876, MDG 5 for, 0 mot. MDG er navngitt
  medforslagsstiller i "Komiteens medlemmer fra Sosialistisk
  Venstreparti, Rødt og Miljøpartiet De Grønne viser til
  representantforslaget og fremmer følgende forslag" — men den
  påfølgende, mer detaljerte begrunnelsen er eksplisitt avgrenset til
  "Komiteens medlemmer fra Sosialistisk Venstreparti og Rødt", uten
  MDG.
status: forslag_avvist_stemte_for
position: -2
source_tier: A
source_name: "Innst. 263 S (2025–2026); votering_id 27876"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2025-2026/inns-202526-263s/?all=true"
claim_confidence: dokumentert
attribution_confidence: svakt_dokumentert
context_note: >
  Kodet -2 fra stemmegivningen og fra medforfatterskap av selve
  forslagsteksten om en direkte økning nå (det motsatte av det snudde
  utsagnets premiss om gradvis utredning), men attribution_confidence
  satt til svakt_dokumentert fordi MDG ikke er medforfatter av
  SV/Rødts videre, mer substansielle argumentasjon (LO-krav,
  pensjonsreformens historikk siden 2011) — samme Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
  "medforslagsstiller på hovedforslaget, ikke på den utdypende
  begrunnelsen"-mønster sett tidligere i datasettet (Sp/Høyre i
  Innst. 424 S, evidence/136).
