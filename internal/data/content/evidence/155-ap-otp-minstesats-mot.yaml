context_note: >
  Kodet +1 (enig, ikke sterkt enig): dette er nøyaktig Flertallets
  (medforfattet av Ap) egen argumentasjon, gjengitt som det snudde
  utsagnet nå bygger på — Flertallet deler eksplisitt intensjonen
  ("forståelse for intensjonen") og nevner finansministerens eget
  svarbrev (17. april 2026: 4 pst. tilsvarer om lag gjennomsnittssatsen
  i eksisterende ordninger), men vil ha en gradvis, utredet prosess i
  dialog med partene i arbeidslivet fremfor et Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
  bindende Storting-vedtak nå. Samme "deler målet, avviser bindende
  hastighet/mekanisme"-mønster sett gjennomgående i datasettet, her i
  en ny variant: uenigheten er om TEMPO og PROSESS
  (utredning+gradvis+dialog), ikke om binding versus frivillighet som
  i tidligere saker.
