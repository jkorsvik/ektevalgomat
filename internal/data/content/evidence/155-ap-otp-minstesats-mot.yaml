scan_summary: >
  Ap stemte mot, som del av komiteens flertall (Ap, Høyre, Sp, KrF,
  V): deler intensjonen, men vil ha en gradvis opptrapping etter
  grundig utredning og dialog med partene i arbeidslivet.
claim_action: >
  Votering_id 27876, Ap 0 for, 32 mot. Fra Flertallets merknad:
  "Flertallet har forståelse for intensjonen bak forslaget om å øke
  minstesatsen i obligatorisk tjenestepensjon til 4 pst., men vil
  understreke at en slik økning vil innebære økte kostnader for
  arbeidsgivere og vil kunne slå ulikt ut mellom virksomheter. [...]
  På denne bakgrunn mener flertallet at eventuelle endringer i
  minstesatsen [...] bør utredes grundig i tråd med
  utredningsinstruksen, skje i dialog med partene i arbeidslivet og
  ses i sammenheng med budsjettprosessen. Flertallet mener videre at
  en eventuell opptrapping bør skje gradvis."
verbatim_excerpt: >
  Endringer i minstekravene også kan føre til omfordeling internt i
  virksomheter, samt at økte kostnader over tid kan bli overført til
  arbeidstakerne gjennom lavere lønnsvekst. Videre kan økte
  pensjonsutgifter være krevende for mange bedrifter og påvirke
  statens skatteinngang.
status: forslag_avvist_stemte_mot
