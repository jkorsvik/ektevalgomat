context_note: >
  Kodet +1: FrPs posisjon i denne saken er den mest uvanlige i hele
  datasettet så langt — FrP er skriftlig medforfatter av selve
  problemdiagnosen som forslagsstillerne (SV/Rødt/MDG) bygger på
  ("store sosiale ulikheter i pensjon", "folketrygden strammet inn
  siden 2011"), men stemte likevel mot en direkte økning nå, i tråd med
  det snudde utsagnets premiss, uten selv å knytte seg til Flertallets
  gradvis-utrede-begrunnelse og uten en Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
  egen, dokumentert motbegrunnelse for HVORFOR de avviser nettopp
  denne løsningen. Dette er en fjerde, distinkt variant av
  "deler diagnosen, ikke medisinen"-mønstret i datasettet — tidligere
  varianter (Høyre/Sp i tannhelse- og sky-sakene, Flertallet i denne
  saken) har alle en uttalt ALTERNATIV tilnærming; FrP her har verken
  det. Lavere attribution_confidence av denne grunn: stemmen og
  problemdiagnosen er sikre, men motivasjonen for selve mot-stemmen
  er ikke dokumentert.
