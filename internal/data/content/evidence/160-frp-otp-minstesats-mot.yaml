scan_summary: >
  FrP stemte mot, men er IKKE del av Flertallets gradvis-utrede-
  begrunnelse. FrP er i stedet medforfatter av en egen, kortere
  merknad delt med SV, Rødt og MDG som erkjenner den samme sosiale
  ulikheten i pensjon uten selv å støtte forslagets løsning.
claim_action: >
  Votering_id 27876, FrP 0 for, 29 mot. Fra delt merknad (FrP, SV,
  Rødt og MDG): "Komiteens medlemmer fra Fremskrittspartiet,
  Sosialistisk Venstreparti, Rødt og Miljøpartiet De Grønne merker
  seg at det i dag er store sosiale ulikheter i pensjon, og arbeidere
  med lav lønn og fysisk krevende yrker kommer dårligere ut enn
  høytlønte arbeidere i typiske kontorjobber. Disse medlemmer merker
  seg også at folketrygden har blitt strammet inn siden
  pensjonsreformen ble innført i 2011." FrP er ikke medforfatter av
  Flertallets etterfølgende merknad (se evidence/155) og har ingen
  egen, tallfestet motbegrunnelse i denne innstillingen.
status: forslag_avvist_stemte_mot
