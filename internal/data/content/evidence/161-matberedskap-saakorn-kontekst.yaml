context_note: >
  Institusjonell kontekst, ikke én enkelt partis posisjon. Saken
  tester dimensjonens spørsmål direkte: dagens system overlater
  lagring av kritiske innsatsfaktorer til matproduksjon (såkorn,
  såfrø) i stor grad til markedet, og forslaget spør konkret om
  systemet tåler avlingssvikt, importstans og andre sjokk uten en
  dedikert beredskapsmekanisme. Uvanlig koalisjonsmønster: forslag 1s
  sponsorgruppe (FrP, SV, Rødt, MDG, KrF) krysser venstre-høyre-aksen
  på en måte som ikke er sett i noen tidligere sak i datasettet — FrP
  og KrF har sin EGEN, smalere begrunnelse (finsk modell, "statens
  ansvar for totalberedskap erstatter ikke den enkeltes ansvar for
  egenberedskap") innenfor samme sponsorgruppe som SV/Rødt/MDGs bredere
  sentralisering/sårbarhet-begrunnelse — se evidence/162-166. Sp, som
  er den OPPRINNELIGE forslagsstilleren for hele saken og
  medforslagsstiller på de tre andre konkrete forslagene (2, 3, 4) i
  samme innstilling, stemte likevel MOT nettopp dette forslaget — ingen
  Sp-spesifikk begrunnelse er dokumentert for dette spesifikke valget,
  se evidence/169. Høyre deler generell skepsis til Sps opprinnelige
  forslag sammen med FrP og KrF, men går ikke så langt som FrP/KrF i å
  støtte den desentraliserte løsningen — se evidence/168.
