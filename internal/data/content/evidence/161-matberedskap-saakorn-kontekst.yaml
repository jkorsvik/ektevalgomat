scan_summary: >
  Stortinget behandlet et representantforslag fra Sp om styrking av
  Norges matberedskap. Blant seks konkrete forslag ble et forslag om
  desentraliserte beredskapslagre for såkorn og matkorn på gårdene
  avvist 48 mot 53 — den jevneste voteringen i saken. Første utsagn i
  Dimensjon 8 (Robusthet / adaptabilitet, 38/39/41/42), som til nå har
  vært helt tom — den siste dimensjonen i datasettet uten noe innhold.
claim_action: >
  Dokument 8:266 S (2025-2026), Innst. 392 S (2025-2026). Fremmet av
  Geir Pollestad, Siv Sætran og Ole Herman Sveian (Sp). Votering_id
  28068, forslag nr. 1 fra FrP, SV, Rødt, MDG og KrF: "Stortinget ber
  regjeringen sikre beredskapslagre for såkorn og matkorn i en
  desentralisert modell på gårdene rundt om i landet." Avvist 48 for
  / 53 mot, fordelt FrP 29, SV 5, R 5, MDG 5, KrF 4 for; Ap 32, H 14,
  Sp 5, V 2 mot (full fordeling i partikortene). To andre forslag i
  samme sak (romertall I og II, om en utredning av finsk-modell
  beredskapslagre og avtaler med dagligvarekjeder) ble derimot VEDTATT
  57 mot 43 (votering_id 28069) — saken er blant få i datasettet der
  Stortinget faktisk vedtok noe av det som ble fremmet, ikke bare
  avviste det.
