context_note: >
  Kodet +2 (sterkt for): FrP har en egen, navngitt begrunnelse (den
  finske modellen, som FrP "lenge har trukket frem som forbilledlig")
  utover det å bare være medforslagsstiller — samme
  fakta-/erfaringsforankrede argumentasjonsstil som FrPs 1,6 mrd.
  kr-tallfesting i Innovasjon Norge-saken (evidence/147), her brukt
  til motsatt konklusjon (for, ikke mot). FrP kobler også dette
  eksplisitt til prinsippet om individuelt ansvar for egenberedskap
  (DSB-informasjon) — ikke bare statlig lagring.
