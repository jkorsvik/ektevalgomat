id: ev-2026-06-05-frp-matberedskap-saakorn-for
statement_id: utsagn-38
party_id: frp
actor: "Fremskrittspartiet (næringskomiteen)"
date: "2026-06-05"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  FrP stemte for, som medforslagsstiller sammen med SV, Rødt, MDG og
  KrF, med en egen, smalere begrunnelse (delt kun med KrF) om den
  finske modellen for fysiske beredskapslagre.
claim_action: >
  Votering_id 28068, FrP 29 for, 0 mot. Fra FrP+KrFs delte merknad:
  "Komiteens medlemmer fra Fremskrittspartiet og Kristelig Folkeparti
  mener at staten burde sikre fysiske beredskapslagre, etter modell
  fra Finland, som Fremskrittspartiet lenge har trukket frem som
  forbilledlig. En desentralisert lagringsstruktur for såkorn,
  matkorn og dagligvarer gir mer robust beredskap enn prosentkrav til
  innkjøp og store sentraliserte lager."
verbatim_excerpt: >
  Disse medlemmer understreker at statens ansvar for totalberedskap
  ikke erstatter den enkeltes ansvar for egenberedskap, og forventer
  at DSB kontinuerlig informerer befolkningen om dette.
status: forslag_avvist_stemte_for
