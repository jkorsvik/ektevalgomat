scan_summary: >
  SV stemte for, som medforslagsstiller sammen med FrP, Rødt, MDG og
  KrF, med en bredere begrunnelse om sentraliseringens sårbarhet
  (delt med Sp, Rødt og MDG i den samme innstillingen for
  tilstøtende forslag).
claim_action: >
  Votering_id 28068, SV 5 for, 0 mot. Fra SV+Sp+Rødt+MDGs bredere
  merknad om samme underliggende sak: "Disse medlemmer mener det er
  en stor svakhet at lagringen av disse innsatsfaktorene i dag i stor
  grad er overlatt til markedet. Det gjør systemet sårbart i møte med
  kriser, importstans eller svikt i avlinger."
verbatim_excerpt: >
  Disse medlemmer mener det er helt nødvendig at staten i større grad
  tar ansvar for å sikre bøndenes tilgang til grunnleggende
  innsatsfaktorer. Uten tilgang på såkorn og såfrø vil
  matproduksjonen raskt stoppe opp, med store konsekvenser for både
  selvforsyning og matsikkerheten til hele den norske befolkningen.
