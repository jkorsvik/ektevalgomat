context_note: >
  Kodet -1 (mot, ikke sterkt mot): Aps begrunnelse i innstillingen er
  generell for hele saken (kontinuerlig produksjon,
  jordbruksforhandlinger som riktig arena), ikke spesifikt skrevet om
  forslag 1s desentraliserte gårds-modell alene — samme
  "prosess/arena"-innvending sett i utsagn-37s Flertallet
  (evidence/155), her fra Ap alene siden Ap ikke er del av noen delt
  merknad i denne saken. Lavere attribution_confidence enn "for"-siden
  av denne grunn.
