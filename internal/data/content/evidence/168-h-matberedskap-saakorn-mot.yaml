scan_summary: >
  Høyre stemte mot. Høyre deler en generell skepsis til Sps
  opprinnelige representantforslag sammen med FrP og KrF, men er ikke
  medforfatter av FrP+KrFs mer spesifikke Finland-modell-konklusjon
  som forslag 1 bygger på.
claim_action: >
  Votering_id 28068, H 0 for, 14 mot. Fra delt merknad (FrP, Høyre og
  KrF): "Komiteens medlemmer fra Fremskrittspartiet, Høyre og
  Kristelig Folkeparti deler bekymringen for norsk matberedskap, men
  mener Senterpartiets forslag ikke treffer de viktigste
  utfordringene. Kvoter og merkeordninger er ikke godt nok svar på
  reell sårbarhet i forsyningskjedene for mat." Den påfølgende,
  konkrete Finland-modell-konklusjonen er eksplisitt avgrenset til
  "Komiteens medlemmer fra Fremskrittspartiet og Kristelig
  Folkeparti" — uten Høyre.
