context_note: >
  Kodet -1: Høyre er medforfatter av en generell skepsis til Sps
  opprinnelige forslag, men den setningen navngir ikke selve forslag
  1s desentraliserte mekanisme spesifikt — Høyres presise grunn for å
  stemme mot NETTOPP dette forslaget (i motsetning til de tre andre
  forslagene i saken) er ikke separat dokumentert utover denne
  generelle skepsisen. Samme "medforfatter av et lag, ikke det
  spesifikke neste laget"-mønster som tidligere sett for Sp/Høyre i
  Innst. 424 S (evidence/136) og MDG i Innst. 263 S (evidence/154).
