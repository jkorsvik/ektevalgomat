context_note: >
  Kodet -1 fra stemmegivningen alene — dette er den mest overraskende
  enkeltposisjonen i datasettet så langt: den opprinnelige
  forslagsstilleren stemmer mot ett av seks konkrete forslag i sin
  egen sak, uten at innstillingen dokumenterer hvorfor. Én mulig,
  ikke bekreftet lesning: Sp har medforslagsstilt den vedtatte
  "utrede en finsk modell"-varianten (romertall I/II) parallelt med
  dette forslaget, og kan ha foretrukket en utredet, regjeringsstyrt
  prosess over et umiddelbart, gårds-spesifikt Storting-vedtak — men
  dette er en tolkning, ikke en dokumentert begrunnelse, og
  presenteres derfor ikke som fakta. Attribution_confidence satt til
  ukjent, ikke svakt_dokumentert, fordi det ikke finnes NOEN tekstlig
  Sp-spesifikk sammenheng å vurdere styrken av — i motsetning til Ap
  og Høyre i samme sak, som begge har generell, om ikke forslag-1-
  spesifikk, dokumentert begrunnelse.
