scan_summary: >
  Sp stemte mot forslag 1, selv om Sp er den opprinnelige
  forslagsstilleren for hele representantforslaget og
  medforslagsstiller på de tre andre konkrete forslagene (2, 3, 4) i
  samme innstilling. Ingen Sp-spesifikk begrunnelse for å avvise
  nettopp den desentraliserte gårds-modellen er dokumentert.
claim_action: >
  Votering_id 28068, Sp 0 for, 5 mot. Representantforslaget (Dokument
  8:266 S) er fremmet av Geir Pollestad, Siv Sætran og Ole Herman
  Sveian, alle Sp. Sp er medforslagsstiller på forslag 2, 3 og 4 (ROS-
  analyse, nasjonalt lagringssystem for såkorn/såfrø, utrede
  desentralisert lagringskapasitet i verdikjeden) og på flertallets
  vedtatte forslag om å utrede en finsk-modell beredskapsordning
  (votering_id 28069, vedtatt 57-43) — men ikke på forslag 1s
  konkrete, umiddelbare gårds-baserte mekanisme.
