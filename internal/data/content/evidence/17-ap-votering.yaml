claim_confidence: dokumentert
context_note: >
  Kodet -1, ikke -2: Ap stemte ikke mot at behovet for et lobbyregister
  utredes i det hele tatt (den enstemmige tilrådingen dekker nettopp
  det), men stemte mot alle fire forslag som ville forpliktet Stortinget
  til noe mer konkret enn å utrede "behovet for" et register — inkludert
  den svakeste skjerpingen (MDGs forslag 3/4, som bare ber om å utrede
  "mulige modeller", uten forpliktelse om innføring). Dette er en reell,
  gjentatt skepsis til et konkret registreringskrav, ikke bare motstand
  mot ett bestemt forslags utforming. Individuelle representantstemmer
  hentet fra data.stortinget.no/eksport/voteringsresultat for
  votering_id 27257–27260 (parti-tally: A mot på alle fire, 32 mot/21
  ikke_tilstede per votering). Denne posisjonsvurderingen er en
  analytisk tolkning av stemmemønsteret, ikke Aps egne ord — bør
  dobbeltsjekkes i human merge-QA før den brukes til scoring.
