context_note: >
  Institusjonell kontekst. Saken kobler dimensjonens spørsmål direkte
  til et konkret, bindende årstall: alle ni partier er dokumentert med
  et vedtak, men fordelingen er svært skjev (9 mot 90) — den mest
  ensidige voteringen i datasettet så langt. Fremskrittspartiet har den
  klart mest omfattende, sympatiske merknadsteksten om selve
  problembeskrivelsen (trafikksikkerhet, beredskap, distriktene,
  responstid for nødetater) av samtlige partier i saken, men stemte
  likevel mot Sps konkrete 2030-forslag uten at innstillingen
  dokumenterer noen egen grunn til akkurat det bruddet — se
  evidence/174. Høyre er det ENESTE partiet med en fullstendig,
  navngitt begrunnelse for mot-stemmen (statsrådens kostnads- og
  realismevurdering, ønske om å avvente Nkoms 2025-analyse) — se
  evidence/175. Ap, SV, Rødt og MDG er alle med i den delte
  6-partitilrådingen uten egen forslagsspesifikk tekst — se evidence
  176-179. KrF og Venstre har ikke sete i komiteen; KrF stemte likevel
  for, Venstre mot, begge udokumentert — se evidence/173 og 180.
