scan_summary: >
  Stortinget behandlet et representantforslag fra Sp om å sikre
  mobildekning på alle offentlige veier innen 2030. Komiteen selv
  omtaler mobildekning som "en viktig del av samfunnets grunnleggende
  infrastruktur" — en direkte formulering av denne dimensjonens
  spørsmål. Andre utsagn i Dimensjon 6 (Universell grunnmur, 25-30) —
  utsagn-25 (tannhelsereform) var allerede bygget; dette er nummer 26.
claim_action: >
  Dokument 8:194 S (2025-2026), Innst. 239 S (2025-2026). Fremmet av
  Geir Inge Lien, Bent-Joacim Bentzen og Erling Sande (Sp). Votering_id
  27610 (alternativ votering mot komiteens tilråding): forslag 1 fra
  Sp, "Stortinget ber regjeringen sørge for at alle offentlige veier i
  Norge har mobildekning innen 2030", fikk 9 for (Sp 5, KrF 4) mot 90
  mot (Ap 31, FrP 28, H 14, MDG 5, R 5, SV 5, V 2). Komiteens tilråding
  (representantforslaget "vedtas ikke") ble dermed vedtatt 90-9
  (votering_id 27609, samme alternativ votering, motsatt telling).
  Bakgrunn: statsråden uttalte i brev til komiteen at full dekning
  langs alle offentlige veistrekninger innen 2030 "ikke er realistisk"
  med kjente virkemidler, og at kostnadene "vil være altfor store."
