scan_summary: >
  Sp fremmet forslaget alene og stemte for, med en egen, navngitt
  begrunnelse som kobler mobildekning til trafikksikkerhet, nullvisjon
  for drepte og hardt skadde, og bosetning og næringsliv i hele landet.
claim_action: >
  Votering_id 27610, Sp 5 for, 0 mot. Fra Sps egen merknad: "Komiteens
  medlem fra Senterpartiet er bekymret for trafikksikkerheten langs
  norske veier når 2G-nettet slukkes. [...] Dette medlem mener at for å
  bidra til beredskapen, nullvisjonen for hardt skadde og drepte i
  veitrafikken og bosetning og næringsliv i hele landet må man sørge
  for at det er reell mobildekning langs alle offentlige veier i
  Norge."
verbatim_excerpt: >
  Dette medlem fremmer derfor følgende forslag: «Stortinget ber
  regjeringen sørge for at alle offentlige veier i Norge har
  mobildekning innen 2030.»
