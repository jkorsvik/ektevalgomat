scan_summary: >
  FrP stemte mot, selv om FrP har den klart mest omfattende og
  sympatiske merknadsteksten om selve problembeskrivelsen
  (trafikksikkerhet, beredskap, distriktene, responstid for nødetater)
  av samtlige partier i saken. Innstillingen dokumenterer ingen egen
  grunn til å avvise nettopp Sps 2030-forslag.
claim_action: >
  Votering_id 27610, FrP 0 for, 28 mot. Fra FrPs egen merknad: "Disse
  medlemmer viser til at manglende mobildekning langs deler av
  veinettet svekker både trafikksikkerhet, beredskap og muligheten til
  å tilkalle hjelp ved ulykker. Dette gjelder særlig i distriktene,
  hvor avstandene er store og responstiden for nødetater kan være
  avgjørende." FrP viser videre til at regjeringens satellitt-løsninger
  "foreløpig ikke fullt ut kan erstatte behovet for robust,
  bakkebasert mobildekning langs veinettet."
verbatim_excerpt: >
  Disse medlemmer legger til grunn at teknologisk utvikling ikke må
  medføre svekket trafikksikkerhet eller beredskap.
status: forslag_avvist_stemte_mot
