context_note: >
  Kodet -1, ikke -2: dette er det klareste eksempelet så langt i
  datasettet på "deler diagnosen fullt ut, ingen dokumentert grunn for
  selve mot-stemmen" — FrPs egen tekst er lengre og mer detaljert enn
  noe annet partis i denne saken, inkludert Sps eget forslag, men
  teksten inneholder ingen setning som forklarer hvorfor et forslag
  FrP tekstlig støtter fullt ut i sak likevel blir stemt ned. Mulig,
  ikke bekreftet lesning: FrP kan ha foretrukket et "innen 2030"-krav
  uten et konkret, bindende årstall koblet direkte til Stortinget,
  eller ønsket en annen mekanisme enn nettopp Sps forslagstekst — men
  dette er en tolkning, ikke en dokumentert begrunnelse.
