evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  Høyre stemte mot, med den eneste fullstendige, forslagsspesifikke
  begrunnelsen for "mot"-siden i saken: statsrådens kostnads- og
  realismevurdering, kombinert med et ønske om å avvente Nkoms egen
  2025-analyse før eventuelle nye tiltak.
claim_action: >
  Votering_id 27610, H 0 for, 14 mot. Fra Høyres egen merknad: "Disse
  medlemmer viser til statsrådens svar, der hun skriver at det ikke er
  realistisk å etablere full mobildekning langs alle offentlige
  veistrekninger innen 2030 med kjente virkemidler som dekningskrav,
  utbyggingstilskudd mv. Kostnadene vil være altfor store. Disse
  medlemmer støtter denne vurderingen."
verbatim_excerpt: >
  Disse medlemmer støtter forslagsstillernes intensjon. [...] Disse
  medlemmer mener det uansett vil være naturlig å avvente Nkoms
  analyse for 2025, som legges frem senere i år, og støtter ikke det
  fremlagte representantforslaget.
