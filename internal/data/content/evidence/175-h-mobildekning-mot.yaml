context_note: >
  Kodet -2 (sterkt mot): Høyre er det eneste partiet i saken med en
  navngitt, forslagsspesifikk begrunnelse for mot-stemmen — direkte
  kontrast til FrP (evidence/174), som deler nesten hele
  problembeskrivelsen tekstlig men ikke forklarer sin egen mot-stemme.
  Høyre støtter uttrykkelig "forslagsstillernes intensjon" men avviser
  selve mekanismen (et bindende 2030-årstall) med en konkret,
  navngitt kilde (statsrådens brev) og et alternativ (avvente Nkoms
  2025-analyse) — samme type "støtter intensjonen, ikke mekanismen"-
  argumentasjon som Høyre har brukt tidligere i datasettet (f.eks.
  evidence/135, Microsoft 365-exit).
