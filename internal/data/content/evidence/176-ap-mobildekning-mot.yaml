context_note: >
  Kodet -1: Ap er navngitt i tilrådingen, men innstillingen har ingen
  egen Ap-merknad forklarer hvorfor Ap konkret avviser forslaget — bare
  den felles setningen "Komiteen har for øvrig ingen merknader."
