scan_summary: >
  Ap stemte mot, som del av en delt seks-partitilråding (med FrP, H,
  SV, Rødt og MDG) om å avvise hele representantforslaget. Ingen
  Ap-spesifikk merknad er skrevet noe sted i innstillingen utover den
  felles komitétekst alle sju komitémedlemmer står bak.
claim_action: >
  Votering_id 27610, Ap 0 for, 31 mot. Fra tilrådingsavsnittet:
  "Komiteens tilråding fremmes av medlemmene i komiteen fra
  Arbeiderpartiet, Fremskrittspartiet, Høyre, Sosialistisk
  Venstreparti, Rødt og Miljøpartiet De Grønne. Komiteen har for
  øvrig ingen merknader, viser til dokumentet og rår Stortinget til å
  [...] vedtas ikke."
