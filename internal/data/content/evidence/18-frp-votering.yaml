claim_confidence: dokumentert
context_note: >
  Kodet -1, ikke -2, av samme grunn som for Ap: FrP stemte for at behovet
  utredes (den enstemmige tilrådingen), men mot alle fire forslag som
  ville forpliktet Stortinget til noe mer konkret. FrP hadde størst
  fravær av de fem partiene i denne kategorien (18 ikke_tilstede av
  gruppen på ~47 per votering), men det registrerte flertallet av de
  tilstedeværende stemte mot på alle fire. Individuelle
  representantstemmer hentet fra data.stortinget.no/eksport/voteringsresultat
  for votering_id 27257–27260. Analytisk posisjonstolkning — bør
  dobbeltsjekkes i human merge-QA.
