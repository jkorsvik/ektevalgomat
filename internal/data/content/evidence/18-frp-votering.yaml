scan_summary: "FrP stemte mot alle fire skjerpingsforslag om lobbyregister."
claim_action: >
  Stemte mot samtlige fire løse forslag som gikk lenger enn
  presidentskapets tilråding: MDGs forslag 2 (utrede "med sikte på å
  innføre"), MDGs forslag 3 og 4 (utrede konkrete registreringsmodeller
  for hhv. Stortinget og departementene) og Rødts forslag 1 (lovhjemlet
  register med registrerings-/innrapporteringsplikt og sanksjonsadgang).
  Stemte deretter for selve tilrådingen, som ble enstemmig vedtatt uten
  registrert dissens (votering_id 27261, personlig votering ikke ført
  ved enstemmig vedtak).
status: forkastet
