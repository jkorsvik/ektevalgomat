context_note: >
  Institusjonell kontekst. Sammenlignet med utsagn-38 (samme sak,
  forslag 1, 48-53) er dette forslaget mer polarisert i partitall (26
  mot 74) men mindre polarisert i koalisjonsbredde: seks partier
  (SV, Sp, R, MDG, KrF, V) på samme side, mot bare tre (Ap, FrP, H).
  Særlig interessant vending: FrP stemte FOR desentraliserte
  beredskapslagre i forslag 1 (evidence/162, +2, egen begrunnelse om
  finsk modell), men MOT en formell risikokartlegging her — uten
  dokumentert grunn, se evidence/189. Sp stemte MOT sitt eget forslag
  1 (evidence/169) men FOR dette forslaget som medforslagsstiller
  (evidence/183) — konsistent med at forslag 2 ligger nærmere Sps
  opprinnelige Dokument 8:266 S-tekst enn forslag 1s spesifikke
  gårdsmodell. Minoritetens merknad viser til at regjeringen selv har
  "varsla" en slik ROS-analyse, men at "eit slikt arbeid har så langt
  ikkje materialisert seg" — saken tester dermed ikke bare om Stortinget
  vil pålegge kartlegging, men om regjeringens eget varslede initiativ
  faktisk er reelt eller bare en intensjon uten frist.
