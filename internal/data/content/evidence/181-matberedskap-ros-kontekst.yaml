scan_summary: >
  Samme sak som utsagn-38 (Dokument 8:266 S, Innst. 392 S), et annet
  av de seks konkrete forslagene: en pålagt, helhetlig nasjonal
  risiko- og sårbarhetsanalyse (ROS) for matsikkerhet og
  matforsyning. Avvist 26 mot 74 — men med et helt annet
  koalisjonsmønster enn forslag 1: her stemte SEKS partier for og
