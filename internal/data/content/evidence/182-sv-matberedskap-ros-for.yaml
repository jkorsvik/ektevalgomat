context_note: >
  Kodet +2 (sterkt for): navngir to konkrete institusjonelle kilder
  (Riksrevisjonen, Totalberedskapskommisjonen) som allerede har
  påpekt mangelen, og dokumenterer at regjeringens eget varslede
