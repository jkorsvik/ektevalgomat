scan_summary: >
  SV stemte for, som medforslagsstiller sammen med Sp, Rødt, MDG og
  KrF, med en delt begrunnelse som viser til at Riksrevisjonen og
  Totalberedskapskommisjonen har påpekt mangelen på en helhetlig
  analyse, og at regjeringens eget varslede ROS-arbeid ikke har
  materialisert seg.
claim_action: >
  Votering_id 28067, SV 5 for, 0 mot. Fra SV+Sp+R+MDG+KrFs delte
  merknad: "Riksrevisjonen og Totalberedskapskommisjonen har peika på
  mangel på heilskaplege scenario- og sårbarheitsanalysar for
  matsikkerheit. Regjeringa har varsla ei nasjonal risiko- og
  sårbarheitsanalyse (ROS) for mat og matforsyning, men eit slikt
  arbeid har så langt ikkje materialisert seg."
verbatim_excerpt: >
  Medlemene i komiteen frå Sosialistisk Venstreparti, Senterpartiet,
  Raudt, Miljøpartiet Dei Grøne og Kristeleg Folkeparti meiner at den
  beste matberedskapen er lokal lagring, fleire bønder med kunnskap,
  jord i drift med god jordhelse og korte forsyningslinjer over heile
  landet.
