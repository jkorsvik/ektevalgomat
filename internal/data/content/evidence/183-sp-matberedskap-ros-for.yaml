context_note: >
  Kodet +2. Merk kontrasten til utsagn-38: Sp fremmet hele saken
  (Dokument 8:266 S) og stemte mot forslag 1 (evidence/169, den
  desentraliserte gårdsmodellen) uten dokumentert egen grunn, men
  stemmer for forslag 2 (kartlegging/ROS) som medforslagsstiller med
  fullt dokumentert delt begrunnelse. Antyder at Sps opprinnelige sak
  handlet mer om å FÅ en risikoanalyse enn om den spesifikke
  gårds-lagrings-mekanismen — forslag 2 ligger nærmere kjernen i
  Sps egen sak enn forslag 1 gjør.
