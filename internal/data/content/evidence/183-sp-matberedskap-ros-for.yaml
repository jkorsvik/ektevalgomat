scan_summary: >
  Sp stemte for, som medforslagsstiller sammen med SV, Rødt, MDG og
  KrF, med samme delte begrunnelse som SV (evidence/182). Sp er den
  opprinnelige forslagsstilleren for hele saken (Dokument 8:266 S) og
  stemmer her i tråd med sitt eget utgangspunkt — i motsetning til
  forslag 1 (utsagn-38), der Sp stemte mot sitt eget gårds-modell-
  forslag.
claim_action: >
  Votering_id 28067, Sp 5 for, 0 mot. Samme delte merknad som SV:
  "Riksrevisjonen og Totalberedskapskommisjonen har peika på mangel
  på heilskaplege scenario- og sårbarheitsanalysar for matsikkerheit.
  Regjeringa har varsla ei nasjonal risiko- og sårbarheitsanalyse
  (ROS) for mat og matforsyning, men eit slikt arbeid har så langt
  ikkje materialisert seg."
