scan_summary: >
  KrF stemte for, som medforslagsstiller sammen med SV, Sp, Rødt og
  MDG, med samme delte begrunnelse (evidence/182-185). KrF er også
  medforslagsstiller på forslag 1 (utsagn-38), der partiet hadde en
  smalere, egen begrunnelse delt kun med FrP (finsk modell,
  egenberedskap).
claim_action: >
  Votering_id 28067, KrF 4 for, 0 mot. Samme delte merknad: "Riksrevisjonen
  og Totalberedskapskommisjonen har peika på mangel på heilskaplege
  scenario- og sårbarheitsanalysar for matsikkerheit. Regjeringa har
  varsla ei nasjonal risiko- og sårbarheitsanalyse (ROS) for mat og
  matforsyning, men eit slikt arbeid har så langt ikkje materialisert
  seg."
