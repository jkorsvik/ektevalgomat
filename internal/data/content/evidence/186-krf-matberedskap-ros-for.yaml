context_note: >
  Kodet +2. Femte og siste av de fem partiene bak den delte merknaden
  i denne saken, se evidence/182-185. Merk at KrF her deler merknad
  med et helt annet sett av partier (SV/Sp/Rødt/MDG) enn i forslag 1
  (der KrF delte merknad med FrP alene) — samme parti kan altså sitte
