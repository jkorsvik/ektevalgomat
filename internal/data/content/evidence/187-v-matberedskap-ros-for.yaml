context_note: >
  Kodet +1 fra stemmetallet alene (svakere enn +2 fordi ingen egen
  begrunnelse finnes). Interessant kontrast til utsagn-38 (evidence/170):
  samme udokumenterte parti, samme sak, samme komité-fravær — men
  Venstre stemmer MOT forslag 1 (gårdslagring) og FOR forslag 2
  (risikoanalyse) i den samme innstillingen. Uten en egen merknad er
  det ikke mulig å si om dette reflekterer en bevisst linje (støtter
  kartlegging, skeptisk til en konkret ny lagringsmekanisme) eller
  bare enkeltrepresentanters uavhengige stemmer — flagget som
  tolkning, ikke fakta.
