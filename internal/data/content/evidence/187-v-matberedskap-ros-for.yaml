scan_summary: >
  Venstre stemte for. Venstre har ikke sete i næringskomiteen og har
  ingen skriftlig merknad noe sted i denne innstillingen — samme funn
  som i utsagn-38 (evidence/170), men her lander Venstre på MOTSATT
  side av stemmegivningen.
claim_action: >
  Votering_id 28067, V 2 for, 0 mot. Ingen V-merknad funnet i
  innstillingens fulltekst; komiteens medlemsliste (Ap, FrP, H, SV,
  Sp, R, MDG, KrF) bekrefter Venstre ikke har plass i næringskomiteen
  denne perioden.
