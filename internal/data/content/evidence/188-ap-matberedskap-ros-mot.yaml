claim_confidence: dokumentert
attribution_confidence: svakt_dokumentert
context_note: >
  Kodet -1: Aps generelle produksjonsfokuserte merknad er dokumentert,
  men den svarer ikke direkte på spørsmålet forslag 2 stiller (skal
  det gjennomføres en formell risikoanalyse), og nevner ikke
  regjeringens eget varslede, uteblitte ROS-arbeid som minoriteten
  peker på. Samme svakhet som Aps begrunnelse i utsagn-38 (evidence/167):
  begrunnelsen er reell, men generell for hele saken, ikke skrevet mot
  dette spesifikke forslaget.
