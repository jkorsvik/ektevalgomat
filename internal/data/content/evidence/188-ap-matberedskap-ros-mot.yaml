date: "2026-06-05"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  Ap stemte mot. Ingen merknad spesifikt om ROS-analysen er funnet;
  Aps eneste dokumenterte generelle begrunnelse i saken (kontinuerlig
  produksjon og handelssystemer som grunnpilarer) er skrevet i
  sammenheng med lagrings- og produksjonsspørsmål, ikke direkte om
  behovet for en risikokartlegging.
claim_action: >
  Votering_id 28067, Ap 0 for, 31 mot. Aps generelle merknad i saken
  (samme sitat som i evidence/167, utsagn-38): "Komiteens medlemmer
  fra Arbeiderpartiet mener at kontinuerlig produksjon, ivaretakelse
  av produksjonsgrunnlaget og velfungerende handelssystemer er
  grunnpilarene for matsikkerheten i Norge." Ingen egen omtale av
  ROS-analysen eller regjeringens varslede, men uteblitte, arbeid med
  den er funnet i Aps merknad.
status: forslag_avvist_stemte_mot
position: -1
