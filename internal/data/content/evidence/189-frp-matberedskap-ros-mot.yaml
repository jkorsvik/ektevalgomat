context_note: >
  Kodet -1 fra stemmetallet alene. Den mest interessante enkeltfunnet
  i utsagn-39: FrP stemte FOR en konkret ny lagringsmekanisme
  (forslag 1, +2, med navngitt finsk modell) men MOT en formell
  kartlegging av risikoen den samme mekanismen skal svare på — uten
  noen dokumentert grunn til å avvise akkurat kartleggingen. En
  plausibel, men udokumentert, tolkning er at FrP anser svaret
  (fysiske lagre) som allerede kjent og ikke ønsker å vente på en
  analyse før tiltak — men dette er ikke skrevet noe sted i FrPs egne
  merknader, og skal derfor ikke presenteres som fakta.
