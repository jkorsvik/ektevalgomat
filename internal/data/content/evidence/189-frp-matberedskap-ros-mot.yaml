claim_action: >
  Votering_id 28067, FrP 0 for, 29 mot. Ingen FrP-merknad om
  ROS-analysen spesifikt er funnet i innstillingens fulltekst; FrPs
  eneste merknader i saken er den delte FrP+KrF-teksten om fysiske
  beredskapslagre etter finsk modell (evidence/162), som ikke omtaler
  en risiko- og sårbarhetsanalyse.
