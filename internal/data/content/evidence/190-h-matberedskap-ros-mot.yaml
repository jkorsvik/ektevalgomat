scan_summary: >
  Høyre stemte mot, uten en egen, distinkt merknad om ROS-analysen.
  Høyres eneste merknader i saken er delte tekster sammen med andre
  partier om andre spørsmål (se evidence/168, utsagn-38), ingen av
  dem omtaler en risiko- og sårbarhetsanalyse for matforsyning.
claim_action: >
  Votering_id 28067, H 0 for, 14 mot. Ingen egen H-merknad om
  ROS-analysen funnet i innstillingens fulltekst.
