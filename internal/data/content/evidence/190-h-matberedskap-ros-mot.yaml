context_note: >
  Kodet -1 fra stemmetallet alene. Sammen med Ap og FrP utgjør Høyre
  den mot-siden av det bredeste for/mot-gapet i denne saken (6 partier
  for, 3 mot) uten at noen av de tre har en dokumentert, forslags-
  spesifikk grunn for nettopp å avvise en risikokartlegging — en
  strukturell observasjon om denne saken, ikke et enkeltfunn: de tre
  partiene med regjeringserfaring/-ansvar (Ap, H) eller nær regjerings-
  posisjon (FrP) er nettopp de som ikke skriftlig forklarer hvorfor de
  ikke vil pålegge regjeringen å kartlegge risikoen.
