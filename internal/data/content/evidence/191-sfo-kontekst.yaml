context_note: >
  Første utsagn i datasettet der Stortinget faktisk STYRKER en
  konkret velferdsrettighet for barn utover regjeringens egen
  proposisjon, ikke bare avviser eller vedtar en svakere
  kompromiss-tekst. Fire ulike, alle dokumenterte, grunner til å
  stemme mot finnes i denne saken — en sjeldenhet i datasettet, der
  mot-siden oftest er udokumentert eller deler én generell
  begrunnelse: KrF vil heller bruke pengene på skolen selv
  (ressursprioritering, se evidence/197), Venstre er bekymret for et
  ufinansiert kommunalt pålegg (se evidence/198), FrP vil evaluere
  bemannings- og finansieringsbehovet FØRST, ikke avvise målet (se
  evidence/199), og Høyre vil prioritere kommunalt handlingsrom over
  en ny individuell rettighet og viser til at ressurssituasjonen i
  SFO allerede er forverret av gratis kjernetid (se evidence/200).
  Ap, SV, Sp og Rødt deler én merknad som eksplisitt kobler denne
  loven til et tidligere flertallsvedtak i statsbudsjettet for 2025 —
  lovfestingen gjør en budsjettbevilgning til en rettighet som ikke
  kan reverseres i neste budsjettforhandling uten et nytt lovvedtak.
