scan_summary: >
  Prop. 160 L (2024–2025), Innst. 78 L (2025–2026): endring i
  opplæringslova om rett til 12 timer gratis skolefritidsordning per
  uke for elever på 1.–3. trinn. Komiteens flertall (H, FrP, KrF, V)
  ville avvise lovfestingen og bare la ordningen bli stående som en
  budsjettbevilgning; Ap, SV, Sp og Rødt sto bak et eget forslag om å
  lovfeste retten direkte i loven. Forslaget vant en alternativ
  votering 52 mot 49, og hele loven ble deretter vedtatt 53 mot 48 —
  en sak der Stortinget faktisk styrket en velferdsordning for barn
  utover det regjeringens egen lovproposisjon isolert la opp til.
claim_action: >
  Votering_id 26667 (alternativ votering mellom innstillingen og
  forslag nr. 1 fra Ap, SV, Sp og Rødt): "Elevar på 1. til 3. trinn
  har rett til 12 timar gratis skolefritidsordning per veke." Vedtatt
  52 for (Ap 31, SV 5, Sp 6, Rødt 5, MDG 5) mot 49 (FrP 29, H 14, KrF
  4, V 1, samt 1 Ap-representant). Sluttvotering over hele loven
  (votering_id 26668): 53 for / 48 mot.
