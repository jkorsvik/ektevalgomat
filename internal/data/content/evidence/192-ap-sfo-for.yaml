evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  Ap stemte for, som medforslagsstiller sammen med SV, Sp og Rødt, med
  en delt begrunnelse som eksplisitt kobler lovfestingen til
  budsjettvedtaket for 2025 og fremhever betydningen av gratis SFO
  for barns deltakelse i lek, læring og fellesskap.
claim_action: >
  Votering_id 26667, Ap 31 for, 1 mot (enkeltrepresentant). Fra
  Ap+SV+Sp+Rødts delte merknad: "Disse medlemmer viser til at
  Arbeiderpartiet sammen med Senterpartiet og Sosialistisk
  Venstreparti har sikret 12 timer gratis SFO for 1.–3. trinn. [...]
  En lovfesting vil styrke rettighetene til elevene og foreldrene, og
  sikre at alle elever på 1.–3. trinn får 12 timer gratis SFO i uka
  dersom det er noe de ønsker og har behov for."
verbatim_excerpt: >
  Disse medlemmer vil fremheve viktigheten gratis og lav pris på SFO
  har for at flere barn skal få delta i lek, læring og fellesskap
  etter skoletid.
