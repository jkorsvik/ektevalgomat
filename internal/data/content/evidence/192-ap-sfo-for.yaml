context_note: >
  Kodet +2 (sterkt for): Ap navngir konkret at ordningen allerede ble
  "sikret" gjennom budsjettvedtaket for 2025, og at lovfesting nå gjør
  den til en individuell rettighet foreldre kan kreve — et konkret,
  etterprøvbart argument om hva lovfesting FAKTISK endrer (fra
  budsjettbevilgning til rettighet), ikke bare en generell
  velvilje-uttalelse. Delt merknad med SV, Sp, Rødt, se evidence/193-195.
