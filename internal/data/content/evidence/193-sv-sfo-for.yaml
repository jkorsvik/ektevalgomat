context_note: >
  Kodet +2. Andre av de fire partiene bak den delte merknaden (Ap,
  SV, Sp, Rødt) — identisk begrunnelse og identisk stemmegivning som
  de andre tre, se evidence/192, 194-195. SV nevnes eksplisitt i
  merknaden selv (sammen med Ap og Sp) som en av de tre partiene som
  "har sikret" ordningen i budsjettet for 2025 — sterkere egenkobling
  enn Rødt, som er medforslagsstiller men ikke navngitt i den samme
  setningen.
