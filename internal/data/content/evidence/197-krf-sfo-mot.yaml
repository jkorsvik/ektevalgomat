claim_action: >
  Votering_id 26667, KrF 0 for, 4 mot. Fra KrFs egen merknad: "Dette
  medlem understreker at gratis SFO for 1.–3. trinn ikke er riktig
  prioritering av ressursene når skolen sårt trenger et løft."
verbatim_excerpt: >
  Dette medlem vil på denne bakgrunn stemme mot forslaget om å
  lovfeste retten til 12 timer gratis skolefritidsordning i uken for
  elever på 1. til 3. trinn.
