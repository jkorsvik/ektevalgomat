scan_summary: >
  Venstre stemte mot, med en egen begrunnelse om ufinansierte
  kommunale pålegg: staten bør ikke pålegge kommunene nye oppgaver
  uten tilstrekkelig finansiering, prinsipielt uavhengig av selve
  SFO-spørsmålet.
claim_action: >
  Votering_id 26667, V 0 for, 1 mot. Fra Venstres egen merknad: "Det
  er på generelt grunnlag også viktig at staten ikke skal pålegge
  kommunene oppgaver uten at det følger med tilstrekkelig
  finansiering."
verbatim_excerpt: >
  På denne bakgrunn vil dette medlem stemme mot forslaget om å
  lovfeste retten til 12 timer gratis skolefritidsordning i uken for
  elever på 1. til 3. trinn.
