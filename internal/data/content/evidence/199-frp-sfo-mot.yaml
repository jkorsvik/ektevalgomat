scan_summary: >
  FrP stemte mot lovfestingen, men med en begrunnelse som er mer
  "vent og evaluer" enn en prinsipiell avvisning av målet: partiet
  ville ha en helhetlig evaluering av bemannings- og
  finansieringsbehovet FØR loven ble vedtatt, ikke en avvisning av
  gratis SFO som sådan.
claim_action: >
  Votering_id 26667, FrP 0 for, 29 mot. FrPs eget forslag nr. 2 (falt
  30-71, votering_id 26665): "Stortinget ber regjeringen foreta en
  helhetlig evaluering av ordningen med 12 timer gratis SFO, herunder
  bemanningsbehov, kvalitetskrav og finansieringsmodell." Fra FrPs
  merknad: "Disse medlemmer viser til at gratisordningen allerede har
  ført til en markant økning i antall barn i SFO, samtidig som
  kommunene melder om at bevilgningene ikke dekker de faktiske
  kostnadene [...] det er etter disse medlemmers syn ikke forsvarlig
  å lovfeste en ny individuell rettighet som vil forsterke dette
  presset ytterligere."
