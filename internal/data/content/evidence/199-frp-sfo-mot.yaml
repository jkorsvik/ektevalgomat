claim_confidence: dokumentert
attribution_confidence: null
context_note: >
  Kodet -1 (mot, ikke sterkt mot): FrPs egen begrunnelse og eget
  forslag ber om evaluering og forskriftsfesting av
  bemannings-/kvalitetskrav FØRST, ikke en avvisning av gratis SFO
  som velferdsordning i seg selv — en svakere mot-posisjon enn KrF og
  Venstre (begge -2, se evidence/197-198), som begge har prinsipielle
  innvendinger mot selve lovfestingen. FrPs egen tallfesting ("markant
  økning i antall barn i SFO") er et konkret, etterprøvbart
  faktapunkt, samme argumentasjonsstil som FrPs tidligere
  tallfesting i Innovasjon Norge-saken (evidence/147) og
  matberedskap-saken (evidence/162) — her brukt til å begrunne en
  pause, ikke en avvisning.
