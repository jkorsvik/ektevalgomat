scan_summary: >
  Høyre stemte mot, med en egen, prinsipiell begrunnelse om kommunalt
  handlingsrom: partiet vil gi kommunene STØRRE frihet til å håndtere
  egne utfordringer, ikke mindre, og viser til at ressurssituasjonen
  i SFO allerede er forverret etter innføringen av gratis kjernetid.
claim_action: >
  Votering_id 26667, H 0 for, 14 mot. Fra Høyres egen merknad: "Disse
  medlemmer er bekymret for at en ny lovfestet rettighet kan medføre
  utilsiktede konsekvenser for kommunenes økonomiske prioriteringer,
  særlig i lys av at flere høringsinstanser forteller at
  ressurssituasjonen i SFO er forverret siden innføring av gratis
  kjernetid." Regjeringens egen uttalelse siteres: økt gratis SFO og
  redusert bemanningsfaktor "har gjort tilbodet for barn med behov
  for særskild tilrettelegging dårlegare".
verbatim_excerpt: >
  Disse medlemmer mener prinsipielt det er behov for å gi kommunene
  større lokalt handlingsrom til å håndtere sine utfordringer, ikke
  mindre.
