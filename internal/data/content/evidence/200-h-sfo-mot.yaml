context_note: >
  Kodet -2 (sterkt mot): Høyres begrunnelse er den mest konkrete av
  de fire mot-begrunnelsene i denne saken — siterer regjeringens EGEN
  innrømmelse at gratis kjernetid allerede har gjort SFO-tilbudet
  dårligere for barn med særskilte behov, og bruker dette som et
  argument mot å utvide ordningen videre uten å løse det
  underliggende bemanningsproblemet først. Prinsipiell
  kommunalt-selvstyre-begrunnelse, ikke bare en enkeltsaks-innvending
  — samme argumentasjonslinje som Høyre har brukt i andre saker om
  statlige pålegg til kommunene i dette datasettet.
