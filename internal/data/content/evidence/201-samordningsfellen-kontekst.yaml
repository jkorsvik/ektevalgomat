scan_summary: >
  Dokument 8:19 L (2025–2026), Innst. 54 L (2025–2026): FrPs
  representantforslag om å avvikle "samordningsfellen" — en effekt av
  pensjonsreformen fra 2011 der offentlig tjenestepensjon avkortes
  mer og mer for hvert år man står i arbeid etter 67 år, for
  årskullene født 1944–1962. Komiteens tilråding avviste FrPs
  opprinnelige lovforslag (vedtatt 71 mot 29), men en løsere
  gulvamendment fremmet av MDG under debatten vant en knivskarp
  votering 51 mot 50 og ble det faktiske vedtaket i saken.
claim_action: >
  Tre forslag ble fremmet under debatten 16.12.2025: Forslag 1 (FrP,
  full lovendring, avvist 29 for/73 mot, votering_id 26602), Forslag 3
  (FrP, SV og Rødt, avvist 40 for/60 mot, votering_id 26603), og
  Forslag 2 (MDG, vedtatt 51 for/50 mot, votering_id 26604) — som ble
  Vedtak 164: "Stortinget ber regjeringen utrede tiltak for at ingen
  offentlig ansatte taper offentlig tjenestepensjon ved å stå, eller
  ha stått, lengre i jobb enn 67 års alder [...], at dette skal gjelde
  fra kullene født fra og med 1944, samt hva budsjettkonsekvenser og
  samfunnsøkonomiske effekter vil være om dette innføres fra
  1.1.2027."
