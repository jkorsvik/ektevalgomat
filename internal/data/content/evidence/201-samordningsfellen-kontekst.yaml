context_note: >
  Komplettering av Generasjonsansvar (37, 40 — "Synliggjøres
  konsekvensene 10–30 år frem?" — nå 2/2 real). Saken tester dette
  direkte: en regelmekanisme fra en reform vedtatt i 2011 fortsetter å
  ramme et navngitt, avgrenset sett av årskull (1944–1962) 14 år
  senere, og spørsmålet er om Stortinget vil synliggjøre og rette opp
  denne langsiktige, utilsiktede konsekvensen eller la den fortsette.
  Uvanlig koalisjonsmønster på den vinnende voteringen: FrP, MDG, Rødt,
  SV, Sp og Venstre for, mot Ap, Høyre og KrF — verken et rent
  venstre-høyre-skille eller et rent regjering-vs-opposisjon-skille.
  Ap viser i sin egen merknad til at saken er behandlet "ni ganger
  tidligere" og peker på at FrP "kun har fremmet forslag av denne
  typen når de har vært i opposisjon [...], mens partiet unnlot å
  gjennomføre slike endringer da de selv var med i en
  flertallskonstellasjon på Stortinget fra 2013 til 2021" — et konkret
  konsistens-argument mot FrP selv, ikke en direkte imøtegåelse av
  forslag 2s spesifikke utrede-bestilling. Komiteens tilråding
  ("Dokument 8:19 L [...] vedtas ikke", votering_id 26605, vedtatt 71
  mot 29) fremmes av Ap, Høyre, SV OG Rødt sammen — SV og Rødt avviser
  altså FrPs opprinnelige, konkrete lovtekst formelt, samtidig som de
  stemmer for et alternativt, mildere utrede-vedtak (forslag 2) og et
  eget forslag 3 — samme "avvis dette spesifikke forslaget, støtt et
  annet mekanisme for samme mål"-mønster sett flere ganger tidligere i
  datasettet (strømpris/Norgespris-saken, matberedskap-saken).
