context_note: >
  Kodet +2 (sterkt for): FrP er opprinnelig forslagsstiller med en
  fullt utformet, konkret lovtekst (forslag 1, evidence/201s
  kontekst), og har en egen, saks-spesifikk begrunnelse om
  motsetningen mellom hevet aldersgrense og samordningsreglenes
  effekt — ikke bare en generell velvilje-uttalelse. FrPs forslag 1
  falt (29 mot 73), men partiet stemte konsekvent for de svakere
  alternativene (forslag 2 og 3) også, i motsetning til f.eks. Sp i
  matberedskap-saken (utsagn-38) som stemte mot sitt eget opprinnelige
  forslag.
