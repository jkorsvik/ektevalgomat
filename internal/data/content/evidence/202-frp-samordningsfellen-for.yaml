scan_summary: >
  FrP stemte for på alle tre forslag, som opprinnelig forslagsstiller
  til hele saken (Dokument 8:19 L) og eneste part med en full,
  konkret lovendringstekst (forslag 1). Egen merknad peker på
  motsetningen mellom å heve aldersgrensen til 72 år og samtidig ha
  samordningsregler som straffer nettopp det å stå lenger i arbeid.
claim_action: >
  Votering_id 26604 (forslag 2, MDG), FrP 29 for, 0 mot. Fra FrPs egen
  merknad: partiet fremmer forslag om opphevelse av samordningsfellen
  med ikrafttredelse "fra den tiden Kongen bestemmer" (ikke straks),
  og argumenterer for at dette adresserer motsetningen mellom å heve
  aldersgrensen til 72 år og å ha samordningsregler som reduserer
  pensjonen for å stå lenger i arbeid.
