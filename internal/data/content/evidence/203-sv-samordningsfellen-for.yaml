scan_summary: >
  SV stemte for på forslag 2 og 3 (medforslagsstiller på forslag 3
  med FrP og Rødt), med den mest omfattende egne merknaden i saken —
  inkludert en kost-nytte-vurdering som forsvarer den anslåtte
  384-millionerskroner-kostnaden ved full avvikling.
claim_action: >
  Votering_id 26604, SV 5 for, 0 mot. Fra SVs egen merknad: "På denne
  bakgrunn vil dette medlem fremme forslag om avvikling av
  samordningsfellen og gi offentlig ansatte for årsklassene 1944 til
  1962 tilsvarende tjenestepensjon som gjaldt før 2011." SV viser til
  statsrådens svarbrev av 17. januar 2024 og argumenterer at en
  kostnad på 384 mill. kroner er berettiget.
