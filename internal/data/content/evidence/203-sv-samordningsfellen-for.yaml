context_note: >
  Kodet +2 (sterkt for): SVs merknad er den mest detaljerte i saken —
  konkret kronebeløp (384 mill. kr), en navngitt kilde (statsrådens
  svarbrev 17.1.2024), og en direkte kobling til hva ordningen var
  FØR 2011-reformen. SV er medforslagsstiller på forslag 3 (falt) og
  stemte samtidig for det svakere forslag 2 (vedtatt) — samme
  "godta det svakere alternativet når det sterkere faller"-mønster
  Ap+Rødt viste i strømpris-saken (utsagn-12).
