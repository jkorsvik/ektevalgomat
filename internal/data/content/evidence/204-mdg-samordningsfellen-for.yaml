context_note: >
  Kodet +2: selv uten en prosa-merknad har MDG den sterkeste mulige
  dokumentasjonen — eneste forslagsstiller på den ORDLYD som faktisk
  ble vedtatt, med en presis, forhandlet formulering (utrede, ikke
  lovendre direkte; navngir 1944-kullet; setter en konkret
  rapporteringsfrist mot 1.1.2027). At forslaget kom som en
  gulvamendment under debatten og ikke i den trykte innstillingen,
  forklarer hvorfor det ikke finnes en skriftlig MDG-merknad å sitere
  fra — teksten i seg selv ER dokumentasjonen.
