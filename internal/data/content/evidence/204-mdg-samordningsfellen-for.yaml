scan_summary: >
  MDG fremmet, alene, det eneste forslaget i saken som faktisk ble
  vedtatt (forslag 2 — en muntlig fremsatt gulvamendment under
  debatten 16.12.2025, ikke en del av den trykte innstillingen). MDG
  har ingen skriftlig merknad i innstillingen selv, men er eneste
  forslagsstiller på den konkrete, vedtatte teksten.
claim_action: >
  Votering_id 26604, MDG 5 for, 0 mot. Forslagets fulle, vedtatte
  tekst (Vedtak 164): "Stortinget ber regjeringen utrede tiltak for
  at ingen offentlig ansatte taper offentlig tjenestepensjon ved å
  stå, eller ha stått, lengre i jobb enn 67 års alder (etter oppnådd
  alder hvor levealdersjustering er fullt ut kompensert for), at dette
  skal gjelde fra kullene født fra og med 1944, samt hva
  budsjettkonsekvenser og samfunnsøkonomiske effekter vil være om
  dette innføres fra 1.1.2027."
