context_note: >
  Kodet +1 (svakere enn SVs +2): Rødt er medforslagsstiller på
  forslag 3, som er en klar handling, men uten en egen skriftlig
  begrunnelse er det umulig å skille Rødts spesifikke argumentasjon
  fra SVs — de deler formelt sponsorskap, men bare SV har en egen,
  sitérbar merknad (se evidence/203). Interessant institusjonell
  detalj: Rødt er samtidig blant partiene som fremmer komiteens
  tilråding (avvisning av FrPs opprinnelige lovtekst), mens de stemmer
  for de to alternative mekanismene (forslag 2, 3) — konsistent med at
  Rødt vil ha SAKEN løst, men ikke nødvendigvis via nettopp FrPs
  konkrete lovtekst.
