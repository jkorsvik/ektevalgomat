scan_summary: >
  Venstre stemte for forslag 2 (det vedtatte), men har ingen egen
  merknad i innstillingen — sammen med Sp det andre av de to
  avgjørende partiene i den knivskarpe 51-50-voteringen.
claim_action: >
  Votering_id 26604, V 2 for, 0 mot. Ingen Venstre-merknad om
  samordningsfellen funnet i innstillingens fulltekst — i motsetning
  til SFO-saken (utsagn-32, evidence/198), der Venstre HADDE en egen
  merknad i samme type sak (arbeids- og sosialkomiteen har ikke
  Venstre-representant med skriftlig merknad her).
