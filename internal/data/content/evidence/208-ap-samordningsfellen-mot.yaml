context_note: >
  Kodet -1 (mot, ikke sterkt mot): Aps begrunnelse er reell og
  dokumentert, men er et konsistens-/motiv-argument mot FrP ("dere
  hadde makten og gjorde ingenting"), ikke en direkte saklig
  imøtegåelse av HVORFOR selve utrede-bestillingen i forslag 2 er
  uønsket. Samme "prosess/motiv-innvending, ikke saksinnvending"-form
  sett i flere tidligere saker i datasettet (f.eks. matberedskap,
  evidence/167). At Ap likevel er blant partiene som fremmer
  komiteens tilråding sammen med SV og Rødt (som selv stemte for
  alternativene) viser at "vedtas ikke"-tilrådingen kun gjelder FrPs
  spesifikke, opprinnelige lovtekst — ikke et generelt standpunkt delt
  av alle undertegnere.
