scan_summary: >
  Ap stemte mot alle tre forslag, med en egen merknad som peker på at
  saken er behandlet ni ganger tidligere og at FrP kun fremmer slike
  forslag i opposisjon — et konsistens-argument mot FrP selv, ikke en
  direkte imøtegåelse av forslag 2s konkrete utrede-bestilling.
claim_action: >
  Votering_id 26604, Ap 0 for, 32 mot. Fra Aps egen merknad: saken har
  blitt "behandlet ni ganger tidligere" i Stortinget, og FrP "kun har
  fremmet forslag av denne typen når de har vært i opposisjon på
  Stortinget, mens partiet unnlot å gjennomføre slike endringer da de
  selv var med i en flertallskonstellasjon på Stortinget fra 2013 til
  2021." Viser også til tidligere komitémerknader i Innst. 232 L
  (2023–2024).
