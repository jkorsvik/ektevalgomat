scan_summary: >
  Samme sak som utsagn-19 og utsagn-20 (Dokument 8:119 S, Innst. 225
  S, digital suverenitet). SV, Rødt og MDG fremmet i komitébehandlingen
  et konkret forbudsforslag mot bruk av Palantirs systemer i norsk
  offentlig sektor, med direkte henvisning til at Tolletaten allerede
  benytter dem. Forslaget ble avvist 17 mot 84.
claim_action: >
  Forslag 8 (SV, Rødt og MDG): "Stortinget ber regjeringen sørge for
  at Palantirs systemer ikke brukes i norsk offentlig sektor."
  Merknadstekst fra SV+Rødt+MDG: "Tolletaten benytter systemer fra
  Palantir Technologies. Selskapet har tette bånd til amerikansk
  etterretning og det amerikanske krigsdepartementet. Bruken av slike
  systemer i norsk offentlig sektor er uforenlig med ambisjonene om
  digital suverenitet. Den reiser grunnleggende spørsmål om
  jurisdiksjon, tillit og kontroll over sensitive data." Votering_id
  27488 (sakid 200036): 17 for (SV 5, Rødt 5, MDG 5, Venstre 2), 84
  mot (Ap 32, FrP 29, Høyre 14, KrF 4, Sp 5).
