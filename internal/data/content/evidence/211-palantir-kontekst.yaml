context_note: >
  Tredje og siste utsagn i dimensjonen Teknologisk kapasitet (19, 20,
  24 — nå 3/3 real). Samme innstilling som utsagn-19 (forslag 11,
  offentlig eid skytjeneste) og utsagn-20 (forslag 6, Microsoft 365
  exit-strategi), men et tredje, distinkt forslag (nr. 8) fra samme
  sak — testet som eget utsagn fordi det adresserer en annen
  mekanisme (forbud mot en NAVNGITT leverandør med sikkerhetspolitisk
  begrunnelse, ikke generell leverandøruavhengighet eller offentlig
  eierskap). Votering_id funnet ved å reverse-engineere sekvensen:
  Innst. 225 S har 21 mindretallsforslag pluss komiteens tilråding
  (22 voteringer totalt for sakid 200036); formelen votering_id =
  27496 − forslagsnummer stemmer eksakt med de to allerede kjente
  punktene (forslag 11 → 27485, forslag 6 → 27490, komiteens tilråding
  → 27496) og er bekreftet direkte mot data.stortinget.no sitt
  voteringsresultat-endepunkt for forslag 8 (SV+Rødt+MDG-sponset
  koalisjon på 17 stemmer, konsistent med samme partimønster som i
  forslag 6 og 9). Venstre stemte for uten å være medforslagsstiller
  eller komitémedlem — se evidence/220. Ap, FrP, Høyre og Senterpartiet
  har ingen egen, Palantir-spesifikk merknad i innstillingen; deres
  stemmegivning er dokumentert, men begrunnelsen må utledes av den
  generelle komitémerknaden (se de respektive partifilene).
