context_note: >
  Kodet -2 (sterkt uenig i at mangfold og konkurranse er godt nok): SV
  er medforslagsstiller med en konkret, navngitt begrunnelse (Palantirs
  bånd til amerikansk etterretning/forsvar) for et navngitt forbud, det
  motsatte av det snudde utsagnets premiss. Samme SV+Rødt+MDG-koalisjon
  som på flere andre forslag i denne saken (utsagn-20s
  Microsoft365-exit). Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
