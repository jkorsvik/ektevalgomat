scan_summary: >
  SV er en av tre medforslagsstillere til det konkrete Palantir-forbudet,
  med en egen, navngitt sikkerhetspolitisk begrunnelse i innstillingen.
claim_action: >
  Votering_id 27488, SV 5 for, 0 mot. Fra SVs (sammen med Rødt og MDGs)
  felles merknad: "Tolletaten benytter systemer fra Palantir
  Technologies. Selskapet har tette bånd til amerikansk etterretning
  og det amerikanske krigsdepartementet. Bruken av slike systemer i
  norsk offentlig sektor er uforenlig med ambisjonene om digital
  suverenitet. Den reiser grunnleggende spørsmål om jurisdiksjon,
  tillit og kontroll over sensitive data."
