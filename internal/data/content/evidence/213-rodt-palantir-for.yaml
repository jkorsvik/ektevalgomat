context_note: >
  Kodet -2 (sterkt uenig i at mangfold og konkurranse er godt nok): Rødt
  er medforslagsstiller med en direkte, delt begrunnelse (samme sitat
  som SV, se evidence/212), samt en egen bredere merknad med Rødt+MDG om
  digital avhengighet som strukturell sårbarhet — det motsatte av det
  snudde utsagnets premiss. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
