scan_summary: >
  Rødt er medforslagsstiller til Palantir-forbudet, sammen med SV og
  MDG, med samme delte sikkerhetspolitiske begrunnelse.
claim_action: >
  Votering_id 27488, Rødt 5 for, 0 mot. Deler SV og MDGs merknad om
  Palantirs bånd til amerikansk etterretning og forsvarsdepartement.
  Rødt har også, sammen med MDG, en egen tilleggsmerknad i saken om at
  "Norges digitale avhengighet av et fåtall globale teknologiselskaper
  utgjør en alvorlig sårbarhet for samfunnssikkerhet, beredskap og
  demokratisk kontroll" — en bredere ramme Palantir-forslaget er en
  konkret utløper av.
verbatim_excerpt: >
  Norges digitale avhengighet av et fåtall globale teknologiselskaper
  utgjør en alvorlig sårbarhet for samfunnssikkerhet, beredskap og
  demokratisk kontroll.
