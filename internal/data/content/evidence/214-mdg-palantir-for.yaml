claim_action: >
  Votering_id 27488, MDG 5 for, 0 mot. Deler SV og Rødts merknad om
  Palantirs bånd til amerikansk etterretning og forsvarsdepartement.
verbatim_excerpt: >
  Tolletaten benytter systemer fra Palantir Technologies. Selskapet
  har tette bånd til amerikansk etterretning og det amerikanske
  krigsdepartementet. Bruken av slike systemer i norsk offentlig
  sektor er uforenlig med ambisjonene om digital suverenitet.
