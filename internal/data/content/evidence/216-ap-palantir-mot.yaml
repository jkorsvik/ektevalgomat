context_note: >
  Kodet +1 (ikke +2): dette er Aps egen argumentasjon fra saken, gjengitt
  som det snudde utsagnet nå bygger på — sitatet er en generell
  begrunnelse om representantforslaget som helhet (rettet mot
  skytjeneste- og konsesjonsforslagene spesifikt i den delen av
  merknaden), ikke en direkte imøtegåelse av Palantir-forbudet
  spesifikt. Svakt_dokumentert fordi koblingen til akkurat dette
  forslaget må utledes, ikke leses direkte — samme mønster som Høyres
  presedens-henvisning i samordningsfellen-saken (evidence/209). Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
