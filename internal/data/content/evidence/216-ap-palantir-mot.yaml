scan_summary: >
  Ap stemte mot forbudsforslaget. Ap deler en generell merknad med
  Høyre om at Stortinget ikke bør legge detaljerte føringer på
  kompliserte tekniske/juridiske beslutninger uten grundigere
  utredning — men merknaden nevner ikke Palantir spesifikt.
claim_action: >
  Votering_id 27488, Ap 32 mot, 0 for. Fra Aps (og Høyres) felles
  merknad: "Disse medlemmer støtter intensjonen i representantforslaget,
  men mener det ikke er forsvarlig av Stortinget å legge såpass
  detaljerte føringer for viktige beslutninger om meget kompliserte
  saker [...] uten grundigere utredninger."
verbatim_excerpt: >
  Disse medlemmer støtter intensjonen i representantforslaget, men
  mener det ikke er forsvarlig av Stortinget å legge såpass detaljerte
  føringer for viktige beslutninger om meget kompliserte saker [...]
  uten grundigere utredninger.
status: forslag_avvist_stemte_mot
