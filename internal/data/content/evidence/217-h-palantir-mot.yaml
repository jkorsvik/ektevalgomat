scan_summary: >
  Høyre stemte mot forbudsforslaget. Høyre har den mest utviklede
  egne merknaden i saken ("smart suverenitet": diversifisering og
  strenge sikkerhetskrav i stedet for forbud/isolasjon), men nevner
  ikke Palantir ved navn.
claim_action: >
  Votering_id 27488, Høyre 14 mot, 0 for. Fra Høyres egen merknad:
  "Høyre mener Norges digitale handlefrihet best sikres gjennom det
  disse medlemmer omtaler som smart suverenitet: bruk av beste
  tilgjengelige teknologi kombinert med strenge sikkerhetskrav,
  diversifisering av leverandører og sterk europeisk og nordisk
  forankring. Svaret på avhengighet av internasjonale teknologigiganter
  er mangfold og konkurranse – ikke statlige monopoler eller isolasjon
  fra den teknologiske utviklingen."
verbatim_excerpt: >
