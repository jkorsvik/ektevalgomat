scan_summary: >
  FrP stemte mot det konkrete Palantir-forbudet, selv om partiet deler
  en generell merknad med Sp og Rødt om at "det må tas grep for å
  sikre større digital suverenitet."
claim_action: >
  Votering_id 27488, FrP 29 mot, 0 for. Fra FrPs (med Sp og Rødts)
  felles merknad: "Komiteens medlemmer fra Fremskrittspartiet,
  Senterpartiet og Rødt er enige i at det må tas grep for å sikre
  større digital suverenitet, og at dagens sikkerhetspolitiske
  situasjon tilsier en dreining mot større egenevne og fokus på
  beredskap." FrP har også egen merknad om at nordisk/europeisk
  samarbeid støttes "i den grad det styrker beredskap, sikkerhet og
  effektivitet, uten å begrense offentlige og private aktørers
  handlingsrom unødvendig."
verbatim_excerpt: >
  Komiteens medlemmer fra Fremskrittspartiet, Senterpartiet og Rødt er
  enige i at det må tas grep for å sikre større digital suverenitet,
  og at dagens sikkerhetspolitiske situasjon tilsier en dreining mot
  større egenevne og fokus på beredskap.
