context_note: >
  Kodet +1, ikke +2: FrPs stemme mot forbudet er i tråd med det snudde
  utsagnets premiss, men partiets egen generelle merknad ("unngå å
  begrense [...] handlingsrom unødvendig") uttrykker samtidig en
  "digital suverenitet"-bekymring som peker motsatt vei — en tydelig
  retorikk/handling-spenning, derfor +1 ikke +2. FrP er samtidig
  medforslagsstiller på det svakere forslag 1 (skytjeneste-utrede,
  sammen med SV+Rødt) i samme sak, men stemte mot det mer spesifikke Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
  Palantir-forbudet — et interessant "vil ha generell suverenitet, men
  ikke det konkrete, navngitte tiltaket"-mønster, verdt å sammenligne
  med FrPs konsekvente for-stemme i samordningsfellen-saken (utsagn-40,
  evidence/202) der partiet derimot fulgte sin retorikk hele veien til
  handling.
