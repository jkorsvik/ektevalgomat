context_note: >
  Kodet +1: samme retorikk/handling-spenning som FrP (evidence/218) —
  Sp deler den generelle "digital suverenitet"-bekymringen med
  FrP+Rødt, men stemte mot det konkrete, navngitte forbudet, i tråd med
  det snudde utsagnets premiss. Sp er komitémedlem (Bengt Fasteraune) i
  motsetning til Venstre og KrF, som begge er utenfor komiteen i denne
  saken. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
