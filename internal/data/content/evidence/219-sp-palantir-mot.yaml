verbatim_excerpt: >
  Komiteens medlemmer fra Fremskrittspartiet, Senterpartiet og Rødt er
  enige i at det må tas grep for å sikre større digital suverenitet,
  og at dagens sikkerhetspolitiske situasjon tilsier en dreining mot
  større egenevne og fokus på beredskap.
