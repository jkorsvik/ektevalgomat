id: ev-2026-04-21-sv-votering
statement_id: utsagn-01
party_id: sv
actor: "Sosialistisk Venstreparti"
date: "2026-04-21"
evidence_type: voteringsspor
evidence_class: fakta
scan_summary: "SV stemte delt: mot to smalere forslag, for de to mest omfattende."
claim_action: >
  Stemte mot MDGs forslag 3 og 4 (avgrensede forslag om å utrede
  registreringsmodeller for hhv. bare Stortinget eller bare
  departementene/Statsministerens kontor, hver med eget personvernunntak
  for privatpersoner), men stemte for MDGs forslag 2 (utrede "med sikte
  på å innføre" et register som dekker både regjeringsapparatet og
  Stortinget samlet) og for Rødts forslag 1 (lovhjemlet register med
  registrerings-/innrapporteringsplikt og sanksjonsadgang). Stemte
  deretter for selve tilrådingen, som ble enstemmig vedtatt.
status: forkastet
position: 2
source_tier: A
source_name: "Voteringsdetaljer, forslag nr. 1–4, 21.04.2026"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Saker/Sak/Voteringsoversikt/?dnid=1&p=105664"
claim_confidence: dokumentert
context_note: >
  SVs stemmemønster er reelt delt, ikke et konsekvent "for" eller "mot"
  på tvers av alle fire forslag (parti-tally fra
  data.stortinget.no/eksport/voteringsresultat: mot på votering_id
  27257/27258, for på 27259/27260). Kodet til +2 fordi SV endte opp med
  å stemme for de to forslagene som ber om et konkret, forpliktende
  register (MDGs forslag 2 med "sikte på å innføre", og Rødts forslag 1
  med registreringsplikt og sanksjonsadgang) — altså den sterkeste
  formen for støtte til selve utsagnet, ikke et gjennomsnitt av de fire
  stemmene. Hvorfor SV stemte mot de to smalere/avgrensede forslagene
  (nr. 3 og 4) er ikke dokumentert i voteringsdataene alene og er
  bevisst ikke spekulert i her (mulige forklaringer: de smalere forslagene
  ble ansett overflødige etter at det bredere forslag 2 var stemt over,
  eller innholdsmessige innvendinger til akkurat de to avgrensningene) —
  dette bør avklares mot debattreferatet før posisjonen brukes til
  scoring i produksjon. Analytisk posisjonstolkning — bør dobbeltsjekkes
  i human merge-QA.
