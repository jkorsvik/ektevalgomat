context_note: >
  Kodet +1 fra stemmetallet alene, i tråd med det snudde utsagnets
  premiss. KrF er, som Venstre (evidence/215), utenfor kommunal- og
  forvaltningskomiteen i denne saken, men stemte MOT det opprinnelige
  forbudsforslaget der Venstre stemte FOR — de to komité-eksterne
  partiene landet på motsatte sider av denne konkrete voteringen, uten
  at noen av dem har en egen begrunnelse å vise til. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
