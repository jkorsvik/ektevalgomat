scan_summary: >
  Samme sak som utsagn-19, 20 og 24 (Dokument 8:119 S, Innst. 225 S,
  digital suverenitet). Høyre fremmet i komitébehandlingen et
  forslag om felleskommunale innkjøpsordninger for avanserte digitale
  teknologier som KI, etter modell av den danske KOMBIT-selskapet.
  Forslaget ble avvist 23 mot 77 (én Høyre-representant brøt ut av
  partiets egen bloc og stemte mot sitt eget parti-fremmede forslag).
claim_action: >
  Forslag 10 (Høyre alene): "Stortinget ber regjeringen utrede
  felleskommunale innkjøpsordninger for avanserte digitale teknologier
  som kunstig intelligens, etter modell av Danmarks KOMBIT." Votering_id
  27486 (sakid 200036): 23 for (Høyre 12, KrF 4, MDG 5, Venstre 2), 77
  mot (Ap 32, FrP 29, Rødt 5, SV 5, Sp 5, Høyre 1).
