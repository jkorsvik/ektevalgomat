context_note: >
  Andre statement fra Innovasjon/omstillingsevne-dimensjonen (21-23,
  nå 2/3 real) og fjerde forskjellige forslag hentet fra samme
  Innst. 225 S som utsagn-19/20/24 — se docs/roadmap.md for hvordan
  votering_id-formelen (27496 − forslagsnummer) ble utledet og
  bekreftet. Statementets kjerne ("bygge felles offentlig kapasitet
  vs. hver enkelt kjøper separat") passer godt til dimensjonens
  spørsmål, i motsetning til forslag 8 (Palantir-forbud) og forslag
  11 (statlig sky), som handler om KONTROLL over infrastruktur og
  derfor ble kodet under Teknologisk kapasitet i stedet. Interessant
  detalj: dette er det ENESTE forslaget i hele Innst. 225 S-saken der
  en representant stemmer på tvers av sitt eget partis blokk — én av
  13 fremmøtte Høyre-representanter stemte MOT et forslag sitt eget
  parti hadde fremmet, mens de resterende 12 stemte for. Ingen
  skriftlig forklaring på avviket er funnet i innstillingen (kan være
  en feilregistrering eller en reell individuell disens; begge er like
  interessante for videre datainnsamling).
