context_note: >
  Kodet +2: Høyre er eneste forslagsstiller, og forslagsteksten selv
  er den sterkeste mulige dokumentasjonen av partiets posisjon. Den
  ene avvikende Høyre-stemmen (mot eget forslag) er notert i
  evidence/221s kontekst, men endrer ikke kodingen av partiets
  offisielle linje — komiteens medlemmer (som fremmet forslaget) er
  den autoritative kilden, ikke enkeltrepresentanters avvik.
