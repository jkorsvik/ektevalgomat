scan_summary: >
  Høyre er eneste forslagsstiller til KOMBIT-forslaget. 12 av 13
  fremmøtte Høyre-representanter stemte for sitt eget forslag; én
  stemte mot.
claim_action: >
  Votering_id 27486, Høyre 12 for, 1 mot. Forslaget er Høyres eget,
  fremmet som en direkte oppfølging av partiets generelle
  "smart suverenitet"-linje i saken (diversifisering og konkurranse
  fremfor statlige monopoler, se evidence/217 for utsagn-24) — her
  anvendt på kommunal KI-anskaffelse spesifikt, med en navngitt dansk
  modell (KOMBIT) som referanse.
verbatim_excerpt: >
  Stortinget ber regjeringen utrede felleskommunale innkjøpsordninger
  for avanserte digitale teknologier som kunstig intelligens, etter
  modell av Danmarks KOMBIT.
