scan_summary: "Kjernekraftutvalget leverte sin utredning og anbefalte ingen større prosess for kjernekraft nå."
claim_action: >
  Leverte NOU 2026: 4 "Kjernekraft i Norge? Fordeler, ulemper og
  forutsetninger" — cirka 500 sider. Utvalget anbefaler at det ikke
  igangsettes en større prosess for introduksjon av kjernekraft i Norge
  nå, og at en eventuell fremtidig beslutning må bygge på IAEAs
  milepælstilnærming og norske demokratiske prosesser. Energidepartementet
  sendte rapporten på offentlig høring med seks måneders frist.
status: mottatt
