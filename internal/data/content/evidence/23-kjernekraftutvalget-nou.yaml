source_name: "NOU 2026: 4 Kjernekraft i Norge? (referert i statsrådens brev til energi- og miljøkomiteen, 13. april 2026, vedlagt Innst. 278 S)"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2025-2026/inns-202526-278s/"
claim_confidence: dokumentert
context_note: >
  Institusjonell kontekst, ikke en partiposisjon. Henvisningen til NOU
  2026:4 og statsrådens vurdering er hentet fra Terje Aaslands brev av
  13. april 2026 til energi- og miljøkomiteen, trykt som vedlegg til
  Innst. 278 S (2025-2026) — hele brevet er lest i fulltekst (PDF), ikke
  bare sammendraget. Statsråden anbefaler at forslagene i Dokument 8:191 S
  ikke vedtas, med henvisning til at spørsmålet allerede er sendt på
  bred offentlig høring.
