scan_summary: >
  Femte forslag hentet fra samme Innst. 225 S (digital suverenitet)
  som utsagn-19, 20, 22 og 24. SV, Rødt og MDG fremmet et forslag om
  et nasjonalt program for åpen kildekode i offentlig sektor med egne
  bevilgninger. Forslaget ble avvist 16 mot 85.
claim_action: >
  Forslag 7 (SV, Rødt og MDG): "Stortinget ber regjeringen opprette et
  nasjonalt program for åpen kildekode i offentlig sektor, med forslag
  til bevilgninger til kompetanseheving og målrettet innføring der
  åpne løsninger reduserer avhengighet av proprietære plattformer og
  styrker gjenbruk." Merknad fra Rødt og MDG: "Flere land i Europa,
  herunder Frankrike og Danmark, har etablert nasjonale programmer for
  åpen kildekode i offentlig sektor. En Harvard-studie fra 2019,
  Government Technology Policy, Social Value, and National
  Competitiveness, har vist at dette har gitt lavere kostnader, mer
  innovasjon og redusert leverandørlåsing." Votering_id 27489
  (sakid 200036): 16 for (SV 5, Rødt 5, MDG 4, Venstre 2), 85 mot
  (Ap 32, FrP 29, Høyre 14, KrF 4, Sp 5, MDG 1).
