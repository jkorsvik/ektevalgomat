context_note: >
  Fullfører Innovasjon/omstillingsevne (21-23, nå 3/3 real) og er det
  femte forskjellige forslaget hentet fra Innst. 225 S — se
  docs/roadmap.md Phase 2t/2u for votering_id-formelen (27496 −
  forslagsnummer). Statementets kjerne ("bygge kompetanse/åpen
  infrastruktur vs. kjøpe proprietært") er den mest direkte testen av
  dimensjonens spørsmål av alle fem utsagn hentet fra denne saken.
  Andre intra-parti-avvik i samme sak: én av fem MDG-representanter
  stemte MOT sitt eget partis medforslag (4 for, 1 mot) — det andre
  funnet av denne typen i saken (det første var Høyre på KOMBIT-
  forslaget, se evidence/221 for utsagn-22). To uavhengige eksempler
  på partidisiplin-brudd i samme innstilling er egnet "kjøtt" for en
  fremtidig funksjon som flagger interne partiavvik automatisk.
