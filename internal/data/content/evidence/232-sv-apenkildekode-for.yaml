  Votering_id 27489, SV 5 for, 0 mot. Deler Rødt og MDGs merknad om at
  Frankrike og Danmark allerede har nasjonale åpen kildekode-programmer,
  og en Harvard-studie fra 2019 som viser lavere kostnader, mer
  innovasjon og redusert leverandørlåsing som resultat.
