context_note: >
  Kodet +2 på partiets offisielle linje (komiteens MDG-medlem er
  medforslagsstiller med en egen, sitérbar begrunnelse), men merk at
  1 av 5 fremmøtte MDG-representanter stemte MOT sitt eget partis
  forslag — det andre eksempelet på intern partidisiplin-brudd i
  denne saken (det første var Høyre på KOMBIT-forslaget, evidence/222
  for utsagn-22). Ingen skriftlig forklaring på avviket er funnet.
  Attribution_confidence satt til svakt_dokumentert fordi den
  offisielle merknaden er sterk, men stemmetallet viser at "MDGs
  posisjon" ikke var enstemmig blant representantene som var
  til stede.
