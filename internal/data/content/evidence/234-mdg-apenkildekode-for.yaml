claim_action: >
  Votering_id 27489, MDG 4 for, 1 mot. Deler SV og Rødts merknad om
  åpen kildekode som verktøy for å redusere avhengighet og styrke
  digital suverenitet, med henvisning til Frankrike, Danmark og en
  Harvard-studie fra 2019.
verbatim_excerpt: >
  Åpen kildekode er et av de viktigste verktøyene for å redusere
  avhengighet og styrke digital suverenitet.
