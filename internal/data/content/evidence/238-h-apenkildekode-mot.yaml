scan_summary: >
  Høyre stemte mot. Partiets egen merknad i saken favoriserer
  "mangfold og konkurranse" mellom leverandører fremfor statlig
  bevilgning til én bestemt teknologisk tilnærming (åpen kildekode),
  selv om Høyre ikke nevner åpen kildekode ved navn i denne konteksten.
claim_action: >
  Votering_id 27489, Høyre 14 mot, 0 for. Fra Høyres egen merknad om
  saken generelt: "Svaret på avhengighet av internasjonale
  teknologigiganter er mangfold og konkurranse – ikke statlige
  monopoler eller isolasjon fra den teknologiske utviklingen."
verbatim_excerpt: >
  Svaret på avhengighet av internasjonale teknologigiganter er
  mangfold og konkurranse – ikke statlige monopoler eller isolasjon
  fra den teknologiske utviklingen.
