scan_summary: >
  Sjette forslag hentet fra Innst. 225 S (digital suverenitet), samme
  sak som utsagn-19, 20, 22, 23 og 24. MDG fremmet alene et forslag om
  et uavhengig nasjonalt digitalt kriseråd. Forslaget ble avvist 8 mot
  91 — med interne partisplitter i BÅDE Rødt og SV.
claim_action: >
  Forslag 21 (MDG alene): "Stortinget ber regjeringen utrede
  etablering av et uavhengig nasjonalt digitalt kriseråd med ansvar
  for strategiske råd knyttet til digital sikkerhet, suverenitet og
  personvern." MDGs egen merknad: "Dette medlem viser til at den
  geopolitiske situasjonen har gjort det tydelig at digital
  infrastruktur kan brukes som pressmiddel mot stater og
  institusjoner. [...] Dette medlem mener det er behov for et
  uavhengig nasjonalt organ som kan gi strategiske råd om digital
  sikkerhet, suverenitet og personvern på tvers av sektorer og
  forvaltningsnivåer." Votering_id 27475 (sakid 200036): 8 for (MDG 5,
  Rødt 1, SV 2), 91 mot (Ap 32, FrP 29, Høyre 13, KrF 4, Sp 5, Rødt 4,
  SV 2, Venstre 2).
