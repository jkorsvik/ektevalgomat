context_note: >
  Første statement i Robusthet/adaptabilitet-dimensjonen (38, 39, 41,
  42, nå 3/4 real) og sjette forskjellige forslag hentet fra denne
  ene saken — se docs/roadmap.md Phase 2t/2u/2v for votering_id-
  formelen (27496 − forslagsnummer). Dette er den TREDJE og klart mest
  dramatiske intra-parti-splitten funnet i saken: Rødt, som ellers har
  stemt i lockstep med MDG på hvert eneste digital-suverenitet-forslag
  i denne innstillingen (se evidence-klyngene for utsagn-19/20/22/23/24),
  stemte her 4 MOT og bare 1 FOR MDGs forslag — nesten motsatt av det
  vanlige mønsteret. SV splittet nøyaktig på midten (2 for, 2 mot, 5
  ikke til stede). Én mulig tolkning: Rødt og deler av SV foretrekker
  kanskje sine EGNE, mer konkrete forslag (som nasjonal skytjeneste,
  forslag 11, eller Palantir-forbudet, forslag 8) fremfor et nytt,
  uavhengig rådgivende organ — men dette er ikke dokumentert direkte
  og er verdt å undersøke videre. To tidligere splitter i samme sak
  (Høyre på KOMBIT-forslaget, MDG på åpen kildekode-forslaget) var
  begge 80%+ enighet med kun 1 avviker; denne er den første med en
  ekte, nær 50/50 (SV) eller motsatt (Rødt) fordeling.
