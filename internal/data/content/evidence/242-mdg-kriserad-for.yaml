scan_summary: >
  MDG er eneste forslagsstiller til det digitale kriserådet, med en
  egen, geopolitisk begrunnet merknad. Alle 5 fremmøtte MDG-
  representanter stemte for.
claim_action: >
  Votering_id 27475, MDG 5 for, 0 mot. Fra MDGs egen merknad: "Dette
  medlem viser til at den geopolitiske situasjonen har gjort det
  tydelig at digital infrastruktur kan brukes som pressmiddel mot
  stater og institusjoner. [...] Dette medlem mener det er behov for
  et uavhengig nasjonalt organ som kan gi strategiske råd om digital
  sikkerhet, suverenitet og personvern på tvers av sektorer og
  forvaltningsnivåer."
verbatim_excerpt: >
  Den geopolitiske situasjonen har gjort det tydelig at digital
  infrastruktur kan brukes som pressmiddel mot stater og
  institusjoner. [...] Det er behov for et uavhengig nasjonalt organ
  som kan gi strategiske råd om digital sikkerhet, suverenitet og
  personvern på tvers av sektorer og forvaltningsnivåer.
