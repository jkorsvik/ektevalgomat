context_note: >
  Kodet 0 (nøytral/uavklart), ikke +1 eller -1: SVs fremmøtte
  representanter delte seg eksakt 2-2, og med 5 av 9 representanter
  ikke til stede er det ikke mulig å si hva "partiets" posisjon ville
  vært med full oppmøte. Ingen skriftlig SV-merknad om kriserådet
  finnes. Dette er datasettets første eksempel på en ekte intern
  uavgjort-splitt (i motsetning til Høyre 12-1 og MDG 4-1 andre
  steder i samme sak, der et klart flertall likevel fantes) — verdt å
  fremheve som et eget tilfelle for en fremtidig
  "partienighet"-indikator.
