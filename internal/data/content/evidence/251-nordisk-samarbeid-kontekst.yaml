scan_summary: >
  Syvende og siste forslag hentet fra Innst. 225 S (digital
  suverenitet). SV, Rødt og MDG fremmet et forslag om tettere nordisk
  og europeisk samarbeid om digitale løsninger og beredskap. Forslaget
  ble avvist 21 mot 80, men fikk støtte fra KrF og Venstre i tillegg
  til sponsorpartiene — mens Høyre stemte mot, til tross for en egen
  skriftlig merknad som eksplisitt sier partiet "støtter" nettopp
  denne formuleringen.
claim_action: >
  Forslag 3 (SV, Rødt og MDG): "Stortinget ber regjeringen ta
  nødvendige grep for å samarbeide tettere med nordiske og europeiske
  land om felles digitale løsninger og beredskap, hvor åpne
  kildekoder og digital suverenitet over digital infrastruktur er
  førende for samarbeidet." Votering_id 27493 (sakid 200036): 21 for
  (SV 5, Rødt 5, MDG 5, KrF 4, Venstre 2), 80 mot (Ap 32, FrP 29,
  Høyre 14, Sp 5).
