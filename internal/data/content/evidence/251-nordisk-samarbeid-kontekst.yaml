context_note: >
  Sjuende og siste statement mined fra denne saken; fullfører
  Robusthet/adaptabilitet-dimensjonen (38, 39, 41, 42 — nå 4/4). Det
  mest oppsiktsvekkende funnet: Høyres EGEN skriftlige merknad i denne
  innstillingen sier ordrett "Disse medlemmer støtter forslaget om å
  samarbeide tettere med nordiske og europeiske land om felles
  digitale løsninger og beredskap, og mener dette er den mest
  virkningsfulle tilnærmingen for å sikre reell digital suverenitet
  over tid" — likevel stemte samtlige 14 fremmøtte Høyre-representanter
  MOT det eksakte forslaget som ordlegger nettopp dette (forslag 3).
  Se evidence/259 for full sitering og analyse av dette gapet mellom
  ord og handling. FrP og Sp, som begge har skrevet støttende merknader
  om nordisk/europeisk samarbeid tidligere i saken, stemte også mot —
  et gjennomgående mønster i denne saken der komitépartienes
  skriftlige "vi støtter i prinsippet"-merknader ikke omsettes til
  stemmer når et konkret forslag faktisk kommer til votering.
