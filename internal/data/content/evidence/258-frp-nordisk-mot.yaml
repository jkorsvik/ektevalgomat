scan_summary: >
  FrP har en egen, forslagsspesifikk merknad om nettopp nordisk og
  europeisk samarbeid — betinget støtte — men stemte likevel mot det
  konkrete forslaget som ordlegger denne ideen.
claim_action: >
  Votering_id 27493, FrP 29 mot, 0 for. Fra FrPs egen merknad: "Når
  det gjelder økt nordisk og europeisk samarbeid om digitale
  løsninger, støtter disse medlemmer dette i den grad det styrker
  beredskap, sikkerhet og effektivitet, uten å begrense offentlige og
  private aktørers handlingsrom unødvendig."
verbatim_excerpt: >
  Når det gjelder økt nordisk og europeisk samarbeid om digitale
  løsninger, støtter disse medlemmer dette i den grad det styrker
  beredskap, sikkerhet og effektivitet, uten å begrense offentlige og
  private aktørers handlingsrom unødvendig.
