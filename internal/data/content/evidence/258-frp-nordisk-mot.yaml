context_note: >
  Kodet -1 basert på den faktiske stemmen, IKKE på merknaden: FrP
  skriver en betinget støtte-merknad om nettopp nordisk/europeisk
  samarbeid ("i den grad det styrker beredskap, sikkerhet og
  effektivitet"), men stemte deretter mot det konkrete forslaget som
  ber regjeringen gjøre nøyaktig dette. Dette er den andre av to
  dokumenterte ord-mot-handling-gap i denne saken (se evidence/259 for
  Høyres, som er enda tydeligere formulert) — begge de to største
  opposisjonspartiene på borgerlig side skriver støttende ord om
  internasjonalt samarbeid, men stemmer mot når forslaget faktisk
  kommer til votering.
