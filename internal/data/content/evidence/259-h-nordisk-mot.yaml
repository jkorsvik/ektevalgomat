scan_summary: >
  Høyres egen skriftlige merknad sier ordrett at partiet "støtter"
  nettopp dette forslaget om nordisk/europeisk samarbeid om digitale
  løsninger og beredskap — men samtlige 14 fremmøtte
  Høyre-representanter stemte likevel MOT det når det kom til
  votering. Det klareste ord-mot-handling-gapet i hele datasettet.
claim_action: >
  Votering_id 27493, Høyre 14 mot, 0 for. Fra Høyres egen merknad:
  "Disse medlemmer støtter forslaget om å samarbeide tettere med
  nordiske og europeiske land om felles digitale løsninger og
  beredskap, og mener dette er den mest virkningsfulle tilnærmingen
  for å sikre reell digital suverenitet over tid."
verbatim_excerpt: >
