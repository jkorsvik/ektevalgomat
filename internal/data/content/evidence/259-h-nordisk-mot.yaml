context_note: >
  Kodet -1 basert på den faktiske stemmen, IKKE på merknaden — og det
  er nettopp gapet mellom de to som er poenget her. "Disse medlemmer
  støtter forslaget" er ikke en vag velvilje-formulering; det er et
  direkte, uforbeholdent samtykke til akkurat den teksten som deretter
  ble satt til votering som forslag 3. Ingen prosedyremessig forklaring
  (som at Høyre stemte for en alternativ, konkurrerende formulering i
  stedet) fremgår av innstillingen — Høyres egen tilråding (komiteens
  tilråding, som H står bak sammen med FrP og SV) inneholder ikke noe
  om nordisk/europeisk samarbeid. Dette er datasettets klareste
  eksempel på at en skriftlig merknad om "støtte til intensjonen" ikke
  automatisk betyr en stemme for det konkrete forslaget — en advarsel
  mot å score partier på merknadstekst alene uten å sjekke
  voteringsresultatet.
