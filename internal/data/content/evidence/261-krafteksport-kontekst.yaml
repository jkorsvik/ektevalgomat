scan_summary: >
  Innst. 374 S (2025-2026), om Dokument 8:235 S fra Rødt (Sofie
  Marhaug m.fl.) om kontroll over krafteksporten. Komiteens flertall
  (Ap, Høyre, MDG, Venstre) avviste forslaget om Statnett-fullmakt
  til eksportbegrensning og reforhandling av kabelavtalene. Forslag
  1-3 ble votert samlet som én sak.
claim_action: >
  Forslag 1-3 (FrP, SV, Sp og Rødt): "Stortinget ber regjeringen
  innføre en styringsmekanisme hvor Statnett må vurdere og har
  fullmakt til å redusere kapasiteten for krafteksport når
  fyllingsgraden er under mediannivå i de viktigste vannmagasinene i
  Norge... [og] starte reforhandling av avtalene om kraftkabler til
  Tyskland og Storbritannia for å regulere kraftflyten og redusere
  prissmitten... [og] sørge for at hybridkabler ikke tillates ved
  utbygging av havvind." Votering_id 28137 (sakid 200210): 47 for
  (FrP 28, SV 5, Sp 5, Rødt 5, KrF 4), 54 mot (Ap 32, Høyre 14, MDG 5,
  Venstre 2, FrP 1). Komiteens tilråding, votering_id 28138: hele
  Dok. 8:235 S "vedtas ikke" (57 for tilrådingen, 44 mot; vedtatt).
