context_note: >
  En reell venstre-høyre-koalisjon: FrP (nesten samlet, 28 av 29
  fremmøtte), SV, Senterpartiet og Rødt sto sammen mot flertallet av
  Ap, Høyre, MDG og Venstre — begge blokkene krysser den vanlige
  sosialistisk/borgerlig-aksen. KrF, som ikke sitter i
  energi- og miljøkomiteen og ikke er medforslagsstiller, stemte for
  hele paketten (alle 4 fremmøtte). Se utsagn-09 for et beslektet
  forslag (Skagerrak 1/2) fra samme sak der SV IKKE er
  medforslagsstiller og stemmer motsatt — et tegn på at koalisjonen
  er saksspesifikk, ikke en fast blokk.
