scan_summary: >
  FrP er medforslagsstiller med sin egen, distinkte begrunnelse
  (prissmitte fra utenlandskablene). 28 av 29 fremmøtte stemte for,
  1 stemte mot.
claim_action: >
  Votering_id 28137, FrP 28 for, 1 mot. Fra FrPs egen merknad: "Etter
  disse medlemmers syn er det en svakhet ved dagens modell at
  eksportkapasiteten i liten grad justeres dynamisk i takt med den
  faktiske forsyningssituasjonen. Disse medlemmer mener derfor det er
  nødvendig å etablere en tydelig operativ styringsmekanisme hvor
  Statnett pålegges å vurdere og gis fullmakt til å redusere
  eksportkapasiteten når fyllingsgraden i sentrale vannmagasiner er
  under historisk mediannivå."
verbatim_excerpt: >
  Etter disse medlemmers syn er det en svakhet ved dagens modell at
  eksportkapasiteten i liten grad justeres dynamisk i takt med den
  faktiske forsyningssituasjonen. Disse medlemmer mener derfor det er
  nødvendig å etablere en tydelig operativ styringsmekanisme
  hvor Statnett pålegges å vurdere og gis fullmakt til å redusere
  eksportkapasiteten når fyllingsgraden i sentrale vannmagasiner er
  under historisk mediannivå.
