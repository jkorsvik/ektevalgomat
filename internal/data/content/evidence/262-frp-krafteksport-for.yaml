context_note: >
  Kodet -2 (sterkt uenig i at dagens styring er god nok): FrP
  medforslagsstiller med egen, detaljert begrunnelse om prissmitte fra
  North Sea Link/NordLink, som direkte motsier det snudde utsagnets
  premiss om at dagens ordning holder. Ett avvikende FrP-medlem (1 av
  29 fremmøtte stemte mot) er ikke navngitt i innstillingen — verdt å
  følge opp ved en senere referatgjennomgang. Utsagnet ble snudd
  2026-09-27 til flertallets (Ap/H/MDG/V) forsvar av status quo, slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
