context_note: >
  Kodet -2 (sterkt uenig i at dagens styring er god nok): SV
  medforslagsstiller på forslag 1-3 (denne saken), men IKKE på forslag 4
  (Skagerrak-utredningen, utsagn-09) — se evidence/271 der SV stemmer mot
  det forslaget. En reell, dokumenterbar nyanse innad i venstre-høyre-
  koalisjonen på denne saken, ikke bare tilfeldig fravær. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
