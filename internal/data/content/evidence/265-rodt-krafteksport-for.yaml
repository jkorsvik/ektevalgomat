claim_action: >
  Votering_id 28137, Rødt 5 for, 0 mot. Fra den delte SV/Sp/Rødt-
  merknaden, med henvisning til EØS-avtalen: "Disse medlemmer viser
  til EØS-avtalen artikkel 112, som åpner for tiltak dersom alvorlige
  økonomiske, sosiale eller miljømessige problemer oppstår. Med de
  siste årenes ustabile forsyningssituasjon og gjennomgående lave
  fyllingsgrader mener disse medlemmer at Norge bør kunne bremse
  krafteksporten."
verbatim_excerpt: >
  Disse medlemmer viser til EØS-avtalen artikkel 112, som åpner for
  tiltak dersom alvorlige økonomiske, sosiale eller miljømessige
  problemer oppstår. Med de siste årenes ustabile forsyningssituasjon
  og gjennomgående lave fyllingsgrader mener disse medlemmer at Norge
  bør kunne bremse krafteksporten.
