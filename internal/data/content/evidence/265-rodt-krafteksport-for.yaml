context_note: >
  Kodet -2 (sterkt uenig i at dagens styring er god nok): Rødt er sakens
  opprinnelige forslagsstiller (Sofie Marhaug er saksordfører for
  forslaget), med den mest juridisk spesifikke begrunnelsen av alle
  partiene (EØS art. 112) — det motsatte av det snudde utsagnets
  premiss. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
