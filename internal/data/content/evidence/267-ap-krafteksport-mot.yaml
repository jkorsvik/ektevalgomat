context_note: >
  Kodet +2: dette er nøyaktig Aps egen argumentasjon, gjengitt som det
  snudde utsagnet nå hevder — en spesifikk, todelt begrunnelse
  (flertallets generelle "bygg mer kraft og nett"-argument, pluss en mer
  detaljert Ap/MDG/Venstre-merknad om at den eksisterende 2024-
  mekanismen allerede løser problemet). Ap mener forslaget ikke bare er
  unødvendig, men at det å stoppe eksport "sannsynligvis også vil
  redusere vår egen tilgang på import" — et argument om at
  eksportbegrensning kan svekke forsyningssikkerheten i motsatt retning.
  Utsagnet ble snudd 2026-09-27 til nøyaktig denne argumentasjonen slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -2 til +2.
