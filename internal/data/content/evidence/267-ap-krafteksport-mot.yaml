scan_summary: >
  Ap er del av flertallet (med Høyre, MDG, Venstre) som avviste
  forslaget, og har en egen tilleggsmerknad (med MDG og Venstre) om
  at styringsmekanismen fra 2024 allerede er tilstrekkelig.
claim_action: >
  Votering_id 28137, Ap 32 mot, 0 for. Fra flertallets merknad: "Det
  viktigste Stortinget og regjeringen kan bidra med for å sikre
  innbyggere og næringsliv lave og stabile strømpriser samtidig som
  forsyningssikkerheten ivaretas, er å legge til rette for at det
  bygges ut mer kraft og nett." Og fra Ap/MDG/Venstres tilleggsmerknad:
  "Styringsmekanismen gir myndighetene bedre kontroll med
  forsyningssikkerheten, samtidig som man ivaretar den viktige
  fleksibiliteten i kraftsystemet vårt."
verbatim_excerpt: >
  Det viktigste Stortinget og regjeringen kan bidra med for å sikre
  innbyggere og næringsliv lave og stabile strømpriser samtidig som
  forsyningssikkerheten ivaretas, er å legge til rette for at det
  bygges ut mer kraft og nett. [...] Styringsmekanismen gir
  myndighetene bedre kontroll med forsyningssikkerheten, samtidig som
  man ivaretar den viktige fleksibiliteten i kraftsystemet vårt.
