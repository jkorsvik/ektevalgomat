context_note: >
  Kodet +2: Høyre bruker et eksplisitt "vi har allerede kontroll"-
  argument som direkte adresserer dimensjonens spørsmål (beholder Norge
  reell beslutningsevne?) — partiets svar er "ja, allerede, via
  eksisterende lovverk", nøyaktig det snudde utsagnet hevder. Utsagnet
