context_note: >
  Kodet +2: MDG inverterer forslagsstillernes premiss — kablene er
  ikke en trussel mot norsk kontroll, men et sikkerhetsverktøy for
  forsyningssikkerheten selv, nøyaktig det snudde utsagnet hevder.
  Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra
  -2 til +2. Verdt å merke: MDG stemte MOT dette krafteksport-forslaget
  (Norsk handlefrihet-dimensjonen), men er medforslagsstiller på FLERE
  digitalsuverenitet-forslag i Innst. 225 S (samme rolle som avviker,
  forskjellig retning avhengig av
  saksfelt).
