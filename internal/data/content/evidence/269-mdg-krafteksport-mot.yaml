claim_action: >
  Votering_id 28137, MDG 5 mot, 0 for. Fra MDG/Venstres tilleggsmerknad:
  "Utenlandskabler fungerer som et nødvendig sikkerhetsnett som
  styrker forsyningssikkerheten, og ensidige begrensninger i
  eksportkapasiteten vil kunne svekke Norges mulighet til å importere
  kraft i perioder med lav produksjon."
verbatim_excerpt: >
  Utenlandskabler fungerer som et nødvendig sikkerhetsnett som styrker
  forsyningssikkerheten, og at ensidige begrensninger i
  eksportkapasiteten vil kunne svekke Norges mulighet til å importere
  kraft i perioder med lav produksjon.
