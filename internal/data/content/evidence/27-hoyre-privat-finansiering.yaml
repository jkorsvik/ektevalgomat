context_note: >
  Kodet -2: Høyres eget forslag krever privat finansiering
  ("dersom private aktører selv finansierer"), og fellesmerknaden med
  Venstre sier eksplisitt "det er ikke aktuelt med ... eierskap" — en
  direkte, ordrett avvisning av utsagnets "fullt statlig eierskap og
  kontroll", ikke en analytisk tolkning. Høyre er for kjernekraft i seg
  selv (positivt, betinget), men eksplisitt MOT statlig eierskapsmodellen
  utsagnet spør om — to atskilte spørsmål, se /metode for hvorfor disse
  ikke slås sammen. Høyre stemte for komiteens tilråding (kun "legg frem
  en stortingsmelding"), som ikke tar stilling til eierskapsform og derfor
  ikke motsier denne kodingen.
