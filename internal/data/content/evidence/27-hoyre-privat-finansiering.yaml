scan_summary: "Høyre (med Venstre) vil åpne for kjernekraft kun privatfinansiert, og avviser eksplisitt statlig eierskap."
claim_action: >
  Høyre fremmer eget forslag (nr. 27) om å legge til rette for
  kjernekraftutbygging BETINGET av at private aktører selv finansierer
  utbygging, drift og dekommisjonering. I fellesmerknad med Venstre setter
  partiet tre uttrykkelige vilkår for kjernekraft, hvorav ett direkte
  avviser statlig eierskap.
verbatim_excerpt: >
  disse medlemmer på sikt ønsker å tilrettelegge for at private kan
  finansiere og bygge ut kjernekraft i Norge, med tre tydelige forbehold:
  Muligheten for kjernekraft i fremtiden må ikke bli en sovepute mot å
  bygge ut mer fornybar kraft og nett i dag, hvor tempoet må betydelig
  opp. Det er ikke aktuelt med statlige subsidier eller eierskap. Det
  skal ikke kompromisses på sikkerhet. […] Stortinget ber regjeringen
  legge til rette for utbygging av kjernekraft i Norge, dersom private
  aktører selv finansierer utbygging, drift og dekommisjonering.
