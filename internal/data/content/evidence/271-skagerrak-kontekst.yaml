claim_confidence: dokumentert
attribution_confidence: null
context_note: >
  SVs skifte fra FOR (utsagn-08, forslag 1-3) til MOT (dette
  forslaget) er den mest interessante detaljen: SV støtter
  eksportbegrensning og kabel-reforhandling generelt, men ikke det
  spesifikke, konkrete tiltaket å stoppe en pågående NVE-utredning om
  Skagerrak-reinvestering. Innstillingen gir ingen egen SV-merknad om
  akkurat dette forslaget, så begrunnelsen for skiftet er ikke
  dokumentert — kun stemmen selv. Interessant tilleggsdetalj: FrP
  gikk til valg på (ifølge Sp/Rødts merknad) at "Arbeiderpartiet gikk
  til valg på at de ikke ville fornye" SK1/SK2, likevel utreder NVE
  en ny forbindelse — et løftebrudd-argument fra Sp/Rødt rettet mot
  Ap, ikke mot regjeringspartiene selv.
