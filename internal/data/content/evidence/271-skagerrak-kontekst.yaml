scan_summary: >
  Fjerde forslag i samme sak som utsagn-08 (Innst. 374 S), men denne
  gangen fra bare FrP, Senterpartiet og Rødt — SV er IKKE
  medforslagsstiller og stemte mot, til forskjell fra forslag 1-3.
claim_action: >
  Forslag 4 (FrP, Sp og Rødt): "Stortinget ber regjeringen instruere
  NVE om å avslutte utredningsprogrammet for mulig reinvestering av
  Skagerrak 1 og 2." Bakgrunn: Ap gikk til valg på å ikke fornye SK1
  og SK2, men NVE utreder likevel en ny forbindelse. Votering_id
  28136 (sakid 200210): 38 for (FrP 28, Sp 5, Rødt 5), 61 mot (Ap 32,
  Høyre 12, KrF 4, MDG 5, SV 5, Venstre 2), 1 FrP-representant mot.
