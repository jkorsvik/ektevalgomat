context_note: >
  Kodet -1: stemmen er dokumentert, men Ap har IKKE besvart Rødts
  konkrete løftebrudd-anklage (se evidence/274) i denne innstillingen.
  Ap deler for øvrig flertallets generelle "kraftutveksling styrker
  forsyningssikkerheten"-linje (evidence/267), som indirekte er svaret,
  men ingen setning nevner Skagerrak eller valgløfter spesifikt. Dette
  er en anklage som IKKE er imøtegått i den offentlige
  saksbehandlingen — verdt å flagge som "ubesvart" heller enn
  "avvist".
