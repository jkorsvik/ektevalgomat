scan_summary: >
  Ap stemte mot forslaget om å stoppe NVEs Skagerrak-utredning, til
  tross for Sp/Rødts påstand om at Ap "gikk til valg på" ikke å
  fornye disse kablene. Ingen Ap-svar på denne konkrete anklagen
  finnes i innstillingen.
