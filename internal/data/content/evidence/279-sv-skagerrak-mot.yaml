context_note: >
  Kodet -1, IKKE -2: dette er den mest presise dokumentasjonen av at
  SVs støtte til "kontroll over krafteksporten" (utsagn-08) ikke er
  ubetinget — partiet trekker en linje ved å stoppe en pågående,
  konkret NVE-utredning om en navngitt kabelforbindelse, selv om det
  generelle prinsippet (eksportbegrensning, kabel-reforhandling)
  fortsatt støttes. Uten en egen SV-merknad er den presise
  begrunnelsen for denne nyansen ikke dokumentert fra partiet selv —
  bare stemmeutfallet.
