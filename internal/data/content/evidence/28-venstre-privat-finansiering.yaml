scan_summary: "Venstre (med Høyre) vil åpne for kjernekraft kun privatfinansiert, og avviser eksplisitt statlig eierskap."
claim_action: >
  Venstre står bak samme fellesmerknad med Høyre og de samme tre
  vilkårene for kjernekraft (ikke en sovepute for fornybar utbygging,
  ingen statlige subsidier eller eierskap, ingen kompromiss på sikkerhet),
  samt felles forslag 17–19 om regelverksendringer og organisering, alle
  betinget av privat finansiering.
verbatim_excerpt: >
  disse medlemmer på sikt ønsker å tilrettelegge for at private kan
  finansiere og bygge ut kjernekraft i Norge, med tre tydelige forbehold:
  Muligheten for kjernekraft i fremtiden må ikke bli en sovepute mot å
  bygge ut mer fornybar kraft og nett i dag, hvor tempoet må betydelig
  opp. Det er ikke aktuelt med statlige subsidier eller eierskap. Det
  skal ikke kompromisses på sikkerhet. […] Stortinget ber regjeringen
  fremme forslag til nødvendige endringer i relevant lovverk, som
  atomenergiloven, energiloven, strålevernloven og aktuelle forskrifter,
  slik at regelverket legger til rette for etablering og drift av
  kommersiell kjernekraftproduksjon i Norge.
status: forkastet
