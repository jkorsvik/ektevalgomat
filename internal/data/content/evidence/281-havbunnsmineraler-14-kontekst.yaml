scan_summary: >
  Innst. 354 S (2024-2025), om Dok. 8:206 S fra FrP (Terje Halleland
  m.fl.) om havbunnsmineraler. Fire mindretallsforslag pluss en
  vedtatt hovedtilråding (romertall I/II) med en gradvis, føre-var-
  linje. Dette forslaget (forslag 1, H og FrP) ba om en konkret
  tidsplan for konsesjonsrunden — avvist, men med en klar
  Ap+FrP+Høyre+Sp-koalisjon på den vedtatte hovedlinjen (se
  evidence for utsagn-15 for motsatt koalisjon).
claim_action: >
  Forslag 1 (Høyre og Fremskrittspartiet): "Stortinget ber regjeringen
  igangsette arbeidet med 1. konsesjonsrunde for havbunnsmineraler
  med sikte på en mulig utlysning av runden tidlig i 2026." Votering_id
  25349 (sakid 103035): 35 for (FrP 12, Høyre 23), 70 mot (Ap 30, KrF
  2, MDG 2, Rødt 5, SV 8, Sp 17, Venstre 5).
status: forslag_avvist
