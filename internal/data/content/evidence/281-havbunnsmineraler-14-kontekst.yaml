context_note: >
  Første av to statements fra denne saken (se utsagn-15 for
  moratorium-forslaget). Selv om Høyre stemte mot en KONKRET
  tidsplan her, ble en mer generell, gradvis versjon av samme idé
  (romertall I i tilrådingen: "sikre at konsesjonsprosessen [...]
  legger til rette for en balansert utvikling") vedtatt 82-23 med
  Ap+FrP+Høyre+Sp for. Det tyder på at Høyre og Sp støtter
  havbunnsmineralutvinning i prinsippet, men ikke ønsket å binde seg
  til FrPs konkrete 2026-frist. Dette er en nyanse verdt å lese
  sammen med selve stemmen, ikke i stedet for den.
