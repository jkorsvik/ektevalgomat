scan_summary: >
  Sp stemte mot den konkrete tidsplanen, med en egen merknad om at
  havbunnsmineraler ikke bør sammenlignes med petroleumsvirksomhet og
  krever en mer varsom, kunnskapsbasert tilnærming.
claim_action: >
  Votering_id 25349, Sp 17 mot, 0 for. Fra Sps merknad: Sp mener det
  er en lite treffende sammenligning å likestille arbeidet med 1.
  konsesjonsrunde for havbunnsmineraler med petroleumsvirksomhet, da
  havbunnsmineralvirksomhet er noe nytt med begrenset operasjonell
  erfaring. Miljømessige, teknologiske og forvaltningsmessige hensyn
  krever særskilt grundighet og en kunnskapsbasert, trinnvis
  tilnærming.
verbatim_excerpt: >
  Det er en lite treffende sammenligning å likestille arbeidet med en
  1. konsesjonsrunde for havbunnsmineraler med en 26. konsesjonsrunde
  for petroleumsvirksomhet. [...] Disse medlemmer vil understreke at
  havbunnsmineralvirksomhet representerer noe nytt, med begrenset
  operasjonell erfaring både nasjonalt og internasjonalt. [...] de
  miljømessige, teknologiske og forvaltningsmessige hensynene ved
  havbunnsmineralutvinning krever særskilt grundighet, og at man må
  legge til rette for en kunnskapsbasert og trinnvis tilnærming.
