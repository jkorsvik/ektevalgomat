context_note: >
  Kodet +1, ikke +2 som Rødt: denne merknaden peker på den europeiske
  normen (statlig involvering er vanlig) som et bekymringspunkt mot den
  private/kommersielle modellen — det er IKKE det samme som Rødts
  eksplisitte, konkrete krav ("under fullt statlig eierskap, kontroll og
  styring", forslag 30–31). Ap har ikke fremmet noe eget forslag som
  krever statlig eierskap for Norge. Kodingen reflekterer en reell, men
  svakere skepsis til den private modellen enn Rødts — styrken på
  posisjonen skal reflektere forpliktelsesgraden i teksten, ikke bare
  fortegnet, samme prinsipp som brukt for MDG/Rødt på utsagn-01.
  Merk: Ap stemte mot Rødts forslag 30-32 i samme sak, som ble
  votert samlet (fil 701). Forslag 30 er nesten ordrett dette utsagnet.
  Posisjonen her er kodet fra merknaden, ikke fra voteringen. Se fil
  701 for hvorfor voteringen alene ikke er kodet.
