scan_summary: "Ap (med Sp, Rødt, MDG) pekte på at kjernekraft i Europa i hovedsak er bygget ut med vesentlig statlig involvering."
claim_action: >
  Ap, Sp, Rødt og MDG skriver i fellesmerknad at forslag om privat og
  kommersielt lønnsom kjernekraft ikke klargjør hvilke kostnader og
  ansvar staten faktisk vil bli sittende med, og viser til at kjernekraft
  i Europa i hovedsak er bygget ut med statlig involvering, statlige
  garantier eller offentlig eierskap.
verbatim_excerpt: >
  "Komiteens medlemmer fra Arbeiderpartiet, Senterpartiet, Rødt og
  Miljøpartiet De Grønne merker seg at forslag om privat og kommersielt
  lønnsom kjernekraft ikke avklarer hvilke kostnader og ansvar staten i
  realiteten vil sitte igjen med. Disse medlemmer vil påpeke at en slik
  kjernekraftmodell står i sterk kontrast til den europeiske erfaringen,
  hvor kjernekraft i all hovedsak er bygget ut med vesentlig statlig
  involvering, statlige garantier eller offentlig eierskap. Det er
  nødvendig å gå grundig inn i hvilken risiko og hvilke kostnader som
  realistisk sett kan bæres av private, og hvilken kostnad staten sitter
  igjen med."
status: uttalt
