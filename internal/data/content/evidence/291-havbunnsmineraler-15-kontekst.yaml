context_note: >
  Denne saken gir et rent, todelt bilde av "Forvaltning av
  fellesskapets ressurser/energi": en Ap+FrP+Høyre+Sp-blokk for rask
  utvinning (vekst/geopolitisk kontroll-argumentet) mot en SV+Rødt+
  Venstre+MDG+KrF-blokk for pause (føre-var/naturmangfold-argumentet)
  — en miljø-vs-vekst-akse, ikke venstre-høyre. Se evidence/281 for
  utsagn-14 (motsatt forslag, samme sak).
