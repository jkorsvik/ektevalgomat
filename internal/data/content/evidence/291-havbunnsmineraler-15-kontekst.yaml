scan_summary: >
  Samme sak som utsagn-14 (Innst. 354 S), motsatt forslag: et
  internasjonalt moratorium på havbunnsmineralutvinning i stedet for
  norsk konsesjonsrunde. Koalisjonen er nesten helt speilvendt av
  utsagn-14s: her er SV, Rødt, Venstre, MDG og KrF for, mens Ap, FrP,
  Høyre og Sp er mot.
claim_action: >
  Forslag 2 (SV, Rødt, Venstre, MDG og KrF): "Stortinget ber
  regjeringen jobbe aktivt internasjonalt, særlig i Den internasjonale
  havbunnsmyndigheten (ISA), for et moratorium på mineralutvinning på
  havbunnen fram til det er bevist at slik virksomhet kan skje uten
  tap av naturmangfold, viktige leveområder og naturens egne
  funksjoner." Votering_id 25348 (sakid 103035): 23 for (KrF 2, MDG 2,
  Rødt 5, SV 8, Venstre 5), 82 mot (Ap 30, FrP 12, Høyre 23, Sp 17).
