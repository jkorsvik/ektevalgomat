scan_summary: "Sp (med Ap, Rødt, MDG) pekte på at kjernekraft i Europa i hovedsak er bygget ut med vesentlig statlig involvering."
claim_action: >
  Sp, Ap, Rødt og MDG skriver i fellesmerknad at forslag om privat og
  kommersielt lønnsom kjernekraft ikke klargjør hvilke kostnader og
  ansvar staten faktisk vil bli sittende med, og viser til at kjernekraft
  i Europa i hovedsak er bygget ut med statlig involvering. Sp har
  dessuten en egen, separat merknad om hva en fremtidig
  stortingsmelding om kjernekraft bør dekke, inkludert ansvarsfordeling
  mellom stat og privat.
verbatim_excerpt: >
  Komiteens medlemmer fra Arbeiderpartiet, Senterpartiet, Rødt og
  Miljøpartiet De Grønne merker seg at forslag om privat og kommersielt
  lønnsom kjernekraft ikke avklarer hvilke kostnader og ansvar staten i
  realiteten vil sitte igjen med. Disse medlemmer vil påpeke at en slik
  kjernekraftmodell står i sterk kontrast til den europeiske erfaringen,
  hvor kjernekraft i all hovedsak er bygget ut med vesentlig statlig
  involvering, statlige garantier eller offentlig eierskap. […] Komiteens
  medlem fra Senterpartiet mener en ny stortingsmelding om kjernekraft
  blant annet må dekke følgende tematikk: Kostnader og finansiering,
  herunder ansvarsfordeling mellom stat og privat, og tidslinjer for
  gjennomføring. Kartlegging av behovet for statlig forvaltningskostnad og
  subsidier, og potensialet for kommersiell drift.
status: uttalt
