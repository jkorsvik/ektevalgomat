context_note: >
  Kodet +1, samme grunn som Ap (se den filens context_note): peker på
  behovet for å klargjøre stat/privat-ansvarsfordeling og på den
  europeiske normen for statlig involvering, men fremmer ikke selv et
  konkret krav om fullt statlig eierskap slik Rødt gjør. Sps egen
  separate merknad er praktisk/utredende i tonen (hva en stortingsmelding
  bør dekke), ikke en eksplisitt stillingtagen for eller mot statlig
  eierskap — den trekker kodingen verken opp eller ned, men bekrefter at
  Sp ønsker spørsmålet om ansvarsfordeling reelt utredet, ikke avklart på
  forhånd i noen retning.
  Merk: Sp stemte mot Rødts forslag 30-32 i samme sak, som ble
  votert samlet (fil 702). Forslag 30 er nesten ordrett dette utsagnet.
  Posisjonen her er kodet fra merknaden, ikke fra voteringen. Se fil
  702 for hvorfor voteringen alene ikke er kodet.
