context_note: >
  Dette er et VEDTATT forslag (ikke avvist) — regjeringen er nå bedt
  om å fremme et konkret lovforslag om avviklingen innen
  statsbudsjettet for 2027. En klassisk skattepolitisk kontrollstrid:
  tilhengerne (FrP/Høyre/Sp) argumenterer med skatterettslige
  prinsipper (faktiske priser, ikke teoretiske), motstanderne (Ap/SV/
