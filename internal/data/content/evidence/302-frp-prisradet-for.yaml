scan_summary: >
  FrP er en av forslagsstillerne til den vedtatte tilrådingen, med
  den mest detaljerte begrunnelsen om skjev konkurranse mellom store
  og små aktører.
claim_action: >
  Votering_id 28077, FrP 29 for, 0 mot. Fra FrPs merknad: "Dagens
  modell åpner for tilpasninger som i praksis innebærer at større,
  vertikalt integrerte selskaper kan flytte overskudd ut av den delen
  av virksomheten som er gjenstand for grunnrenteskatt. Mindre,
  uavhengige aktører har ikke tilsvarende muligheter, noe som bidrar
  til en skjev konkurransesituasjon."
