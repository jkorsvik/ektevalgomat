context_note: >
  Hele saken (31 mindretallsforslag) ble avvist i sin helhet
  (tilrådingen: "vedtas ikke") — regjeringens egen mineralstrategi
  fra 2023 ble ansett å dekke det meste. Ap+Sp mener forslagene bør
  vurderes i den videre oppfølgingen av strategien, uten selv å ha
  stemt for noen av dem. SV/Rødts konkrete case-eksempel er Fensfeltet
  og "Norge Mining" (utenlandskeid, sveitsisk hovedaksjonær) — samme
  bekymring om utenlandsk/privat kontroll over strategiske ressurser
  som gjentar seg i havbunnsmineraler-saken (utsagn-14/15).
