scan_summary: >
  Innst. 388 S (2023-2024), om Dok. 8:125 S (H+V+FrP+MDG-representanter
  m.fl.) om landbasert mineralutvinning og sirkulærøkonomi. SV og
  Rødt fremmet et alternativt forslag om et STATLIG mineralselskap i
  stedet for å overlate letevirksomhet til private, ofte
  utenlandskeide, aktører — direkte relevant for "hvem kontrollerer
  ressursene"-spørsmålet.
claim_action: >
  Forslag 28 (SV og Rødt): "Stortinget ber regjeringen opprette et
  statlig mineralselskap som kan drive letevirksomhet og utvinne
  strategisk viktige mineralforekomster på en økologisk bærekraftig
  måte, som sikrer minst mulig tap av matjord og natur, og som sikrer
  fellesskapet inntekter og verdiskaping lokalt i kommunene og i
  regionen." Votering_id 22966 (sakid 98223): 12 for (Rødt 4, SV 8),
  89 mot (Ap 29, FrP 13, Høyre 21, KrF 2, MDG 2, Sp 17, Venstre 4).
