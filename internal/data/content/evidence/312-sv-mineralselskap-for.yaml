claim_action: >
  Votering_id 22966, SV 8 for, 0 mot. Fra den delte SV/Rødt-merknaden:
  "Norges mineralforekomster burde sees på samme måte som man forholdt
  seg til funnet av oljen tilbake på 1960-tallet. Verdiene er så store
  at det kan føre til enorme naturbeslag og andre negative virkninger
  på folk og næring. [...] Naturen og naturforekomstene tilhører
  fellesskapet."
