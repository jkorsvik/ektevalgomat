scan_summary: >
  Rødt er medforslagsstiller sammen med SV, med et konkret case-
  eksempel om det utenlandskeide selskapet "Norge Mining" og
  Fensfeltet. Alle 4 fremmøtte stemte for.
claim_action: >
  Votering_id 22966, Rødt 4 for, 0 mot. Fra den delte merknaden:
  "Prosjektet styres av selskapet Norge Mining, som til tross for
  navnet er et utenlandskeid selskap der grunnlegger og storaksjonær
  er av sveitsisk opphav. [...] Fensfeltet er enda et eksempel på et
  mineralutvinningsprosjekt av stor nok betydning til at staten burde
  ha eierskap og drift av virksomheten slik at det tjener felleskapet
  best mulig både økonomisk og sikkerhetspolitisk."
