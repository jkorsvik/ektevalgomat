scan_summary: >
  Ap er del av flertallet (med Sp) som mener regjeringens egen
  mineralstrategi fra 2023 allerede dekker behovet, uten å love å
  følge opp SV/Rødts konkrete statlig-selskap-forslag spesifikt.
claim_action: >
  Votering_id 22966, Ap 29 mot, 0 for. Fra Ap/Sps merknad: disse
  medlemmer legger til grunn at regjeringen i det videre arbeidet med
  oppfølging av "Norges mineralstrategi" vil vurdere forslagene
  fremsatt i representantforslaget — uten selv å stemme for noen av
  dem.
