scan_summary: >
  FrP stemte mot statlig eierskap, med en egen merknad som i stedet
  foreslår et statlig KAPITALFOND (ikke et statlig driftsselskap) for
  å hjelpe PRIVATE mineralprosjekter med finansiering.
claim_action: >
  Votering_id 22966, FrP 13 mot, 0 for. Fra FrPs merknad: FrP viser
  til Innst. 74 S (2023–2024), der de fremmet forslag om å etablere
  et statlig kapitalfond for mineralnæringen, etter finsk modell —
  et fond som støtter kapitaltilgang for private aktører, ikke et
  statlig driftsselskap som tar over letevirksomheten selv.
verbatim_excerpt: >
  Fremskrittspartiet blant annet fremmet forslag om å etablere et
  statlig kapitalfond for mineralnæringen, etter finsk modell. Disse
  medlemmer mener økt tilgang til kapital er nødvendig for at
  mineralnæringen kan ha videre vekst.
