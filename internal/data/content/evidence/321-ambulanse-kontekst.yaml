context_note: >
  Komiteens flertall (FrP, Høyre, SV og Sp) skriver en FELLES
  merknad om at ambulansekapasitet i distriktene må sikres — men
  Høyre stemte likevel MOT den konkrete forslaget. "Ja i prinsippet,
  nei til denne bindende teksten"-mønsteret, samme som gjentar seg i
  flere andre saker i dette datasettet. MDG (opprinnelig
  forslagsstiller til HELE saken) stemte MOT dette spesifikke
  forslaget, fordi FrP/SV/Sp/Rødt kritiserer MDGs EGNE forslag i
  saken (møteordninger, hjemmevakt) som "i realiteten ei svekking av
  dagens ambulanseteneste" — se evidence for MDGs stemme.
