scan_summary: >
  Innst. 252 S (2025-2026), om Dok. 8:133 S (MDG) om mindre sjukehus,
  desentralisering og kortere reisevei for helsehjelp. FrP, Sp og
  Rødt fremmet et konkret forslag om at regjeringen skal komme
  tilbake med hvordan responstidsmålene for ambulanse kan nås i ALLE
  kommuner — avvist, men med bred prinsipiell tilslutning fra flere
  partier som ikke støttet den bindende formen.
claim_action: >
  Forslag 1 (FrP, Sp og Rødt): "Stortinget ber regjeringa komme
  tilbake til Stortinget med forslag til korleis responstidsmåla for
  ambulanse kan nåast i alle kommunar i landet." Votering_id 27581
  (sakid 200056): 45 for (FrP 28, Rødt 5, SV 5, Sp 5, Venstre 2), 54
  mot (Ap 31, Høyre 14, KrF 4, MDG 5).
