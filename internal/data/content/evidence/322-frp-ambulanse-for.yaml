verbatim_excerpt: >
  Ambulansetenesta stadig blir utsett for sparetiltak i
  helseføretaka som fører til at responstidene blir lengre. Desse
  medlemene meiner det er ein viktig del av akuttberedskapen at
  ambulansetilbodet blir styrkt slik at dei fagleg tilrådde
  responstidsmåla kan bli nådde i heile landet.
