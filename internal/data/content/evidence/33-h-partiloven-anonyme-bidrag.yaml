context_note: >
  Kodet +2, ikke lavere: Høyre stemte FOR selve forbudet (§ 17 a) uten
  unntak — deres egne tilleggsforslag (falt) ba om MER åpenhet, ikke
  mindre, så de trekker ikke posisjonen ned. Individuell
  representantstemme hentet direkte fra data.stortinget.no for votering_id
  26057 (22 av Høyres representanter stemte for, 0 mot).
