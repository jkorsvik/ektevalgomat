scan_summary: >
  MDG er den opprinnelige forslagsstilleren til hele saken (Dok. 8:133
  S), men stemte MOT dette spesifikke forslaget fra FrP/Sp/Rødt — som
  til gjengjeld kritiserer MDGs EGNE forslag i saken (møteordninger,
  hjemmevakt) som en skjult svekking av ambulansetjenesten.
claim_action: >
  Votering_id 27581, MDG 5 mot, 0 for. Fra FrP/SV/Sp/Rødts merknad,
  rettet mot MDGs egne forslag: "Desse medlemene meiner at forslaga
  frå Miljøpartiet Dei Grøne i realiteten er ei svekking av dagens
  ambulanseteneste i distrikta, der ein opnar opp for møteordningar,
  heimevakt og kombinasjon med kommunale tenester."
