context_note: >
  FrP flipper fra FOR (utsagn-27) til MOT (dette forslaget) — og MDG
  flipper motsatt vei, fra MOT (utsagn-27) til FOR. Samme sak, samme
  ni partier, to forskjellige forslag, to helt forskjellige
  koalisjoner: dette er den klareste dokumentasjonen i hele datasettet
  på at "en sak, en koalisjon" er en for enkel modell — koalisjoner er
  forslagsspesifikke, ikke saksspesifikke.
