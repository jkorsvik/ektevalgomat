scan_summary: >
  Samme sak som utsagn-27 (Innst. 252 S), forslag 3: SV, Sp og Rødt
  ba regjeringen bruke lokalsykehus aktivt for å kutte ventelister —
  en annen koalisjon enn forslag 1 (der FrP også var med).
claim_action: >
  Forslag 3 (SV, Sp og Rødt): "Stortinget ber regjeringa sikre at
  lokalsjukehus blir nytta aktivt i arbeidet for å få ned
  ventelistene i spesialisthelsetenesta, jf. ventetidsløftet, og
  informere Stortinget på eigna måte." Votering_id 27579 (sakid
  200056): 22 for (MDG 5, Rødt 5, SV 5, Sp 5, Venstre 2), 77 mot (Ap
  31, FrP 28, Høyre 14, KrF 4).
