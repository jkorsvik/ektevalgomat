context_note: >
  Venstre stemmer for sitt EGET forslag (den opprinnelige Dok. 8:11 S
  er en Venstre-sak), selv om SV/MDG/KrF er de formelle
  forslagsstillerne til akkurat denne teksten. Rødt stemmer MOT, til
  tross for ideologisk nærhet til SV på fattigdomsbekjempelse — et
  eksempel på at nærhet i retorikk ikke garanterer samme stemme.
  Tilrådingen (votering 26948) ble vedtatt 80-20, men med et helt
  annet, mer generelt innhold enn dette konkrete forslaget.
