scan_summary: >
  Innst. 126 S (2025-2026), om Venstres (Abid Raja, Guri Melby, Grunde
  Almeland) Dok. 8:11 S om en helhetlig tiltakspakke mot sosiale
  forskjeller. 22 mindretallsforslag i alt; dette er forslag 1 og 2
  (SV, MDG og KrF), votert samlet.
claim_action: >
  Forslag 1 (SV, MDG, KrF): "Stortinget ber regjeringen legge til
  rette for økt grunnbemanning i barnehager i levekårsutsatte
  områder." Forslag 2 (samme partier): "Stortinget ber regjeringen
  legge frem en plan for å gradvis øke tilskuddspotten for
  Utdanningsdirektoratets øremerkede tilskuddsordning til tiltak for
  å styrke den språklige utviklingen for minoritetsspråklige barn i
  barnehage." Votert samlet, votering_id 26946 (sakid 104872): 16 for
  (KrF 4, MDG 5, SV 5, Venstre 2), 85 mot (Ap 32, FrP 29, Høyre 14,
  Rødt 5, Sp 5).
