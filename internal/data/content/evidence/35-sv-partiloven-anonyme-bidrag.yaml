claim_confidence: dokumentert
context_note: >
  Kodet +1 etter metodekonsistenskontroll 2026-11-01: stemmen og
  tilleggsforslaget viser klar retning, men tilleggsforslaget var felles
  med Rødt og regnes som medforslag, ikke et parti-eget instrument.
  Rødts egne forslag vurderes separat. Votering 26057 er kontrollert:
  SV 8 for / 0 mot.
