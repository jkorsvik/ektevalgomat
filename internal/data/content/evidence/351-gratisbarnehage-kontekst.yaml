scan_summary: >
  Samme sak som utsagn-33 (Innst. 126 S), forslag 5, 6 og 8 (SV og
  MDG, votert samlet): gratis barnehageplass for lavinntektsfamilier,
  høyere sosialhjelpssatser, og utvidet startlånsramme for enslige
  forsørgere.
claim_action: >
  Forslag 5 (SV og MDG): "Stortinget ber regjeringen fremme forslag
  om å tilby barn i lavinntektsfamilier som per i dag har rett til
  gratis kjernetid i barnehagen, gratis barnehageplass." Votert
  samlet med forslag 6 (høyere sosialhjelpssatser) og forslag 8
  (startlån for enslige forsørgere). Votering_id 26943 (sakid
  104872): 12 for (MDG 5, SV 5, Venstre 2), 89 mot (Ap 32, FrP 29,
  Høyre 14, KrF 4, Rødt 5, Sp 5).
