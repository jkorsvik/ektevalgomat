context_note: >
  KrF flipper fra FOR (utsagn-33) til MOT (dette forslaget) — KrF er
  ikke medforslagsstiller her (kun SV og MDG), og partiets egen linje
  er en høyere barnetrygd, ikke gratis barnehage i sin helhet. Samme
  mønster som gjentar seg gjennom hele datasettet: koalisjoner er
  bundet til det spesifikke forslaget, ikke til saken som helhet.
