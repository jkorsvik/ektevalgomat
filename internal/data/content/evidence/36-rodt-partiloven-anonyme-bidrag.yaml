scan_summary: "Rødt stemte for forbudet og fremmet to egne tilleggsforslag om enda strengere meldeplikt og rapportering."
claim_action: >
  Rødt er del av komiteflertallet som fremmet og vedtok § 17 a-forbudet.
  Stemte FOR (individuell representantstemme, votering_id 26057: 5 for,
  0 mot i egen gruppe). Rødts eget medlem fremmet i tillegg to egne
  forslag (5 og 6) om rapporteringsplikt for bidrag direkte til
  enkeltkandidater og forbud mot å bruke gaver før de er innrapportert —
  begge falt (10 mot 91), men går lenger i samme retning som utsagnet.
verbatim_excerpt: >
  Komiteens medlem fra Rødt viser til at det i dag ikke er
  rapporteringsplikt for bidrag til enkeltkandidater, altså bidrag holdt
  utenom de ordinære partiapparatene. […] Stortinget ber regjeringen
  særskilt vurdere behovet for å innføre rapporteringsplikt for alle
  typer bidrag direkte til enkeltkandidater [...] og komme tilbake til
  Stortinget på egnet måte. […] Stortinget ber regjeringen særskilt
  vurdere behovet for å innføre et forbud mot å bruke gaver før de er
  innrapportert [...] og komme tilbake til Stortinget på egnet måte.
