claim_confidence: dokumentert
context_note: >
  Kodet -2: dette er IKKE en prosedyre-innvending som falt sammen med et
  reelt "for"-standpunkt (den fellen kjernekraft-saken advarer mot, se
  utsagn-06s evidensfiler) — FrPs egen merknad tar substansielt til orde
  mot selve forbudets treffsikkerhet ("begrense... mulighet til å motta
  bidrag fra andre organisasjoner enn de Arbeiderpartiet får støtte
  fra"), og den individuelle stemmegivningen viser et unisont,
  udelt nei: 12 av 12 FrP-representanter til stede stemte mot, 0 stemte
  for. Individuell representantstemme hentet direkte fra
  data.stortinget.no/eksport/voteringsresultat for votering_id 26057 (169
  representanter, kryssjekket mot offisielt for/mot-tall 89/12 — stemmer
  eksakt, og mot-stemmene er 100% FrP).
