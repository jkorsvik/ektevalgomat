actor: "Fremskrittspartiet (Per-Willy Amundsen, Erlend Wiborg, kommunal- og forvaltningskomiteen)"
date: "2025-06-13"
evidence_type: voteringsspor
evidence_class: partiets_begrunnelse
scan_summary: "FrP var det ENESTE partiet som stemte mot forbudet mot anonyme bidrag og bidrag via skjulte mellomledd."
claim_action: >
  FrP ble uttrykkelig utelatt fra komiteens "samlet komité"-tilråding på
  nettopp § 17 a og § 20 (tilrådingen på disse punktene "fremmes av
  medlemmene fra Arbeiderpartiet, Høyre, Senterpartiet, Sosialistisk
  Venstreparti og Rødt" — FrP er det eneste av de seks komitépartiene som
  ikke er med i den listen). Den individuelle voteringen (votering_id
  26057) bekrefter dette eksakt: av 12 representanter som stemte MOT i
  hele Stortinget, var samtlige 12 fra FrP — null FrP-representanter
  stemte for, mot 89 fra alle andre partier samlet.
verbatim_excerpt: >
  Komiteens medlemmer fra Fremskrittspartiet registrerer at regjeringen
  ikke synes å ville foreta en helhetlig gjennomgang av partiloven som
  tar for seg alle aktuelle forhold. Det synes å være mest fokus på å
  begrense de politiske partienes mulighet til å motta bidrag fra andre
  organisasjoner enn de Arbeiderpartiet får støtte fra, samt foreta noen
  tekniske justeringer. […] fremmes av medlemmene fra Arbeiderpartiet,
  Høyre, Senterpartiet, Sosialistisk Venstreparti og Rødt.
