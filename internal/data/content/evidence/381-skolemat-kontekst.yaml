scan_summary: >
  Innst. 55 S (2024-2025), behandling av Meld. St. 34 (2023-2024) om
  en mer praktisk skole. Blant de vedtatte romertallene var et
  vedtak om gratis skolemat i grunnskolen — en av flere saker i en
  stor, samlet stortingsmelding-innstilling (60+ mindretallsforslag
  i tillegg til de vedtatte romertallene).
claim_action: >
  Romertall IV (vedtatt): Regjeringen ble bedt om å legge frem en
  plan for å innføre et daglig sunt og enkelt skolemåltid for alle
  elever i grunnskolen, med sikte på gjennomføring fra skoleåret
  2026. Votering_id 23652 (sakid 97332): 61 for (Ap 30, KrF 1, MDG 2,
  Rødt 4, SV 8, Sp 16), 37 mot (FrP 12, Høyre 21, Venstre 4).
