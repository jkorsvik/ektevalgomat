context_note: >
  Dette er et VEDTATT forslag — regjeringen er bedt om å komme med en
  konkret gjennomføringsplan. SVs utdanningspolitiske talsperson
  Grete Wold uttalte etter vedtaket: "Endelig er skolemat på vei!" og
  "Nå håper jeg at kunnskapsministeren kjenner sin besøkelsestid og
  får fortgang i dette, så vi omsider kan følge de aller, aller
  fleste andre vestlige land, og sørge for at barn får mat." Merk at
  denne saken er en STOR, samlet stortingsmelding-innstilling (66+
  mindretallsforslag) — skolemat er kun ett av mange vedtatte og
  avviste elementer i den.
