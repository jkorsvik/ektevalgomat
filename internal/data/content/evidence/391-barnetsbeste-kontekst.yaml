context_note: >
  MERK: denne saken hadde en dokumentert avviksadvarsel under
  research — data.stortinget.nos voteringsliste for sakid=103839
  viser to voteringer beskrevet som "Forslag nr. 10" og "Forslag nr.
  11 på vegne av Sp", men den publiserte innstillingsteksten
  inneholder KUN forslag 1-9 (sponsorer FrP+KrF, SV+KrF, SV, KrF —
  ingen Sp-sponsede forslag i det hele tatt). Denne evidensen bruker
  BARE forslag 4 (votering_id 26988), der sponsorlisten i
  voteringsbeskrivelsen ("SV og KrF") er direkte bekreftet mot
  innstillingens egen tekst, og stemmetallet (21) stemmer eksakt med
  summen av per-parti-tallene. De to uverifiserbare Sp-voteringene
  (26984/26985) er bevisst IKKE brukt i dette datasettet.
