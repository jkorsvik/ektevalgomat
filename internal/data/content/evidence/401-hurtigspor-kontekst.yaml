context_note: >
  Dette er en "alternativ votering" — en avstemning mellom to
  gjensidig utelukkende alternativer (innstillingens avvisning vs.
  forslag 1), ikke en vanlig for/mot-votering på ett forslag. Sp
  (regjeringsparti) viser til statsrådens svar: eksisterende
  virkemidler (statlig reguleringsplan + forskriftsbaserte unntak
  fra byggetekniske krav) allerede dekker behovet — altså "vi har
  allerede verktøyet" mot FrP/Høyres "vi trenger en ny, bredere
  hjemmel". Direkte relevant for dimensjonens spørsmål om reell
  operasjonsevne i krise.
