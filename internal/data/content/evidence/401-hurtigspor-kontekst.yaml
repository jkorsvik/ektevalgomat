scan_summary: >
  Innst. 266 S (2025-2026), om FrPs (Tom Staahle, Erlend Wiborg, Jon
  Engen-Helgheim, Himanshu Gulati) Dok. 8:162 S om en plan- og
  bygningslov for krig og krise. Forslaget viser til at Danmark har
  vedtatt en egen hurtigsporlov (nr. 1097 av 15. september 2025) for
  forsvarsbygging, og ber Norge gjøre det samme.
claim_action: >
  Forslag 1 (FrP og Høyre): "Stortinget ber regjeringen legge frem
  forslag til en særskilt lovhjemmel for hurtig behandling av større
  forsvarsanlegg og kritisk forsvarsrelatert infrastruktur, som ikke
  begrenses av den til enhver tid gjeldende plan- og bygningslov."
  Alternativ votering mellom innstillingen (avvisning) og forslag 1,
  votering_id 27597 (sakid 200087): 57 for innstillingen/avvisning
  (Ap 30, KrF 4, MDG 5, Rødt 5, SV 5, Sp 5, Venstre 2, FrP 1), 41 for
  forslag 1 (FrP 27, Høyre 14).
