claim_action: >
  Alternativ votering 27597, FrP 27 mot innstillingen/for forslag 1,
  1 for innstillingen. Fra FrPs merknad: "Etter disse medlemmers syn
  må hensynet til nasjonal sikkerhet og beredskap i en alvorlig tid
  veie tungt, og lovverket må innrettes slik at det støtter opp under
  Stortingets forsvarsambisjoner, ikke forsinker dem."
