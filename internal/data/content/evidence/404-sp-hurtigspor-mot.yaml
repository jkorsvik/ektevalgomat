scan_summary: >
  Sp (regjeringsparti) stemte for innstillingens avvisning av
  forslag 1, med en egen merknad som viser til at eksisterende
  virkemidler allerede dekker behovet.
claim_action: >
  Alternativ votering 27597, Sp 5 for innstillingen/mot forslag 1.
  Fra Sps merknad: "Dette medlem viser til statsrådens uttalelse,
  hvor han peker på at muligheten for en statlig reguleringsplan og
  muligheten for å innføre ytterligere unntak fra blant annet
  byggetekniske krav, gjennom forskrift, dersom Forsvaret mener det
  er behov for dette, svarer på den problemstillingen som tas opp i
  representantforslaget."
