scan_summary: "To representantforslag (Sp, Rødt) om å avvise EUs fjerde energimarkedspakke og trekke Norge ut av ACER ble avvist av flertallet, med fire separate voteringer."
claim_action: >
  Dokument 8:58 S (2024–2025, Sp: Marit Arnstad, Gro-Anita Mykjåland,
  Aleksander Øren Heen) og Dokument 8:75 S (2024–2025, Rødt: Sofie
  Marhaug, Bjørnar Moxnes, Marie Sneve Martinussen) foreslo at Norge
  skal avvise EUs fjerde energimarkedspakke ("Ren energi-pakken") og
  starte arbeidet med å melde Norge ut av EUs energibyrå ACER, blant
  annet med henvisning til at ACER siden 2018 (Innst. 178 S 2017–2018)
  har fått myndighet til å fatte vedtak om krafthandel over
  landegrensene. Energi- og miljøkomiteen behandlet begge forslagene i
  én innstilling (Innst. 196 S, 2024–2025) og avga fire separate
  voteringer 2025-04-01 før forslagene ble avvist.
status: avvist_av_flertallet
