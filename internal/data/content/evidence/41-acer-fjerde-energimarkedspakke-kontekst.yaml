claim_confidence: dokumentert
context_note: >
  Institusjonell kontekst, ikke en partiposisjon i seg selv. Fire
  voteringer på sak_id 101890 (votering_id 24383, 24384, 24385, 24386)
  kryssjekket individuelt mot data.stortinget.no/eksport/voteringsresultat
  — se partienes egne evidensfiler for hvilken votering hvert parti
  stemte hvordan i. Full innstillingstekst (634 linjer PDF) lest før
  koding av noen partiposisjon.
