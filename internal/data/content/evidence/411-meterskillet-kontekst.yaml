claim_action: >
  Forslag 15 (SV og Rødt): "Stortinget ber regjeringen gjeninnføre
  meterskillet mellom kyst- og havfiskeflåte hvor faktisk lengde på
  28 meter er utgangspunktet, og komme tilbake til Stortinget med
  konkretisering av konsekvenser for blant annet kvoterettigheter og
  havdeling." Votering_id 22561 (sakid 97159): 14 for (Rødt 4, SV 8,
  Sp 1), 87 mot (Ap 29, FrP 13, Høyre 21, KrF 2, MDG 2, Sp 16,
  Venstre 4).
