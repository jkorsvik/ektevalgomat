claim_action: >
  Votering_id 22561, SV 8 for, 0 mot. Fra SV/Rødts merknad: "Fri
  fartøyutforming over lang tid har utfordret målene om en
  differensiert flåte og spredt mottaksstruktur. Fri fartøyutforming
  kombinert med strukturkvoteordning har bidratt til en utvikling av
  svært store kystfartøy, i mange tilfeller langt større enn
  havflåtens fartøy. Dette utfordrer skillene mellom hav og kyst, og
  oppfyller i liten grad den opprinnelige intensjonen med havdeling."
verbatim_excerpt: >
