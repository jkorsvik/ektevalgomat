context_note: >
  Kodet -2 (sterkt uenig i at hjemmelslengde er godt nok): SV
  medforslagsstiller med et presist argument om at fri fartøyutforming
  har latt store kystfartøy vokse forbi havflåten i størrelse — direkte
  relevant for "hvem kontrollerer ressursene"-spørsmålet (store vs. små
  aktørers tilgang til fiskekvoter), og det motsatte av det snudde
  utsagnets premiss. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
