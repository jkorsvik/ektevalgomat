context_note: >
  Kodet +2: FrP har den mest direkte og prinsipielle argumentasjonen i
  saken — et rent teknisk/effektivitetsargument mot ethvert
  lengdebasert skille, ikke bare mot SV/Rødts konkrete 28-meter-grense,
  som gjør FrP til det partiet som er MEST enig i at man ikke trenger
  et strengere meterskille (partiets eget ideal går faktisk lenger enn
  bare å beholde hjemmelslengde — FrP vil ha valgfri
  fartøyutforming). Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -2 til +2.
