scan_summary: >
  FrP stemte mot, med en egen merknad som argumenterer for FRI
  fartøyutforming (motsatt av et meterskille), av effektivitets- og
  miljøhensyn.
claim_action: >
  Votering_id 22561, FrP 13 mot, 0 for. Fra FrPs merknad: "Lengde på
  fartøy har lite å si for hvilken fangstkapasitet et fartøy
  innehar, og en valgfri fartøyutforming kan bidra til å sikre en
  optimal og bærekraftig utnyttelse av fiskebestander etter de
  stedlige forholdene i nærområdene. Friere fartøyutforming kan gi
  bedre sjøegenskaper, lavere drivstofforbruk, bedre komfort for
  mannskapet."
verbatim_excerpt: >
  Lengde på fartøy har lite å si for hvilken fangstkapasitet et
  fartøy innehar, og en valgfri fartøyutforming kan bidra til å
  sikre en optimal og bærekraftig utnyttelse av fiskebestander.
