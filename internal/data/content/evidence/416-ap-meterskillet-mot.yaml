context_note: >
  Kodet +1 (ikke +2): dette er nøyaktig Aps egen posisjon, gjengitt som
  det snudde utsagnet nå hevder — Ap fremmer sin egen versjon
  (hjemmelslengde) fremfor SV/Rødts strengere 28-meter-grense. +1 ikke
  +2 fordi Ap ikke avviser prinsippet om en gruppeinndeling som sådan,
  bare den SPESIFIKKE, strengere grensen — en "vi vil ha en avgrensning,
  bare en annen"-nyanse. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
