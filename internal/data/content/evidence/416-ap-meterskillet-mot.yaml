scan_summary: >
  Ap er del av flertallet (med Høyre, Sp, FrP, Venstre) som i stedet
  fremmet en alternativ avgrensning basert på hjemmelslengde.
claim_action: >
  Votering_id 22561, Ap 29 mot, 0 for. Fra flertallets egen
  forslagstekst: "Stortinget ber regjeringen gjeninnføre
  hjemmelslengde som gruppeinndeling av kvotegrunnlaget i
  kystfiskeflåten." Flertallet "gir sin tilslutning til å videreføre
  gruppeinndelingen av kvotegrunnlaget i kystfiskeflåten basert på
  hjemmelslengde" — en mindre streng avgrensning enn SV/Rødts
  28-meter-forslag.
verbatim_excerpt: >
  Gir sin tilslutning til å videreføre gruppeinndelingen av
  kvotegrunnlaget i kystfiskeflåten basert på hjemmelslengde.
