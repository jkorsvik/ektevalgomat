claim_action: >
  Forslag 1 (Høyre, SV, Sp, Rødt og MDG): "Stortinget ber regjeringen
  utrede hvordan den sterke økningen i etterspørsel etter kraft til
  datasentre skal håndteres, herunder utrede innføring av et
  nasjonalt konsesjonssystem, og komme tilbake til Stortinget senest
  innen utgangen av 2026." Votering_id 27047 (sakid 105697): 40 for
  (Høyre 14, KrF 4, MDG 5, Rødt 5, SV 5, Sp 6, Venstre 1), 62 mot (Ap
  33, FrP 28, Venstre 1).
