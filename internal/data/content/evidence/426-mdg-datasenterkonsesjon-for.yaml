scan_summary: >
  MDG er medforslagsstiller sammen med SV/Sp/Rødt, med en egen,
  ytterligere presisert merknad om eierskapskrav. Alle 5 fremmøtte
  stemte for.
claim_action: >
  Votering_id 27047, MDG 5 for, 0 mot. Fra MDGs egen merknad: "Norge
  må sikre tilstrekkelig grad av nasjonal og europeisk kontroll med
  eierskap og datalagring. Det må sikres at datasentre som etableres
  i Norge, har norsk eller europeisk eierskap, at kraftforsyningen
  baseres på fornybar energi, og at overskuddsvarme skal utnyttes."
