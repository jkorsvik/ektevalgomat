claim_confidence: dokumentert
context_note: >
  Kodet -2 (sterkt uenig i at EØS-tilknytningen ikke svekker
  kraftkontrollen): SV stemte konsekvent for alle fire forslag om å
  begrense ACER/avvise fjerde energimarkedspakke, og medundertegnet en
  merknad som eksplisitt beskriver ACERs vedtaksmyndighet over
  kostnadsfordeling og strømflyt som problematisk for norsk kontroll —
  det motsatte av det snudde utsagnets premiss. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2.
