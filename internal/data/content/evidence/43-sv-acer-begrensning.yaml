scan_summary: "SV stemte FOR alle fire forslag som ville begrenset ACER/avvist EUs fjerde energimarkedspakke, og delte Sp/Rødts merknad om at ACER-tilknytning svekker nasjonal kontroll."
claim_action: >
  SV stemte FOR på alle fire voteringer i saken (votering_id 24383,
  24384, 24385: 7 for hver; votering_id 24386: 7 mot flertallets
  avvisning). Individuell votering kryssjekket mot
  data.stortinget.no/eksport/voteringsresultat.
verbatim_excerpt: >
  Komiteens medlemmer fra Senterpartiet, Sosialistisk Venstreparti og
  Rødt vil påpeke at det ikke er tilstrekkelig å se på hva som står i de
  enkelte direktivene, men at man må vurdere konsekvensene av å
  innlemme stadig flere områder i EØS-avtalen [...] Disse medlemmer
  viser til at ACER, gjennom ESA og Reguleringsmyndigheten for energi
  (RME), blant annet kan treffe vedtak om kostnadsfordeling og
  strømflyten i mellomlandsforbindelsene.
