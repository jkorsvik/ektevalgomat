context_note: >
  Denne saken fylte et tidligere HULL i evidensdatabasen: utsagn-05
  hadde 0 av 9 partier dokumentert helt til nå. Forslaget adresserer
  nøyaktig utsagnets kjerne — at offentligheten (her: Stortinget selv,
  som representerer offentligheten) skal kunne ETTERPRØVE
  (overprøve) hvordan en åpenhets-/integritetssak (statsråders egen
  habilitetsvurdering) faktisk ble avgjort, i stedet for å basere seg
  på statsrådens egen, uovervåkede vurdering. Merk: originalforslaget
  kom fra Rødt (Dok. 8:1 S), men ble tatt opp som eget
  mindretallsforslag av MDG i selve komitébehandlingen — en
  vanlig prosedyre der komiteen "adopterer" enkeltpunkter fra et
  Dok. 8-forslag som separate, avstemningsklare forslag.
