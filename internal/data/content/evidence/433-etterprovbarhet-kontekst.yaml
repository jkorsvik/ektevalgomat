scan_summary: >
  Innst. 140 S (2023-2024), om Rødts (Marie Sneve Martinussen, Seher
  Aydar) Dok. 8:1 S om å styrke habilitetsreglene og gjenreise tillit
  til demokratiet. Bakgrunnen: kontroll- og konstitusjonskomiteens
  egne undersøkelser avdekket manglende felles praksis og manglende
  samlet oversikt over departementenes habilitetspraksis. MDG tok opp
  et av forslagene som egen mindretallsforslag i komitébehandlingen.
claim_action: >
  Forslag 3 (fremmet av MDG i komitébehandlingen): "Stortinget ber
  regjeringen utrede og vurdere sine muligheter til å sanksjonere mot
  brudd på habilitetsreglene og overprøve statsråders
  habilitetsvurderinger." Dette er en direkte etterprøvbarhets-
  mekanisme: i dag vurderer statsråder ofte sin egen habilitet, uten
  ekstern overprøving. Votering_id 22102 (sakid 96869): 7 for (MDG 2,
  Rødt 4, uavhengig 1), 93 mot (Ap 29, FrP 13, Høyre 21, KrF 1, SV 8,
  Sp 17, Venstre 4).
