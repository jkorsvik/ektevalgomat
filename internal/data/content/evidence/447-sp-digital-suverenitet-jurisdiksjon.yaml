id: ev-2026-05-07-sp-digital-suverenitet-jurisdiksjon
statement_id: utsagn-44
party_id: sp
actor: "Senterpartiet (Bengt Fasteraune)"
date: "2026-05-07"
evidence_type: voteringsspor
evidence_class: partiets_begrunnelse
scan_summary: "Sp støtter digital suverenitet som mål, men kaller de konkrete forslagene urealistiske og stemte mot jurisdiksjonskravet."
claim_action: >
  Sp fremmet, sammen med SV, Rødt og MDG, forslag 2 i Innst. 225 S
  (2025–2026): at digital suverenitet skal være et overordnet mål i
  Norges digitaliseringsstrategi. Sp stemte for (votering_id 27494,
  07.05.2026). Sp stemte mot forslag 4 om at sensitiv og
  samfunnskritisk informasjon utelukkende skal behandles under norsk
  eller europeisk jurisdiksjon (votering_id 27492: Sp 5 mot, 4 ikke til
  stede).
verbatim_excerpt: >
  Komiteens medlemmer fra Fremskrittspartiet, Senterpartiet og Rødt er
  enige i at det må tas grep for å sikre større digital suverenitet,
  og at dagens sikkerhetspolitiske situasjon tilsier en dreining mot
  større egenevne og fokus på beredskap. [...] Komiteens medlemmer fra
  Høyre og Senterpartiet deler intensjonen bak representantforslaget
  om å styrke Norges digitale handlefrihet og redusere sårbar
  avhengighet av enkeltleverandører. Disse medlemmer vil likevel
  understreke at de konkrete forslagene som fremmes, verken er
  realistiske, kostnadseffektive eller egnet til å styrke Norges
  reelle digitale suverenitet i praksis.
status: forslag_avvist_stemte_mot
position: 0
source_tier: A
source_name: "Innst. 225 S (2025–2026), forslag 2 og 4; votering_id 27494 og 27492 (07.05.2026)"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2025-2026/inns-202526-225s/"
claim_confidence: dokumentert
context_note: >
  Kodet 0 (delt), uendret av snuingen: Sp har signert to merknader som
  peker hver sin vei i samme innstilling. Den ene sier at det «må tas
  grep» for større digital suverenitet (mot det snudde utsagnets
  premiss). Den andre, sammen med Høyre, sier at de konkrete forslagene
  verken er realistiske eller kostnadseffektive (i tråd med det snudde
  utsagnets premiss). Stemmene følger samme mønster: mot målet i teksten
  (forslag 2), for å avvise det konkrete jurisdiksjonskravet (forslag 4)
  som det opprinnelige utsagnet speilet — netto fortsatt 0. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt der fortegnet ikke er 0. Venstre har
  nøyaktig samme stemmemønster og er kodet likt. Korrigert 2026-09-26:
  en tidligere versjon av denne filen siterte en merknad fra en annen
  innstilling (om kjernekraft) og hadde feil kode (+1).
retrieved_at: "2026-09-26"
