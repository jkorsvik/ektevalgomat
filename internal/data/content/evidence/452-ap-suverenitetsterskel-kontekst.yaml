context_note: >
  IKKE en kodet posisjon på utsagn-45 (position: null med vilje) — denne
  saken handler om den GENERELLE grunnlovsmekanismen for
  suverenitetsavgivelse (terskelen for når Grunnloven § 115 kreves), ikke
  spesifikt om forsvars- og beredskapslovgivning. Lagt til som kontekst:
  Ap mener dagens terskel er god nok, altså ingen skjerpet grunnlovssperre
  mot fremtidig myndighetsoverføring til EU-organer generelt. Se
  utsagn-45s partiprogram-evidens for Aps faktiske, spesifikke posisjon om
  forsvar/beredskap vs. EU/EØS-koordinering.
