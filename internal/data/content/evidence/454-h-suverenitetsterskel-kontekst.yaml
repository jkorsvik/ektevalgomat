scan_summary: "Høyre mener det ikke er behov for å endre Grunnlovens terskel for suverenitetsavståelse."
claim_action: >
  Høyre, sammen med Ap, FrP, MDG og KrF, avviste i komiteflertallet
  Grunnlovsforslag 9 (2023–2024, Moxnes/Sneve Martinussen/Marhaug) om å
  klargjøre terskelen for suverenitetsavståelse (Grunnloven §§ 115 og
  26). Innst. 464 S (2025–2026).
verbatim_excerpt: >
  «Komiteens flertall, medlemmene fra Arbeiderpartiet, Fremskrittspartiet,
  Høyre, Miljøpartiet De Grønne og Kristelig Folkeparti , viser til
  Høyesteretts tolkninger og Stortingets praksis og mener at det ikke er
  behov for å endre terskelen for hva som skal anses som
  suverenitetsavståelse [...]»
