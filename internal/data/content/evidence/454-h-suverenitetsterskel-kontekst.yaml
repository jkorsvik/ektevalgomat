context_note: >
  IKKE en kodet posisjon på utsagn-45 (position: null med vilje) — dette
  er den generelle grunnlovsmekanismen for suverenitetsavgivelse, ikke
  spesifikt om forsvar/beredskap. Lagt til som kontekst: Høyre mener
  dagens terskel og Høyesteretts praksis er god nok. Se utsagn-45s
