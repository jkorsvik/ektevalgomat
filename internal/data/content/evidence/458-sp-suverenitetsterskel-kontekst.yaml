date: "2026 (sesjon)"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: "Sp støtter forslag om å klargjøre Grunnlovens terskel for suverenitetsavståelse, og mener dagens praksis bryter Grunnloven § 1."
claim_action: >
  Sp, sammen med SV og Rødt, støttet i komitémindretallet
  Grunnlovsforslag 9 (2023–2024, Moxnes/Sneve Martinussen/Marhaug) om å
  klargjøre terskelen for suverenitetsavståelse (Grunnloven §§ 115 og
  26). Innst. 464 S (2025–2026). Sp og Rødt går lenger enn SV og
  karakteriserer dagens praksis som et klart grunnlovsbrudd.
verbatim_excerpt: >
  «Medlemene i komiteen frå Sosialistisk Venstreparti, Senterpartiet og
  Raudt støttar forslagsstillarane sitt ønske om å klårgjera Grunnlova
  når det gjeld overføring av mynde [...]»

  «Medlemene i komiteen frå Senterpartiet og Raudt meiner dette er eit
  klårt brot på Grunnlova § 1 fyrste ledd: 'Kongeriket Noreg er eit fritt,
  sjølvstendig, udeleleg og uavhendeleg rike.'»
status: forkastet
position: null
source_tier: A
source_name: "Innst. 464 S (2025–2026)"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2025-2026/inns-202526-464s/"
claim_confidence: dokumentert
context_note: >
  IKKE en kodet posisjon på utsagn-45 (position: null med vilje) — dette
  er den generelle grunnlovsmekanismen for suverenitetsavgivelse, ikke et
  forsvarsspesifikt standpunkt. Lagt til som sterk, relevant kontekst: Sp
  er blant de to partiene (med Rødt) som eksplisitt kaller dagens
  gradvise myndighetsoverføring til EU-organer et grunnlovsbrudd — det
  mest prinsipielt suverenitetsvarme standpunktet i denne saken av alle
  9 partier. Se utsagn-45s partiprogram-evidens for Sps faktiske,
  forsvarsspesifikke posisjon — sammenlign de to for konsistens.
