scan_summary: "Rødt fremmet forslaget om å klargjøre Grunnlovens terskel for suverenitetsavståelse, og mener dagens praksis bryter Grunnloven § 1."
claim_action: >
  Rødt (Bjørnar Moxnes, Marie Sneve Martinussen, Sofie Marhaug) fremmet
  selv Grunnlovsforslag 9 (2023–2024) om å klargjøre terskelen for
  suverenitetsavståelse (Grunnloven §§ 115 og 26). Innst. 464 S
  (2025–2026): forslaget fikk støtte fra SV og Sp i mindretall, men ble
  avvist av flertallet.
verbatim_excerpt: >
  «Medlemene i komiteen frå Sosialistisk Venstreparti, Senterpartiet og
  Raudt støttar forslagsstillarane sitt ønske om å klårgjera Grunnlova
  når det gjeld overføring av mynde [...]»

  «Medlemene i komiteen frå Senterpartiet og Raudt meiner dette er eit
  klårt brot på Grunnlova § 1 fyrste ledd: 'Kongeriket Noreg er eit fritt,
  sjølvstendig, udeleleg og uavhendeleg rike.'»
status: forkastet
position: null
source_tier: A
source_name: "Innst. 464 S (2025–2026); Grunnlovsforslag 9 (2023–2024), Dok. 12:9"
