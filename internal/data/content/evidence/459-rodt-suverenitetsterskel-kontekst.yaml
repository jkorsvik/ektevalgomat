claim_confidence: dokumentert
context_note: >
  IKKE en kodet posisjon på utsagn-45 (position: null med vilje) — dette
  er den generelle grunnlovsmekanismen for suverenitetsavgivelse, ikke et
  forsvarsspesifikt standpunkt. Lagt til som sterk, relevant kontekst:
  Rødt er selv forslagsstiller til det mest prinsipielle
  suverenitetsvernet av alle 9 partier i denne saken, og kaller (med Sp)
  dagens praksis et grunnlovsbrudd. Se utsagn-45s partiprogram-evidens for
  Rødts faktiske, forsvarsspesifikke posisjon — sammenlign de to for
  konsistens.
