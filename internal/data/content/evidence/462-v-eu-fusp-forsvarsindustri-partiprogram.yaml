scan_summary: "Venstre vil ha full deltakelse i EUs felles sikkerhets- og forsvarspolitikk og styrke forsvarsindustrielt samarbeid med EU."
claim_action: >
  Venstres stortingsvalgprogram 2025–2029 tar til orde for full norsk
  deltakelse i EUs felles utenriks- og sikkerhetspolitikk (FUSP) og
  tettere forsvarsindustrielt samarbeid med EU.
verbatim_excerpt: >
  Sikre Norge fullverdig deltakelse i EUs felles utenriks- og
  sikkerhetspolitikk (FUSP) og i EUs romfarts- og satellittsamarbeid,
  styrke det forsvarsindustrielle samarbeidet med EU, og bidra til
  Europas mobilisering og styrking av forsvarsindustrien. [...] Bidra til
  å styrke NATO som vår viktigste sikkerhetsgaranti og forsvarsallianse,
  samtidig som vi jobber for å delta når NATO og EU utvikler felles
  forsvars-, sikkerhets- og beredskapskapasiteter.
