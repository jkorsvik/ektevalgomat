scan_summary: "MDG vil ha mer europeisk samarbeid og forhandlinger om EU-medlemskap, og kaller EU Norges viktigste strategiske partner for klima og energi og et sentralt fredssamarbeid."
claim_action: >
  MDGs arbeidsprogram 2025–2029 (kapittel «Sterkere sammen i Norden og
  Europa») går inn for mer europeisk samarbeid og EU-medlemskapsforhandlinger,
  og kaller EU Norges viktigste strategiske partner «for å styrke
  miljø- og klimapolitikken og energiomstillingen» og «et sentralt
  fredssamarbeid». Programmet kaller ikke EU en sikkerhetspartner.
verbatim_excerpt: >
  «De Grønne vil ha mer europeisk samarbeid, og at Norge skal starte
  forhandlinger med EU om medlemskap. EU er Norges viktigste strategiske
  partner for å styrke miljø- og klimapolitikken og energiomstillingen,
  og et sentralt fredssamarbeid.»
