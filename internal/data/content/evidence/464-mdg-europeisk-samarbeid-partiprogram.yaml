context_note: >
  Kodet -1: MDGs kapittel har ingen setning som eksplisitt kobler EU til
  forsvar/beredskap på samme presise måte som SV, Høyre eller Venstre —
  koblingen her er sluttet fra deres generelle «mer europeisk
  samarbeid»/EU-medlemskaps-linje, ikke et direkte forsvarsspesifikt
  sitat. Derfor claim_confidence «sannsynliggjort», ikke «dokumentert»,
  og -1 (moderat), ikke -2. Tier C, ikke tier A.
