context_note: >
  Kodet 0 (nøytral/delt), ikke et fortegn: FrPs egen tekst peker to
  veier på nøyaktig det spørsmålet utsagnet stiller. Den generelle
  EU-linjen (reservasjonsrett, «utnytte handlingsrommet», nei til
  medlemskap) trekker mot enighet med utsagnets premiss om uavhengighet.
  Men programmet selv lister eksplisitt «sikkerhetspolitikk» som et
  område der FrP ØNSKER godt samarbeid med Europa — det direkte motsatte
  signalet. Forsvarskapittelet er dessuten helt taust om EU (bare
  NATO/bilaterale allierte), så det gir ingen ekstra retning. Én
  posisjon ville skjult denne reelle spenningen i partiets eget
  program, ikke løst den. Tier C, ikke tier A.
  consistency_flag=tension: FrP stemte MED flertallet i Innst. 464 S
  (samme utsagn, egen fil) for at dagens grunnlovsterskel mot
  myndighetsoverføring er god nok — et påfallende komfortabelt standpunkt
  gitt partiets ellers gjennomgående EU-skeptiske linje andre steder i
  programmet (se f.eks. handlingsrom-formuleringen over).
