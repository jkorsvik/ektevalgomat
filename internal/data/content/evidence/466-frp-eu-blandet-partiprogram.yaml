scan_summary: "FrPs program er i reell spenning med seg selv: vil ha reservasjonsrett og handlingsrom mot EU generelt, men eksplisitt godt samarbeid om sikkerhetspolitikk."
claim_action: >
  FrPs partiprogram 2025–2029 (kapittel «Norge og Europa») er imot norsk
  EU-medlemskap og vil utnytte handlingsrommet/reservasjonsretten i EØS,
  men lister samtidig sikkerhetspolitikk som et område der «godt
  samarbeid med Europa» er ønskelig. Programmets forsvarskapittel nevner
  ikke EU i det hele tatt (kun NATO og bilaterale allierte).
verbatim_excerpt: >
  Vi må i større grad utnytte handlingsrommet og benytte
  reservasjonsretten for å sikre norske interesser. [...] Det er viktig
  med et godt samarbeid med Europa for å søke gode løsninger når det
  gjelder spørsmål om sikkerhetspolitikk, miljøpolitikk, kriminalpolitikk
  og politiske områder som i sterk grad relaterer seg til frihandel,
  felles konkurranseregler og menneskelig frihet.
