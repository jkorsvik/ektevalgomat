context_note: >
  Institusjonell kontekst for utsagn-46 og utsagn-47 (samme sak, to
  ulike voteringer). Komiteens flertall (A, H, SV, Sp, R, MDG) skriver
  kun nøytralt om dagens regelverk og regjeringens varslede gjennomgang
  — tar ikke stilling til tilknytningsspørsmålet i denne felles
  merknaden. Egne partiposisjoner om selve tilknytningsspørsmålet er
  kodet i de partivise evidensfilene på hvert av de to utsagnene.
