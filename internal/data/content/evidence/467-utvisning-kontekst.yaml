scan_summary: "FrPs forslag om utvisning uavhengig av tilknytning falt; Stortinget avviste hele representantforslaget 70-29."
claim_action: >
  Innst. 205 S (2025–2026), sak 106246, komiteens behandling av
  Dokument 8:81 S (2025–2026) fra Sylvi Listhaug og Erlend Wiborg om
  en utvisningsreform for kriminelle innvandrere. Komiteen (kommunal-
  og forvaltningskomiteen) fremmet ingen egne forslag om innstramming,
  men tre mindretallsforslag ble satt under votering 14. april 2026,
  i tillegg til komiteens tilråding om å avvise representantforslaget
  i sin helhet.
verbatim_excerpt: >
  «Flertallet merker seg at forslagsstillerne ønsker at Stortinget skal
  vedta en utvisningsreform som vil innebære at utlendinger som dømmes
  til mer enn ett års fengsel, skal utvises, uavhengig av
  oppholdsgrunnlag samt at det skal etableres et samarbeid med danske
  myndigheter om en slik reform.»
