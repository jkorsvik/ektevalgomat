scan_summary: "FrP fremmet eget forslag om at alvorlig kriminalitet skal føre til utvisning uansett tilknytning til Norge — falt 26-66."
claim_action: >
  FrP fremmet forslag nr. 2 i Innst. 205 S (2025–2026): regjeringen bes
  ta initiativ til et samarbeid med Danmark om en utvisningsreform der
  innvandrere som begår alvorlig kriminalitet, skal utvises uavhengig
  av tilknytning til landet, herunder også asylsøkere og flyktninger,
  og der personer som ikke kan returneres til hjemlandet, i stedet skal
  sendes til et trygt tredjeland. Votering 27441 (14.04.2026): falt
  26 mot 66, kun FrP for.
verbatim_excerpt: >
  «Stortinget ber regjeringen ta initiativ til et samarbeid med Danmark
  om en utvisningsreform som sikrer at innvandrere som begår alvorlig
  kriminalitet i Norge, skal utvises, uavhengig av tilknytning til
  landet, herunder også asylsøkere og flyktninger. Dersom personer ikke
  kan returneres til sitt hjemland, skal de likevel uttransporteres til
  et trygt tredjeland som Norge inngår avtale med.»
