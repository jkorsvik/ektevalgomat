scan_summary: "Sp co-fremmet med Høyre en reform innenfor folkerettslige rammer, ikke FrPs ubetingede modell."
claim_action: >
  Senterpartiet er medforslagsstiller på forslag nr. 3 sammen med
  Høyre (se utsagn-47s Høyre-evidens for full tekst og merknad) —
  en gjennomgang av utvisningsregelverket som eksplisitt skal holde
  seg innenfor Norges folkerettslige forpliktelser, til forskjell fra
  FrPs forslag nr. 2 uten et slikt forbehold. Sp stemte mot FrPs
  forslag nr. 2 (votering 27441) og for sitt eget forslag nr. 3
  (votering 27440).
verbatim_excerpt: >
  «Et regelverk som fullstendig avskjærer enhver individuell behandling
  ved utvisning, risikerer å stride mot Norges folkerettslige
  forpliktelser og vil kunne settes til side av domstolene.»
