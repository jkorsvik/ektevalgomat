claim_confidence: dokumentert
context_note: >
  Institusjonell kontekst for utsagn-48 (skjerpede krav generelt) og
  utsagn-49 (tidsfrist for tilbakekall), samme sak, to ulike
  voteringer. KrF og Venstre har ikke sete i kommunal- og
  forvaltningskomiteen for denne saken og har derfor ingen egen
  merknad — deres posisjoner under er kodet fra stemmegivning alene.
