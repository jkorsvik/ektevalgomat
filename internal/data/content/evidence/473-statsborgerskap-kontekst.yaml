scan_summary: "Komiteen behandlet FrPs forslag om innstramming av statsborgerskapsreglene; Høyre og SV/R/MDG fremmet egne, ulike alternativer."
claim_action: >
  Innst. 232 S (2025–2026), sak 200050, behandling av Dokument 8:128 S
  (2025–2026) fra Erlend Wiborg, Sylvi Listhaug, Helge André Njåstad,
  Bjørn Larsen og Rune Midtun om innstramminger for nye statsborgerskap.
  Komiteen (Ap, FrP, H, SV, Sp, R, MDG har sete; KrF og V har ikke)
  behandlet fem mindretallsforslag 30. april 2026, i tillegg til
  tilrådingen om å avvise representantforslaget i sin helhet.
  Innstillingen er signert 30. april 2026, som er denne radens dato;
  de fire voteringene i saken (27522-27525) ble holdt 12. mai 2026.
verbatim_excerpt: >
  «Komiteen viser til at representantforslaget langt på vei tilsvarer
  Representantforslag 159 S (2024–2025), som ble fremmet 1. april 2025,
  og at statsråden i sitt svar til komiteen skriver at hun holder fast
  ved de svarene som ble gitt i den forbindelse.»
