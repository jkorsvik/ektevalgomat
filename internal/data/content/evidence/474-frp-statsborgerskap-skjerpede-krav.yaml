claim_action: >
  FrP fremmet forslag nr. 1–3 i Innst. 232 S (2025–2026), behandlet
  samlet i én votering: minimum ti års botid, bestått språkprøve på
  B2-nivå, bestått prøve om grunnleggende norske verdier, troskapsed
  etter dansk mønster, karensregler ved ubetinget straff, samt krav om
  selvforsørgelse (lønnsinntekt på 3,2 G) de siste fem år før
  statsborgerskap innvilges. Votering 27524 (12.05.2026): falt 29 mot
  72, kun FrP for.
verbatim_excerpt: >
  «Stortinget ber regjeringen legge frem lovforslag med følgende
  kriterier for norsk statsborgerskap som skal gjelde for alle: minimum
  ti års botid bestå språkprøve på minimum B2-nivå bestå prøve om
  grunnleggende norske verdier avlegge en troskapsed etter mønster av
  ordningen i Danmark»
