scan_summary: "Høyre foreslo å vurdere strengere språkkrav (B2 muntlig) og færre fritak fra statsborgerprøven — falt 14-84."
claim_action: >
  Høyre fremmet forslag nr. 5 i Innst. 232 S: evaluere en heving av det
  muntlige språkkravet fra B1 til B2-nivå, redusere antallet
  fritaksgrunner fra testene i samfunnskunnskap og statsborgerprøven,
  innføre krav om ingen offentlig gjeld, og la brudd på en
  integrerings-/borgerkontrakt kunne få konsekvenser for muligheten til
  å bli statsborger. Votering 27522 (12.05.2026): falt 14 mot 84, kun
  Høyre for.
verbatim_excerpt: >
  «Stortinget ber regjeringen legge frem lovforslag om skjerpede krav
  for erverv av norsk statsborgerskap, herunder evaluere språkkravet om
  B1-nivå muntlig og vurdere å øke språkkravet til B2-nivå muntlig
  redusere antallet fritaksgrunner fra å ta testen i norsk
  samfunnskunnskap og statsborgerprøven»
