scan_summary: "Ap mener dagens krav ligger på riktig nivå og avviser en heving av språkkravet til B2, med henvisning til egen forskning."
claim_action: >
  Ap skriver i Innst. 232 S at dagens vilkår for statsborgerskap
  ligger på et riktig nivå, viser til IMPECT-rapporten (Høgskulen på
  Vestlandet, august 2025) om at bare 13 pst. av innvandrere med lav
  utdanning og fluktbakgrunn når B1-nivå, og mener at et krav om B2 vil
  ekskludere personer med reelle forutsetninger for integrering.
  Stemte mot FrPs (27524) og Høyres (27522) forslag.
verbatim_excerpt: >
  «Disse medlemmer mener med bakgrunn i rapporten at en ytterligere
  skjerping av kravet til ferdigheter i norsk muntlig ikke vil styrke
  integreringen. [...] Disse medlemmer mener at dagens krav om nivå B1
  gir et godt grunnlag for deltaking i samfunns- og arbeidsliv og bør
  opprettholdes.»
