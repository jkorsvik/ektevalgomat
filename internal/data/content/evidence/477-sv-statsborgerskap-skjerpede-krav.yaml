scan_summary: "SV og MDG avviser botidskrav på ti år, B2-språkkrav, troskapsed og absolutte inntektskrav som vilkår for statsborgerskap."
claim_action: >
  SV og MDG skriver sammen i Innst. 232 S at de ikke kan støtte forslag
  om å øke botidskravet til ti år, innføre et generelt B2-språkkrav,
  kreve troskapsed eller stille absolutte inntektskrav som vilkår for
  statsborgerskap. Stemte mot FrPs (27524) og Høyres (27522) forslag.
verbatim_excerpt: >
  «Disse medlemmer kan ikke støtte forslag om å øke botidskravet til ti
  år eller innføre et generelt språkkrav på B2-nivå. [...] Disse
  medlemmer kan heller ikke støtte forslag om troskapsed eller
  særskilte verdiprøver som vilkår for statsborgerskap.»
