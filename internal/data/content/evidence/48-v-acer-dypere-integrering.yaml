scan_summary: "V tok til orde for RASKERE og FULL innlemmelse av EUs energiregelverk, og stemte MOT alle fire forslag om å begrense ACER."
claim_action: >
  V stemte MOT på alle fire voteringer i saken (votering_id 24383,
  24384, 24385: 5 mot hver; votering_id 24386, komiteens tilråding om å
  avvise begge representantforslag: 5 for). Individuell votering
  kryssjekket mot data.stortinget.no/eksport/voteringsresultat for alle
  fire votering_id-er.
verbatim_excerpt: >
  "Komiteens medlemmer fra Venstre og Miljøpartiet De Grønne viser til
  at det er avgjørende for Norges klima- og energipolitikk at hele «Ren
  energi-pakken» fra 2018/2019, inkludert de reviderte versjonene av
  rettsaktene, innlemmes i EØS-avtalen og implementeres så raskt som
  mulig. Disse medlemmer viser til at en fortsatt trenering av
  implementeringen vil medføre at Norge går glipp av viktige
  støtteordninger, forutsigbare rammevilkår for næringslivet og
  styrkede forbrukerrettigheter."
