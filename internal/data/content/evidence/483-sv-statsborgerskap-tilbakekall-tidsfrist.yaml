scan_summary: "SV, Rødt og MDG foreslo sammen en foreldelsesfrist for tilbakekall av statsborgerskap — falt 21-80."
claim_action: >
  SV, Rødt og MDG fremmet sammen forslag nr. 4 i Innst. 232 S: at
  regjeringen skal utrede og fremme forslag til en foreldelsesfrist for
  tilbakekall av statsborgerskap. Begrunnelsen viser til at Norge i dag
  praktiserer tilbakekall uten noen foreldelsesfrist, og at praksisen
  har blitt kritisert flere ganger. Votering 27523 (30.04.2026): falt
  21 mot 80, for fra SV, Rødt, MDG, KrF og Venstre.
verbatim_excerpt: >
  «Disse medlemmer mener at Norge allerede har strenge regler for
  erverv av norsk statsborgerskap. Disse medlemmer viser blant annet
  til at Norge praktiserer tilbakekall av statsborgerskap uten
  foreldelsesfrist. Disse medlemmer viser til at denne praksisen ved
  flere anledninger har blitt kritisert.»
