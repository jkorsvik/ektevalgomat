scan_summary: "Stortinget vedtok å erstatte integreringskontrakten med en signeringspliktig integreringserklæring."
claim_action: >
  Innst. 309 L (2025–2026), sak 200258, behandling av Prop. 70 L
  (2025–2026) om endringer i integreringsloven § 16. Loven innfører en
  plikt for deltakere i introduksjonsprogrammet til å signere en
  integreringserklæring som skal erstatte dagens integreringskontrakt.
  Vedtatt 19. mai 2026 (votering 27779: 54 mot 44).
verbatim_excerpt: >
  «Formålet med å innføre en integreringserklæring er å tydeliggjøre
  hva norske myndigheter forventer av deltakere i introduksjonsprogrammet,
  og hvilke forpliktelser deltakerne har til å ta del i arbeids- og
  samfunnslivet og bli selvforsørget. [...] Integreringserklæringen
  skal også løfte frem hvilket ansvar som følger med det å være
  forelder i Norge, og at brudd på norske lover kan medføre
  straffansvar.»
