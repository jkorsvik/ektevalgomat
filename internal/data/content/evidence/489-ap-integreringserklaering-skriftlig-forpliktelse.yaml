scan_summary: "Ap støtter plikten til å signere en integreringserklæring, som et rammesettende tillegg, ikke et kontrolltiltak."
claim_action: >
  Ap og Høyre skriver sammen at de støtter forslaget om å innføre en
  plikt til å signere en integreringserklæring for deltakere i
  introduksjonsprogrammet, som et tillegg tidlig i integreringsløpet —
  ikke som erstatning for dialog, opplæring og eksisterende lovverk.
  Ap er del av komiteflertallet som fremmet loven, og stemte for
  (votering 27779: 54 for, 44 mot).
verbatim_excerpt: >
  «Komiteens medlemmer fra Arbeiderpartiet og Høyre støtter forslaget
  om å innføre en plikt til å signere en integreringserklæring for
  deltakere i introduksjonsprogrammet. [...] Erklæringen er ment som et
  rammesettende tillegg tidlig i integreringsløpet, ikke som et
  kontrolltiltak eller erstatning for dialog, opplæring og eksisterende
  lovverk.»
