id: ev-2025-04-10-mdg-acer-dypere-integrering
statement_id: utsagn-07
party_id: mdg
actor: "Miljøpartiet De Grønne (Une Bastholm, energi- og miljøkomiteen)"
date: "2025-04-10"
evidence_type: voteringsspor
