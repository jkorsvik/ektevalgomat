scan_summary: "MDG delte Vs merknad om at hele fjerde energimarkedspakke bør innlemmes så raskt som mulig, og stemte MOT alle fire forslag om å begrense ACER."
claim_action: >
  MDG stemte MOT på alle fire voteringer i saken (votering_id 24383,
  24384, 24385: 2 mot hver; votering_id 24386, komiteens tilråding om å
  avvise begge representantforslag: 2 for). Individuell votering
  kryssjekket mot data.stortinget.no/eksport/voteringsresultat for alle
  fire votering_id-er.
verbatim_excerpt: >
  "Komiteens medlemmer fra Venstre og Miljøpartiet De Grønne viser til
  at det er avgjørende for Norges klima- og energipolitikk at hele «Ren
  energi-pakken» fra 2018/2019, inkludert de reviderte versjonene av
  rettsaktene, innlemmes i EØS-avtalen og implementeres så raskt som
  mulig. [...] Disse medlemmer er av den klare oppfatning at det både i
  et miljøpolitisk, energipolitisk og sikkerhetspolitisk perspektiv vil
  være en fordel for Norge å knytte seg tettere til det europeiske
  energisystemet. Å nedlegge veto mot EUs «Ren energi-pakke», og å melde
  Norge ut av ACER, er det diametralt motsatte av den energi- og
  klimapolitikken Norge og Europa trenger nå."
status: forslag_avvist_av_flertallet
position: 1
