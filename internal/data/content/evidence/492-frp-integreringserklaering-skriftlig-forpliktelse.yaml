claim_confidence: dokumentert
context_note: >
  Kodet +1, ikke -1: FrPs egen tekst er ikke en avvisning av tanken om
  en skriftlig forpliktelse til lover, verdier og foreldreansvar — den
  er en avvisning av DENNE loven for å være for svak/symbolsk, mens FrP
  selv ønsker en STRENGERE, mer bindende variant (egen
  integreringskontrakt med reelle sanksjoner). Retningen er den samme
  som utsagnet spør om, bare sterkere. Bekreftet [OK] i votes.py: FrP 0
  for / 27 mot.
