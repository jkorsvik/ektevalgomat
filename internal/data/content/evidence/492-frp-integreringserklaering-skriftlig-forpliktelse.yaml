scan_summary: "FrP mener regjeringens erklæring er symbolpolitikk uten reelle sanksjoner, og vil ha en langt strengere, bindende integreringskontrakt i stedet."
claim_action: >
  FrP mener det er positivt at regjeringen erkjenner behovet for
  tydeligere forventninger til nyankomne, men mener forslaget i all
  hovedsak er symbolpolitikk fordi det ikke knyttes reelle sanksjoner
  til brudd. FrP viser til sitt eget, mer forpliktende forslag
  (Dokument 8:275 S) om en integreringskontrakt med reelle sanksjoner,
  og stemte mot loven (votering 27779: 54 for, 44 mot, FrP mot).
verbatim_excerpt: >
  «Disse medlemmer mener det er positivt at regjeringen snur og nå
  erkjenner behovet for tydeligere forventninger til nyankomne
  innvandrere, men disse medlemmer mener forslaget som fremmes, ikke
  løser utfordringene eller svarer på de grunnleggende
  integreringsutfordringene Norge står overfor.»
status: vedtatt_stemte_mot
