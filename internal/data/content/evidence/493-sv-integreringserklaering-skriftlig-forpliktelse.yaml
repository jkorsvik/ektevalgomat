scan_summary: "SV kan ikke støtte forslaget — mener integrering ikke skapes gjennom underskrifter, men gjennom reelle tiltak."
claim_action: >
  SV mener integrering ikke skapes gjennom underskrifter eller formelle
  erklæringer, men gjennom konkrete tiltak som gir reelle muligheter
  til deltakelse. SV mener forslaget innebærer et prinsipielt skifte
  fra en gjensidig kontrakt til en ensidig erklæring rettet mot
  individet, og stemte mot (votering 27779: 54 for, 44 mot).
verbatim_excerpt: >
  «Dette medlem vil understreke at integrering ikke skapes gjennom
  underskrifter eller formelle erklæringer, men gjennom konkrete tiltak
  som gir mennesker reelle muligheter til deltakelse i arbeid,
  utdanning og samfunnsliv.»
