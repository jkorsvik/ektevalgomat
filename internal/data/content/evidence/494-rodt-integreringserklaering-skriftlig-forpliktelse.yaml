scan_summary: "Rødt støtter ikke forslaget — mener en ensidig signeringsplikt kan svekke tillit og dialog i dagens introduksjonsprogram."
claim_action: >
  Rødt mener det er rett og rimelig å stille krav og forventninger til
  nyankomne, men mener samtidig at en ensidig signeringsplikt kan
  svekke tilliten, dialogen og gjensidigheten som i dag ivaretas
  gjennom introduksjonsprogrammets integreringsplan og -kontrakt.
  Rødt mener forslaget er dårlig utredet. Stemte mot (votering 27779:
  54 for, 44 mot).
verbatim_excerpt: >
  «Dette medlem deler synet til en rekke av høringsinstansene om at en
  ensidig signeringsplikt kan svekke tilliten, dialogen og
  gjensidigheten som er godt ivaretatt med dagens
  introduksjonsprogram.»
