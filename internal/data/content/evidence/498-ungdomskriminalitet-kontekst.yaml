claim_confidence: dokumentert
context_note: >
  Institusjonell kontekst for utsagn-51. Innst. 173 S inneholder også
  forslag om en egen ungdomskriminalitetsnemnd (forslag 2 og 3) — det
  er en egen, separat mekanisme og ikke brukt her; kun forslag 1
  (lukket institusjon uten tidsbegrensning) er relevant for dette
  utsagnet.
