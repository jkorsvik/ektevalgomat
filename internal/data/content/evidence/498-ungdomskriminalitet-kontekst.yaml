scan_summary: "FrP og Høyre foreslo å tillate lukket institusjon for ungdom med kriminell atferd så lenge det er behov; falt 43-58."
claim_action: >
  Innst. 173 S (2025–2026), sak 105260, behandling av Dokument 8:28 S
  (2025–2026) om innføring av ungdomskriminalitetsnemnd og lukkede
  institusjoner for mindreårige kriminelle. Komiteens flertall (FrP, H
  og KrF) fremmet forslag om et institusjonsnettverk for ungdom; FrP og
  H fremmet i tillegg forslag nr. 1 om ubegrenset varighet på lukket
  institusjonsopphold, som Innst. 173 S 16. april 2026 satte til
  votering.
verbatim_excerpt: >
  «Komiteens medlemmer fra Fremskrittspartiet og Høyre fremmer på denne
  bakgrunn følgende forslag: «Stortinget ber regjeringen legge frem
  lovforslag som gir mulighet til å holde ungdom med kriminell adferd i
  lukkede institusjoner så lenge det er behov for det.»»
