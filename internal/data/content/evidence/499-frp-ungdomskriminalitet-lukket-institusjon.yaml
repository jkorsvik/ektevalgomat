scan_summary: "FrP mener korte, tidsbegrensede opphold er utilstrekkelige og vil ha klare hjemler for langvarig skjerming når kriminalitetsbildet krever det."
claim_action: >
  FrP og Høyre fremmet sammen forslag nr. 1 i Innst. 173 S om at
  ungdom med kriminell atferd skal kunne holdes i lukket institusjon så
  lenge det er behov for det. FrP understreker i egen tekst at
  kortvarige plasseringer uten mulighet for forlengelse er
  utilstrekkelige. Votering 27111 (16.04.2026): falt 43 mot 58, for fra
  FrP og Høyre.
verbatim_excerpt: >
  «Komiteens medlemmer fra Fremskrittspartiet understreker videre at
  institusjonene må ha klare hjemler for langvarig skjerming når
  kriminalitetsbildet tilsier det. Kortvarige plasseringer uten
  mulighet for forlengelse har vist seg utilstrekkelige for å beskytte
  ofre og samfunn mot gjentatt kriminalitet fra unge gjengangere samt
  for å gi reell behandlingsmessig effekt.»
