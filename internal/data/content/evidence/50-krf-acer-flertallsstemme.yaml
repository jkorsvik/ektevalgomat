source_tier: A
source_name: "Innst. 196 S (2024–2025); votering_id 24383-24386"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2024-2025/inns-202425-196s/?all=true"
claim_confidence: dokumentert
context_note: >
  Kodet +1 utelukkende fra stemmegivning, ikke fra en egen skriftlig
  merknad — komiteinnstillingen har ingen KrF-spesifikk tekst i denne
  saken utover å være listet som medundertegner av den generelle
  flertallsmerknaden og komiteens tilråding om å avvise begge
  representantforslag, den samme tilrådingen det snudde utsagnet nå
  bygger på. Kodet svakere enn +2 for å reflektere at signalet er
  stemmesporet alene, ikke en egen begrunnet posisjon. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
