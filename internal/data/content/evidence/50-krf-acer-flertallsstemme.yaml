scan_summary: "KrF stemte MOT alle fire forslag om å begrense ACER, som del av flertallet, men har ingen egen skriftlig merknad i saken."
claim_action: >
  KrF stemte MOT på alle fire voteringer i saken (votering_id 24383,
  24384, 24385: 2 mot hver; votering_id 24386, komiteens tilråding om å
  avvise begge representantforslag: 2 for). Individuell votering
  kryssjekket mot data.stortinget.no/eksport/voteringsresultat for alle
  fire votering_id-er.
verbatim_excerpt: >
  "Komiteens tilråding fremmes av medlemmene i komiteen fra
  Arbeiderpartiet, Høyre, Fremskrittspartiet, Venstre, Miljøpartiet De
  Grønne og Kristelig Folkeparti."
status: forslag_avvist_av_flertallet
