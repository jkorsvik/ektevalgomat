scan_summary: "Høyre medforslagsstiller (med FrP) til ubegrenset varighet ved lukket institusjon, men med krav om rettssikkerhetsgarantier og oppfølging."
claim_action: >
  Høyre er medforslagsstiller på forslag nr. 1 sammen med FrP. Høyre
  understreker samtidig at det må foreligge gode
  rettssikkerhetsgarantier og at varigheten må gi rom for god
  oppfølging av barnet, og viser til at Høyre gjentatte ganger har
  fremmet forslag om nasjonale institusjonstilbud. Stemte for i
  votering 27111.
verbatim_excerpt: >
  «Komiteens medlemmer fra Høyre mener at det må foreligge gode
  rettssikkerhetsgarantier for ungdommer som skal ha opphold på en
  institusjon, og at varighet på oppholdet må kunne være langt nok til
  å gi god oppfølging av barnet.»
