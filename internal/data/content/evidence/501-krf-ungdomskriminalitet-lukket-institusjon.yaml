claim_confidence: dokumentert
context_note: >
  Kodet -1, ikke -2 (korrigert 2026-09-27): KrFs egen tekst er
  betinget, ikke en prinsipiell avvisning — lukkede institusjoner "kan
  ... være nødvendige i enkelte alvorlige tilfeller". Det KrF avviser
  eksplisitt er nettopp DENNE ordlyden, "så lenge det er behov for
  det" — ikke lukket institusjon som sådan. «så lenge det er behov for
  det» er den nøyaktige ordlyden kildeteksten selv setter i
  anførselstegn.

  Presisering (korrigert 2026-09-27): en tidligere versjon av denne
  filen hevdet at KrF var "medforslagsstiller (med FrP og Høyre)" på
  et bredere institusjonsnettverk-forslag. Det finnes ingen slik felles
  "forslag" — Innst. 173 S sitt "Forslag 3" er fremmet av Høyre og
  Kristelig Folkeparti ALENE (uten FrP), og gjelder et helt annet tema
  (utredning av en ungdomskriminalitetsnemnd for 10-14-åringer etter
  dansk modell), ikke lukket institusjon. Det FrP+H+KrF faktisk står
  sammen om er komiteens tilråding (vedtak I), sitert direkte over: en
  anmodning om et nettverk av institusjonsplasser, både åpne og
  lukkede — uten den ubegrensede varigheten forslag 1 ber om. Denne
  tilrådingen falt i Stortinget (votering 27114), separat fra forslag
  1 (votering 27111) som er kilden til dette utsagnet.

  Bekreftet [OK] i votes.py: KrF 0 for / 4 mot (votering 27111).
