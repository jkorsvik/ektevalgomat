evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: "KrF mener lukkede institusjoner kan være nødvendige i enkelte alvorlige tilfeller, men avviser eksplisitt en ordlyd uten avgrensning eller rettssikkerhetsgarantier."
claim_action: >
  KrF skriver at lukkede institusjoner kan være nødvendige i enkelte
  alvorlige tilfeller, men avviser eksplisitt å støtte en ordlyd som
  åpner for å holde ungdom i lukket institusjon "så lenge det er behov
  for det" uten nærmere avgrensninger og rettssikkerhetsgarantier.
  Stemte mot forslag nr. 1 (FrP og Høyre) i votering 27111. KrF er del
  av komiteens tilråding (fremmet sammen med FrP og Høyre) om et bredere
  nettverk av institusjonsplasser, både åpne og lukkede — en egen,
  separat anmodning uten den ubegrensede varigheten forslag 1 og dette
  utsagnet spør om.
verbatim_excerpt: >
  «Lukkede institusjoner kan etter dette medlems syn være nødvendige i
  enkelte alvorlige tilfeller, både av hensyn til barnet selv, til
  ansatte og til samfunnets sikkerhet. Samtidig må slike tiltak være
  strengt regulert, målrettede og underlagt tydelig kontroll, og ikke
  utvikle seg til en hovedregel.»

  […]

  «så lenge det er behov for det»

  […]

  «Komiteens tilråding fremmes av medlemmene i komiteen fra
  Fremskrittspartiet, Høyre og Kristelig Folkeparti.»
status: forslag_avvist_stemte_mot
position: -1
source_tier: A
source_name: "Innst. 173 S (2025–2026), forslag 1 og komiteens tilråding; votering 27111 (16.04.2026)"
