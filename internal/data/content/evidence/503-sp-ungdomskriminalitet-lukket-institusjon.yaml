scan_summary: "Sp mener FrPs ønske allerede er ivaretatt gjennom et vedtak fra trontaledebatten, og vil avvente regjeringens oppfølging."
claim_action: >
  Sp og MDG skriver sammen at stortingsflertallet allerede har vedtatt
  (vedtak 8, trontaledebatten) å be regjeringen komme tilbake med
  forslag til lovhjemler på dette området, og at dette er til
  oppfølging i departementet. Sp oppfatter derfor FrPs forslag som
  allerede ivaretatt, og avventer regjeringens videre arbeid. Stemte
  mot forslag nr. 1 (votering 27111).
verbatim_excerpt: >
  «Komiteens medlemmer fra Senterpartiet og Miljøpartiet De Grønne
  viser for øvrig til at stortingsflertallet i vedtak 8 i forbindelse
  med trontaledebatten allerede har vedtatt å be regjeringen komme
  tilbake med forslag til lovhjemler, og at dette er til oppfølging i
  departementet. Disse medlemmer oppfatter derfor at forslagene fra
  Fremskrittspartiet allerede er ivaretatt, og avventer derfor
  regjeringens oppfølging av dette i det varslede lovarbeidet.»
