context_note: >
  Faktakontekst uten partiposisjon (position: 0, ingen part_id) — se de
  ni egne partifilene (52–60) for hvert partis stemme og eventuelle egen
  merknad. Utsagn-04 ble snudd 2026-09-27 til Ap/Sps egen "allerede
  ivaretatt"-argumentasjon slik at ikke alle utsagn peker samme vei. Et parti som stemte FOR dette
  kartleggingsforslaget nå er kodet UENIG i at dagens innsats er god
  nok, og omvendt for Ap/Sp/SV/FrP som stemte mot. Merk
  presisjonsnyansen mot den opprinnelige ordlyden: forslaget ber om
  kartlegging av "informasjonspåvirkning" generelt (bakgrunnsteksten
  viser til FFI-rapporter om desinformasjon i sosiale medier spesifikt,
  men selve forslagsteksten nevner ikke "sosiale medier" som eget vilkår)
  og sier ikke eksplisitt "informere offentligheten" — FFI-modellen
  forslaget bygger på (FFI-rapport 21/02746) er riktignok selv en
  offentlig rapport, så "informere offentligheten" er en rimelig
  underforstått konsekvens, ikke en ordrett del av forslagsteksten. Tett
  nok til å kode partiposisjoner på, i motsetning til Innst. 275 L
  (utsagn-02) og Innst. 303 S (utsagn-04s tidligere avviste kandidat) som
  begge testet en reelt annen problemstilling.
