scan_summary: >
  Innst. 231 S (2022–2023): Høyres representantforslag (Dokument 8:51 S)
  om styrking av rikets sikkerhet og kontraetterretning inneholdt et
  konkret forslag om at regjeringen umiddelbart skulle igangsette en
  kartlegging av uønsket informasjonspåvirkning fra utenlandske aktører
  i forbindelse med valgene i 2023 og 2025 — det avviste forslaget
  utsagn-04 (i sin snudde form, se nedenfor) spør om Ap/Sps "allerede
  ivaretatt"-innvending mot. Forslaget (endelig forslagsnummer 6, fremmet
  av Høyre og Venstre) fikk 32 for og 69 mot, og falt.
claim_action: >
  Representantforslagets opprinnelige forslagspunkt 7 (Høyres syv
  forslagsstillere, ledet av Sveinung Stensland og Ine Eriksen Søreide)
  ba regjeringen "umiddelbart igangsette en kartlegging av uønsket
  informasjonspåvirkning fra utenlandske aktører i forbindelse med
  kommune- og fylkestingsvalget i 2023 og stortingsvalget i 2025.
  Kartleggingen skal blant annet fange opp forsøk på påvirkning av
  nordmenns virkelighetsoppfatning, verdier og tillit over tid." I
  komiteens endelige, omnummererte forslagsliste ble dette forslag 6,
  fremmet av Høyre og Venstre alene (de øvrige forslagsstillerne fra
  dokumentet, alle Høyre, sto ikke bak den endelige forslagsteksten som
  Venstre-medlem). Votering 2023-03-14, votering_id 20371: 32 for
  (H 20, V 4, KrF 2, MDG 2, Rødt 4), 69 mot (Ap 30, FrP 13, SV 8, Sp 17,
  Pasientfokus 1) — kryssjekket per parti mot
  data.stortinget.no/eksport/voteringsresultat. Forslaget falt. Den
  eneste delen av representantforslaget som faktisk ble vedtatt
  (komiteens tilråding, samlet flertall H/FrP/SV/V, enstemmig) gjaldt
  endringer i eksportkontrollforskriften — et annet tema, ikke kartlegging.
verbatim_excerpt: >
  Stortinget ber regjeringen umiddelbart igangsette en kartlegging av
  uønsket informasjonspåvirkning fra utenlandske aktører i forbindelse
  med kommune- og fylkestingsvalget i 2023 og stortingsvalget i 2025.
  Kartleggingen skal blant annet fange opp forsøk på påvirkning av
  nordmenns virkelighetsoppfatning, verdier og tillit over tid.
