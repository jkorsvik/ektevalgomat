context_note: >
  Ingen enkeltparti går inn for en generell, ubetinget avvikling av
  formuesskatten uten forbehold bortsett fra FrP (program, fil 517) og
  Høyre (egen merknad i Innst. 188 S, fil 518). De øvrige partiene
  som nevner formuesskatten i sitt program, gjør det enten med en
  avgrensning (kun "arbeidende kapital", kun SMB-eiere) eller med en
  eksplisitt motsatt retning (økt sats for de største formuene). Se
  enkeltfilene for hvert partis nøyaktige formulering.
