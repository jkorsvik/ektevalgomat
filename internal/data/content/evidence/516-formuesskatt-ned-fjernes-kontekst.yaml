scan_summary: "Formuesskatten er en årlig skatt på nettoformue (verdien av bolig, aksjer, bankinnskudd med mer, minus gjeld) over et bunnfradrag. FrP (partiprogrammet) og Høyre (egen merknad i Innst. 188 S) vil fjerne den helt. De andre partiene som nevner den, vil redusere den bare for noen formuestyper, øke den for de største formuene, eller begge deler."
claim_action: >
  Kontekstfil for utsagn-52. Kildene under er de ni partienes egne
  stortingsvalg-/arbeidsprogram for 2025-2029 (tier C — partiets eget
  program, ikke en Storting-avstemning), unntatt Høyres evidens som
  også bruker en direkte, sitert formulering fra en reell innstilling
  (Innst. 188 S). Sp og Rødt: Sp har levert eget program (hentet
  27.09.2026 fra senterpartiet.no). Rødt er kodet fra sin egen
  hovedmerknad i Innst. 2 S (tier A, fil 601); Rødts program (lastet
  ned i nettleser 28.09.2026, se fil 603) peker samme vei.
