context_note: >
  Kodet +2, kilde oppgradert fra parti­program til en reell innstilling
  (tier A): denne setningen er en eksplisitt, ordrett uttalt ambisjon
  om FULL avvikling av formuesskatten, ikke bare et partiprogram-
  sitat om delvis reduksjon på "arbeidende kapital". De to kildene er
  ikke motstridende — programmets tiltak (fjerne skatt på arbeidende
  kapital, øke bunnfradraget) er de konkrete, kortsiktige skrittene;
  denne merknaden i Innst. 188 S sier eksplisitt hva Høyre mener bør
  skje "deretter": full avvikling. Ikke en votering i seg selv, men en
  skriftlig komitémerknad i en reell sak, samme evidensklasse som
  brukes gjennomgående ellers i datasettet.
