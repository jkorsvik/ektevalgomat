scan_summary: "Høyres egen merknad i Innst. 188 S sier eksplisitt at formuesskatten bør avskaffes i sin helhet, som neste steg etter en økt bunnfradrag-heving."
claim_action: >
  I Innst. 188 S (2025–2026) skriver Høyre at partiet ønsker å øke
  bunnfradraget i formuesskatten, og at "formuesskatten bør deretter
  avskaffes i sin helhet" — et eksplisitt, ubetinget mål om full
  avvikling, ikke bare en delvis reduksjon. Dette stemmer med Høyres
  program, som mer forsiktig sier "fjerne formuesskatten på arbeidende
  kapital" og "øke bunnfradraget på all formuesskatt" som kortsiktige
  skritt mot det samme målet.
verbatim_excerpt: >
