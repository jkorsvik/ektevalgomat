claim_action: >
  Venstres stortingsvalgprogram 2025–2029 sier partiet vil fjerne
  formuesskatten på arbeidende kapital, og delvis kompensere
  inntektsbortfallet gjennom en moderat økning av selskapsskatten.
verbatim_excerpt: >
