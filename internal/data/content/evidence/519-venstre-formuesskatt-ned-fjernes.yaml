context_note: >
  Kodet +1, ikke +2: dette er en avgrenset reduksjon (kun "arbeidende
  kapital", ikke hele formuesskatten) med en uttalt kompensasjon
  andre steder — samme retning som utsagnet, men ikke den fulle
  "på sikt fjernes"-påstanden Venstre ikke uttrykker eksplisitt for
  formuesskatten som helhet. Tier C, ikke tier A.
