scan_summary: >
  Høyre fremmet selv representantforslaget og sto bak forslag 6 (med
  Venstre) om umiddelbar kartlegging av utenlandsk informasjonspåvirkning
  mot valgene i 2023 og 2025 — direkte tekstlig samsvar med utsagn-04.
  Stemte for.
claim_action: >
  Høyres syv stortingsrepresentanter (Stensland, Eriksen Søreide, Holm
  Lønseth, Elvenes, Farahmand, Foss, Schou) fremmet Dokument 8:51 S med
  kartleggingsforslaget som eget punkt. I komiteens endelige forslagsliste
  sto Høyre (sammen med Venstre) bak forslag 6. Votering_id 20371: Høyre
  20 for, 0 mot (16 ikke til stede) — kryssjekket mot
  data.stortinget.no/eksport/voteringsresultat.
verbatim_excerpt: >
  Stortinget ber regjeringen umiddelbart igangsette en kartlegging av
  uønsket informasjonspåvirkning fra utenlandske aktører i forbindelse
  med kommune- og fylkestingsvalget i 2023 og stortingsvalget i 2025.
  Kartleggingen skal blant annet fange opp forsøk på påvirkning av
  nordmenns virkelighetsoppfatning, verdier og tillit over tid.
status: forslag_avvist_av_flertallet
