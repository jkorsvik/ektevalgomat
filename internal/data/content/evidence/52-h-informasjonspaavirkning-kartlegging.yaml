claim_confidence: dokumentert
context_note: >
  Kodet -2 (sterkt uenig i at dagens innsats er god nok): Høyre er selv
  opphavspartiet til det avviste kartleggingsforslaget og
  medforslagsstiller på den endelige forslagsteksten — et parti som selv
  fremmet et mer omfattende tiltak enn dagens praksis, kan vanskelig sies
  å mene dagens innsats er tilstrekkelig. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2, men
  det faktiske stemme- og forslagssporet i verbatim_excerpt/claim_action
  er uendret. Se evidence/51-utenlandsk-paavirkning-kontekst.yaml for den
  mindre presisjonsnyansen mot den opprinnelige "sosiale medier"-
  formuleringen.
