context_note: >
  Kodet -2: eksplisitt, ordrett mot utsagnets premiss. Teksten bruker
  ikke selve ordet "formuesskatt" her (SVs eneste bruk av det ordet i
  programmet gjelder en global formuesskatt for dollarmilliardærer,
  ikke den norske skatten), men er en direkte, entydig uttalelse om at
  større norske formuer skal skattlegges MER, ikke mindre — samme
  politikkområde, motsatt retning av "trappes ned og fjernes". Tier
  C, ikke tier A.
