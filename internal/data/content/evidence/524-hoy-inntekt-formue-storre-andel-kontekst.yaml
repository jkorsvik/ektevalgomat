context_note: >
  Merk asymmetrien i kildestyrke: SV, MDG og KrF navngir eksplisitt
  hvilke grupper som skal betale mer (store formuer/høyeste inntekter),
  mens Ap og Sp har mer generelle formuleringer om rettferdig/
  progressiv beskatning uten et like presist "mer enn i dag"-løfte, og
  er derfor kodet mildere (+1, sannsynliggjort). FrP, Høyre og Venstre
  er kodet fra sine egne formuesskatt-reduksjonstekster (samme kilder
  som utsagn-52), som peker motsatt vei av dette utsagnet.
