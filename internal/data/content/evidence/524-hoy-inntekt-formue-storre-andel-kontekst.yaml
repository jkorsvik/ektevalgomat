  Kontekstfil for utsagn-53. Kildene under er de ni partienes egne
  program for 2025-2029 (tier C). Rødt er kodet fra sin egen
  hovedmerknad i Innst. 2 S (tier A, fil 602); Rødts program (lastet
  ned i nettleser 28.09.2026, se fil 603) peker samme vei.
