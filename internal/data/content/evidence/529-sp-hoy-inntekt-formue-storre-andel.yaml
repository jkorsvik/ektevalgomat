context_note: >
  Kodet +1, ikke +2: setningen er eksplisitt på topic (store formuer
  skal bidra), men sier "etter evne", ikke uttrykkelig "en STØRRE
  andel enn i dag" — kan også leses som en bekreftelse av dagens
  bidrag, ikke nødvendigvis en økning. Samme kildetekst som utsagn-52s
  Sp-evidens (kodet 0 der, siden den samtidig reduserer skatten for en
  avgrenset gruppe); her telles bare "må bidra etter evne"-delen, som
  er svakt, men reelt, på topic for AT rikeste skal bære en byrde.
  Tier C, ikke tier A.
