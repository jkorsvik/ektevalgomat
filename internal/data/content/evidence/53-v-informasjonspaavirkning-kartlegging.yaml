claim_confidence: dokumentert
context_note: >
  Kodet -2 (sterkt uenig i at dagens innsats er god nok): Venstre er
  medforslagsstiller på hovedforslaget (6) og fremmet i tillegg et eget,
  ytterligere ansvarsklargjøringsforslag (7) på samme tema — det sterkeste
  signalet av alle ni partier sammen med Høyre, og det motsatte av å mene
  dagens innsats er tilstrekkelig. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +2 til -2, men det faktiske
  forslagssporet i verbatim_excerpt/claim_action er uendret. Se
  evidence/51-utenlandsk-paavirkning-kontekst.yaml for presisjonsnyansen
  mot den opprinnelige ordlyden.
