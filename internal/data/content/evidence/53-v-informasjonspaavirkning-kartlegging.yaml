scan_summary: >
  Venstre var medforslagsstiller (med Høyre) på forslag 6 om umiddelbar
  kartlegging av utenlandsk informasjonspåvirkning mot valgene i 2023 og
  2025, og fremmet i tillegg et eget, ytterligere forslag (7) om klare
  ansvarsforhold for håndtering av informasjonspåvirkning. Stemte for begge.
claim_action: >
  Forslag 6 (Høyre og Venstre), votering_id 20371: Venstre 4 for, 0 mot
  (1 ikke til stede). Venstre fremmet også, alene, forslag 7 ("Stortinget
  ber regjeringen sikre klare ansvarsforhold i spørsmål om håndtering av
  informasjonspåvirkning i den offentlige debatten"), votering_id 20370:
  Venstre 4 for — kryssjekket mot
  data.stortinget.no/eksport/voteringsresultat. Begge forslag falt i
  plenum.
verbatim_excerpt: >
  Stortinget ber regjeringen umiddelbart igangsette en kartlegging av
  uønsket informasjonspåvirkning fra utenlandske aktører i forbindelse
  med kommune- og fylkestingsvalget i 2023 og stortingsvalget i 2025.
status: forslag_avvist_av_flertallet
