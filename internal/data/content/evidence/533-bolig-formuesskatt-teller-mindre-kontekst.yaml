context_note: >
  Komiteens flertall (Ap, SV, Sp, MDG, Rødt) viser i sin merknad
  eksplisitt til regjeringens varslede justering og velger å behandle
  realitetene når revidert nasjonalbudsjett kommer, i stedet for å
  støtte noen av mindretallsforslagene nå. Dette er en utsatt/
  prosedyremessig posisjon, ikke en substansiell "nei" til at boligen
  bør telle mindre — se enkeltpartienes evidensfiler, kodet 0
  (nøytral/delt), ikke -1/-2. Alle fire voteringer bekreftet [OK] i
  votes.py mot data.stortinget.nos egne totaler.
