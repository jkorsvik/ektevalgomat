scan_summary: "Finanskomiteen behandlet to representantforslag om verdsetting av bolig i formuesskatten (Innst. 188 S). Fire alternative forslag om å redusere boligens vekt falt; regjeringen har samtidig varslet en egen, mindre justering via revidert nasjonalbudsjett."
claim_action: >
  Innst. 188 S (2025–2026), sak 200007, behandlet Dokument 8:94 S (H)
  og Dokument 8:97 S (V) om verdsetting av primærbolig i
  formuesskatten. Fra 2026 ble en ny verdsettingsmodell innført som økte
  formuesskatten for mange boligeiere. Fire mindretallsforslag om å
  redusere boligens vekt (forslag 1, FrP+H+V: bred utredning; forslag
  2-4, FrP: suspendere modellen / ekspertutvalg / 25 % for alle
  primærboliger; forslag 5, H: 25 % opp til 20 mill.; forslag 6, V:
  gjeninnføre 2025-modellen) falt alle i Stortinget 24. mars 2026.
  Finansministeren har samtidig varslet at regjeringen i revidert
  nasjonalbudsjett 2026 vil foreslå å heve innslagspunktet for høy
  verdsetting fra 10 til 14 mill. kroner — en mindre justering i samme
  retning, via en annen kanal.
