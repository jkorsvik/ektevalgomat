scan_summary: "FrP fremmet tre egne forslag for å redusere eller reversere den nye boligverdsettingsmodellen i formuesskatten, deriblant at alle primærboliger skal verdsettes til 25 % av markedsverdi."
claim_action: >
  FrP fremmet forslag 2 (midlertidig suspensjon av 2026-modellen),
  forslag 3 (hurtigarbeidende ekspertutvalg) og forslag 4 (alle
  primærboliger verdsettes til 25 % av markedsverdi) i Innst. 188 S.
  Partiet mener boligen først og fremst er et hjem, ikke et finansielt
  objekt, og at skatten bør stå i rimelig forhold til betalingsevne.
  Stemte for egne forslag (votering 27361, 29 for/72 mot) og for
  forslag 1 (FrP+H+V, votering 27362, 45 for/57 mot).
verbatim_excerpt: >
  «Stortinget ber regjeringen i forbindelse med revidert
  nasjonalbudsjett for 2026 legge til rette for at alle primærboliger
  verdsettes til 25 prosent av markedsverdi ved beregning av
  formuesskatt.»
