scan_summary: "Høyre fremmet Dokument 8:94 S og et eget forslag om å heve grensen for 75 % verdsettelsesrabatt til 20 mill. kroner, og vil på sikt avskaffe formuesskatten på bolig helt."
claim_action: >
  Høyre fremmet forslag 5: primærbolig verdsettes til 25 % av
  omsetningsverdi for verdi opp til 20 mill. kroner. Partiet mener den
  nye modellen har gitt uforutsette og urimelige utslag for vanlige
  boligeiere i pressområder, og vil i tillegg øke bunnfradraget i
  formuesskatten. Stemte for eget forslag (votering 27360, 14 for/88
  mot) og for forslag 1 (FrP+H+V, votering 27362).
verbatim_excerpt: >
  «Stortinget ber regjeringen i forbindelse med revidert
  nasjonalbudsjett for 2026 legge til rette for at primærbolig i
  formuesskatten verdsettes til 25 prosent av omsetningsverdi for
  verdi opp til 20 mill. kroner, med virkning fra og med 2026.» [...]
  «Formuesskatten bør deretter avskaffes i sin helhet.»
