claim_action: >
  Venstre fremmet forslag 6: legge den samme modellen for
  formuesverdi på bolig i 2026 til grunn som gjaldt i 2025, og be
  regjeringen legge frem en ny, utredet modell fra 2027. Partiet
  kaller regjeringens varslede heving av innslagspunktet (10 til 14
  mill.) "et skritt i riktig retning". Stemte for eget forslag
  (votering 27359, 2 for/100 mot) og for forslag 1 (votering 27362).
verbatim_excerpt: >
