context_note: >
  Kodet 0 (nøytral/delt), ikke -1/-2: Aps egen tekst er en utsatt/
  prosedyremessig posisjon (vil behandle substansen senere, via
  regjeringens egen, mindre justering), ikke en substansiell
  avvisning av at boligen bør telle mindre. Regjeringens egen varslede
  heving (10 til 14 mill.) peker faktisk i SAMME retning som utsagnet
  (mindre vekt for høyt verdsatte boliger), bare via en annen og mer
  forsiktig kanal enn mindretallsforslagene. Bekreftet [OK] i votes.py:
