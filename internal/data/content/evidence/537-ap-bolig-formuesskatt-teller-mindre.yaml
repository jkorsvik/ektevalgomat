scan_summary: "Ap er del av komiteflertallet som viser til regjeringens egen, varslede justering av innslagspunktet og velger å behandle realiteten når revidert nasjonalbudsjett kommer, i stedet for å støtte mindretallsforslagene nå."
claim_action: >
  Ap er del av "Komiteens flertall" (med SV, Sp, MDG, Rødt) som viser
  til at finansministeren har lagt fram forslag om å heve
  innslagspunktet for høy verdsetting av primærbolig fra 10 til 14
  mill. kroner, og at dette vil bli behandlet i forbindelse med
  revidert nasjonalbudsjett. Stemte mot alle fire mindretallsforslag
  (voteringene 27359-27362).
verbatim_excerpt: >
  «Disse medlemmer viser til at dette vil bli behandlet i forbindelse
  med revidert nasjonalbudsjett. Disse medlemmer vil derfor behandle
  realitetene i forslaget i forbindelse med Stortingets behandling av
  revidert nasjonalbudsjett.»
