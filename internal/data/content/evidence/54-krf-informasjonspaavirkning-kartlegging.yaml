claim_confidence: dokumentert
context_note: >
  Kodet -1, ikke -2: signalet er stemmesporet alene, ikke en egen
  begrunnet merknad — samme svakere-signal-konvensjon som brukt for
  MDG/V/KrF på utsagn-03 og KrF på utsagn-07. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra +1 til -1 fordi
  KrF stemte FOR det avviste kartleggingsforslaget, det motsatte av å
  mene dagens innsats er god nok. KrF har ingen egen tekst i
  innstillingen (verken merknad eller komitemedlemskap — KrF sitter ikke
  i justiskomiteen); source_url er derfor voteringsdetaljer-siden, som
  gjengir selve forslagsteksten KrF stemte over, ikke en KrF-uttalelse.
