scan_summary: "MDG mener verken mindretallsforslagene eller regjeringens justerte modell løser de grunnleggende skjevhetene i boligbeskatningen, og vil ha en helhetlig gjennomgang i stedet."
claim_action: >
  MDG er del av "Komiteens flertall" (samme delte merknad som Ap, se
  Aps evidensfil), men har i tillegg en egen, separat merknad: verken
  mindretallsforslagene eller regjeringens justerte verdsettingsmodell
  løser de grunnleggende skjevhetene i boligbeskatningen, og
  utfordringene bør løses gjennom en helhetlig gjennomgang av bolig-
  og formuesskatten. Stemte mot alle fire mindretallsforslag
  (voteringene 27359-27362).
verbatim_excerpt: >
  «hverken representantforslagene eller regjeringens justerte
  verdsettingsmodell løser de grunnleggende skjevhetene i
  boligbeskatningen.» [...] «Disse utfordringene må løses gjennom en
  helhetlig gjennomgang av bolig- og formuesskatten, ikke gjennom
  enkeltstående justeringer»
