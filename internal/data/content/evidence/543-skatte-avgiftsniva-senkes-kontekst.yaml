context_note: >
  Sju av ni partier har en eksplisitt, ordrett setning om det samlede
  nivået (tre for å senke, tre for å holde det uendret, én for å øke
  det). To partier
  (Sp, MDG) har bare målrettede skatteendringer uten en klar
  helhetspåstand, og er utelatt for å unngå å overtolke en
  omfordelingssetning som en totalnivå-posisjon.
