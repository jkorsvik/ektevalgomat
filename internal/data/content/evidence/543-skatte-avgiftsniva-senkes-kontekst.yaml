scan_summary: "Utsagnet spør om det SAMLEDE skatte- og avgiftsnivået (ikke enkeltskatter) bør senkes, selv om det krever strengere prioritering av statens utgifter."
claim_action: >
  Kontekstfil for utsagn-55. Kildene under er de ni partienes egne
  program for 2025-2029 (tier C). Kun setninger som eksplisitt gjelder
  det SAMLEDE/TOTALE skatte- og avgiftsnivået er brukt — en setning om
  å redusere skatt for én bestemt gruppe (f.eks. lavtlønte) er ikke i
  seg selv et svar på om det TOTALE nivået skal ned, siden det kan
  finansieres ved å øke andre skatter. Sp og MDG har slike målrettede,
  men ikke totalnivå-spesifikke, setninger og er derfor "Ikke vurdert"
  her. Rødt: programmet (lastet ned i nettleser 28.09.2026) har en
  eksplisitt setning om at mer skal finansieres i fellesskap via
  skatter og avgifter (fil 603).
