scan_summary: "Innst. 58 S behandlet et representantforslag om å stanse EUs nye klimakvotesystem (ETS2), som gir en EU-styrt CO2-pris på blant annet drivstoff og bygg. Forslaget om å stanse det ble ikke vedtatt."
claim_action: >
  Innst. 58 S (2025–2026), sak 104877, energi- og miljøkomiteen,
  behandlet Dokument 8:8 S om å stanse innføringen av ny EU-avgift på
  drivstoff i Norge (EUs klimakvotesystem ETS2, som gjelder utslipp
  fra veitransport, bygg og andre sektorer fra 2028). Sp fremmet
  forslag 2 om å stanse den nasjonale gjennomføringen; FrP fremmet
  forslag 1 om å fjerne CO2-avgiften på de samme områdene i stedet.
  Begge falt. Komiteens tilråding — å IKKE vedta representantforslaget
  om å stanse ETS2 — ble vedtatt 9. desember 2025 (votering 26747:
  109 for, 57 mot).
