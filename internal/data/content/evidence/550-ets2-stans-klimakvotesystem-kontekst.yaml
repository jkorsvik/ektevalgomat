claim_confidence: dokumentert
context_note: >
  Utsagnet er formulert som Sps eget forslag 2 ("stanse den nasjonale
  gjennomføringen av EUs nye klimakvotesystem (ETS2)"), som er det
  bredeste og mest direkte forslaget i saken. FrPs forslag 1 er et
  beslektet, men snevrere virkemiddel (fjerne CO2-avgiften på de
  samme områdene i stedet for å stanse hele gjennomføringen) — FrP
  skriver selv at de subsidiært støtter Sps forslag, og stemte for det
  (votering 26746, 46 av 47 for). Alle tre voteringer bekreftet [OK] i
  votes.py mot data.stortinget.nos egne totaler; merk at
  stemmetallene i denne saken er vesentlig høyere enn i
  dimensjon-11-sakene (rundt 166 avgitte stemmer mot rundt 99-102) —
  et reelt utslag av høyere fremmøte i denne saken, ikke en feil.
