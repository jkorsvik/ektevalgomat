scan_summary: "Sp fremmet selv forslaget om å stanse den nasjonale gjennomføringen av ETS2, med FrP som eneste subsidiære støttespiller."
claim_action: >
  Sp fremmet forslag 2 i Innst. 58 S: stanse den nasjonale
  gjennomføringen av EUs nye klimakvotesystem (ETS2). Sammen med FrP
  viser Sp til at avgiftsnivået på bilister og transportsektoren
  allerede er for høyt, og at en samtidig nasjonal CO2-avgift og
  kvoteplikt under ETS2 er dobbel virkemiddelbruk som øker
  kostnadsbyrden uten global utslippseffekt. Stemte for eget forslag
  (votering 26746, 55 for/110 mot) og mot komiteens tilråding
  (votering 26747, som innebar å IKKE stanse ETS2).
verbatim_excerpt: >
  «Stortinget ber regjeringen stanse den nasjonale gjennomføringen av
  EUs nye klimakvotesystem (ETS2).» [...] «Disse medlemmer vil videre
  påpeke at en samtidig anvendelse av en nasjonal CO₂-avgift og
  kvoteplikt under EUs kvotesystem innebærer dobbel virkemiddelbruk.»
