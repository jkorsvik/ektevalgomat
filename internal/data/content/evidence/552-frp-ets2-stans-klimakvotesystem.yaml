scan_summary: "FrP fremmet et eget, snevrere forslag (fjerne CO2-avgiften i ETS2-området) men skriver eksplisitt at partiet subsidiært støtter Sps forslag om å stanse hele gjennomføringen."
claim_action: >
  FrP fremmet forslag 1: fjerne CO2-avgiften på de områder som dekkes
  av ETS2 fra samme dato som det innføres. Partiet skriver eksplisitt
  at det subsidiært støtter Senterpartiets forslag om å stanse den
  nasjonale gjennomføringen av ETS2, og stemte for det (votering
  26746, 46 av 47 for) i tillegg til eget forslag (votering 26745, 47
  for/119 mot).
verbatim_excerpt: >
  «Disse medlemmer vil subsidiært støtte Senterpartiets forslag om å
  stanse den nasjonale gjennomføringen av ETS2.»
status: forslag_avvist_stemte_for
position: 2
source_tier: A
source_name: "Innst. 58 S (2025–2026), forslag 1 og 2; voteringene 26745-26746 (09.12.2025)"
