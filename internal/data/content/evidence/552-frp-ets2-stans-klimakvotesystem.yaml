claim_confidence: dokumentert
context_note: >
  Kodet +2: FrPs primære forslag er snevrere (fjerne CO2-avgiften
  spesifikt, ikke stanse hele ETS2-gjennomføringen), men partiets egen
  tekst uttrykker eksplisitt, ordrett støtte til nettopp det forslaget
  utsagnet bygger på (Sps forslag 2), bekreftet av stemmegivningen (46
  av 47 for). Bekreftet [OK] i votes.py.
