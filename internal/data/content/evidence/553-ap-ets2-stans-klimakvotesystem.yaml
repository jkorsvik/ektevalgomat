scan_summary: "Ap viser til at ETS2 allerede er innført i norsk rett, og vil bruke unntak og kompensasjonsordninger for å dempe konsekvensene i stedet for å stanse gjennomføringen."
claim_action: >
  Ap viser til at EUs forsterkede klimakvotedirektiv ble innlemmet i
  EØS-avtalen i 2023 og gjennomført i norsk rett før sommeren 2025.
  Partiet vil bruke midlertidige unntak og kompensasjon gjennom andre
  avgifter for å unngå plutselige prisøkninger, i stedet for å stanse
  ETS2. Stemte for komiteens tilråding (votering 26747, som innebar å
  IKKE stanse gjennomføringen).
verbatim_excerpt: >
  «Derfor ønsker disse medlemmer å understreke at Norge kan søke om
  midlertidig unntak, og kan kompensere gjennom andre avgifter eller
  andre ordninger om det skulle bli nødvendig.»
