scan_summary: "Høyre understreker EØS-avtalens betydning og at gjennomføring av ETS2 sikrer at norske bedrifter konkurrerer på like vilkår med EU — vil ikke stanse gjennomføringen."
claim_action: >
  Høyre, sammen med MDG og Venstre, understreker EØS-avtalens
  avgjørende betydning for norsk økonomi og næringsliv, og at det å
  følge opp EUs klimakvotesystem sikrer at norske bedrifter
  konkurrerer på like vilkår med selskaper i EU. Høyre og Venstre
  viser i tillegg til at de allerede stemte for å gjennomføre ETS2 i
  Innst. 527 L (2024–2025) og ikke har endret mening. Stemte for
  komiteens tilråding (votering 26747).
verbatim_excerpt: >
  «Komiteens medlemmer fra Høyre, Miljøpartiet De Grønne og Venstre
  understreker igjen EØS-avtalens avgjørende betydning for norsk
  økonomi og næringsliv [...] Å følge opp gjennomføring av EUs
  klimakvotesystem, herunder det nye ETS2-regelverket, sikrer at
  norske bedrifter konkurrerer på like vilkår med selskaper i EU.»
