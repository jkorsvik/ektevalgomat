scan_summary: "MDG er del av samme merknad som Høyre og Venstre om EØS-avtalens betydning og vil ikke stanse gjennomføringen av ETS2."
claim_action: >
  MDG er medforfatter (med Høyre og Venstre) av merknaden om EØS-
  avtalens betydning og at gjennomføring av ETS2 sikrer like
  konkurransevilkår for norske bedrifter (se Høyres evidensfil for
  full tekst). Stemte for komiteens tilråding (votering 26747).
verbatim_excerpt: >
  «Komiteens medlemmer fra Høyre, Miljøpartiet De Grønne og Venstre
  understreker igjen EØS-avtalens avgjørende betydning for norsk
  økonomi og næringsliv [...] Å følge opp gjennomføring av EUs
  klimakvotesystem, herunder det nye ETS2-regelverket, sikrer at
  norske bedrifter konkurrerer på like vilkår med selskaper i EU.»
