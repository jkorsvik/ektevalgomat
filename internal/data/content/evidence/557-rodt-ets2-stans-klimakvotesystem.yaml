scan_summary: "Rødt er kritisk til at ETS2 svekker nasjonal demokratisk kontroll, men ba ikke om å stanse gjennomføringen nå og stemte for komiteens tilråding."
claim_action: >
  Rødt peker på at ETS2 innebærer en betydelig overføring av kontroll
  fra Stortinget til EU og erstatter politisk styring med
  markedsbaserte mekanismer, noe partiet mener svekker nasjonal
  demokratisk kontroll. Rødt fremmet likevel ikke noe eget forslag om
  å stanse gjennomføringen, og viser i stedet til at EUs utsettelse til
  2028 gir rom for en bredere politisk debatt "uten å rive opp
  klimakvotedirektivet". Stemte for komiteens tilråding (votering
  26747, som innebar å IKKE stanse ETS2).
verbatim_excerpt: >
  «erstatter direkte politisk styring med markedsbaserte mekanismer.
  Dette svekker nasjonal demokratisk kontroll» [...] «Utsettelsen gir
  Stortinget mulighet til en bredere politisk diskusjon og vurdering
  av hvordan Norge kan sikre demokratisk kontroll og sosial
  rettferdighet, uten å rive opp klimakvotedirektivet.»
