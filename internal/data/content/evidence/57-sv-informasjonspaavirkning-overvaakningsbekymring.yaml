scan_summary: >
  SV deler bekymringen for utenlandsk valgpåvirkning, men stemte mot
  forslag 6 om kartlegging fordi SV mener nettopp dette forslaget (i
  dokumentets opprinnelige nummerering forslag 7) kan gi overvåkning av
  legitim norsk valgdeltakelse — en substansiell, begrunnet innvending
  mot denne konkrete mekanismen, ikke mot målet om å avdekke utenlandsk
  påvirkning som sådan.
claim_action: >
  Votering_id 20371 (Forslag nr. 6 på vegne av H og V): SV 8 mot, 0 for
  (5 ikke til stede) — kryssjekket mot
  data.stortinget.no/eksport/voteringsresultat. Forslaget falt i plenum.
verbatim_excerpt: >
  Komiteens medlem fra Sosialistisk Venstreparti deler forslagsstillernes
  bekymring rundt informasjons- og valgpåvirkning. Frie valg er
  grunnsteinen i demokratiet. At det finnes tillit i samfunnet til at
  valg gjennomføres uten påvirkning utenfra, er viktig. Dette medlem er
  likevel bekymret for at forslag nummer syv vil kunne føre til
  overvåkning av også nasjonal valgdeltakelse, og at forslaget da vil ha
  uheldige konsekvenser med overvåkning av frie valg.
status: forslag_avvist_av_flertallet
position: 1
source_tier: A
source_name: "Innst. 231 S (2022–2023); votering_id 20371"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2022-2023/inns-202223-231s/?all=true"
claim_confidence: dokumentert
context_note: >
  Kodet +1, ikke +2: SV har en reell, begrunnet egen merknad (ikke bare
  stemmespor) om at den avviste kartleggingsmekanismen kunne gitt
  overvåkning av legitim norsk valgdeltakelse — en innvending mot DENNE
  spesifikke mekanismen, som gjør SV forsiktig enig i at man ikke trenger
  akkurat det nye kartleggingsoppdraget, uten selv å hevde at dagens
  innsats er god nok i alle henseender (SV sier eksplisitt at de "deler
  forslagsstillernes bekymring" om utenlandsk påvirkning). Derfor +1 ikke
  +2, samme "ikke slå sammen forskjellige styrkegrader"-disiplin som
  brukt for FrP på utsagn-07 og Ap/Sp under. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1.
retrieved_at: "2026-09-24"
