scan_summary: >
  FrP stemte mot forslag 6 (Høyre/Venstre) om kartlegging av utenlandsk
  informasjonspåvirkning mot valgene i 2023 og 2025. FrPs egen merknad i
  saken dekker andre punkter i representantforslaget (støtte til
  kriminalisering av samarbeid med fremmed etterretning) og adresserer
  ikke kartleggingsforslaget spesifikt.
claim_action: >
  Votering_id 20371 (Forslag nr. 6 fra Høyre, Venstre): FrP 13 mot, 0
  for (8 ikke til stede) — kryssjekket mot
  data.stortinget.no/eksport/voteringsresultat. Forslaget falt i plenum.
verbatim_excerpt: >
  Forslag nr. 6 fra Høyre, Venstre Stortinget ber regjeringen umiddelbart
  igangsette en kartlegging av uønsket informasjonspåvirkning fra
  utenlandske aktører i forbindelse med kommune- og fylkestingsvalget i
  2023 og stortingsvalget i 2025. Kartleggingen skal blant annet fange
  opp forsøk på påvirkning av nordmenns virkelighetsoppfatning, verdier
  og tillit over tid.
status: forslag_avvist_av_flertallet
