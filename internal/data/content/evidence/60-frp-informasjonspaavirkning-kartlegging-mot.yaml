source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Saker/Sak/Voteringsoversikt/votering-detaljer/?p=91706&dnid=1&vt=20371"
claim_confidence: dokumentert
context_note: >
  Kodet +1, ikke +2: signalet er stemmesporet alene — FrP stemte MOT det
  avviste kartleggingsforslaget, men har ingen egen begrunnelse
  spesifikt om hvorfor (partiets egen merknad i saken dekker et annet
  punkt). Et mot-forslaget-stemme uten egen begrunnelse er et svakere
  signal enn en skrevet merknad, derfor +1 ikke +2, samme svakere-signal-
  konvensjon som brukt for KrF/MDG/Rødt sine -1-koder over, i motsatt
  retning. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1. FrPs egen
  komitemerknad i innstillingen dekker et annet forslagspunkt
  (kriminalisering av samarbeid med fremmed etterretningstjeneste), ikke
  kartleggingsforslaget — source_url er derfor voteringsdetaljer-siden,
  som gjengir selve forslagsteksten FrP stemte mot.
retrieved_at: "2026-09-24"

