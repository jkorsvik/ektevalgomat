consistency_flag: consistent
context_note: >
  Kodet -2: Rødt vil eksplisitt IKKE trappe ned eller fjerne
  formuesskatten — de vil gjøre den mer progressiv (høyere bunnfradrag,
  men høyere satser og et nytt, tredje trinn for de største formuene),
  det direkte motsatte av utsagnets premiss. Tier A (finanskomiteens
  innstilling, Rødts egen hovedmerknad om Rødts alternative
  statsbudsjett). Rødts arbeidsprogram 2025–2029 (s. 5, se fil 603)
  peker samme vei: «Øke skatten på store formuer i form av en
  formuesskatt med økt bunnfradrag og flere innslagspunkter med
  økende skattesats». consistency_flag=consistent: samme merknad inneholder også Rødts
  "øke skattene for de med høyest inntekt og formue"-formulering (se
  utsagn-53s Rødt-evidens), som peker samme vei.
