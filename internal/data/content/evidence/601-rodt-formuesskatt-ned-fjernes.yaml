id: ev-2026-innst2s-rodt-formuesskatt-ned-fjernes
statement_id: utsagn-52
party_id: rodt
actor: "Rødt (finanskomiteen)"
date: "2025-12 (budsjettinnstilling)"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: "Rødt vil gjøre formuesskatten mer progressiv, ikke trappe den ned — høyere bunnfradrag for vanlige folk, høyere satser og et nytt trinn for de største formuene."
claim_action: >
  Rødts hovedmerknad i Innst. 2 S (2025–2026, nasjonalbudsjettet 2026)
  sier eksplisitt at målet ikke er at flest mulig skal betale
  formuesskatt, og at Rødt derfor vil heve bunnfradraget — men samtidig
  øke satsene for de største formuene og innføre et nytt, høyere trinn.
verbatim_excerpt: >
  Det er ikke et mål i seg selv at flest mulig skal betale
  formuesskatt. For å vri formuesskatten mer mot toppen av
  formuespyramiden foreslår Rødt å øke bunnfradraget til 2,2 mill.
  kroner. [...] Til gjengjeld foreslår Rødt å øke skattesatsene for
  større formuer og å innføre en tredje sats rettet mot de med over
  100 mill. kroner i formue.
status: fremmet
