scan_summary: "Rødt vil kutte skattene for de under 800 000 kroner i inntekt, og til gjengjeld øke skattene for de med høyest inntekt og formue."
claim_action: >
  Rødts hovedmerknad i Innst. 2 S (2025–2026, nasjonalbudsjettet 2026)
  sier eksplisitt at Rødt vil kutte skatten for de med under 800 000
  kroner i årsinntekt, og til gjengjeld øke skattene for de med høyest
  inntekt og formue.
verbatim_excerpt: >
  Til gjengjeld foreslår Rødt å øke skattene for de med høyest inntekt
  og formue og å skjerpe skatteleggingen av selskapsoverskudd og
  bankvirksomhet for å sikre finansiering av velferdstjenestene.
