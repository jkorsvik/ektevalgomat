context_note: >
  Kodet +2: eksplisitt, ordrett formulering direkte på utsagnets
  premiss — høy inntekt OG stor formue skal betale mer, finansiert ved
  at de under 800 000 kroner i inntekt betaler mindre. Tier A
  (finanskomiteens innstilling, Rødts egen hovedmerknad). Rødts
  arbeidsprogram 2025–2029 (s. 5, se fil 603) peker samme vei: «Ha en
  mer progressiv inntektsskatt, med økt skatt på høye inntekter» og
  «Øke skatten på store formuer». consistency_flag=consistent:
  samme merknad inneholder også Rødts mer detaljerte forslag om en mer
  progressiv formuesskatt (se utsagn-52s Rødt-evidens), som peker
  samme vei.
