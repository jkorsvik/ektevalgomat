scan_summary: "Rødt vil at mer av det som er viktig i livene våre skal finansieres i fellesskap, betalt blant annet via skatter og avgifter: en eksplisitt avvisning av et lavere samlet nivå."
claim_action: >
  Rødts arbeidsprogram 2025–2029 åpner kapitlet «Skatter og avgifter»
  (s. 5) med at Rødt ønsker et større fellesskap, der mer finansieres i
  fellesskap via skatter og avgifter. Tiltakslisten øker skatten på
  selskapsoverskudd, aksjeutbytte, store formuer og arv, og kutter
  skatten bare for dem som tjener minst.
verbatim_excerpt: >
  Rødt ønsker et større, sterkere og bedre fellesskap. Det innebærer at
  mer av det som er viktig i livene våre, finansieres i fellesskap i
  stedet for direkte fra vår private konto. Det gjør ikke at ting blir
  gratis, men at vi betaler på en annen måte, via blant annet skatter og
  avgifter.
