context_note: >
  Kodet -2: en ordrett setning om det samlede nivået, ikke om én gruppe.
  «Mer» skal finansieres i fellesskap via skatter og avgifter, altså et
  høyere samlet nivå, det motsatte av utsagnet. Sterkere enn SVs
  «fortsatt»-setning (fil 549), som også er kodet -2. Programmet vil
  også «kutte skattene for de som tjener minst» og «redusere avgifter
  og offentlige gebyrer», men det er omfordeling innenfor et høyere
  totalnivå, ikke en senking av nivået, samme regel som kontekstfil 543
  bruker for Sp og MDG. Tier C (partiets eget program). roedt.no svarer
  automatiserte forespørsler med en Vercel-bot-sjekk (HTTP 429);
  PDF-en er lastet ned i nettleser 2026-09-28 fra denne adressen
  (lenket fra roedt.no/arbeidsprogram), 106 sider, laget 2025-09-02,
