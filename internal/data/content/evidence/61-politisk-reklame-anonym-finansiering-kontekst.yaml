scan_summary: >
  Under trontaledebatten 2025-10-14 fremmet Rødt (Marie Sneve Martinussen)
  et løst forslag om å regulere anonym finansiering av politisk reklame og
  markedsføring som del av den kommende gjennomgangen av partiloven.
  Forslaget (votering_id 26361) ble vedtatt 54 mot 46.
claim_action: >
  Forslag nr. 5 fra Marie Sneve Martinussen på vegne av Rødt: "Stortinget
  ber regjeringen inkludere regulering av anonym finansiering av politisk
  reklame og markedsføring i den helhetlige gjennomgangen av partiloven,
  og komme tilbake til Stortinget med forslag som følger opp dette."
  Votering_id 26361, 2025-10-14: 54 for (Ap 32, MDG 5, Rødt 5, SV 5,
  Sp 5, V 2), 46 mot (FrP 28, H 14, KrF 4) — kryssjekket per parti mot
  data.stortinget.no/eksport/voteringsresultat. Vedtatt.
