context_note: >
  Faktakontekst uten partiposisjon (position: 0, ingen party_id) — se de
  ni egne partifilene (62-70) for hvert partis stemme og eventuell egen
  begrunnelse. Presisjonsnyanse mot utsagn-02s ordlyd: utsagn-02 har to
  ledd forbundet med "og" — (1) selve reklamen bør VISE hvem som har
  betalt (en EU DSA/TTPA-lignende merkingskrav på annonsen selv) og (2)
  pengenes opprinnelse bør være offentlig kjent. Dette forslaget adresserer
  utelukkende ledd (2): det ber om regulering av ANONYM FINANSIERING
  gjennom partiloven, ikke et krav om merking på selve annonsen. Tett nok
  til å kode partiposisjoner på ledd (2) — i motsetning til Innst. 275 L
  (2024–2025), som gjaldt generell kandidatstøtte/naturalytelse-rapportering
  og ikke spesifikt "politisk reklame og markedsføring" som dette
  forslagets egen ordlyd nevner — men ikke et fullt tekstlig treff på hele
  utsagnet. Samme "ikke tvinge et snevrere treff til å bety hele
  påstanden"-disiplin som brukt for utsagn-04s "sosiale medier"-nyanse.
