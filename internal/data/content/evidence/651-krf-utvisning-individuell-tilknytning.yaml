scan_summary: "KrF stemte mot FrPs forslag om å fjerne tilknytning som vilkår ved utvisning; partiet har ikke sete i komiteen og ingen egen merknad."
claim_action: >
  KrF har ikke sete i kommunal- og forvaltningskomiteen for denne saken
  og har derfor ingen egen merknad. Stemte mot forslag nr. 2 (votering
  27441), som ville utvist «uavhengig av tilknytning til landet». KrF
  stemte for forslag nr. 3 (H/Sp, votering 27440), men uten egen tekst
  som forklarer hvorfor.
verbatim_excerpt: >
  «Stortinget ber regjeringen ta initiativ til et samarbeid med Danmark
  om en utvisningsreform som sikrer at innvandrere som begår alvorlig
  kriminalitet i Norge, skal utvises, uavhengig av tilknytning til
  landet, herunder også asylsøkere og flyktninger.»
status: forslag_avvist_stemte_mot
position: 1
source_tier: A
source_name: "Innst. 205 S (2025–2026), forslag 2; votering 27441 (14.04.2026)"
