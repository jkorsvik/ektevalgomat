scan_summary: "Rødt stemte mot FrPs forslag om å fjerne tilknytning som vilkår ved utvisning, uten egen merknad om nettopp dette forslaget."
claim_action: >
  Rødt er medlem av komiteen (del av komiteens flertall som beskriver
  dagens regelverk generelt), men har ingen egen tekst som tar stilling
  til nettopp forslag 2s «uavhengig av tilknytning»-formulering. Stemte
  mot forslag nr. 2 (votering 27441).
verbatim_excerpt: >
  «Stortinget ber regjeringen ta initiativ til et samarbeid med Danmark
  om en utvisningsreform som sikrer at innvandrere som begår alvorlig
  kriminalitet i Norge, skal utvises, uavhengig av tilknytning til
  landet, herunder også asylsøkere og flyktninger.»
