scan_summary: "Venstre stemte mot FrPs forslag om å fjerne tilknytning som vilkår ved utvisning; partiet har ikke sete i komiteen og ingen egen merknad."
claim_action: >
  Venstre har ikke sete i kommunal- og forvaltningskomiteen for denne
  saken og har derfor ingen egen merknad. Stemte mot forslag nr. 2
  (votering 27441), som ville utvist «uavhengig av tilknytning til
  landet».
verbatim_excerpt: >
  «Stortinget ber regjeringen ta initiativ til et samarbeid med Danmark
  om en utvisningsreform som sikrer at innvandrere som begår alvorlig
  kriminalitet i Norge, skal utvises, uavhengig av tilknytning til
  landet, herunder også asylsøkere og flyktninger.»
