scan_summary: "Venstre stemte mot FrP/Høyres forslag om ubegrenset varighet på lukket institusjonsopphold; ikke medlem av justiskomiteen, ingen egen merknad."
claim_action: >
  Venstre har ikke sete i justiskomiteen for denne saken og har derfor
  ingen egen merknad. Stemte mot forslag nr. 1 (votering 27111), som
  ville gitt hjemmel til å holde ungdom i lukket institusjon «så lenge
  det er behov for det».
verbatim_excerpt: >
  «Stortinget ber regjeringen legge frem lovforslag som gir mulighet
  til å holde ungdom med kriminell adferd i lukkede institusjoner så
  lenge det er behov for det.»
