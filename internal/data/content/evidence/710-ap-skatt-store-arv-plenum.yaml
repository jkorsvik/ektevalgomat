scan_summary: >
  Finansminister Vedum (Sp) sa i Stortinget at også Ap har sagt nei til
  å gjeninnføre arveskatt. Dette er ikke Aps egne ord, så Aps posisjon
  er ikke kodet.
claim_action: >
  Samme innlegg som fil 709. Vedum var finansminister i regjeringen
  Støre (Ap og Sp) og omtaler Arbeiderpartiets standpunkt. Aps egne
  talere i samme debatt nevnte ikke arv.
verbatim_excerpt: >
  Blant annet er det et forslag om å gjeninnføre arveskatt.
  Senterpartiet og Arbeiderpartiet har sagt at det ønsker vi ikke å
  gjøre.
