scan_summary: >
  Venstre mener, sammen med H og FrP, at arv ikke skal skattlegges ved
  overføringen, bare når arvingen selger.
claim_action: >
  Fellesmerknad fra H, FrP, V og KrF i Innst. 410 S (2023–2024) til SVs
  forslag om å utrede skatt på gevinster ved arv og gave. De viser til
  at arveavgiften ble fjernet i 2014.
verbatim_excerpt: >
  Disse medlemmer mener det er riktig å videreføre dette prinsippet og
  at skattlegging skjer ved endelig realisasjon.
