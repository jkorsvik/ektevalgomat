claim_confidence: dokumentert
context_note: >
  Kodet -1, ikke -2: merknaden handler om skatt på gevinst ved arv, ikke
  om en arveavgift. Den sier likevel at arv ikke skal skattlegges ved
  overføringen. «Disse medlemmer» er «Komiteens medlemmer fra Høyre,
  Fremskrittspartiet, Venstre og Kristelig Folkeparti» i samme avsnitt.
  Venstres program 2025–2029 nevner ikke arveavgift. Forrige
  stortingsperiode.
