context_note: >
  Kodet +1: FrP gikk imot innstrammingen, men begrunner det med
  manglende utredning, ikke med et krav om mildere regler. FrPs program
  2025–2029 nevner bare 3-årsregelen for skattemessig utflytting, som er
  en annen regel. Ingen navngitt votering om denne endringen. Forrige
  periode.
