scan_summary: >
  FrP gikk imot innstrammingen av utflytterskatten i 2022 og kalte den
  en forhastet symbolhandling.
claim_action: >
  Egen merknad i Innst. 4 L (2022–2023) til innstrammingen fra
  budsjettforliket mellom Ap, Sp og SV.
verbatim_excerpt: >
  Disse medlemmer viser til at denne foreslåtte endringen i skatteloven
  skjer uten betryggende utredning og høring og således fremstår som en
  forhastet symbolhandling på ideologisk grunnlag. Disse medlemmer kan
  ikke støtte endring av loven på et så ufullstendig grunnlag.
