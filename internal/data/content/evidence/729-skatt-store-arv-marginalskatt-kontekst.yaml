scan_summary: >
  Ved høyeste sats i 2026 er skatten på lønn 53,9 prosent medregnet
  arbeidsgiveravgift, og på utbytte 51,5 prosent medregnet
  selskapsskatt.
claim_action: >
  Skatteetatens tabell over høyeste effektive marginalskatt,
  inntektsåret 2026. Lønnssatsen er målt per krone av samlet
  lønnskostnad, med 14,1 prosent arbeidsgiveravgift. Utbyttesatsen tar
  med 22 prosent selskapsskatt og oppjusteringsfaktoren 1,72. Moms (25
  prosent, 15 prosent på mat) kommer i tillegg når pengene brukes,
  uansett om de kommer fra lønn eller utbytte.
