scan_summary: >
  Komiteens tilråding om løpende kartlegging og rapport til Stortinget
  falt 47 mot 54.
claim_action: >
  Tilrådingen ble skrevet i komiteen til Dokument 8:119 S (2025–2026),
  SVs forslag om digital suverenitet, og sto ikke i det opprinnelige
  forslaget. Den ble fremmet av FrP, H og SV. Tilrådingen i Innst. 225 S
  (2025–2026) falt i votering 27496 den 7. mai 2026, 47 mot 54. For: FrP
  28, H 13, KrF 4, V 2. Mot: Ap 32, SV 5, Sp 5, R 5, MDG 5, FrP 1, H 1.
verbatim_excerpt: >
  Stortinget ber regjeringen ta initiativ til å kontinuerlig kartlegge
  Norges digitale avhengigheter til andre land og jurisdiksjoner som
  tiltak for å sikre tilstrekkelig nasjonal kontroll med den digitale
  grunnmuren som understøtter kritiske samfunnsfunksjoner. Den første
  rapporten leveres til Stortinget innen utgangen av 2026.
