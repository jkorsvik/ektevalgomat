verbatim_excerpt: >
  Forslagsstillerne mener regjeringen som del av en stortingsmelding om
  utvikling av datasenterindustrien i Norge bør kartlegge Norges
  digitale avhengigheter til andre land og jurisdiksjoner, og foreslå
  tiltak som bidrar til forsterket nasjonal kontroll med den digitale
  grunnmuren som understøtter kritiske samfunnsfunksjoner.
