scan_summary: >
  SV var med på forslaget om kartlegging og rapport i komiteen.
claim_action: >
  Flertallsforslag fra FrP, H og SV i Innst. 225 S, senere komiteens
  tilråding. Forslaget kom fra Høyre, ikke fra SVs eget
  representantforslag. Votering 27496: SV 5 mot, 0 for.
verbatim_excerpt: >
  Stortinget ber regjeringen ta initiativ til å kontinuerlig kartlegge
  Norges digitale avhengigheter til andre land og jurisdiksjoner som
  tiltak for å sikre tilstrekkelig nasjonal kontroll med den digitale
  grunnmuren som understøtter kritiske samfunnsfunksjoner. Den første
  rapporten leveres til Stortinget innen utgangen av 2026.
status: forslag_avvist_stemte_mot
position: -1
source_tier: A
source_name: "Innst. 225 S (2025–2026), flertallsforslag FrP/H/SV; votering 27496"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2025-2026/inns-202526-225s/?all=true"
claim_confidence: dokumentert
context_note: >
  Kodet -1. Raden var først kodet +1 fordi SV hadde navnet sitt på
  flertallsforslaget i Innst. 225 S. Det holder ikke: forslaget var Høyres,
  SV stemte 5 mot og 0 for på votering 27496, og
  tools/autopilot/method/position-scale.md sier uttrykkelig at et
  medforslagsstillerskap ikke er et eget instrument. Retningen kommer fra
  voteringen, som er handlingen. Raden er dermed enig med fil 737 (-1) i
  stedet for å motsi den på samme votering. Ingrid Fiskaa (SV) sa til
  Altinget at forslaget ikke var viktig for partiet (fil 738).
