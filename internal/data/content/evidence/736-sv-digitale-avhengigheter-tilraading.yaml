  Flertallsforslag fra FrP, H og SV i Innst. 225 S, senere komiteens
  tilråding. Forslaget kom fra Høyre, ikke fra SVs eget
  representantforslag. Votering 27496: SV 5 mot, 0 for.
verbatim_excerpt: >
  Stortinget ber regjeringen ta initiativ til å kontinuerlig kartlegge
  Norges digitale avhengigheter til andre land og jurisdiksjoner som
  tiltak for å sikre tilstrekkelig nasjonal kontroll med den digitale
  grunnmuren som understøtter kritiske samfunnsfunksjoner. Den første
  rapporten leveres til Stortinget innen utgangen av 2026.
