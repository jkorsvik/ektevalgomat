id: ev-2027-bredband-avviklet
statement_id: utsagn-61
party_id: ""
actor: "Regjeringen (Prop. 1 S 2026–2027, Digitaliserings- og forvaltningsdepartementet)"
date: "2026-10-07"
evidence_type: budsjettforslag
evidence_class: fakta
scan_summary: >
  Regjeringen foreslår å avvikle bredbåndsstøtteordningen (kap. 1541, post 60
  Breibandutbygging) fra 2027. Posten finnes i 2026-budsjettet, men er borte fra
  2027-forslaget. Begrunnelsen er at 99,3 pst. av husstandene og 98,9 pst. av
  virksomhetene hadde tilbud om minst 100 Mbit/s ved utgangen av 2025, og at
  resten dekkes av kommersiell utbygging, allerede bevilgede midler,
  lavbanesatellitt og ordningen for funksjonell internettilgang.
claim_action: >
  Staten avvikler bredbåndsstøtteordningen fra 2027 og flytter midlene mot
  sikkerhet og beredskap i ekomnettene, i stedet for å videreføre støtten til
  de siste husstandene og virksomhetene.
verbatim_excerpt: >
  Dekningsgraden for breiband i Noreg er svært god. Dei siste offisielle
  dekningstala frå Nasjonal kommunikasjonsmyndigheit viser at 99,3 pst. av
  husstandane og 98,9 pst. av verksemdene hadde tilbod om høghastigheits
  breiband med minst 100 Mbit/s nedlastingshastigheit ved utgangen av 2025.
  [...]
  På denne bakgrunn blir det foreslått å avvikle breibandstøtteordninga frå
  2027.
status: foreslått
position: null
