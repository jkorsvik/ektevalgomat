claim_confidence: dokumentert
context_note: >
  Regjeringens eget forslag i budsjettet for 2027. Utsagn-61 spør om staten bør
  videreføre bredbåndsstøtten til hele landet har høyhastighetsbredbånd, framfor
  å avvikle den fordi dekningen er nesten full. Dette beviset er
  avviklingssiden av svaret: regjeringen foreslår å avvikle ordningen fra 2027.
  Post 60 Breibandutbygging finnes i 2026-budsjettet, men har ingen post i
  2027-forslaget (bekreftet mot Gul bok-indeksen for 2027, der kap. 1541 ikke
  lenger har post 60). Institusjonelt bevis, ikke en partiposisjon — regjeringen
  er Ap-ledet.
