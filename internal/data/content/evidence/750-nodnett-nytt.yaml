scan_summary: >
  Digitaliserings- og forvaltningsdepartementet foreslår 324,5 mill. kroner på
  kap. 1543, post 22 Nytt nødnett for 2027 (opp fra 100 mill. kroner i 2026,
  +224,5 mill.). Prosjektet for nytt nødnett ble flyttet fra Justis- og
  beredskapsdepartementet til Digitaliserings- og forvaltningsdepartementet
  høsten 2025, og skal bygges på 5G og skivedeling.
claim_action: >
  Staten bevilger 324,5 mill. kroner på kap. 1543, post 22 til prosjektet nytt
  nødnett i 2027, og holder dermed utbyggingen av et nytt nødnett på
  statsbudsjettet. Ansvaret for prosjektet ligger nå i Digitaliserings- og
  forvaltningsdepartementet (flyttet fra Justis- og beredskapsdepartementet
  høsten 2025), og løsningen skal bygges på 5G-teknologi og skivedeling.
verbatim_excerpt: >
  Digitaliserings- og forvaltningsdepartementet tok hausten 2025 over ansvaret
  for prosjektet for nytt nødnett. Det vidare arbeidet med å utgreie nytt
  nødnett skal baserast på den til ei kvar tid best tilgjengelege og oppdaterte
  teknologien, med nødvendig sikkerheit, per no 5G-teknologi og skivedeling.
  [...]
