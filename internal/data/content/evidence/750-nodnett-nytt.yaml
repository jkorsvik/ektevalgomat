context_note: >
  Regjeringens eget forslag i budsjettet for 2027. Utsagn-60 spør om staten
  skal fullfinansiere nytt nødnett slik at kommunale og frivillige aktører ikke
  må bære kostnaden. Dette beviset viser at staten selv bygger og finansierer
  nytt nødnett (kap. 1543, post 22: 324,5 mill. kroner i 2027). Institusjonelt
  bevis, ikke en partiposisjon i seg selv — regjeringen er Ap-ledet. Den andre
  halvdelen (skjerming av kommunale og frivillige brukere mot økte
  brukerbetalinger på dagens nett, kap. 451) er eget bevis.
