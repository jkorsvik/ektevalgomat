context_note: >
  Regjeringens eget forslag i budsjettet for 2027. Utsagn-60 spør om staten
  skal fullfinansiere nytt nødnett slik at kommunale og frivillige aktører
  ikke må bære kostnaden. Dette er den ene halvdelen av svaret: staten
  foreslår å skjerme dem for økte brukerbetalinger på dagens nett. Den andre
  halvden (nytt nødnett, kap. 1543/22) er eget bevis. Institusjonelt bevis,
  ikke en partiposisjon i seg selv — regjeringen er Ap-ledet.
