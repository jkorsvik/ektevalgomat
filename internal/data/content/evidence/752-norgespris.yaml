scan_summary: >
  Energidepartementet foreslår 12 000 mill. kroner på kap. 1820, post 77
  «Noregspris for straum» for 2027 (opp fra 9 100 mill. kroner i 2026, +2 900
  mill.). Staten viderefører Norgespris som en valgfri støtteordning med fast
  referansepris (45 øre per kWh i 2027), ikke en lovbestemt makspris på strøm.
claim_action: >
  Staten viderefører og øker Norgespris som en valgfri støtteordning med fast
  referansepris, framfor å innføre en lovbestemt nasjonal makspris på strøm.
verbatim_excerpt: >
  Noregspris gir bustader og fritidsbustader høve til å velje ein fast og
  føreseieleg pris på straum.
  [...]
  til ein Noregspris på 45 øre per kWh eksklusive avgifter i 2027
  (referanseprisen), jf. boks 4.3.
status: foreslått
