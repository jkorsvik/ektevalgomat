claim_confidence: dokumentert
context_note: >
  Regjeringens eget forslag i budsjettet for 2027. Utsagn-12 spør om staten bør
  bruke støtte- eller referanseprisordninger, som Norgespris, framfor en
  lovbestemt nasjonal makspris på strøm. Retningen på utsagn-12 er +1: dette er
  enig-/støtteordning-siden av utsagnet (Norgespris videreføres og økes, ingen
  lovbestemt makspris innføres). Institusjonelt bevis, ikke en partiposisjon —
  regjeringen er Ap-ledet. Merk: proposisjonen skriv «Noregspris» (nynorsk),
  postnavnet i Gul bok er «Norgespris for strøm».
