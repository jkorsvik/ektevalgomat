scan_summary: >
  I forslaget til statsbudsjett for 2026 foreslo regjeringen å redusere
  bredbåndsstøtten (kap. 1541, post 60 Breibandutbygging) med om lag 370 mill.
  kroner, fra 415 mill. i 2025 til 34,1 mill. kroner i 2026, for å gjøre rom
  for sikkerhet og beredskap i elektronisk kommunikasjon. Dette er første steg
  i nedtrappingen som ble fullført med avviklingen i 2027-forslaget.
claim_action: >
  Staten foreslo å kutte bredbåndsstøtten til 34,1 mill. kroner for 2026,
  begrunnet i å prioritere sikkerhet og beredskap i ekomnettene.
verbatim_excerpt: >
  Det blir foreslått å redusere løyvinga med om lag 370 mill. kroner for å
  gjere rom for andre budsjettmessige prioriteringar, mellom anna forsterka
  satsing på sikkerheit og beredskap innanfor elektronisk kommunikasjon i lys
  av den sikkerheitspolitiske situasjonen. Det blir foreslått å løyve 34,1
  mill. kroner.
