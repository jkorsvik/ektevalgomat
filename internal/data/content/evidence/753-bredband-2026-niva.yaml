context_note: >
  Regjeringens eget forslag i budsjettet for 2026. Utsagn-61 spør om staten bør
  videreføre bredbåndsstøtten til hele landet har høyhastighetsbredbånd, framfor
  å avvikle den fordi dekningen er nesten full. Dette beviset viser at
  nedtrappingen startet allerede i 2026-forslaget (34,1 mill. kroner) og ble
  fullført med avviklingen i 2027-forslaget (eget bevis). Post 60 i 2026: det
  opprinnelige forslaget var 34,1 mill.; Stortinget økte posten med 125 mill.
  kroner i budsjettforliket (Innst. 16 S (2025–2026)), til 159,11 mill. saldert
  2026 (NKOMs oppdragsbrev for 2026). Institusjonelt bevis, ikke en
  partiposisjon — regjeringen er Ap-ledet.
