id: ev-2026-partiprogram-rodt-nasjonal-kontroll-forsvar
statement_id: utsagn-45
party_id: rodt
actor: "Rødt"
date: "2025 (landsmøtevedtatt arbeidsprogram)"
evidence_type: partiprogram
evidence_class: partiets_begrunnelse
scan_summary: >
  Rødt vil ha et nasjonalt forsvar som er uavhengig av stormaktsinteresser og
  som selv setter premissene på norsk territorium, og vil erstatte EØS-avtalen
  med en handelsavtale som sikrer nasjonal kontroll.
claim_action: >
  Rødts arbeidsprogram 2025–2029 sier i kapittelet «Militær og sivil
  beredskap» at det forsvarspolitiske målet er et defensivt, sterkt nasjonalt
  forsvar, uavhengig av stormaktsinteresser, og at et sterkere nasjonalt
  forsvar skal gjøre Norge til premissleverandør for militær aktivitet på eget
  territorium. I kapittelet «Internasjonale handels- og investeringsavtaler»
  beskriver Rødt EØS-avtalen som en ensidig avtale som tvinger Norge til å
  innføre direktiv på direktiv som EU vedtar, og vil erstatte den med en
  handelsavtale som sikrer nasjonal kontroll.
verbatim_excerpt: >
  Rødts mål forsvarspolitisk er et defensivt, sterkt nasjonalt forsvar,
  uavhengig av stormaktsinteresser. [...] Med et sterkere nasjonalt forsvar kan
  vi sørge for at Norge er premissleverandør for militær aktivitet på vårt eget
  territorium. [...] Det er en ensidig avtale som tvinger Norge til å innføre
  direktiv på direktiv som EU vedtar, selv om Norge ved folkeavstemninger har
  sagt nei til EU-medlemskap. [...] Erstatte EØS-avtalen med en balansert
  handelsavtale som sikrer nasjonal kontroll.
