claim_action: >
  Senterpartiets stortingsvalgprogram 2025–2029 sier i forsvars- og
  beredskapskapitlet at partiet er tilhenger av et folkeforsvar til stede i
  hele landet, og at Forsvarets hovedoppgave er å trygge norsk territorium.
  I kapittelet «EU/EØS» sier partiet at den politiske og økonomiske
  integrasjonen i EU undergraver folkestyret og fratar medlemslandene
  handlefrihet, at dagens EØS-avtale er for inngripende og begrenser norsk
  sjølråderett på mange viktige politikkområder, og at Norge ikke må avgi
  suverenitet til EU. Partiet vil erstatte EØS-avtalen med handels- og
  samarbeidsavtaler med EU etter reforhandlinger.
