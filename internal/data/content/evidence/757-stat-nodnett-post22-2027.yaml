claim_confidence: dokumentert
context_note: >
  Institusjonelt bevis, ingen partiposisjon: dette er regjeringens forslag
  (Ap-ledet regjering høsten 2026, etter at Senterpartiet gikk ut 4. februar
  2025). Tabellen i kilden viser tre år på rad for samme post — regnskap 2025:
  15 000, saldert budsjett 2026: 100 000, forslag 2027: 324 500 (tusen kroner)
  — så endringsretningen er dokumentert mot to navngitte tidligere år, ikke
  bare mot fjoråret. Utsagn-60 handler om fullfinansiering av utbygging og
  drift av nytt nødnett slik at kommunale og frivillige aktører ikke må bære
  kostnaden; denne posten viser statens egen finansiering av prosjektfasen.
  Driftsfinansieringen og brukerbetalingen ligger i Justis- og
  beredskapsdepartementets kapitler (eget bevis i denne mappen).
