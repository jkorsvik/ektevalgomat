scan_summary: >
  For budsjettåret 2027 foreslår regjeringen 324,5 mill. kroner på kap. 1543,
  post 22 Nytt nødnett, mot 100 mill. kroner saldert for 2026 og 15 mill.
  kroner i regnskapet for 2025. Økningen er begrunnet i behov for
  risikoreduserende tiltak (utvidet testing, utvikling og pilotering) før
  investeringsbeslutning. Prosjektet ligger nå under Digitaliserings- og
  forvaltningsdepartementet og NKOM, med 5G og skivedeling som teknologisk
  utgangspunkt.
claim_action: >
  Staten foreslår selv å finansiere prosjektet for nytt nødnett over
  statsbudsjettet: 324,5 mill. kroner i 2027, opp fra 100 mill. kroner i
  saldert budsjett for 2026 og 15 mill. kroner i regnskapet for 2025. Dette er
  bevilgningen til å utrede, teste og forberede utbygging — ikke en
  finansieringsmodell for drift av det nye nettet, og ikke en forpliktelse til
  å holde kommunale og frivillige brukere skadesløse.
verbatim_excerpt: >
  22 nytt nødnett, kan overførast 15 000 100 000 324 500 [...] med bakgrunn i
  det ovanståande blir det foreslått å auke løyvinga med 200 mill. kroner
  [...] samla blir det foreslått å løyve 324,5 mill. kroner.
