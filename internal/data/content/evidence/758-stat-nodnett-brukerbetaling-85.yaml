context_note: >
  Institusjonelt bevis, ingen partiposisjon. Dette er den delen av
  regjeringens forslag som treffer utsagn-60 ordrett: kommunale og frivillige
  brukere skjermes mot én prisøkning (85 mill. kroner), men bærer fortsatt
  driftskostnaden gjennom abonnement (725,7 mill. kroner i 2027). Kilden
  sier ikke at staten skal overta denne kostnaden for nytt nødnett; den
  økonomiske modellen for det nye nettet er ikke omtalt i proposisjonen.
  Merk at abonnementsinntektene i tabellen er 653 492 (regnskap 2025), 577 324
  (saldert 2026), 725 685 (forslag 2027), mens prosaen viser til en økning på
  127 mill. kroner knyttet til den nye driftsavtalen; postnivået er nettoen av
  flere endringer, så beløpet i tabellen og den tiltaksspesifikke økningen må
  ikke forveksles. Regjeringen er Ap-ledet (Sp gikk ut 4. februar 2025).
