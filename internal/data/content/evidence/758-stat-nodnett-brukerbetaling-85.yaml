scan_summary: >
  For dagens nødnett foreslår regjeringen å øke kap. 451, post 22 med 212
  mill. kroner, men samtidig å øke abonnementsinntektene på kap. 3451, post 05
  med 127 mill. kroner: kostnaden hentes delvis inn fra brukerne. 85 mill.
  kroner brukes til å holde abonnementsprisen uendret for kommunale og
  frivillige brukere, mens brukerne samlet betaler 725,7 mill. kroner i
  abonnement og refusjoner i 2027 (saldert 2026: 577,3 mill. kroner).
claim_action: >
  Staten fullfinansierer ikke driften av nødnett: økningen i statens
  driftsbevilgning på nødnett (212 mill. kroner) matches av en økning i
  abonnementsinntektene fra brukerne på 127 mill. kroner, og bare 85 mill.
  kroner går til å holde abonnementsprisen uendret for kommunale og frivillige
  brukere. Brukerne betaler 725,7 mill. kroner i abonnement og refusjoner i
  2027, opp fra 577,3 mill. kroner saldert for 2026. Skjermingen er dermed
  delvis og tidsbegrenset til budsjettåret, ikke en fullfinansiering.
