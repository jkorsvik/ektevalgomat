scan_summary: >
  I innstillingen om endringer i statsbudsjettet 2024 under Justis- og
  beredskapsdepartementet tilrår justiskomiteen å øke kap. 451, post 22
  (spesielle driftsutgifter - nødnett) med 40 mill. kroner, fra 561,4 til
  601,4 mill. kroner, og samtidig å øke kap. 3451, post 5
  (abonnementsinntekter og refusjoner nødnett) med 40 mill. kroner, fra 536,9
  til 576,9 mill. kroner.
claim_action: >
  Økningen i statens utgifter til nødnett ble i 2024 tilrådd dekket krone for
  krone av økte abonnementsinntekter fra brukerne: 40 mill. kroner mer i
  utgift og 40 mill. kroner mer i brukerbetaling i samme innstilling. Det er
  den etablerte finansieringsmodellen for nødnett — staten eier og bygger
  nettet, brukerne betaler driften — ikke en fullfinansiering der kommunale
  og frivillige aktører skjermes.
