id: ev-2022-01-21-krf-makspris-mot
statement_id: utsagn-12
party_id: krf
actor: "Kristelig Folkeparti (energi- og miljøkomiteen)"
date: "2022-01-21"
evidence_type: voteringsspor
evidence_class: partiets_begrunnelse
scan_summary: >
  KrF stemte for å avvise begge maksprisforslagene og ville i stedet
  fullt ut kompensere strømpris over 50 øre.
claim_action: >
  KrF stemte mot Rødts forslag nr. 6 og 7 om en makspris på 35 øre/kWt
  (votering_id 18082: KrF 0 for, 2 mot av de tilstedeværende), mot
  SV/MDGs forslag nr. 3 om å utrede en maksimalpris (votering_id 18084:
  0 for, 2 mot) og mot FrPs forslag nr. 4 og 5 om 0,50 kr/kWt
  (votering_id 18085: 0 for, 2 mot). Stemte for komiteens tilråding om
  at Dokument 8:65 S og 8:66 S ikke vedtas (votering_id 18088 og 18089:
  KrF 2 for, 0 mot i begge), altså substansielt mot begge forslagene.
  KrF var sammen med FrP medforslagsstiller til kompensasjonsmodellen i
  egen merknad, ikke til noen av maksprisene.
status: forslag_avvist_stemte_mot
position: 1
source_tier: A
source_name: "Innst. 122 S (2021–2022); votering_id 18082, 18084, 18085, 18088, 18089"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2021-2022/inns-202122-122s/?all=true"
verbatim_excerpt: >
  Komiteens medlemmer fra Fremskrittspartiet og Kristelig Folkeparti mener
  derfor at det så snart som råd er må innføres at strømpris over 50 øre
  pr. kWt kompenseres fullt ut.
claim_confidence: dokumentert
context_note: >
  Historisk motstykke til ev-2025-06-05-krf-stroemprismakspris-mot: to
  datede observasjoner, samme retning. KrFs nei til maksprisene har en
  annen begrunnelse enn Høyres og Venstres: KrF står UTENFOR «et annet
  flertall, alle unntatt medlemmene fra Rødt og Kristelig Folkeparti»,
  altså slutter KrF seg ikke til flertallets grunn om at en makspris er
  uutredet og prisregulerende. KrF ville ha sin egen modell: full
  kompensasjon av strømpris over 50 øre, som er en støtteordning der
  staten betaler differansen, ikke et lovbestemt tak på utsalgsprisen.
  Det er nøyaktig støtteordnings-siden av utsagn-12, derfor +1 og ikke
  +2: KrF sier ikke at markedet fungerer, bare at kompensasjon er
  virkemiddelet. Votering 18088/18089 er tilrådinger om at dokumentene
  «vedtas ikke», så «for» betyr stemme MOT forslaget; status beskriver
  den substansielle siden.
retrieved_at: "2026-10-27"
