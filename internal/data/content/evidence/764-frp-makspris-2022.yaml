scan_summary: >
  FrP fremmet og stemte for sitt eget forslag om en lovbestemt makspris
  på strøm på 0,50 kr/kWt for alle.
claim_action: >
  FrP fremmet Dokument 8:65 S (2021–2022), forslag 1: «Stortinget ber
  regjeringen innføre en makspris for strøm på 0,50 kr pr. kWt ekskl.
  mva. Dette gjøres gjeldende for alle, både husholdninger og næringsliv.»
  Forslaget ble votert som forslag 4 og 5 (votering_id 18085: 15 for,
  83 mot; FrP 11 for, 0 mot av de tilstedeværende). FrP stemte samtidig
  mot Rødts forslag nr. 6 og 7 om 35 øre/kWt (votering_id 18082: 0 for,
  12 mot) og mot å utrede en maksimalpris (votering_id 18084: 12 for,
  0 mot — FrP støttet utredningsforslaget fra SV og MDG), og stemte for
  komiteens tilråding om at Dokument 8:66 S ikke vedtas (votering_id
  18089: FrP 12 for, 0 mot). FrP stemte mot tilrådingen om at eget
  Dokument 8:65 S ikke vedtas (votering_id 18088: FrP 0 for, 12 mot),
  altså substansielt FOR eget maksprisforslag.
