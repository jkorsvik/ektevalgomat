verbatim_excerpt: >
  Stortinget ber regjeringen innføre en makspris for strøm på 0,50 kr pr.
  kWt ekskl. mva. Dette gjøres gjeldende for alle, både husholdninger og
  næringsliv.
claim_confidence: dokumentert
context_note: >
  Dette er den ene cellen der 2022 og 2025 peker hver sin vei, og raden er skrevet
  for å vise det, ikke for å jevne det ut. I 2022 fremmet FrP selv et forslag om
  makspris på 0,50 kr/kWt for alle, næringslivet inkludert, og stemte for det; i
  2025 (ev-2025-06-05-frp-stroemprismakspris-mot) stemte FrP mot Rødts pristak og
  fremmet i stedet 100 pst. strømstøtte over 50 øre for husholdninger og
  fritidsboliger, med et volumtak på 5 000 kWh i måneden og uten næringslivet.
  Rødts merknad i Innst. 535 L sier det samme fra motsatt side: FrP «har
  tilsynelatende gått vekk fra» maksprisen.

  Kodet -1 og ikke -2, og det er den svakeste koden i denne serien. Grunnen:
  FrPs eget forslag er formelt en makspris, men forslaget er begrunnet som
  kompensasjon. Setningen om at strømpris over 50 øre pr. kWt «kompenseres fullt
  ut» står i Innst. 122 S, men den er signert «Komiteens medlemmer fra
  Fremskrittspartiet og Kristelig Folkeparti» — en felles FrP+KrF-merknad, ikke
  FrPs egen. Det er altså ikke bare partiet som står bak kompensasjonslesningen.
  FrPs egen merknad i samme innstilling kaller likevel forslaget «eget
  representantforslag, som også omhandler å legge til rette for en
  strømstøtteordning», så partiet har signert begge lesningene av ett og samme
  instrument. Instrumentet er derfor en hybrid mellom de to sidene utsagnet
  stiller opp. -2 ville krevd at jeg kalte 50-øre-modellen en lovbestemt makspris
  også i substans, og det motsier partiets egen begrunnelse. En leser som er uenig
  i dette kan forsvare -2, og position-scale-regelen («eget instrument, med et
  tall») peker dit; tallene som gjør det mulig står over. Den skrevne regelen er
  ennå ikke ratifisert av eieren (køoppgave krf-skatteniva-polarity), så valget
  står urørt her.

  Votering 18088 er en tilråding om at dokumentet «vedtas ikke», så «mot» betyr
  substansielt FOR forslaget; status beskriver den substansielle siden, ikke
  tallsiden. 18082 og 18084 er ordinære forslagsvoteringer uten inversjon: på
  18084 stemte FrP FOR å utrede en maksimalpris, ikke mot.
