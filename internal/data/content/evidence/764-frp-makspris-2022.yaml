verbatim_excerpt: >
  Stortinget ber regjeringen innføre en makspris for strøm på 0,50 kr pr.
  kWt ekskl. mva. Dette gjøres gjeldende for alle, både husholdninger og
  næringsliv.
claim_confidence: dokumentert
context_note: >
  Dette er den ene cellen der 2022 og 2025 peker hver sin vei, og raden
  er skrevet for å vise det, ikke for å jevne det ut. I 2022 fremmet FrP
  selv et lovbestemt pristak og stemte for det; i 2025 (ev-2025-06-05-
  frp-stroemprismakspris-mot) stemte FrP mot Rødts pristak og fremmet i
  stedet 100 pst. strømstøtte over 50 øre. Rødts merknad i Innst. 535 L
  sier det samme fra motsatt side: FrP «har tilsynelatende gått vekk fra»
  maksprisen.

  Kodet -1 og ikke -2, og det er den svakeste koden i denne serien.
  Grunnen: FrPs eget forslag er formelt en makspris, men FrPs egen merknad
  begrunner den som kompensasjon — «at strømpris over 50 øre pr. kWt
  kompenseres fullt ut» — altså i praksis staten betaler differansen over
  et nivå, den samme familien partiet i 2025 rendyrker. Instrumentet er
  derfor en hybrid mellom de to sidene utsagnet stiller opp. -2 ville
  krevd at jeg kalte 50-øre-modellen en lovbestemt makspris også i
  substans, og det motsier partiets egen begrunnelse. En leser som er
  uenig i dette kan forsvare -2; tallene som gjør det mulig står over.

  Votering 18088 er en tilråding om at dokumentet «vedtas ikke», så «mot»
  betyr substansielt FOR forslaget; status beskriver den substansielle
  siden, ikke tallsiden. 18082 og 18084 er ordinære forslagsvoteringer
  uten inversjon.
