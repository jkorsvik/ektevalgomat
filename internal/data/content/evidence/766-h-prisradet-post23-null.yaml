context_note: >
  Andre og tidligere daterte bevis for Høyre på utsagn-16, fra en annen
  dokumenttype enn merknaden i Innst. 377 S (2025–2026): her er kilden Høyres
  eget tall i den alternative budsjett-tabellen i budsjettinnstillingen.
  Kodet +2 fordi posten settes til 0 — hele bevilgningen forsvinner, ikke en
  delvis kutt — og fordi Høyre i samme innstilling skriver at
  «normprisrådet bør avvikles». Utsagn-16 sier at ordningen med normpris og
  Prisrådet for havbruk bør avvikles; en null på posten er avviklingssiden av
  utsagnet, ikke videreførings- eller reform-siden. Forbehold: tabellen viser
  bare bevilgningen, ikke om Høyre ville finansiere et prisråd på en annen
  post, og den begrunner ikke nullen — den eneste uttalelsen Høyre har om
  Prisrådet i dokumentet står i merknaden i punkt 3.3.3, ikke i tabellen.
  Sitatet er derfor den setningen, ikke tabellinjen: et tabellsitat fra dette
  dokumentet sprenger arkivvinduet. Målt 2026-10-27 med build_archive.locate:
  post 23-linjen alene gir et vindu på 13 572 tegn og linjen pluss tabellhodet
  22 665, mot en grense på 6 000, fordi tabellcellene har så mye luft at 100
  normaliserte tegn tilsvarer over 13 000 tegn i kilden. Merknadssetningen gir
  899 tegn. Tabelltallene står derfor ordrett i claim_action i stedet, som
  LOOP.md foreskriver: sitér fragmentet som bærer påstanden, og oppgi det
  andre tallet i claim_action. Post 1 og post 22, som ellipsen i en
  tabellinje ville ha skjult, har ingen av enkeltpartikolonnene endret (bare
  forlikskolonnen har et avvik der: post 1, -1 000).
  Endringen er ikke vedtatt: komiteens tilråding beholder 17 900 000 kroner.
  Tabellen er i tusen kroner, så 17 900 = 17,9 mill. kroner. Dokumentet er
  datert «Oslo, i næringskomiteen, den 12. desember 2025».
