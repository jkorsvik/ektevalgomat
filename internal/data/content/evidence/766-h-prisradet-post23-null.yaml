scan_summary: >
  I Høyres alternative budsjett for 2026 er hele bevilgningen til kap. 917
  post 23 Prisråd for havbruk satt til 0, mot regjeringens 17 900 tusen
  kroner: en full fjerning av posten, ikke en reduksjon. Hver eneste andre
  partikolonne i samme tabell beholder 17 900.
claim_action: >
  Høyre foreslo å fjerne hele bevilgningen på kap. 917 post 23 «Prisråd for
  havbruk»: regjeringen 17 900 tusen kroner, Høyre 0, dvs. -17 900. Kolonnen
  er Høyre-kolonnen i tabellen i punkt 3.3.9, hvis hode lest ordrett er
  «Kap. | Post | Formål | Prop. 1 S(2025–2026) | A, SV, Sp, R og MDG | FrP |
  H | SV | R | MDG | KrF» — «H» er altså kolonnen rett etter FrP, og det er
  den som står med 0(-17 900) på post 23. Kontrollregnestykke: H-kolonnen har
  avvik på bare to poster i rammeområde 10, post 23 (-17 900) og post 73
  (-140 000), og sumlinjen i samme kolonne er «2 798 587(-157 900)». Samme
  dokument sier i Høyres merknad (punkt 3.3.3): «Disse medlemmer mener
  normprisrådet bør avvikles.» Forslaget ble ikke en del av komiteens
  tilråding: i tilrådingen (bokstav b, rammeområde 10) står post 23 fortsatt
  med 17 900 000 kroner, og tilrådingen fremmes av Ap, SV, Sp, R og MDG.
verbatim_excerpt: >
  Disse medlemmer peker videre på at det fremdeles er uavklarte sider ved den
  vedtatte grunnrenteskatten, f.eks. spørsmålet om normpris, noe som i seg selv
  er svært uheldig. Disse medlemmer mener normprisrådet bør avvikles.
