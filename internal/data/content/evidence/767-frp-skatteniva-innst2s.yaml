source_name: >
  Innst. 2 S (2025–2026), finanskomiteen, punkt 3.2 «Oversikt over partienes
  forslag til rammevedtak», rad 21 «Skatter og avgifter», FrP-kolonnen;
  sitatet er fra punkt 3.1.2.2 «Merknader fra Fremskrittspartiet»
