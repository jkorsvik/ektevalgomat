date: "2025-11-30"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  FrPs eget budsjett tar inn 51,4 mrd. kroner mindre i skatter og avgifter enn
  regjeringens: rad 21 «Skatter og avgifter» går fra -1 862 746 244 til
  -1 811 310 244, avvik +51 436 000 (tusen kroner), 2,8 pst. av nivået. Det er
  den klart største senkingen av det samlede nivået av alle partiene i tabellen.
claim_action: >
  Fremskrittspartiets eget budsjettforslag senker det samlede skatte- og
  avgiftsnivået med 51,4 mrd. kroner mot regjeringens forslag. I tabellen i
  punkt 3.2 står FrP-kolonnen i rad 21 med -1 811 310 244 mot regjeringens
  -1 862 746 244, og avviket står i parentes som +51 436 000 (alle tall i
  1 000 kroner). Raden er negativ fordi skatter og avgifter er en inntekt i
  netto rammevedtak; et positivt avvik betyr derfor at det tas inn MINDRE enn
  regjeringen foreslår, altså et lavere samlet nivå. FrPs egen merknad i punkt
  3.1.2.2 sier det samme i ord og egen tallrekke: «samlede skatte- og
  avgiftslettelser på 54 mrd. kroner», sammensatt av skattelette
  35 720 000 000, avgiftskutt 16 016 000 000 og forbedret strømstøtte
  2 000 000 000 (total 53 736 000 000). Strømstøtten er en utgiftspost og
  inngår ikke i rad 21; de resterende 0,3 mrd. kroner mellom 51 736 og 51 436
  er ikke forklart i dokumentet.
verbatim_excerpt: >
  Fremskrittspartiets alternative statsbudsjett inneholder samlede skatte- og
  avgiftslettelser på 54 mrd. kroner, herunder skattelette på 36 mrd. kroner,
  avgiftskutt på 16,0 mrd. kroner og forbedret strømstøtte på 2,0 mrd. kroner.
