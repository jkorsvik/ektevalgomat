evidensstyrke_cap: "moderat"
context_note: >
  Kolonneoverskriften i tabellen er ordrett «Komité | Nr. | (tomt felt) |
  Prop. 1 S (2025–2026) Gul bok | A, Sp og R | FrP | H | SV | R | MDG | KrF |
  V», så FrP er første partikolonne og det er den som står med
  «-1 811 310 244 (+51 436 000)». To uavhengige kontroller i samme dokument:
  (1) kapittel 4 «Forslag fra mindretall» fører FrPs eget rammevedtak nr. 21
  med -1 811 310 244 000 kroner, altså nøyaktig samme beløp ganget med 1 000;
  (2) FrPs merknad i 3.1.2.2 oppgir egne samlede lettelser på 54 mrd. kroner
  (53,736 mrd. med strømstøtten inkludert). Kodet +2: 51,4 mrd. kroner er
  2,8 pst. av det samlede nivået på 1 862,7 mrd. kroner, en substantiell
  senking og ikke en avrundingsdifferanse. Forslaget er ikke vedtatt:
  innledningen sier at forhandlingene ikke førte frem og at «det er derfor
  ikke flertall for noe rammeforslag i denne innstillingen»; Ap, Sp og R
  fremmet forliket sitt som komiteens tilråding. Sitatet er en setning i FrPs
  merknad, ikke et tabellutsnitt, fordi et utsnitt som spenner over tabellraden
  sprenger arkivvinduet (målt: rad 21s etikett pluss første kolonne gir alene
  5 805 tegn mot grensen 6 000). Dokumentet er datert «Oslo, i finanskomiteen,
  den 30. november 2025».
