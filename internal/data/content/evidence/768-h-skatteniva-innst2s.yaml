context_note: >
  Kolonneoverskriften er ordrett «Komité | Nr. | (tomt felt) | Prop. 1 S
  (2025–2026) Gul bok | A, Sp og R | FrP | H | SV | R | MDG | KrF | V», så H er
  kolonnen rett etter FrP, og det er den som står med «-1 846 992 244
  (+15 754 000)». To uavhengige kontroller i samme dokument: (1) kapittel 4
  «Forslag fra mindretall» fører Høyres eget rammevedtak nr. 21 med
  -1 846 992 244 000 kroner, altså samme beløp ganget med 1 000; (2) Høyres
  egen tabell i 3.1.2.3 oppgir netto reduksjon i skatte- og avgiftsnivået på
  16 168 (påløpt) / 17 118 (bokført) mill. kroner, og finansieringstabellen i
  samme merknad fører linjen «Memo Skatt (se egen tabell) 16 178 000». Tre
  H-tall på 15,8, 16,2 og 17,1 mrd. kroner er altså ikke en motsigelse, men
  ulike målebasiser (rammevirkning i rad 21 mot påløpt og bokført i Høyres egen
  tabell); rad 21-tallet er det som er kodet her. Kodet +2: 15,8 mrd. kroner er
  0,85 pst. av nivået på 1 862,7 mrd. kroner og Høyre beskriver det selv som en
  netto reduksjon av nivået, ikke som en omlegging. Forslaget er ikke vedtatt:
  innledningen sier at «det er derfor ikke flertall for noe rammeforslag i
  denne innstillingen». Sitatet er en tabellinje fordi Høyres merknad ikke har
  en løpende setning om det samlede nivået; et utsnitt over hele tabellraden
  ville sprenge arkivvinduet (målt: 4 916 tegn for denne linjen, mot grensen
  6 000). Dokumentet er datert «Oslo, i finanskomiteen, den 30. november 2025».
