scan_summary: >
  Høyres eget budsjett tar inn 15,8 mrd. kroner mindre i skatter og avgifter
  enn regjeringens: rad 21 «Skatter og avgifter» går fra -1 862 746 244 til
  -1 846 992 244, avvik +15 754 000 (tusen kroner), 0,85 pst. av nivået.
claim_action: >
  Høyres alternative budsjett senker det samlede skatte- og avgiftsnivået med
  15,8 mrd. kroner mot regjeringens forslag. H-kolonnen i rad 21 i punkt 3.2
  står med -1 846 992 244 mot regjeringens -1 862 746 244; avviket i parentes
  er +15 754 000 (alle tall i 1 000 kroner). Raden er negativ fordi skatter og
  avgifter er en inntekt i netto rammevedtak, så et positivt avvik betyr at det
  tas inn mindre enn regjeringen foreslår, altså et lavere samlet nivå. Høyres
  egen tabell i merknaden (punkt 3.1.2.3) sier det samme med sine egne tall:
  linjen «Netto reduksjon i skatte- og avgiftsnivået» viser -16 168 og -17 118
  mill. kroner. Kolonneoverskriften i den tabellen er «Skatteendringer (tall i
  mill. kroner) 2026 påløpt», så bare den første kolonnen er merket påløpt;
  at den andre er bokført er en slutning fra tallrekkefølgen, ikke en etikett
  i kilden. Utsagnet som er sitert er Høyres egen
  tabellinje, ikke et utsnitt som spenner over tabellraden.
