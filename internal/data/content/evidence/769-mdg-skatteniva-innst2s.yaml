context_note: >
  Kolonneoverskriften er ordrett «Komité | Nr. | (tomt felt) | Prop. 1 S
  (2025–2026) Gul bok | A, Sp og R | FrP | H | SV | R | MDG | KrF | V», så MDG
  er kolonnen mellom R og KrF, og det er den som står med «-1 900 829 044
  (-38 082 800)». Kontroll i samme dokument: kapittel 4 «Forslag fra
  mindretall» fører MDGs eget rammevedtak nr. 21 med -1 900 829 044 000
  kroner, samme beløp ganget med 1 000. MDGs to merknader (2.1.2.7 og 3.1.2.7)
  er gjennomgått: de handler om oljeinvesteringer, naturregnskap, arbeidsliv og
  kollektivtransport, nevner ikke det samlede skatte- og avgiftsnivået og har
  ingen tall for MDGs skatteopplegg; 3.1.2.7 viser til 2.1.2.7 og fremmer i
  tillegg en rekke enkeltforslag (flyseteavgift, VOEC, mva-fritak,
  produksjonsavgift) uten samlet tall. Derfor er sitatet et tabellutsnitt uten løpende prosa, ikke en
  setning. Kodet -2: 2,04 pst. av nivået er en klar heving. Forslaget er ikke
  vedtatt: innledningen sier at «det er derfor ikke flertall for noe
  rammeforslag i denne innstillingen». Vinduet for dette utsnittet er målt til
  5 071 tegn, under grensen på 6 000 men med liten margin. Dokumentet er
  datert «Oslo, i finanskomiteen, den 30. november 2025».
