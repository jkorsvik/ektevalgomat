scan_summary: >
  MDGs eget budsjett tar inn 38,1 mrd. kroner MER i skatter og avgifter enn
  regjeringens: rad 21 «Skatter og avgifter» går fra -1 862 746 244 til
  -1 900 829 044, avvik -38 082 800 (tusen kroner), 2,04 pst. av nivået. Det
  er den største hevingen av det samlede nivået i tabellen.
claim_action: >
  MDGs alternative budsjett hever det samlede skatte- og avgiftsnivået med
  38,1 mrd. kroner mot regjeringens forslag, altså det motsatte av hva
  utsagnet ber om. MDG-kolonnen i rad 21 i punkt 3.2 står med -1 900 829 044
  mot regjeringens -1 862 746 244; avviket i parentes er -38 082 800 (alle
  tall i 1 000 kroner). Raden er negativ fordi skatter og avgifter er en
  inntekt i netto rammevedtak, så et negativt avvik betyr at det tas inn mer
  enn regjeringen foreslår. Sitatet er MDGs egen celle i rad 21, ordrett
  (-1 900 829 044 med avviket -38 082 800 i parentes), fordi MDGs merknader i
  dette dokumentet ikke inneholder noen setning om det samlede skatte- og
  avgiftsnivået og ingen egen skattetabell.
