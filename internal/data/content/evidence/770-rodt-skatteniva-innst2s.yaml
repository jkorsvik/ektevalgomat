evidensstyrke_cap: "moderat"
context_note: >
  R har egen kolonne i tabellen («... | SV | R | MDG | KrF | V»), og den er
  brukt; R sitter samtidig i forlikskolonnen «A, Sp og R», men det er Rødts
  eget budsjett som kodes her. Kontroller i samme dokument: (1) kapittel 4
  «Forslag fra mindretall» fører Rødts eget rammevedtak nr. 21 med
  -1 891 383 244 000 kroner, samme beløp ganget med 1 000; (2) Rødts merknad
  oppgir egne inntektsøkninger på «omtrent 13 mrd. kroner» på inntekt og
  utbytte og «om lag 15 mrd. kroner» på formue; de to summene ligger nær de
  28,6 mrd. kronene i rad 21, men merknaden øker også selskaps- og
  finansskatt, så likheten er en avrunding og ikke en avstemming; (3) Rødts merknad
  sier samtidig at Rødt foreslår «å kutte skatten til det store flertallet av
  befolkningen» — det er omfordeling innenfor et høyere totalnivå, samme regel
  som kontekstfil 543 bruker, og ikke en senking av nivået. Kodet -2: 1,54 pst.
  av nivået er en klar, ikke marginal, heving. Forslaget er ikke vedtatt:
  innledningen sier at «det er derfor ikke flertall for noe rammeforslag i
  denne innstillingen». Sitatet er en løpende setning i Rødts merknad, ikke et
  tabellutsnitt; et utsnitt over tabellraden ville sprenge arkivvinduet (målt:
  rad 21s etikett pluss første kolonne gir 5 805 tegn mot grensen 6 000).
  Dokumentet er datert «Oslo, i finanskomiteen, den 30. november 2025».
