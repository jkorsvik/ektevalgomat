scan_summary: >
  Rødts eget budsjett tar inn 28,6 mrd. kroner MER i skatter og avgifter enn
  regjeringens: rad 21 «Skatter og avgifter» går fra -1 862 746 244 til
  -1 891 383 244, avvik -28 637 000 (tusen kroner), 1,54 pst. av nivået.
claim_action: >
  Rødts alternative budsjett hever det samlede skatte- og avgiftsnivået med
  28,6 mrd. kroner mot regjeringens forslag, altså det motsatte av hva
  utsagnet ber om. R-kolonnen i rad 21 i punkt 3.2 står med -1 891 383 244 mot
  regjeringens -1 862 746 244; avviket i parentes er -28 637 000 (alle tall i
  1 000 kroner). Raden er negativ fordi skatter og avgifter er en inntekt i
  netto rammevedtak, så et negativt avvik betyr at det tas inn mer enn
  regjeringen foreslår, altså et høyere samlet nivå. Rødt sier det samme i
  ord i merknaden (punkt 3.1.2.6): Rødts skattemodell «øker de samlede
  inntektene til fellesskapet» mens skatten kuttes for vanlige lønnsmottakere.
verbatim_excerpt: >
  Rødts skattemodell viser at det er mulig å både kutte skattene til vanlige
  folk og øke de samlede inntektene til fellesskapet for å finansiere viktige
  velferdsreformer.
status: foreslått
position: -2
source_tier: A
source_name: >
  Innst. 2 S (2025–2026), finanskomiteen, punkt 3.2 «Oversikt over partienes
  forslag til rammevedtak», rad 21 «Skatter og avgifter», R-kolonnen; sitatet
  er fra punkt 3.1.2.6 «Merknader fra Rødt»
