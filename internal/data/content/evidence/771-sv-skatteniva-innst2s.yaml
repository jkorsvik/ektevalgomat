context_note: >
  Kolonneoverskriften er ordrett «Komité | Nr. | (tomt felt) | Prop. 1 S
  (2025–2026) Gul bok | A, Sp og R | FrP | H | SV | R | MDG | KrF | V», så SV
  er tredje partikolonne, og det er den som står med «-1 895 045 244
  (-32 299 000)». Kontroll i samme dokument: kapittel 4 «Forslag fra
  mindretall» fører SVs eget rammevedtak nr. 21 med -1 895 045 244 000 kroner,
  samme beløp ganget med 1 000; det er en selvstendig bekreftelse av at
  kolonnen er SVs eget budsjett, siden SVs merknad selv ikke har noe samlet
  tall. SVs merknad (3.1.2.4) argumenterer i samme retning uten tall for
  totalen: «I en tid med altfor stor ulikhet og klimakrise må skattesystemet
  omfordele mer ... gi inntekter til å opprettholde og bygge ut velferdsstaten»,
  og SV foreslår å øke personfradraget i inntektsskatten med 24 mrd. kroner
  samtidig som skattene på høye inntekter, formue og bankoverskudd økes.
  Kodet -2: 1,73 pst. av nivået er en klar heving. Forslaget er ikke vedtatt:
  innledningen sier at «det er derfor ikke flertall for noe rammeforslag i
  denne innstillingen». Merk at sitatet er et tabellutsnitt uten løpende
  prosa, jf. at SV ikke har noen samlet tallsetning i dokumentet; vinduet for
  dette utsnittet er målt til 5 284 tegn, under grensen på 6 000 men med liten
  margin. Dokumentet er datert «Oslo, i finanskomiteen, den 30. november 2025».
