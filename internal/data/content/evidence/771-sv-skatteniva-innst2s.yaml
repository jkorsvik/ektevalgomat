scan_summary: >
  SVs eget budsjett tar inn 32,3 mrd. kroner MER i skatter og avgifter enn
  regjeringens: rad 21 «Skatter og avgifter» går fra -1 862 746 244 til
  -1 895 045 244, avvik -32 299 000 (tusen kroner), 1,73 pst. av nivået.
claim_action: >
  SVs alternative budsjett hever det samlede skatte- og avgiftsnivået med
  32,3 mrd. kroner mot regjeringens forslag, altså det motsatte av hva
  utsagnet ber om. SV-kolonnen i rad 21 i punkt 3.2 står med -1 895 045 244 mot
  regjeringens -1 862 746 244; avviket i parentes er -32 299 000 (alle tall i
  1 000 kroner). Raden er negativ fordi skatter og avgifter er en inntekt i
  netto rammevedtak, så et negativt avvik betyr at det tas inn mer enn
  regjeringen foreslår. Sitatet er SVs egen celle i rad 21, ordrett
  (-1 895 045 244 med avviket -32 299 000 i parentes), fordi SVs merknad i
  dette dokumentet ikke har noen setning eller tabell som oppgir SVs samlede
  skatte- og avgiftsnivå.
