context_note: >
  Kolonneoverskriften er ordrett «Komité | Nr. | (tomt felt) | Prop. 1 S
  (2025–2026) Gul bok | A, Sp og R | FrP | H | SV | R | MDG | KrF | V», så V er
  siste kolonne. Presisjonskontroll: Venstres egen oppsummeringstabell rett før
  punkt 3.2 fører linjen «sum alle endringer (netto skatte- og avgiftslettelse)
  7 414,3 6 906,5» i mill. kroner (påløpt og bokført), og 6 906,5 mill. kroner
  er nøyaktig 6 906 500 i tabellens enhet 1 000 kroner — samme tall som
  avviket i rad 21, bare i en annen enhet og uten fortegnsvending. Kapittel 4
  «Forslag fra mindretall» fører i tillegg Venstres eget rammevedtak nr. 21 med
  -1 855 839 744 000 kroner. Kodet +2: 6,9 mrd. kroner er 0,37 pst. av nivået,
  og Venstre presenterer det selv som en netto lettelse av det samlede
  skatte- og avgiftsopplegget (9,5 mrd. kroner høyere miljø- og bilavgifter mot
  16 mrd. kroner lavere skatter for personer og næringsliv), ikke som en
  omfordeling innenfor uendret nivå. Terskelen for |2| i denne serien er
  ikke målt, bare anvendt: 0,37 pst. er kodet +2, og en rad på 0,18 pst. ble
  holdt utenfor promotering nettopp fordi den er for liten til å bære en
  retning. Terskelen er dermed ikke konsistent mellom fortegn, og det står
  åpent. Forslaget er ikke vedtatt: innledningen
  sier at «det er derfor ikke flertall for noe rammeforslag i denne
  innstillingen». Sitatet er en løpende setning i Venstres merknad, ikke et
  tabellutsnitt; et utsnitt over tabellraden ville sprenge arkivvinduet (målt:
  rad 21s etikett pluss første kolonne gir 5 805 tegn mot grensen 6 000).
  Dokumentet er datert «Oslo, i finanskomiteen, den 30. november 2025».
