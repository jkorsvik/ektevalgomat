scan_summary: >
  Venstres eget budsjett tar inn 6,9 mrd. kroner mindre i skatter og avgifter
  enn regjeringens: rad 21 «Skatter og avgifter» går fra -1 862 746 244 til
  -1 855 839 744, avvik +6 906 500 (tusen kroner), 0,37 pst. av nivået.
claim_action: >
  Venstres alternative budsjett senker det samlede skatte- og avgiftsnivået med
  6,9 mrd. kroner mot regjeringens forslag. V-kolonnen, den siste i rad 21 i
  punkt 3.2, står med -1 855 839 744 mot regjeringens -1 862 746 244; avviket i
  parentes er +6 906 500 (alle tall i 1 000 kroner). Raden er negativ fordi
  skatter og avgifter er en inntekt i netto rammevedtak, så et positivt avvik
  betyr lavere samlet nivå. Venstre sier det samme i klartekst i merknaden
  (punkt 3.1.2.9): «I sum medfører Venstres samlede skatte- og avgiftsopplegg
  netto lettelser på om lag 7 mrd. kroner.»
verbatim_excerpt: >
