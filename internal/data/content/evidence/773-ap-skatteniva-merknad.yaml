context_note: >
  Kodet -2. Utsagnet sier at det samlede skatte- og avgiftsnivået bør SENKES, og
  uenig-polen i utsagnet er ordrett «holdes som i dag eller økes». Ap sier at
  nivået «holdes uendret», altså nøyaktig uenig-polen, uten forbehold og uten en
  eneste lempelse i det samlede nivået. Det er samme posisjon som partiets
  programfesting i 547 ap skatte-avgiftsniva-senkes (-2, «holde de samlede skattene
  og avgiftene … på samme nivå som i dag»), så cellen står stille på -2; raden gir
  den en andre date og en tier-A-kilde i stedet for en programkilde. Hvem som
  snakker: Ap er regjeringsparti og merknaden beskriver regjeringens eget
  budsjettforslag. Det er ikke en opposisjonsmerknad, og det er ikke «Ap/Sp»:
  Senterpartiet gikk ut av regjeringen 2025-02-04 og står bak en egen
  opposisjonsmerknad i samme innstilling. Dokumentet er datert «Oslo, i
  finanskomiteen, den 30. november 2025».
