scan_summary: >
  Arbeiderpartiet forsvarer sitt eget budsjett med at «skatteløftet holdes ved at det
  samlede skatte- og avgiftsnivået i 2026 holdes uendret med regjeringens forslag».
  Nivået holdes altså uendret, ikke senket, og partiet presenterer det som en
  oppfylt lovnad.
claim_action: >
  I merknad 2.1.2.1 i Innst. 2 S (2025–2026) skriver komiteens medlemmer fra
  Arbeiderpartiet at skatteløftet holdes ved at det samlede skatte- og avgiftsnivået
  i 2026 holdes uendret med regjeringens forslag. Ap er regjeringspartiet, så dette
  er regjeringens eget budsjett som partiet forsvarer i innstillingen: nivået
  videreføres uendret og senkes ikke.
