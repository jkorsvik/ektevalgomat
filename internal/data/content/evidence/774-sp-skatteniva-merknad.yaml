context_note: >
  Kodet +1, ikke +2. Utsagnet spør om det SAMLEDE skatte- og avgiftsnivået bør
  senkes. Sp sier klart at partiet vil redusere både skatter og avgifter, og det er
  en positiv retning på utsagnet. Men merknaden (1) avgrenser uttrykkelig mot store
  lettelser, (2) oppgir ingen samlet senking av nivået, bare enkeltgrep (matmoms
  15 til 10 pst., drivstoffavgifter, fradrag, omfordeling i inntektsskatten), og
  (3) foreslår 6,5 mrd. kroner mer i utgifter til kommunesektoren, som trekker den
  samlede virkningen på nivået i motsatt retning og gjør den uoppgitt i dokumentet.
  +2 er forbeholdt de partiene som dokumenterer en senking av det samlede nivået med
  et tall, slik som FrP (51,4 mrd. kroner, rad 21 i tabellen i punkt 3.2). Hos Sp
  finnes ikke noe slikt tall, og da er +1 den ærlige koden: retning ja, omfang ikke
  dokumentert. Sp er opposisjon her; merknaden er til partiets eget alternative
  budsjett, ikke en regjeringsmerknad. Dokumentet er datert «Oslo, i finanskomiteen,
  den 30. november 2025».
