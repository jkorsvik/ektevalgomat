scan_summary: >
  Senterpartiet sier at partiet «vil redusere både skatter og avgifter», men avgrenser
  det samtidig: «ikke store skattelettelser til dem som har aller mest», og bruker
  6,5 mrd. kroner mer på kommunesektoren. Retningen er å senke, men merknaden oppgir
  ingen senking av det samlede nivået.
claim_action: >
  I merknad 3.1.2.5 i Innst. 2 S (2025–2026) skriver komiteens medlem fra
  Senterpartiet at partiet vil redusere både skatter og avgifter, med en omfordeling
  i inntektsskatten og økte fradrag, og nevner særskilt matmomsen fra 15 til 10 pst.
  og lavere drivstoffavgifter. Samtidig avgrenses retningen uttrykkelig til «ikke
  store skattelettelser til dem som har aller mest», og merknaden foreslår 6,5 mrd.
  kroner mer til kommunesektoren. Det er en retning mot lavere skatter og avgifter
  for vanlige folk, ikke et påstand om at det samlede nivået senkes.
verbatim_excerpt: >
  Senterpartiet vil redusere både skatter og avgifter, slik at folk kan få mer igjen
  for egen arbeidsinnsats
