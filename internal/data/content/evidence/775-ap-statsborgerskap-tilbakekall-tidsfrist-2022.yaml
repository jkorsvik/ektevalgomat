context_note: >
  Andre dato i cellen: den ene eksisterende Ap-raden er datert 2026-04-30
  og koder -1 fra votering 27523. Retningen er den samme i begge sesjoner,
  så cellen står uendret på -1. Forslaget var SV og Rødts eget, ikke Aps,
  og Ap har ingen egen tekst om det; derfor -1 og ikke -2. Hele saken
  ble avgjort med votering 18487, der Ap stemte for tilrådingen om at
  dokumentet «vedtas ikke» — samme side som i 18486 når tilrådingen leses
  invertert (88 for / 16 mot).
