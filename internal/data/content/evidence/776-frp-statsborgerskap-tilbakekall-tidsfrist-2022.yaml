context_note: >
  Andre dato i cellen: den ene eksisterende FrP-raden er datert 2026-04-30
  og koder -1 fra votering 27523. Retningen er den samme i begge sesjoner,
  så cellen står uendret på -1. Kun stemmegivning — forslaget var SV og
  Rødts eget, ikke FrPs, og FrP har ingen egen tekst om nettopp denne
  fristen i saken. Votering 18487, tilrådingen om at dokumentet «vedtas
  ikke», ble vedtatt 88 mot 16 med FrP på ja-siden, som er samme side når
  tilrådingen leses invertert.
