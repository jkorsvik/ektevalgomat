scan_summary: "Høyre stemte mot SV og Rødts forslag om en foreldelsesfrist for tilbakekall av statsborgerskap — falt 21 mot 83."
claim_action: >
  Høyre stemte mot forslag nr. 1 i Dokument 8:75 S (2021–2022), som ba
  regjeringen «utrede og fremme forslag om en foreldelsesfrist som etter
  en gitt tid avskjærer anledningen til å tilbakekalle et statsborgerskap».
  Votering 18486 (07.04.2022) avgjorde forslag nr. 1, 2 og 3 i én
  avstemning; nr. 2 gjaldt en frist fra forhåndsvarsel til vedtak og nr. 3
  et krav om dobbelt statsborgerskap ved tilbakekall. Høyre 0 for / 23 mot.
  Forslaget falt 21 mot 83; den 21. for-stemmen var Pasientfokus (Irene Ojala), som ikke er blant
  de ni partiene i partiet-eksporten.
status: forslag_avvist_stemte_mot
