context_note: >
  Andre dato i cellen: den ene eksisterende Høyre-raden er datert 2026-05-12
  og koder -1 fra votering 27523. Retningen er den samme i begge sesjoner,
  så cellen står uendret på -1. Kun stemmegivning — forslaget var SV og
  Rødts eget. Høyre satt i regjering fra 2013 til 2021 og var i
  opposisjon da denne saken ble avgjort, så raden er opposisjonsatferd,
  ikke regjeringsansvar.
  Sitatet i claim_action er forslagsteksten, ikke stemmetallene: den ligger i
  https://data.stortinget.no/eksport/voteringsforslag?voteringid=18486 (samme
  votering). source_url peker på voteringsresultat, som bare inneholder
  representantenes stemmer og ikke ordet «foreldelsesfrist». Begge er nødvendige:
  teksten bærer påstanden, tellingen bærer retningen.
