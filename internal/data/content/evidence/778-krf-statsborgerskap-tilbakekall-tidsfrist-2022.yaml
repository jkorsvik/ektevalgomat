scan_summary: "KrF stemte for forslaget om en foreldelsesfrist, men også for tilrådingen om at dokumentet ikke skulle vedtas — partiet tok begge sider i samme sak."
claim_action: >
  KrF stemte for forslag nr. 1 i Dokument 8:75 S (2021–2022), som ba
  regjeringen «utrede og fremme forslag om en foreldelsesfrist som etter
  en gitt tid avskjærer anledningen til å tilbakekalle et statsborgerskap»
  (votering 18486, KrF 2 for / 0 mot), og stemte deretter for
  innstillingens tilråding om at «Dokument 8:75 S (2021–2022) … vedtas
  ikke» (votering 18487, KrF 2 for / 0 mot). De to stemmene peker hver sin
  vei i samme sak.
status: forslag_avvist
