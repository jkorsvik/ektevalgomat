context_note: >
  Ingen posisjon kodet, og det er et resultat, ikke en mangel på arbeid.
  KrF stemte for det saklige forslaget om foreldelsesfrist (18486) og for
  tilrådingen som forkastet hele dokumentet (18487). En stemme kan ikke
  leses som retning når partiet selv gikk begge veier i samme sak, og
  reglene i tools/autopilot/method/history.md sier at en deling eller en
  selvmotsigende kilde ikke er en posisjon. Cellen har fra før en KrF-rad
  datert 2026-04-30 kodet +1 (votering 27523, der KrF stemte for uten
  motstemme); den står uendret. Denne raden gir cellen en andre dato for
  *atferd*, men ikke en andre kodet posisjon, så konsistensscoren for
  KrF er fortsatt utilstrekkelig grunnet. Les votering 18487 invertert:
  «vedtas ikke» betyr at ja er nei til forslaget.
