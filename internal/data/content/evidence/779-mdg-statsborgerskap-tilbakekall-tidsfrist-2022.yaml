scan_summary: "MDG stemte for SV og Rødts forslag om en foreldelsesfrist for tilbakekall av statsborgerskap — falt 21 mot 83."
claim_action: >
  MDG stemte for forslag nr. 1 i Dokument 8:75 S (2021–2022), som ba
  regjeringen «utrede og fremme forslag om en foreldelsesfrist som etter
  en gitt tid avskjærer anledningen til å tilbakekalle et statsborgerskap».
  Votering 18486 (07.04.2022) avgjorde forslag nr. 1, 2 og 3 i én
  avstemning; nr. 2 gjaldt en frist fra forhåndsvarsel til vedtak og nr. 3
  et krav om dobbelt statsborgerskap ved tilbakekall. MDG 2 for / 0 mot.
  Forslaget falt 21 mot 83.
status: forslag_avvist_stemte_for
position: 1
source_tier: A
source_name: "Dokument 8:75 S (2021–2022); votering 18486 (07.04.2022)"
source_url: "https://data.stortinget.no/eksport/voteringsresultat?voteringid=18486&format=json"
claim_confidence: dokumentert
evidensstyrke_cap: moderat
context_note: >
  MDG var ikke blant forslagsstillerne i 2022 — forslaget var SV og Rødts — så
  grunnlaget i denne raden er avstemningen alene, og en avstemning uten eget
  forslag eller egen tekst er magnituden 1 etter
  tools/autopilot/method/position-scale.md. Den ble først kodet 2 med
  2026-medforslagsstillerskapet som begrunnelse, men en datert rad kan ikke låne
  styrke fra et annet år: da rapporterer 2022-stemmen en styrke bare et
  2026-dokument støtter, og årssammenligningen blander styrker som aldri ble
  observert samtidig. Den eksisterende MDG-raden datert 2026-04-30 bærer +2 fra
  Innst. 232 S forslag 4, som MDG fremmet sammen med SV og Rødt, og den står
  uendret. Cellen er dermed en middelverdi av 2 og 1, ikke 2 og 2.
  Sitatet i claim_action er forslagsteksten, ikke stemmetallene: den ligger i
  https://data.stortinget.no/eksport/voteringsforslag?voteringid=18486 (samme
  votering). source_url peker på voteringsresultat, som bare inneholder
  representantenes stemmer og ikke ordet «foreldelsesfrist». Begge er nødvendige:
  teksten bærer påstanden, tellingen bærer retningen.
