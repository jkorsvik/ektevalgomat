context_note: >
  Andre dato i cellen, og magnituden må leses nøye. I 2022 var MDG ikke
  blant forslagsstillerne — forslaget var SV og Rødts — så retningen
  kommer fra avstemningen alene, som er et svakere instrument enn et eget
  forslag og isolert sett gir 1. Den eksisterende MDG-raden er datert
  2026-04-30 og koder +2 fra Innst. 232 S forslag 4, som MDG fremmet
  sammen med SV og Rødt. Etter regelen i tools/autopilot/method/
  position-scale.md om at det sterkeste entydige egne instrumentet
  bestemmer magnituden, og at et svakere dokument ikke kan trekke den ned,
  kodes denne raden 2: retningen er 2022-stemmen, magnituden er
  medforslagsstillerskapet i 2026. Cellen står dermed uendret på +2, og
  ingen leser kan tro at 2022-stemmen alene ga 2.
