claim_confidence: dokumentert
context_note: >
  Andre dato i cellen: den eksisterende Rødt-raden 484 er datert 2026-04-30
  og koder +2 fra Innst. 232 S forslag 4, som Rødt fremmet sammen med SV og
  MDG. Rødt har i tillegg raden 480, kodet -1, fra votering 27524 i samme
  sak, så cellen er allerede en mellomting; denne raden endrer ikke det
  bildet. Magnituden 2 bæres av at Rødt selv sto bak forslaget i begge
  sesjoner, ikke av avstemningen alene.
