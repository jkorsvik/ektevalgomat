scan_summary: "Rødt foreslo sammen med SV en foreldelsesfrist for tilbakekall av statsborgerskap og stemte for sitt eget forslag — falt 21 mot 83."
claim_action: >
  Rødt sto bak forslag nr. 1 i Dokument 8:75 S (2021–2022), som ba
  regjeringen «utrede og fremme forslag om en foreldelsesfrist som etter
  en gitt tid avskjærer anledningen til å tilbakekalle et statsborgerskap
  etter statsborgerloven § 26 annet ledd», med unntak for misbruk og for
  dem som bruker flere identiteter ved alvorlig kriminalitet. Votering
  18486 (07.04.2022) avgjorde forslag nr. 1, 2 og 3 i én avstemning; nr. 2
  gjaldt en frist fra forhåndsvarsel til vedtak, nr. 3 et krav om dobbelt
  statsborgerskap ved tilbakekall. Rødt 4 for / 0 mot. Forslaget falt 21 mot 83.
