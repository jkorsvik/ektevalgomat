scan_summary: "Venstre stemte for SV og Rødts forslag om en foreldelsesfrist for tilbakekall av statsborgerskap — falt 21 mot 83."
claim_action: >
  Venstre stemte for forslag nr. 1 i Dokument 8:75 S (2021–2022), som ba
  regjeringen «utrede og fremme forslag om en foreldelsesfrist som etter
  en gitt tid avskjærer anledningen til å tilbakekalle et statsborgerskap».
  Votering 18486 (07.04.2022) avgjorde forslag nr. 1, 2 og 3 i én
  avstemning; nr. 2 gjaldt en frist fra forhåndsvarsel til vedtak og nr. 3
  et krav om dobbelt statsborgerskap ved tilbakekall. Venstre 4 for /
  0 mot. Forslaget falt 21 mot 83.
status: forslag_avvist_stemte_for
position: 1
source_tier: A
source_name: "Dokument 8:75 S (2021–2022); votering 18486 (07.04.2022)"
source_url: "https://data.stortinget.no/eksport/voteringsresultat?voteringid=18486&format=json"
claim_confidence: dokumentert
evidensstyrke_cap: moderat
context_note: >
  Andre dato i cellen: den eksisterende Venstre-raden er datert 2026-04-30
  og koder +1 fra votering 27523, også den uten egen merknad. +1 og ikke
  +2 fordi forslaget var SV og Rødts, ikke Venstres. I votering 18486 var
  Venstre samlet (4 for / 0 mot), men i den avsluttende votering 18487 om
  tilrådingen delte partiet seg 3 for / 1 mot; delingen gjelder
  tilrådingen om at dokumentet «vedtas ikke», ikke forslaget om
  foreldelsesfrist, og derfor er den ikke brukt som grunnlag her.
  Sitatet i claim_action er forslagsteksten, ikke stemmetallene: den ligger i
  https://data.stortinget.no/eksport/voteringsforslag?voteringid=18486 (samme
  votering). source_url peker på voteringsresultat, som bare inneholder
  representantenes stemmer og ikke ordet «foreldelsesfrist». Begge er nødvendige:
  teksten bærer påstanden, tellingen bærer retningen.
