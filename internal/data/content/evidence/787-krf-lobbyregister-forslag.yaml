scan_summary: "KrF stemte mot Fiskaa-forslaget om å utrede en registreringsordning for dem som oppsøker Stortinget — falt 15 mot 87."
claim_action: >
  KrF stemte mot forslag nr. 1 og 2 fra femte visepresident Ingrid Fiskaa
  (SV), som ba Stortingets presidentskap og regjeringen «utrede mulige
  modeller for en registreringsordning for dem som oppsøker Stortinget og
  Stortingets representanter» og «den politiske ledelsen i departementene
  eller på Statsministerens kontor» i Dokument 8:165 S (2021–2022). Votering
  18941 (02.06.2022) avgjorde begge forslag i én avstemning. KrF 0 for / 2
  mot. Forslagene falt 15 for / 87 mot.
