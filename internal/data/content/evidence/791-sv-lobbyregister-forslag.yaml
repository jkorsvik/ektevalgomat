context_note: >
  Tidligere dato i cellen: avstemningen er fra 2022-06-02, før den
  eksisterende SV-raden datert 2026-04-21 som er kodet +2 (Voteringsdetaljer,
  forslag nr. 1–4, 21.04.2026). Retningen peker samme vei som i den
  eksisterende raden, men denne raden er svakere kodet. Batchen gir cellen tre
  tidligere datoer fra tre ulike sesjoner (2021–2022, 2022–2023, 2024–2025);
  denne raden koder bare det som ble stemt denne dagen og forutsetter ingen
  kontinuitet mellom dem. Om radene skal slås sammen til én celle, er det en
  eieravgjørelse; her rapporteres bare hva avstemningen viser.

  Magnituden er 1 og ikke 2: raden hviler på en avstemning partiet deltok i,
  ikke på et eget dokument som uttrykker kravet med et tall. Forslaget ber om
  at modeller for en registreringsordning utredes; det er ingen ferdig
  registreringsordning og ingen sum, og avstemningen er derfor et
  retningssignal og ikke et eget instrument.

  Saken hadde tre avstemninger: Rødts forslag nr. 3 om adgangskort for
  tidligere representanter (falt 15 mot 87), denne, og til slutt
  innstillingens tilråding om at «Dokument 8:165 S (2021–2022) … vedtas ikke»,
  som ble vedtatt 83 mot 19 (partiet 0 for / 8 mot). Les tilrådingen
  invertert: ja til «vedtas ikke» er nei til forslaget.

  Forslaget var SVs eget, fremmet av partiets femte visepresident Ingrid
  Fiskaa; dokumentet som lå til behandling var Venstres (Dokument 8:165 S
  (2021–2022)). Sesjonen er 2021–2022, avstemningen er fra en tidligere sesjon
  enn de eksisterende radene i cellen.
