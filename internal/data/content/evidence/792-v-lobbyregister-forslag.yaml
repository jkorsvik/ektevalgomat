scan_summary: "Venstre stemte mot Fiskaa-forslaget om å utrede en registreringsordning og samtidig mot tilrådingen som ville avvise partiets eget lobbyregisterforslag — ingen posisjon kodet."
claim_action: >
  Venstre stemte mot forslag nr. 1 og 2 fra femte visepresident Ingrid Fiskaa
  (SV), som ba Stortingets presidentskap og regjeringen «utrede mulige
  modeller for en registreringsordning for dem som oppsøker Stortinget og
  Stortingets representanter» og «den politiske ledelsen i departementene
  eller på Statsministerens kontor» i Dokument 8:165 S (2021–2022), og stemte
  deretter 0 for / 4 mot på innstillingens tilråding om at «Dokument 8:165 S
  (2021–2022) … vedtas ikke». Begge avstemningene gikk mot, men de peker på
  hver sin sak: nei til SVs utredningsforslag, og nei til å avvise Venstres
  eget lobbyregisterforslag. Votering 18941 (02.06.2022): V 0 for / 4 mot,
  forslagene falt 15 for / 87 mot.
