context_note: >
  Ingen posisjon kodet, og det er et resultat, ikke en mangel på arbeid.
  Venstre er partiet som fremmet Dokument 8:165 S (2021–2022), og partiet
  stemte 0 for / 4 mot både på Fiskaa-forslaget og på tilrådingen om at
  dokumentet «vedtas ikke». En -1 på denne raden ville melde at Venstre gikk
  mot et lobbyregister, og det er feil: partiet gikk mot å drepe sitt eget
  forslag og mot et konkurrerende utredningsforslag fra SV. De to stemmene
  peker på hver sin sak, og ingen retning for utsagnet kan leses ut av dem
  alene. Hvorfor Venstre stemte mot Fiskaa-forslaget er ikke dokumentert i
  voteringsdataene, og det spekuleres ikke i her.

  Cellen har fra før en V-rad datert 2025-11-25 kodet +2 (Dok. 8:53 S
  (2025–2026), partiets eget representantforslag). Den raden står uendret.
  Denne raden gir cellen en andre dato for atferd, men ingen kodet posisjon.

  Saken hadde tre avstemninger: Rødts forslag nr. 3 om adgangskort for
  tidligere representanter (falt 15 mot 87), denne, og til slutt
  innstillingens tilråding om at «Dokument 8:165 S (2021–2022) … vedtas ikke»,
  som ble vedtatt 83 mot 19 (partiet 0 for / 4 mot). Les tilrådingen
  invertert: ja til «vedtas ikke» er nei til forslaget.

  Sesjonen er 2021–2022, avstemningen er fra en tidligere sesjon enn de
  eksisterende radene i cellen.
