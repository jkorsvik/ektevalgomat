scan_summary: "Venstre stemte for Fiskaa-forslaget om å utrede en registreringsordning for dem som oppsøker Stortinget — falt 20 mot 81."
claim_action: >
  Venstre stemte for forslag nr. 1 og 2 fra femte visepresident Ingrid Fiskaa
  (SV), som ba Stortingets presidentskap og regjeringen «utrede mulige
  modeller for en registreringsordning for dem som oppsøker Stortinget og
  Stortingets representanter» og «den politiske ledelsen i departementene
  eller på Statsministerens kontor» i Dokument 8:223 S (2022–2023). Votering
  21354 (15.06.2023) avgjorde begge forslag i én avstemning. Venstre 4 for / 0
  mot. Forslagene falt 20 for / 81 mot.
