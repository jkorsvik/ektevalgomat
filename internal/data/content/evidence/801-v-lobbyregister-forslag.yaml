context_note: >
  Tidligere dato i cellen: avstemningen er fra 2023-06-15, før den
  eksisterende Venstre-raden datert 2025-11-25 som er kodet +2 (Dok. 8:53 S
  (2025–2026), partiets eget representantforslag). Retningen peker samme vei
  som i den eksisterende raden, men denne raden er svakere kodet. Batchen gir
  cellen tre tidligere datoer fra tre ulike sesjoner (2021–2022, 2022–2023,
  2024–2025); denne raden koder bare det som ble stemt denne dagen og
  forutsetter ingen kontinuitet mellom dem. Om radene skal slås sammen til én
  celle, er det en eieravgjørelse; her rapporteres bare hva avstemningen
  viser.

  Magnituden er 1 og ikke 2: raden hviler på en avstemning partiet deltok i,
  ikke på et eget dokument som uttrykker kravet med et tall. Forslaget ber om
  at modeller for en registreringsordning utredes; det er ingen ferdig
  registreringsordning og ingen sum, og avstemningen er derfor et
  retningssignal og ikke et eget instrument.

  Saken hadde to avstemninger: denne, og innstillingens tilråding om at
  «Dokument 8:223 S (2022–2023) … vedtas ikke», som ble vedtatt 82 mot 19
  (partiet 0 for / 4 mot). Les tilrådingen invertert: ja til «vedtas ikke» er
  nei til forslaget.

  Dokumentet som lå til behandling var Venstres eget (Dokument 8:223 S
  (2022–2023)), og Venstre stemte både for Fiskaas forslag og mot tilrådingen
  som ville avvise dokumentet; de to stemmene peker samme vei. Sesjonen er
  2022–2023, avstemningen er fra en tidligere sesjon enn de eksisterende
  radene i cellen.
