context_note: >
  Tidligere dato i cellen: avstemningen er fra 2025-06-19, før den
  eksisterende Ap-raden datert 2026-04-21 som er kodet -1 (Voteringsdetaljer,
  forslag nr. 1–4, 21.04.2026). Retningen er den samme i begge sesjoner.
  Batchen gir cellen tre tidligere datoer fra tre ulike sesjoner (2021–2022,
  2022–2023, 2024–2025); denne raden koder bare det som ble stemt denne dagen
  og forutsetter ingen kontinuitet mellom dem. Om radene skal slås sammen til
  én celle, er det en eieravgjørelse; her rapporteres bare hva avstemningen
  viser.

  Magnituden er 1 og ikke 2: raden hviler på en avstemning partiet deltok i,
  ikke på et eget dokument som uttrykker kravet med et tall. Forslaget ber om
  at det utredes hvordan et lobbyistregister kan innføres, og om et lovforslag
  på bakgrunn av utredningen; det er ingen ferdig registreringsordning og
  ingen sum, og avstemningen er derfor et retningssignal og ikke et eget
  instrument.

  Saken hadde tre avstemninger: Rødts forslag nr. 3–5 (falt 15 mot 87), denne,
  og den alternative avstemningen mellom innstillingen og Fiskaas forslag 1 og
  2, der tilrådingen om at «Dokument 8:241 S (2024–2025) … vedtas ikke» ble
  vedtatt 82 mot 20 (partiet 29 for / 0 mot). Les tilrådingen invertert.

  Forslaget var SVs, ikke Aps; dokumentet som lå til behandling var Rødts
  (Dokument 8:241 S (2024–2025)). Sesjonen er 2024–2025, avstemningen er fra
  en tidligere sesjon enn de eksisterende radene i cellen.
