scan_summary: "Ap stemte mot Fiskaa-forslaget om å utrede en registreringsordning for dem som oppsøker Stortinget — falt 20 mot 82."
claim_action: >
  Ap stemte mot forslag nr. 1 og 2 fra femte visepresident Ingrid Fiskaa (SV):
  nr. 1 ba presidentskapet «utrede og legge frem forslag til hvordan en
  registreringsordning for lobbyister som oppsøker Stortinget … kan innføres
  gjennom endringer i Stortingets forretningsorden», nr. 2 ba regjeringen
  nedsette et utvalg om «et lobbyistregister hjemlet i åpenhetsloven eller
  annen egnet lov» med registrerings- og innrapporteringsplikt og adgang til
  sanksjoner i Dokument 8:241 S (2024–2025). Votering 26219 (19.06.2025)
  avgjorde begge forslag i én avstemning. Ap 0 for / 29 mot. Forslagene falt
  20 for / 82 mot.
