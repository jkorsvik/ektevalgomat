claim_confidence: dokumentert
context_note: >
  Institusjonell kontekst, ikke en partiposisjon i seg selv. Sak_id
  102973 kryssjekket mot data.stortinget.no/eksport/sak (status
  behandlet, henvisning Dokument 8:166 S, Innst. 535 L, Lovvedtak 135,
  alle 2024-2025). 17 separate voteringer eksisterer på denne saken
  (votering_id 26113-26129); denne evidensfilen og partienes egne
  filer dekker kun votering_id 26116 (Rødts egen makspris-blokk), den
  ene voteringen som direkte tester DETTE utsagnets konkrete krav —
  ikke Norgespris-lovens vedtakelse for øvrig, ikke de andre 15
  voteringene om moms, nettleiemodell, forbrukstak eller flat
  utbetaling, som hver tester andre, distinkte spørsmål og ikke bør
  slås sammen til én enkelt partiposisjon. Se docs/research-notes/
  dimension-2-3-leads.md for hvorfor denne saken tidligere ikke ble
  kodet direkte (fire distinkte politikkspørsmål i én lov).
