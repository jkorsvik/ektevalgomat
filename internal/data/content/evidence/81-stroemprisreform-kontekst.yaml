scan_summary: >
  Stortinget behandlet regjeringens Norgespris-lov sammen med tre
  opposisjonsforslag i én innstilling. Rødts forslag om en lovbestemt
  nasjonal makspris på 35 øre/kWt ble avvist 96 mot 5 stemmer; loven om
  Norgespris ble vedtatt 59 mot 43.
claim_action: >
  Prop. 148 L (2024–2025, lov om Norgespris og strømstønad),
  Dokument 8:82 S, Dokument 8:136 S og Rødts Dokument 8:166 S
  (2024–2025, Sofie Marhaug, Seher Aydar, Mímir Kristjánsson, Tobias
  Drevland Lund) ble behandlet samlet i Innst. 535 L (2024–2025,
  3554-linjers PDF lest i fulltekst). Rødts Dokument 8:166 S inneholdt
  forslag 1 (senere nummerert forslag 14 i innstillingen): "Stortinget
  ber regjeringen legge fram forslag om en nasjonal makspris for hva
  kraftselskapene kan selge strømmen for innenlands. Nivået bør være
  på 35 øre/kWt i 2025." Dette forslaget ble votert som del av en
  samlet R-blokk (forslag 12-23, votering_id 26116, sak_id 102973):
  5 for (kun Rødt), 96 mot. Norgespris-loven selv (Innstillingens
  tilråding, votering_id 26128) ble vedtatt 59 mot 43, støttet av Ap
  og Rødt sammen i komiteen, men Rødts EGET makspris-alternativ ble
  avvist av alle de andre åtte partigruppene samlet.
status: avvist_av_flertallet_lov_vedtatt
