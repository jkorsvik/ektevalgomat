context_note: >
  Hvem som står bak: merknaden er skrevet av «Komiteens medlem fra Rødt»
  (avsnittet åpner «Komiteens medlem fra Rødt viser til Rødts alternative
  statsbudsjett ...») under overskriften «2.6 Generelle merknader fra Rødt»,
  og komiteens eneste Rødt-medlem er oppgitt i innstillingens innledning:
  «fra Rødt, Hege Bae Nyholt». Sitatet er hentet fra merknaden og måler
  127 tegn, både som skrevet og normalisert (126 som søkefragment), og gir et
  arkivvindu på 1 006 tegn med build_archive.locate, altså godt under grensen
  på 6 000; gate.py finner fragmentet som delstreng i kilden.
  Kodet +1, ikke +2: merknaden angir en retning uten et eget instrument med
  et tall. Det er nettopp forskjellen mellom denne raden og SV-kolonnen i
  samme tabell, der posten bærer 415 000. Rødts egen tabellkolonne viser 0(0)
  på posten, så det finnes ikke noe bevilgningstall å måle mot, og regelen om
  at eget instrument med tall gir magnitude 2 er ikke oppfylt.
  Forbehold som leseren må få: jeg kunne ikke avgjøre hvor — eller om — Rødt
  finansierer ordningen. Innst. 12 S dekker bare rammeområde 16
  (Kunnskapsdepartementet), så en finansiering lagt til kommunerammen ville
  ikke synes i denne tabellen i det hele tatt, og Rødts samlede alternative
  budsjett er ikke i kildematerialet jeg har tilgang til her. Merknaden lover
  også «midler til å ansette flere i SFO» uten at Rødt har noe avvik på
  SFO-posten (kap. 225 post 62 har 0 i Rødts kolonne, forliket +142 000), som
  trekker i samme retning: merknaden varsler tiltak som ikke er synlige som
  poster i rammeområde 16. Merknaden motsies derfor ikke av Rødts tall — det
  står ingen tall der — men den bekreftes heller ikke. Skolemat står ikke i
  komiteens tilråding (kapittel 15 bokstav a, fremmet av Ap, SV, Sp og R;
  kap. 200 fører der ingen post 70), og kapittel 14 «Forslag fra mindretall»
  inneholder bare åtte verbalforslag (FrP/H/V, FrP/KrF/V og V), ingen av dem
  om skolemat.
  At utsagnet er reelt og ikke retorisk viser samme innstilling punkt 13
  «Oppfølging av anmodningsvedtak», tabell 3.1: anmodningsvedtak nr. 63 for
  sesjonen 2024–2025 har stikkordet «opptrappingsplan for skulemåltid i
  grunnskulen» og er ført opp som fulgt opp (ja). Det er nettopp den planen
  utsagn-35 ber regjeringen legge fram.
  Dokumentet er datert «Oslo, i utdannings- og forskningskomiteen, den
  11. desember 2025»; raden er den nyeste i cellen og setter dermed Rødts
  publiserte posisjon på utsagn-35 til +1, som er samme verdi som før.
