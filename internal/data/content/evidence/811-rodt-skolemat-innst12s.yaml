scan_summary: >
  Rødt foreslår i merknaden en gratis skolemat-ordning i grunnskolen, men
  bevilger 0 på den eneste skolemat-posten i sitt eget budsjett i samme
  dokument. Posten gjelder ungdomstrinnet mens merknaden gjelder hele
  grunnskolen, så raden sier ikke at Rødt bevilger ingenting til skolemat.
claim_action: >
  I Innst. 12 S (2025–2026) punkt 2.6 «Generelle merknader fra Rødt» skriver
  Rødt: «Videre foreslår Rødt en ordning for gratis skolemat i grunnskolen,
  slik at alle elever får tilgang på et sunt måltid på skolen.» Merknaden
  begrunner det med forsøkene rundt om i landet og viser til «Rødts
  alternative statsbudsjett». Samtidig har Rødt egen kolonne i tabellen i
  punkt 3, og der står posten «70 Innføre gratis skolemåltid for alle elever
  på ungdomstrinnet fra skoleåret 2026/2027» under kap. 200 med 0(0) i Rødts
  kolonne — ingen bevilgning og ingen avvik fra regjeringens 0. Merknaden er
  altså en uttalt intensjon som ikke følges av et tall på den eneste
  skolemat-posten i samme dokument. Rødts avvik i rammeområde 16 ligger på
  helt andre poster, og de største er kap. 231 post 60 «Toppet bemanning i
  barnehagene» +1 591 347, kap. 2410 post 50 «Avsetning til utdanningsstipend»
  +1 346 400, kap. 2410 post 70 «Utdanningsstipend» +157 400 og kap. 270
  post 75 «Tilskudd til bygging av studentboliger» +130 230 (i tusen kroner);
  ingen av de 15 postene med avvik i Rødts kolonne er skolemat, og summen
  deres er 3 271 055, som er dokumentets egen sum for kolonnen.
