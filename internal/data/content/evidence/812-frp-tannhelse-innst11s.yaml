claim_confidence: dokumentert
context_note: >
  Setningen er signert av Fremskrittspartiet, Høyre og Kristelig Folkeparti i
  fellesskap («Komiteens medlemmer fra Fremskrittspartiet, Høyre og Kristelig
  Folkeparti») — ikke av FrP alene, og sitatet må leses slik. Høyres og KrFs
  navn står på samme setning, så raden kan ikke brukes til å skille de tre
  partiene fra hverandre. FrP har i tillegg egne merknader i samme innstilling
  som peker samme vei: om etterslepet for «eldre, langtidssyke og uføre i
  institusjonspleie og hjemmesykepleie» (punkt 3.37) og om stønadspunkt 14
  (punkt 3.41). Kodet +1, ikke +2: de 35 000 i FrPs kolonne er et tall for
  posten — en reversering av et kutt i en eksisterende stønadsordning — ikke
  et tall som uttrykker hvor sterk den målrettede posisjonen er. En
  fellesmerknad som angir en retning er heller ikke et eget instrument, så
  styrken kan ikke bli 2. Dette er samme posisjon som den eksisterende raden
  ev-2025-06-04-frp-tannhelse-universell-mot (2025-06-04, +1, fra voteringa den
  raden selv siterer), nå med en skriftlig begrunnelse FrP faktisk står bak; den raden
  hadde attribution_confidence: svakt_dokumentert nettopp fordi FrP den gang
  ikke hadde noen merknad om spørsmålet. Ingen egen votering om tannhelse
  finnes i punkt 5 «Forslag fra mindretall», så posisjonen er kodet fra
  merknaden.
