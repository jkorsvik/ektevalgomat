scan_summary: >
  Fellesmerknaden fra FrP, Høyre og KrF sier at det «burde vært en prioritet å
  styrke tannhelsetjenesten til de som særlig trenger den – og ikke til hele
  befolkningen», og FrPs egen kolonne legger 35 000 (tusen kroner) på kap.
  2711 post 72.
claim_action: >
  I punkt 3.37 «Kap. 770 Tannhelsetjenester» skriver «Komiteens medlemmer fra
  Fremskrittspartiet, Høyre og Kristelig Folkeparti» at det er etterslep i
  tannbehandlingene for prioriterte grupper, «slik som eldre som bor på
  institusjon, og det burde vært en prioritet å styrke tannhelsetjenesten til
  de som særlig trenger den – og ikke til hele befolkningen». Det er den
  målrettede linjen utsagnet spør om, ordrett. FrPs egen kolonne i punkt 2.8
  «Oversikt over forslag til bevilgninger under rammeområde 15» (i tusen
  kroner) er 3 192 400 (+35 000) på rad 2711 post 72 Tannbehandling mot
  regjeringens 3 157 400, og 453 447 (0) på kap. 770 post 70 Tilskudd.
  Kolonneoverskriften er «Kap. Post Formål Prop. 1 S (2025-2026) A, SV, Sp, R
  og MDG FrP H SV R KrF», så FrP er kolonnen rett etter forlikskolonnen. De 35
  mill. kronene er reverseringen av stønadspunkt 14, som FrP selv omtaler i
  punkt 3.41: «Disse medlemmer viser til Fremskrittspartiets alternative
  budsjettforslag, hvor det forslås å reversere dette kuttet og tilbakeføre
  midlene på 35 mill. kroner.»
verbatim_excerpt: >
