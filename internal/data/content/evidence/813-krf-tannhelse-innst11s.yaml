context_note: >
  Setningen er signert av Høyre og Kristelig Folkeparti i fellesskap
  («Komiteens medlemmer fra Høyre og Kristelig Folkeparti»), ikke av KrF alene,
  og sitatet må leses slik. Høyres navn står på samme setning, så raden kan
  ikke brukes til å skille de to partiene fra hverandre, og den kan heller ikke
  leses som en H-linje: Høyres posisjon på utsagn-25 er kodet særskilt i
  ev-2025-06-04-h-tannhelse-universell-mot (+2) og berøres ikke her. Kodet +1,
  ikke +2: en fellesmerknad som angir en retning er ikke et eget instrument i
  position-scale.md sin forstand, og KrFs 35 000 i kolonnen er et tall for
  posten — reverseringen av et kutt i en eksisterende stønadsordning — ikke et
  tall som uttrykker hvor sterk den målrettede posisjonen er. KrFs EGEN merknad
  i punkt 2.7 sier noe annet og skal ikke leses som det samme: «Intensjonen om
  å gjøre tannhelse til en tilgjengelig og sosialt utjevnende del av
  helsetjenesten er god, og dette medlem ønsker på sikt en frikortordning for
  tannhelsebehandling. Likevel mener dette medlem at prioriteringen i dagens
  situasjon er feil.» Her er innvendingen budsjettprioritering og ikke
  universell rett mot målrettet: samme medlem begrunner den med at «når
  sykehusene mangler midler til aktivitetsvekst, når eldreomsorgen knaker i
  sammenføyningene, og når rusomsorgen i kommunene kuttes, er det ikke riktig å
  bruke hundrevis av millioner på tannhelse før de mest grunnleggende
  helsetjenestene er sikret». Det er derfor den andre setningen — H+KrF-
  merknaden i punkt 3.37 — er det som bærer utsagnet, og ikke denne. Spenningen
  står likevel ved lag og skal ikke glattes ut: KrF vil «på sikt» ha en
  frikortordning for tannhelsebehandling, og en frikortordning er nettopp ett av
  modellalternativene anmodningsvedtak nr. 67 (2025–2026) ber om («Minst én
  modell skal ha en frikortordning/egenandelstak», sitert i punkt 3.37) — altså
  en retning mot uenig-polen, men uttrykkelig «på sikt». Ingen egen votering om
  tannhelse finnes i punkt 5 «Forslag fra mindretall»; tilrådingen er fremmet av
  medlemmene fra Ap, SV, Sp og Rødt, og den vedtatte bevilgningen på kap. 2711
  post 72 er 3 508 140 000 kroner (punkt 6), altså forlikskolonnen og ikke KrFs
  tall. Dokumentet er datert «Oslo, i helse- og omsorgskomiteen, den 8. desember
  2025».
