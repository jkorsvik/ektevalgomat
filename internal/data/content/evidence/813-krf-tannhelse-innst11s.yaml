scan_summary: >
  KrF sier rett ut at det er «feil å prioritere utvidelser av tannhelsetjenester
  til alle, all den tid de som trenger det mest, ikke får hjelpen de trenger,
  når de trenger den», og legger ingen egne midler på tannhelse ut over de 35
  mill. kronene som reverserer kuttet i stønadsordningen for personer med
  nedsatt evne til egenomsorg.
claim_action: >
  I punkt 3.37 «Kap. 770 Tannhelsetjenester» skriver «Komiteens medlemmer fra
  Høyre og Kristelig Folkeparti»: «Disse medlemmer mener det er feil å
  prioritere utvidelser av tannhelsetjenester til alle, all den tid de som
  trenger det mest, ikke får hjelpen de trenger, når de trenger den.» Det er
  utsagnets enig-pol ordrett: utvid mot dem som trenger det mest, ikke til
  alle. Tallene står i punkt 2.8 «Oversikt over forslag til bevilgninger under
  rammeområde 15» (alle tall i tusen kroner): KrFs kolonne på rad 2711 post 72
  Tannbehandling er 3 192 400 (+35 000) mot regjeringens 3 157 400, altså 1,1
  pst. over regjeringens forslag, og kap. 770 post 70 Tilskudd står uendret på
  453 447 (0). De 35 mill. kronene er nøyaktig det KrF fører opp i sin egen
  tiltaksliste i punkt 2.7: «2711 72 Tannhelsestønad for personer med nedsatt
  evne til egenomsorg, reversere kutt 35,0». Kolonneoverskriften i punkt 2.8 er
  ordrett «Kap. Post Formål Prop. 1 S (2025-2026) A, SV, Sp, R og MDG FrP H SV
  R KrF», så KrF er den siste kolonnen. Regjeringens 3 157 400 er hentet fra
  punkt 1.1 «Oversikt over regjeringens budsjettforslag», kolonnen «Prop. 1 S
  (2025-2026) Gul bok», der posten står med 3 157 400 000 kroner. Ingen
  tabellrad er sitert: målt med build_archive.locate() krever selv det korte
  utsnittet «72 Tannbehandling 3 157 400 3 508 140 (+350 740)» et arkivvindu
  på 11 379 tegn, og hele raden 13 174, mot grensen på 6 000 i
  TestWindowsStayBounded. Tallene er derfor gjengitt her og sitatet er
  merknadsprosa — samme grep som i 768-h-skatteniva-innst2s.yaml.
