context_note: >
  Kodet +1. «År for år» er den bærende formuleringen: Rødt beskriver en
  gradvis opptrapping, ikke en bindende universell rett innen 2030, og det er
  mekanismen utsagnet spør om. Det er konsistent med Rødts egen stemme
  2025-06-04 (rad ev-2025-06-04-rodt-tannhelse-universell-mot, +1, i voteringa
  den raden siterer: Rødt 0 for og 5 mot SVs forslag om en bindende
  2030-frist). Samtidig
  viser samme merknad hvorfor kodingen ikke kan bli ren: Rødt skriver at
  «[d]ette medlem peker på at det er nødvendig å sikre like helserettigheter
  til alle» og at «[m]ålet for helsepolitikken må være å utjevne forskjellene
  og sikre lik rett til helsehjelp for alle» — en universalistisk ambisjon som
  ligger nærmere uenig-polen enn regjeringens linje i punkt 3.37 (høringsnotat
  høsten 2026, oppstart 2027). Raden koder mekanismen (utvidelse år for år,
  med et eget tall) og ikke den langsiktige målsetningen, som Rødt selv
  beskriver som likestilling. At Rødt har et eget budsjettall på posten gir ikke
  styrke 2: etter position-scale.md må tallet bære selve påstanden, og
  +3 732 700 er en bevilgning til utvidelse av tannbehandling, ikke et tall som
  uttrykker hvor sterk forpliktelsen mot en universell rett er. Det er samme
  linje som avgjørelsen i krf-skatteniva-polarity: et tall som ikke uttrykker
  påstanden direkte gir ikke styrke 2 og kan heller ikke flytte cellen. Radene
  767–772 koder riktignok partikolonner i et budsjett til ±2, men der ER tallet
  påstanden — skatte- og avgiftsnivået selv, sitert som radens egen tabellinje.
  Her er posten et virkemiddel, ikke påstanden. Rødts merknad uttrykker
  dessuten begge retninger, og en selvmotsigende kilde kan etter samme regel
  ikke flytte cellen i noen retning. Punktet er flagget i NOTES.md, ikke
  avgjort her.
  Ingen egen votering om tannhelse finnes i punkt 5 «Forslag fra mindretall».
