scan_summary: >
  Rødt vil «likestille tannhelse med andre helsetjenester, gjennom en
  utvidelse år for år» og mer enn dobler kap. 2711 post 72 i sitt alternative
  budsjett, uten å binde seg til en universell rett innen 2030.
claim_action: >
  Rødts egen merknad (punkt 2.6 «Generelle merknader fra Rødt») sier: «Målet
  er å likestille tannhelse med andre helsetjenester, gjennom en utvidelse år
  for år», og viser til at Rødt «i sitt alternative budsjett starter
  innfasingen av en ordentlig tannhelsereform med å ta regningen for folk med
  de største utgiftene». Rødts kolonne i punkt 2.8 «Oversikt over forslag til
  bevilgninger under rammeområde 15» (i tusen kroner) er 6 890 100 (+3 732
  700) på rad 2711 post 72 Tannbehandling mot regjeringens 3 157 400 — 2,2
  ganger regjeringens tall, altså mer enn en dobling — og 463 447 (+10 000) på
  kap. 770 post 70 Tilskudd mot regjeringens 453 447. Kolonneoverskriften er
  «Kap. Post Formål Prop. 1 S (2025-2026) A, SV, Sp, R og MDG FrP H SV R KrF»,
  så Rødt er nest siste kolonne. Rødts egen tiltaksliste i punkt 2.6 summerer
  seg til samme avvik: 3 000 (egenandelstak på 2 500 kroner og 40 pst.
  refusjon over dette) + 382 (gratis tannregulering for alle opp til 18 år) +
  316 (refusjonsordningene for tannlegebehandling opp 10 pst.) + 35 (reversere
  kutt i stønadspunkt 14) = 3 733 mill. kroner, mot 3 732 700 i kolonnen;
  differansen er avrunding til hele millioner i tiltakslisten. Kap. 770 post
  70 svarer til tiltakslisten «770 70 Styrke TOO-ordningen ... 10».
