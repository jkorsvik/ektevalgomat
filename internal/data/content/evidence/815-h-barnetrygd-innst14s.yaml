context_note: >
  Kodet +1. Retningen hviler på hvilket virkemiddel Høyre velger: Høyre
  legger sin egen prisjustering i det årlige budsjettet, med et tall mot
  regjeringens forslag (punkt 3.38), ikke i en lovfestet automatikk.
  Styrken er 1 og ikke 2 fordi tallet i merknaden gjelder nivået på
  bevilgningen, ikke mekanismen; ingen setning i merknaden uttaler seg
  om satsen skal lovfestes. Etter position-scale.md er det egne
  instrumentet med tall magnitude 2 når tallet ER kravet, slik som i
  768-h-skatteniva-innst2s; her er tallet en bevilgning for ett
  budsjettår, og mekanismen er en slutning fra virkemiddelet.
  Motlesningen hører med og er ikke skjult: Høyres generelle merknad
  (punkt 3.3.3, normert offset 47 097) sier at Høyre «foreslår å
  prisjustere barnetrygden i takt med prisveksten i resten av samfunnet
  for alle barn over seks år», med begrunnelsen at regjeringen «nok en
  gang foreslår å gjøre barnetrygden mindre verdt neste år». Det er
  indekseringsargumentet, som i en programtekst ville ligge nær
  minus-siden av utsagn-31. Kodet +1 fordi utsagn-31 skiller på
  virkemiddel («fastsettes i de årlige statsbudsjettene, ikke lovfestes
  med en automatisk årlig prisjustering»), og Høyres tall her er en
  bevilgning for 2026 med startdato 1. februar 2026, ikke en lovendring
  og ikke en stående formel. Dokumentet har «lovfest» 0 forekomster og
  «indeksregulering» 0 forekomster (målt i den maskinelt uttrukne
  teksten, 931 377 tegn, re-ekstrahert med
  tools/verify/verify_excerpts.to_text), så det sier ikke selv at
  barnetrygden ikke skal lovfestes. Det er grunnen til at raden ikke
  koder sterkere, og grunnen til at en leser som vektlegger
  indekseringsargumentet kan lande på 0.
  Ulikheten mellom de to Høyre-merknadene («alle barn over seks år» mot
  «alle barn») er ikke oppklart her. Sitatet er hentet fra
  kap. 845-fragmentet fordi det bærer både startdato og beløp; punkt
  3.3.3 ligger FORAN punkt 3.12 i dokumentet og kunne derfor ikke
  legges til som et andre fragment etter hovedsitatet.
  Samme celle: 116-h-barnetrygd-prisjustering-mot.yaml (2026-02-10,
  Innst. 126 S) koder H også +1. Denne raden er
  eldre, så cellens heltall står uendret; den gir cellen en andre dato
  og et andre år (2025). Se
  evidence/111-barnetrygd-prisjustering-kontekst.yaml.
