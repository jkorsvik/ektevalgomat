scan_summary: >
  Høyre prisjusterer barnetrygd for alle barn i sitt alternative budsjett
  for 2026 og foreslår å øke kap. 845 post 70 med 609 mill. kroner, altså
  gjennom den årlige budsjettbehandlingen og ikke gjennom en lovendring.
claim_action: >
  I Innst. 14 S (2025–2026) punkt 3.12.1 (kap. 845 post 70 tilskudd,
  overslagsbevilgning) begrunner Høyres medlemmer i familie- og
  kulturkomiteen sin egen barnetrygdbevilgning med at barnetrygden skal
  prisjusteres for alle barn fra 1. februar 2026, og at posten derfor
  foreslås økt med 609 mill. kroner. Beløpet står også i innstillingens
  tabell under punkt 3.38 ("Oversikt over fraksjonenes forslag til
  bevilgninger under rammeområde 2", tall i tusen kroner): kap. 845
  post 70 er oppført med 29 700 000 kroner i Prop. 1 S (2025–2026) og
  30 309 000 (+609 000) i Høyres kolonne. Prisjusteringen gis i Høyres
  alternative budsjett for 2026, det vil si i den årlige
  budsjettbehandlingen. Posten har ingen avstemming i dette dokumentet: en
  innstilling inneholder ingen avstemmingstall.
  Tabelltallene ligger i claim_action og ikke i sitatet; det er bare
  609 mill. kroner som står ordrett i sitatet over.
verbatim_excerpt: >
  "Disse medlemmer viser til at økt barnetrygd er et av de mest effektive
  tiltakene mot barnefattigdom, og at dersom barnetrygden ikke
  prisjusteres, mister den mer og mer av sin viktige betydning for
  småbarnsforeldres økonomi og inntekt. Disse medlemmer viser til Høyres
  alternative budsjett, der barnetrygden prisjusteres for alle barn fra
  1. februar 2026, og det derfor foreslås å øke posten med 609 mill.
  kroner."
