context_note: >
  Kodet -1: voteringen gjelder et forslag som ber regjeringen legge fram
  en plan med sikte på gradvis innføring av et skolemåltid i grunnskolen, som er
  samme spørsmål som utsagnet (en opptrappingsplan for et daglig skolemåltid for
  alle elever i grunnskolen). Voteringen delte partiene (9 for, 95 mot nasjonalt).
  KrF stemte mot både Sp/SVs plan (6375) og Ap sitt forslag nr. 1 (6376: KrF 0 for, 6 mot). Dagens celle (2024-11-28) er kodet +1 (forslag vedtatt, KrF stemte for), sa dette er en dokumentert endring fra -1 i 2015 til +1 i 2024. Rettet 2026-11-09: notatet sa feilaktig at dagens celle var -1.
  Saken hadde tre voteringspunkter: 6375 (forslag nr. 2 fra Sp og SV, kodet her), 6376 (forslag nr. 1 fra A, ikke kodet) og 6377 (komiteens tilråding om at dokumentet vedlegges protokollen, enstemmig vedtatt uten tall). Forslaget er ikke en «vedtas ikke»-tilråding, så for/mot leses rett fram.
