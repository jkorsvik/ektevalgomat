context_note: Votering 9080 (2017-05-30), forslag nr. 12 fra SV om å «opprette et statlig mineralselskap
  som kan bidra til at det tas hensyn til miljø og lokalsamfunn ved ny utvinning av mineraler». Samme
  instrument som utsagn-17 spør om (et eget statlig mineralselskap), men formålet er formulert som miljø-
  og lokalsamfunnshensyn. Saken (Dok 8:41 S (2016–2017) fra Ap) hadde også voteringspunktene 9081–9085
  om mineralstrategi, avfall, gjenvinning og en stortingsmelding — andre spørsmål, ingen av dem et alternativ
  til spørsmålet om å opprette et statlig selskap. Rødt hadde ingen stemmende representant og får ingen
  rad. Partitallet er 0 for og 6 mot for Senterpartiet, hentet fra voteringsresultatet for 9080. Posisjonen
  er kodet til -1 fordi bare stemmetallet er dokumentert, ikke en egen begrunnelse fra partiet.
