context_note: Votering 17035 (2021-06-04), forslag nr. 6 fra SV om å «foreslå opprettelse av et statlig
  mineralselskap som kan drive utforskning og utvinning av mineraler» — samme spørsmål som utsagn-17,
  nesten ord for ord. Saken var minerallovsaken (Prop. 124 L (2020–2021) med mindretallsforslag); de øvrige
  voteringspunktene gjelder lovtekst, kartleggingstempo, mineralstrategi og rekkefølgekrav, altså andre
  spørsmål. Senterpartiet stemte 6 for og 3 mot og er ikke kodet (en splitt er ikke en posisjon). MDG
  og Rødt var ikke til stede i voteringen og får ingen rad. Partitallet er 0 for og 3 mot for Venstre,
  hentet fra voteringsresultatet for 17035. Posisjonen er kodet til -1 fordi bare stemmetallet er dokumentert,
  ikke en egen begrunnelse fra partiet.
