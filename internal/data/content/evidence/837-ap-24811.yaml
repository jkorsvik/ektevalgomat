context_note: 'Votering 24811 (sak om Dok 8:112 S (2024–2025) fra Rødt om å få kontroll over datasenterindustrien),
  behandlet 2025-05-20. Voteringspunktet slår sammen forslag nr. 5 («Stortinget ber regjeringen utrede
  konsesjonsplikt for datasentre») og nr. 6 (nye generelle kriterier for nettilknytning i NEM). Forslaget
  ble ikke vedtatt: Rødt, SV, MDG og KrF stemte for; Ap, FrP, H, Sp og Venstre stemte mot. Ingen av de
  øvrige voteringspunktene i saken spør om det samme (24810 om 25 MW-grense og stortingsbehandling av
  krafttildeling, 24812 om overskuddsvarme, 24813 om midlertidig forbud mot ny utbygging, 24814 om kryptoutvinning),
  så ingen parti er utelatt etter utsagn-35-regelen. Forbehold: forslag nr. 5 og 6 er votert sammen, så
  en mot-stemme kan i prinsippet gjelde nr. 6 alene; derfor er posisjonen kodet til -1/+1 og ikke -2/+2.
  Partitallet er 0 for og 29 mot for Arbeiderpartiet, hentet fra voteringsresultatet for 24811. Posisjonen
  er kodet til -1 fordi bare stemmetallet er dokumentert, ikke en egen begrunnelse fra partiet.'
