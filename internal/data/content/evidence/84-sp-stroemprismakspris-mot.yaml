scan_summary: >
  Sp stemte mot Rødts pristak-forslag som regjeringspartner bak
  Norgespris-loven, samme mekanisme-uenighet som Ap.
claim_action: >
  Sp er medforslagsstiller og forsvarer av Norgespris-loven (en av
  flertallspartiene bak tilrådingen, votering_id 26128, 59 for). I
  votering_id 26116 stemte Sp mot Rødts pristak-blokk (0 for, 17 mot
  av de tilstedeværende). Sp har egne merknader om å utvide Norgespris
  til næringsliv og organisasjonsliv (forslag 5, sammen med Rødt) —
  en utvidelse av regjeringens EGEN ordning, ikke støtte til en
  lovbestemt makspris.
status: forslag_avvist_stemte_mot
