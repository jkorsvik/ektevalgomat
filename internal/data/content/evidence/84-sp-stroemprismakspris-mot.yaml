claim_confidence: dokumentert
context_note: >
  Kodet +1: samme resonnement som Ap — Sp avviser DENNE mekanismen
  (lovbestemt pristak) til fordel for Norgespris, som Sp selv
  medforfatter, nøyaktig det snudde utsagnet hevder. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1. Sp og Rødt samarbeider faktisk på et beslektet punkt (forslag 5, utvide Norgespris til næringslivet), men det er en utvidelse av referanseprisordningen, ikke det samme
  som Rødts pristak-krav i dette utsagnet. Se
  evidence/81-stroemprisreform-kontekst.yaml for hvorfor bare denne
  ene voteringen er kodet.
