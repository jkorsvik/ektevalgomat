scan_summary: >
  SV stemte mot Rødts pristak-forslag, men foretrekker et enda mer
  vidtgående alternativ: et statlig foretak som overtar kjøp og salg
  av strøm.
claim_action: >
  SV fremmet eget forslag (forslag 11, votering_id 26119, 7 for, 95
  mot): "Stortinget ber regjeringen opprette et statlig foretak for
  kjøp og salg av strøm." I votering_id 26116 stemte SV mot Rødts
  pristak-blokk (0 for, 8 mot av de tilstedeværende).
verbatim_excerpt: >
  "Komiteens medlem fra Sosialistisk Venstreparti mener målet er å ta
  krafta tilbake til demokratisk kontroll. [...] Staten må ta mye
  større kontroll over strømmarkedet. [...] Det bør derfor opprettes
  et statlig foretak for kjøp og salg av strøm."
status: forslag_avvist_stemte_mot
