claim_confidence: dokumentert
context_note: >
  Kodet +1, ikke +2: SV stemte konkret MOT Rødts spesifikke
  pristak-mekanisme, altså for det snudde utsagnets premiss om at
  referanseprisordninger er å foretrekke. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1. Men konteksten er viktig og ærlig å vise: SVs egen retorikk om
  "demokratisk kontroll" over krafta er om noe MER radikal enn Rødts —
  de vil ha statlig eierskap av selve handelen, ikke bare et lovbestemt
  pristak på private selskaper. Dette er et tilfelle der en lav
  saksmatch-score IKKE betyr at partiet er markedsliberalt; det betyr
  at partiet foretrakk en annen, sterkere intervensjonsform. Se
  evidence/81-stroemprisreform-kontekst.yaml.
