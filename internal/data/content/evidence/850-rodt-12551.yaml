context_note: >
  Kodet 1 fra votering 2019-06-05 i sak 75802 (Innst. 314 L (2018–2019) om ny
  tjenestepensjon for ansatte i offentlig sektor), der As forslag nr. 6 og 7 ber
  regjeringen komme tilbake med forslag som styrker arbeidsinsentivene for offentlig
  ansatte født 1944–1962, «med særlig vekt på dem som måtte tape i samlet årlig
  pensjonsutbetaling på å stå lenger i arbeid». Det er samme spørsmål som utsagn-40
  («utrede tiltak som sikrer at offentlig ansatte født fra og med 1944 ikke taper
  tjenestepensjon ved å stå lenger i arbeid enn 67 år»): samme kohort (1944–1962) og
  samme tap, med et sterkere instrument (forslag, ikke utredning). Samme sak inneholder
  Sps forslag nr. 9 (votering_id 12549: løsning for aldersgruppene 1943–1962 i tråd med
  Stoltenbergs brev 3. juni 2009, med virkning også for dem rammet av samordningsfellen),
  som spør det samme om samme kohort — kohorten er der 1943–1962 mot utsagnets «fra og
  med 1944». Denne raden siterer begge voteringspunktene fordi partiet sto på samme side
  i begge, og fordi 12551 er bundet sammen med As AFP-garanti (forslag nr. 6): at partiet
  også stemte for på det ubundne forslaget 12549 fjerner den innvendingen.
  Styrken er satt etter hva protokollen viser av handling og egen tekst, ikke etter
  stemmetallet. Rødt hadde én representant til stede og stemte for begge forslagene, uten egen merknad eller eget forslag i saken; derfor +1, samme styrke som raden for 2025-12-16 (også +1, også uten egen tekst). Samme fortegn som dagens celle. Ap og Sp er ikke kodet fra denne saken: hver av dem stemte for sitt eget og mot det andres forslag om det samme spørsmålet i samme sak (Ap 0 for / 29 mot på 12549 og 29 for / 0 mot på sitt eget 12551; Sp 11 for / 0 mot på sitt eget 12549 og 0 for / 11 mot på 12551), og en stemme mot en rival sitt forslag mens en selv bærer et nesten identisk forslag er ikke en posisjon.
  Ingen eksisterende posisjon er endret, og raden er en tidligere observasjon som den
  nyeste raden fortsatt overstyrer.
