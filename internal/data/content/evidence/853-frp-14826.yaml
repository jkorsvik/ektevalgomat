context_note: >
  Andre dato i cellen: den eksisterende FrP-raden er datert 2026-05-12 og kodet
  +2 fra votering 27524 (FrPs egne forslag om ti års botid, B2, troskapsed og
  selvforsørgelse, 29 for / 72 mot). Denne raden står uendret; raden her er en
  tidligere observasjon av samme spørsmål, og de to datoene leses som «Samme
  posisjon i 2020 og 2026».
  Votering 14826 er den eneste voteringspunkten i saken som ber om nettopp
  utsagn-48s skjerpelse (høyere språkkrav og krav om selvforsørgelse), og den
  deler partiene (FrP for, alle andre mot). De øvrige voteringspunktene i sak
  79534 er bevisst ikke brukt: 14827 og 14829 er innstillingens tilråding og
  lovvedtaket om krav til norsk muntlig, og der stemte H, Ap, Sp, KrF og V for
  — det er sakens eget alternativ til FrPs forslag, ikke en posisjon på FrPs
  spørsmål. 14828 er SV-forslaget om 300 timer norskopplæring, som SV, MDG og
  Rødt stemte for mens de stemte mot både FrPs forslag og tilrådingen: de valgte
  et annet virkemiddel i samme sak, og en slik stemmekombinasjon kodes ikke.
  Derfor er FrP det eneste partiet som får en rad fra denne saken, selv om ni
  partier har kodet celle på utsagn-48.
  Kilde: voteringsdetaljene viser forslagsteksten; stemmetallene er kontrollert
  mot https://data.stortinget.no/eksport/voteringsresultat?voteringid=14826
  (FrP 14 for / 0 mot, totalt 15 for / 72 mot).
