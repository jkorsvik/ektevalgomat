scan_summary: "FrP foreslo ti års botid, språkprøve på C1-nivå, verdiprøve, troskapsed og krav om selvforsørgelse — falt 15 mot 72."
claim_action: >
  FrP fremmet forslag nr. 1–3 i sak 79534 (Prop. 98 L, 2019–2020), votert
  samlet som votering 14826 (13.10.2020). Forslag nr. 2 ba regjeringen påse at
  følgende krav skal være oppfylt for å få norsk statsborgerskap: ti års botid,
  bestått språkprøve på minimum C1-nivå, bestått prøve om grunnleggende norske
  og vestlige verdier, bestått prøve om generelle spørsmål, plettfri vandel og
  selvforsørget de siste tre årene. FrP stemte 14 for / 0 mot; forslaget falt
  15 mot 72, der den femtende for-stemmen kom fra en uavhengig representant.
verbatim_excerpt: >
  Stortinget ber regjeringen om å påse at følgende krav skal være oppfylt for å
  få norsk statsborgerskap: ti års botid bestått språkprøve på minimum C1-nivå
  bestått prøve om grunnleggende norske og vestlige verdier bestått prøve om
  generelle spørsmål en norsk statsborger bør kunne plettfri vandel selvforsørget
  de siste tre årene
