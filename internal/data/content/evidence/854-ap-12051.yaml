claim_action: >
  Arbeiderpartiet stemte mot forslag nr. 2 og 3 fra SV i Dokument 8:43 S
  (2018–2019), der nr. 2 ba regjeringen utrede en foreldelsesfrist som etter en
  gitt tid avskjærer anledningen til å tilbakekalle et statsborgerskap.
  Votering 12051 (12.02.2019): Ap 0 for / 30 mot; forslaget falt 9 mot 94.
verbatim_excerpt: >
  Stortinget ber regjeringen om å utrede en foreldelsesfrist som etter en gitt
  tid avskjærer anledningen til å tilbakekalle et statsborgerskap etter
  statsborgerloven § 26 annet ledd, med sikte på innføring av en slik regel så
  snart som mulig.
