source_name: "Voteringsdetaljer, forslag nr. 2 og 3 fra Sosialistisk Venstreparti; votering 12051 (12.02.2019), sak 74148, Innst. 160 S (2018–2019)"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Saker/Sak/Voteringsoversikt/votering-detaljer/?p=74148&dnid=1&vt=12051"
claim_confidence: dokumentert
context_note: >
  Tredje dato i cellen: Høyre har fra før 2026-05-12 (-1, den nyere raden (2026-05-12)) og
  2022-04-07 (-1, den tidligere raden (2022-04-07)), begge uten egen merknad om
  foreldelsesfristen. Denne raden er -1 fra 2019 og gir dermed «Samme posisjon
  i 2019 og 2026». Ingen eksisterende rad er endret.
  Saken har tre voteringspunkter: 12049 (Sp og SVs forslag om frist fra
  forhåndsvarsel til saken er avklart — et annet spørsmål, om
  saksbehandlingstid), 12050 (innstillingens tilråding «… vedtas ikke», lest
  invertert) og 12051 (SVs forslag nr. 2 og 3). Høyre stemte mot forslaget og
  for tilrådingen, altså samme retning i begge; én Høyre-representant stemte
  for 12049, men partiet som helhet 26 mot, og enkeltstemmen endrer ikke
  partisiden. Stemmetallene er kontrollert mot
  https://data.stortinget.no/eksport/voteringsresultat?voteringid=12051
  (Høyre 0 for / 27 mot, totalt 9 for / 94 mot).
