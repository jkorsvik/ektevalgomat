date: "2019-02-12"
evidence_type: voteringsspor
evidence_class: uklart
scan_summary: "KrF stemte mot SVs forslag om å utrede en foreldelsesfrist for tilbakekall av statsborgerskap — falt 9 mot 94."
claim_action: >
  KrF stemte mot forslag nr. 2 og 3 fra SV i Dokument 8:43 S (2018–2019), der
  nr. 2 ba regjeringen utrede en foreldelsesfrist som etter en gitt tid
  avskjærer anledningen til å tilbakekalle et statsborgerskap. Votering 12051
  (12.02.2019): KrF 0 for / 5 mot; forslaget falt 9 mot 94.
verbatim_excerpt: >
  Stortinget ber regjeringen om å utrede en foreldelsesfrist som etter en gitt
  tid avskjærer anledningen til å tilbakekalle et statsborgerskap etter
  statsborgerloven § 26 annet ledd, med sikte på innføring av en slik regel så
  snart som mulig.
status: stemte_mot
position: -1
source_tier: A
source_name: "Voteringsdetaljer, forslag nr. 2 og 3 fra Sosialistisk Venstreparti; votering 12051 (12.02.2019), sak 74148, Innst. 160 S (2018–2019)"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Saker/Sak/Voteringsoversikt/votering-detaljer/?p=74148&dnid=1&vt=12051"
claim_confidence: dokumentert
context_note: >
  Denne raden peker motsatt vei av den nyeste KrF-raden, og det er selve
  observasjonen: KrF har fra før 2026-05-12 +1 (den nyere raden (2026-05-12), KrF stemte for
  forslaget om en tidsfrist) og en rad datert 2022-04-07 uten posisjon, fordi
  KrF den gangen stemte både for forslaget om foreldelsesfrist (den tidligere raden (2022-04-07)) og for
  tilrådingen om å forkaste dokumentet (tilradingsvoteringen) og dermed gikk begge veier i
  samme sak. I 2019 gikk KrF bare én vei: mot forslaget og for tilrådingen om
  at dokumentet ikke skulle vedtas (12050). Med to kodede datoer som peker hver
  sin vei leses cellen som «Endret posisjon mellom 2019 og 2026». Cellens
  posisjon er ikke endret av denne raden — nyeste rad vinner fortsatt.
  Stemmetallene er kontrollert mot
  https://data.stortinget.no/eksport/voteringsresultat?voteringid=12051
  (KrF 0 for / 5 mot, totalt 9 for / 94 mot).
