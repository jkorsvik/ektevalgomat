scan_summary: "MDG stemte for SVs forslag om å utrede en foreldelsesfrist for tilbakekall av statsborgerskap — falt 9 mot 94."
claim_action: >
  MDG stemte for forslag nr. 2 og 3 fra SV i Dokument 8:43 S (2018–2019), der
  nr. 2 ba regjeringen utrede en foreldelsesfrist som etter en gitt tid
  avskjærer anledningen til å tilbakekalle et statsborgerskap. Votering 12051
  (12.02.2019): MDG 1 for / 0 mot; forslaget falt 9 mot 94.
verbatim_excerpt: >
  Stortinget ber regjeringen om å utrede en foreldelsesfrist som etter en gitt
  tid avskjærer anledningen til å tilbakekalle et statsborgerskap etter
  statsborgerloven § 26 annet ledd, med sikte på innføring av en slik regel så
  snart som mulig.
status: stemte_for
position: 1
source_tier: A
source_name: "Voteringsdetaljer, forslag nr. 2 og 3 fra Sosialistisk Venstreparti; votering 12051 (12.02.2019), sak 74148, Innst. 160 S (2018–2019)"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Saker/Sak/Voteringsoversikt/votering-detaljer/?p=74148&dnid=1&vt=12051"
claim_confidence: dokumentert
context_note: >
  Tredje dato i cellen: MDG har fra før 2026-05-12 (+2, den nyere raden (2026-05-12), delt
  forslag med SV og Rødt i Innst. 232 S) og 2022-04-07 (+1, den tidligere raden (2022-04-07)).
  Denne raden er +1 fra en stemme for SVs forslag i 2019 — samme side som de
  to andre datoene, og +1 og ikke +2 fordi forslaget var SVs, ikke MDGs.
  De tre datoene leses som «Samme posisjon i 2019 og 2026». Ingen eksisterende
  rad er endret.
  Votering 12051 avgjorde forslag nr. 2 og 3 i én avstemning; nr. 3 gjaldt krav
  om dobbelt statsborgerskap ved tilbakekall og er et annet spørsmål. MDG
  stemte mot tilrådingen i 12050, samme retning, så raden er kodet fra
  forslagsvoteringen. Stemmetallene er kontrollert mot
  https://data.stortinget.no/eksport/voteringsresultat?voteringid=12051
  (MDG 1 for / 0 mot, totalt 9 for / 94 mot).
