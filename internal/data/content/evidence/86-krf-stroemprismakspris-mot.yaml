scan_summary: >
  KrF stemte mot Rødts pristak-forslag og fremmet i stedet sitt eget
  forslag om en 100 prosent strømstøtte over 50 øre/kWt — en
  kompensasjonsordning, ikke et lovbestemt pristak.
claim_action: >
  KrF fremmet eget forslag (forslag 30, votering_id 26114, 2 for, 99
  mot): "Stortinget ber regjeringen legge frem et forslag om en
  nasjonal strømstøtteordning der husholdninger og fritidsboliger
  kompenseres fullt ut for strømpriser over 50 øre per kWt." I
  votering_id 26116 stemte KrF mot Rødts pristak-blokk (0 for, 2 mot
  av de tilstedeværende).
verbatim_excerpt: >
  "Dette medlem mener en slik modell vil være mer hensiktsmessig og
  treffsikker enn den foreslåtte Norgesprisen. En slik
  strømstøttemodell vil fortsatt gi insentiv til å flytte forbruk."
status: forslag_avvist_stemte_mot
position: 1
source_tier: A
source_name: "Innst. 535 L (2024–2025); votering_id 26114, 26116"
