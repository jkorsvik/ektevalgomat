claim_confidence: dokumentert
context_note: >
  Kodet +1: KrF avviser DENNE mekanismen (lovbestemt pristak) og
  foreslår selv en fullstendig statlig kompensasjon over en terskelpris
  — en støtteordning (staten betaler differansen), nøyaktig den typen
  ordning det snudde utsagnet foretrekker. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1. Samme mekanisme-familie som
  FrPs forslag (100 pst. kompensasjon over en grense), ikke det samme
  som Rødts eller Norgesprisens design. Se
  evidence/81-stroemprisreform-kontekst.yaml.
