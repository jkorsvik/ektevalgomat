evidence_type: voteringsspor
evidence_class: partiets_begrunnelse
scan_summary: "SV foreslo å utrede en foreldelsesfrist for tilbakekall av statsborgerskap — falt 9 mot 94."
claim_action: >
  SV fremmet forslag nr. 2 og 3 i Dokument 8:43 S (2018–2019) om en
  foreldelsesfrist for tilbakekall av statsborgerskap. Votering 12051
  (12.02.2019) avgjorde forslagene: nr. 2 ba regjeringen utrede en
  foreldelsesfrist som etter en gitt tid avskjærer anledningen til å
  tilbakekalle et statsborgerskap. SV stemte 7 for / 0 mot; forslaget falt
  9 mot 94.
verbatim_excerpt: >
  Stortinget ber regjeringen om å utrede en foreldelsesfrist som etter en gitt
  tid avskjærer anledningen til å tilbakekalle et statsborgerskap etter
  statsborgerloven § 26 annet ledd, med sikte på innføring av en slik regel så
  snart som mulig.
status: stemte_for
position: 2
source_tier: A
source_name: "Voteringsdetaljer, forslag nr. 2 og 3 fra Sosialistisk Venstreparti; votering 12051 (12.02.2019), sak 74148, Innst. 160 S (2018–2019)"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Saker/Sak/Voteringsoversikt/votering-detaljer/?p=74148&dnid=1&vt=12051"
claim_confidence: dokumentert
context_note: >
  Tredje dato i cellen: SV har fra før 2026-05-12 (+2, den nyere raden (2026-05-12), eget
  forslag i Innst. 232 S) og 2022-04-07 (+2, den tidligere raden (2022-04-07), Dokument 8:75 S).
  Denne raden er +2 fra eget forslag i 2019, og de tre datoene leses som
  «Samme posisjon i 2019 og 2026». Ingen eksisterende rad er endret.
  Saken har tre voteringspunkter: 12049 (Sp og SVs forslag nr. 1 om frist fra
  forhåndsvarsel til saken er avklart — et annet spørsmål, om
  saksbehandlingstid, ikke om foreldelse), 12050 (innstillingens tilråding
  «Dokument 8:43 S (2018–2019) … vedtas ikke», lest invertert) og 12051
  (SVs forslag nr. 2 og 3). SV stemte for forslaget og mot tilrådingen — samme
  retning i begge, og raden er derfor kodet fra forslagsvoteringen.
  Stemmetallene er kontrollert mot
  https://data.stortinget.no/eksport/voteringsresultat?voteringid=12051
  (SV 7 for / 0 mot, totalt 9 for / 94 mot).
