scan_summary: "Venstre stemte mot SVs forslag om å utrede en foreldelsesfrist for tilbakekall av statsborgerskap — falt 9 mot 94."
claim_action: >
  Venstre stemte mot forslag nr. 2 og 3 fra SV i Dokument 8:43 S (2018–2019),
  der nr. 2 ba regjeringen utrede en foreldelsesfrist som etter en gitt tid
  avskjærer anledningen til å tilbakekalle et statsborgerskap. Votering 12051
  (12.02.2019): Venstre 0 for / 5 mot; forslaget falt 9 mot 94.
verbatim_excerpt: >
  Stortinget ber regjeringen om å utrede en foreldelsesfrist som etter en gitt
  tid avskjærer anledningen til å tilbakekalle et statsborgerskap etter
  statsborgerloven § 26 annet ledd, med sikte på innføring av en slik regel så
  snart som mulig.
status: stemte_mot
position: -1
source_tier: A
source_name: "Voteringsdetaljer, forslag nr. 2 og 3 fra Sosialistisk Venstreparti; votering 12051 (12.02.2019), sak 74148, Innst. 160 S (2018–2019)"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Saker/Sak/Voteringsoversikt/votering-detaljer/?p=74148&dnid=1&vt=12051"
claim_confidence: dokumentert
context_note: >
  Denne raden peker motsatt vei av de to nyere Venstre-radene, og det er selve
  observasjonen: 2026-05-12 +1 (den nyere raden (2026-05-12)) og 2022-04-07 +1 (votering
  den tidligere raden (2022-04-07)) mot -1 her. I 2019 stemte Venstre mot forslaget om foreldelsesfrist og
  for tilrådingen om å forkaste dokumentet (12050); i 2022 delte partiet seg
  3 for / 1 mot på selve tilrådingen, men var samlet for forslaget. Partiet tok
  altså i 2019 den motsatte siden av samme spørsmål som i 2022 og 2026, og
  cellen leses som «Endret posisjon mellom 2019 og 2026». Cellens posisjon er
  ikke endret av denne raden — nyeste rad vinner fortsatt.
  Stemmetallene er kontrollert mot
  https://data.stortinget.no/eksport/voteringsresultat?voteringid=12051
  (Venstre 0 for / 5 mot, totalt 9 for / 94 mot).
