scan_summary: >
  Miljøpartiet De Grønne stemte for forslag nr. 1 fra SV, Rødt, Venstre og MDG om å øke minstesatsen i OTP til minimum 4 pst. nå — 3 for / 0 mot (votering 24591, 06.05.2025).
claim_action: >
  Miljøpartiet De Grønne avgav stemme på forslag nr. 1 fra SV, Rødt, Venstre og Miljøpartiet De Grønne i Dokument 8:92 S (2024–2025) om at regjeringen skal «fremme forslag for Stortinget om å øke pensjonsinnskuddssatsen i obligatorisk tjenestepensjon til minimum 4 pst.» Partiets tall i votering_id 24591: 3 for / 0 mot; forslaget falt 33 for / 136 mot. Voteringen ble holdt 06.05.2025 i sesjonen 2024–2025 (sak 102062, Innst. 193 S).
verbatim_excerpt: "Stortinget ber regjeringen fremme forslag for Stortinget om å øke pensjonsinnskuddssatsen i obligatorisk tjenestepensjon til minimum 4 pst."
