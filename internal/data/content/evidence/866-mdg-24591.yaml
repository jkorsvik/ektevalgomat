context_note: >
  Utspørringen er entydig: voteringsdetaljene viser «Mindretallsforslag: Forslag nr. 1 fra Sosialistisk Venstreparti, Rødt, Venstre, Miljøpartiet De Grønne», og forslaget falt 33 for / 136 mot, så partiene står på hver sin side. Kodet -2: partiet er navngitt på selve forslaget som ber om en umiddelbar økning til minimum 4 pst. nå, og stemte for det. Det er det motsatte av utsagnets premiss (at en økning skal utredes og skje gradvis, ikke vedtas nå som 2 → 4 pst.), og en navngitt forslagsstiller er en sterkere tilkjennegivelse enn en løs stemme. Retningen er den samme som i 2026-raden, så serien skal lese «samme posisjon i 2025 og 2026». Samme sak hadde to andre voteringspunkter som ikke kodes her: votering 24592 er komiteens tilråding om at «Dokument 8:92 S (2024–2025) … vedtas ikke» (invertert spørsmål, og Høyre delt der med 35 for / 1 mot, altså ingen partilinje), og votering 24593 samler forslagene nr. 2–7 om overtidsbetaling som pensjonsgivende, obligatorisk uførepensjon, felles pensjonskasse og innarbeiding i folketrygden — et annet spørsmål enn minstesatsen. Saken er Rødts representantforslag; forslag nr. 1 ble fremmet på vegne av SV, Rødt, Venstre og MDG. Cellen på utsagn-37 står uendret på -2 (ev-2026-05-28-mdg-otp-minstesats-for); denne raden er en andre, tidligere dato, ikke en overstyring.
