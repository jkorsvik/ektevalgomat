context_note: >
  Utspørringen er entydig: voteringsdetaljene viser «Mindretallsforslag: Forslag nr. 1 fra Sosialistisk Venstreparti, Rødt, Venstre, Miljøpartiet De Grønne», og forslaget falt 33 for / 136 mot, så partiene står på hver sin side. Kodet +1, ikke +2: partiet stemte mot å vedta økningen nå, som er utsagnets retning, men denne voteringsposten bærer ingen begrunnelse for «utredes og gradvis» — den ligger i flertallsmerknaden i Innst. 263 S (2025–2026) som allerede er kodet i 2026-raden. Stemmen alene dokumenterer retningen, ikke styrken. Retningen er den samme som i 2026-raden, så serien skal lese «samme posisjon i 2025 og 2026». Samme sak hadde to andre voteringspunkter som ikke kodes her: votering 24592 er komiteens tilråding om at «Dokument 8:92 S (2024–2025) … vedtas ikke» (invertert spørsmål, og Høyre delt der med 35 for / 1 mot, altså ingen partilinje), og votering 24593 samler forslagene nr. 2–7 om overtidsbetaling som pensjonsgivende, obligatorisk uførepensjon, felles pensjonskasse og innarbeiding i folketrygden — et annet spørsmål enn minstesatsen. Saken er Rødts representantforslag; forslag nr. 1 ble fremmet på vegne av SV, Rødt, Venstre og MDG. Cellen på utsagn-37 står uendret på +1 (ev-2026-05-28-sp-otp-minstesats-mot); denne raden er en andre, tidligere dato, ikke en overstyring.
