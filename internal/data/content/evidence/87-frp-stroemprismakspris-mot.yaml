source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2024-2025/inns-202425-535l/?all=true"
claim_confidence: dokumentert
context_note: >
  Kodet +1: FrP avviser DENNE mekanismen på DETTE tidspunktet, i tråd med det
  snudde utsagnets premiss — men Rødts egen merknad i innstillingen (sitert
  ovenfor) dokumenterer at FrP tidligere tok til orde for en makspris som også
  skulle gjelde næringslivet, og at partiet tilsynelatende har gått vekk fra det.
  Primærkilden for det tidligere standpunktet er FrPs eget forslag i 2022
  (ev-2022-01-21-frp-makspris-for). Innst. 25 S (2022–2023), som tidligere ble
  nevnt her, er ikke kilde til det: 535 L omtaler Innst. 25 S som Rødts eget
  forslag, ikke som FrPs. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn
  peker samme vei, og posisjonen er speilvendt fra -1 til +1. Dette er nettopp det
  slags Konsistens-spørsmål prosjektets tre-mål-modell
  (Saksmatch/Konsistens/Evidensstyrke) finnes for å synliggjøre, ikke skjule bak
  én saksmatch-tall for dagens votering alene. Se
  evidence/81-stroemprisreform-kontekst.yaml. Status beskriver votering 26116
  (FrP mot Rødts blokk); i 26120 stemte FrP for eget forslag, og det er den siden
  som bærer +1. Etter position-scale-regelen («eget instrument, med et tall»)
  kunne raden ha vært +2. Den står på +1 fordi den skrevne regelen i
  method/position-scale.md ennå ikke er ratifisert av eieren — køoppgaven
  krf-skatteniva-polarity er der ratifiseringen ligger — og en magnitudeendring
  skal ikke avgjøres inne i en tekstkorreksjon.
retrieved_at: "2026-09-24"
