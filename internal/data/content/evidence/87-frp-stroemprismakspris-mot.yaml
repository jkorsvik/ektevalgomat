id: ev-2025-06-05-frp-stroemprismakspris-mot
statement_id: utsagn-12
party_id: frp
actor: "Fremskrittspartiet (energi- og miljøkomiteen)"
date: "2025-06-05"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  FrP stemte mot Rødts pristak-forslag og fremmet i stedet sitt eget forslag om en
  100 prosent strømstøtte over 50 øre/kWh, med et volumtak på 5 000 kWh i måneden —
  en kompensasjonsmodell for husholdninger og fritidsboliger, ikke et lovbestemt
  pristak. I 2022 fremmet FrP selv et forslag om makspris på strøm på 0,50 kr/kWt
  for alle, næringslivet inkludert (ev-2022-01-21-frp-makspris-for). Det som har
  endret seg til 2025 er omfanget og navnet: næringslivet er ute av ordningen, og
  forslaget kaller den en støtte, ikke en prisregulering.
claim_action: >
  FrP fremmet eget forslag (forslag 8, votering_id 26120, 12 for, 90 mot):
  "Stortinget ber regjeringen fremme forslag om å innføre en strømstøtte på 100
  pst. over 50 øre/kWh inkl. mva. for husholdninger og fritidsboliger med en
  begrensning på 5 000 kWh i måneden totalt." Begrensningen er operativ og gjør
  "100 pst." til en sats innenfor et volumtak, ikke en ubetinget garanti. I
  votering_id 26116 stemte FrP mot Rødts pristak-blokk (FrP 0 for, 12 mot av de
  tilstedeværende).
verbatim_excerpt: >
  "Komiteens medlem fra Rødt viser til at både Fremskrittspartiet og
  Kristelig Folkeparti foreslår en slags makspris, som er en
  forsterket strømstøtte, til husholdningene. Fremskrittspartiet har
  tidligere tatt til orde for en makspris som også gjelder næringslivet
  og industrien, men dette medlem registrerer at partiet tilsynelatende
  har gått vekk fra dette."
status: forslag_avvist_stemte_mot
position: 1
