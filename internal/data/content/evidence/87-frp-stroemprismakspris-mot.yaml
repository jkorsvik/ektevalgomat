id: ev-2025-06-05-frp-stroemprismakspris-mot
statement_id: utsagn-12
party_id: frp
actor: "Fremskrittspartiet (utenriks- og energikomiteen)"
date: "2025-06-05"
evidence_type: innstilling
evidence_class: partiets_begrunnelse
scan_summary: >
  FrP stemte mot Rødts pristak-forslag og fremmet i stedet sitt eget
  forslag om en 100 prosent strømstøtte over 50 øre/kWt — samme
  kompensasjonsmodell som KrF, ikke et lovbestemt pristak. FrP støttet
  selv en makspris-lignende mekanisme så sent som 2022-2023, men har
  siden gått over til støttemodellen.
claim_action: >
  FrP fremmet eget forslag (forslag 8/9, votering_id 26120, 12 for,
  90 mot): "Stortinget ber regjeringen fremme forslag om å innføre en
  strømstøtte på 100 pst. over 50 øre/kWh inkl. mva. for husholdninger
  og fritidsboliger." I votering_id 26116 stemte FrP mot Rødts
  pristak-blokk (0 for, 12 mot av de tilstedeværende).
verbatim_excerpt: >
  "Komiteens medlem fra Rødt viser til at både Fremskrittspartiet og
  Kristelig Folkeparti foreslår en slags makspris, som er en
  forsterket strømstøtte, til husholdningene. Fremskrittspartiet har
  tidligere tatt til orde for en makspris som også gjelder næringslivet
  og industrien, men dette medlem registrerer at partiet tilsynelatende
  har gått vekk fra dette."
status: forslag_avvist_stemte_mot
position: 1
source_tier: A
source_name: "Innst. 535 L (2024–2025); votering_id 26116, 26120"
source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2024-2025/inns-202425-535l/?all=true"
claim_confidence: dokumentert
context_note: >
  Kodet +1: FrP avviser DENNE mekanismen på DETTE tidspunktet, i tråd
  med det snudde utsagnets premiss — men Rødts egen merknad i
  innstillingen (sitert ovenfor) dokumenterer at FrP tidligere (bl.a.
  Innst. 25 S, 2022-2023) selv støttet en pristak-lignende mekanisme som
  også skulle gjelde næringslivet, og siden har gått over til en
  rendyrket støttemodell. Utsagnet ble snudd 2026-09-27 slik at ikke alle utsagn peker samme vei, og posisjonen er speilvendt fra -1 til +1. Dette er nettopp
  det slags Konsistens-spørsmål prosjektets tre-mål-modell (Saksmatch/
  Konsistens/Evidensstyrke) finnes for å synliggjøre, ikke skjule bak
  én saksmatch-tall for dagens votering alene. Se
  evidence/81-stroemprisreform-kontekst.yaml.
retrieved_at: "2026-09-24"
