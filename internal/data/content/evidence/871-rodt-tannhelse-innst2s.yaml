context_note: 'Kodet +1. De to blinde anmelderne leste −1: de tok «i løpet av fire år» som
  en forpliktelse om en universell rett før 2030. Jeg leser det annerledes, og grunnen er
  hvilket ledd utsagnet faktisk spør om. Utsagnet har to deler: utvid gradvis og målrettet
  mot dem som trenger det mest, og ikke forplikt deg til en universell rett innen 2030. Rødt
  oppfyller den første delen konkret — refusjon på 40 pst. over en egenandel på 2 500 kroner,
  rettet mot dem med størst utgifter, og 3 mrd. kroner som første trinn. Den andre delen berøres
  ikke: fireårsmålet gjelder å likestille tannhelse med andre helsetjenester, altså hvordan
  tannhelse behandles kostnadsmessig, ikke en lovfestet rett innen 2030. Gratis tannhelse
  for alle nevnes som retning, uten frist. Raden koder dermed samme ledd som søsterraden ev-2025-12-08-rodt-tannhelse-innst11s
  (+1), som eksplisitt koder mekanismen og ikke den langsiktige målsetningen. Å kode 2023
  på målet og 2025 på mekanismen ville gitt et omslag som bare finnes fordi to rader ble lest
  med to regler. Konsekvensen er at cellen ikke får noe omslag: den får et tidligere år og
  kan si at Rødt holdt linja. Det er et kjedeligere funn enn et omslag, og det er det teksten
  bærer. Merknaden er skrevet som «[d]ette medlem» — ett av Rødts medlemmer i finanskomiteen
  — og er kodet som partiets begrunnelse etter samme konvensjon som søsterraden.'
