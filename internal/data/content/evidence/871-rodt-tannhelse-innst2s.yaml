context_note: 'Kodet −1 etter regelen i statement-feltet codes_on: avvist_alternativ. Utsagnet
  avviser en universell rett innen 2030, så en rad må si noe om den forpliktelsen. Rødt sier
  seg enig i den: «offentlig finansiert gratis tannhelse», «gratis tannhelse for alle» som
  mål, og likestilling «i løpet av fire år». En tidsfestet universell målsetting før 2030
  er nettopp det utsagnet avviser, så raden ligger på uenig-siden. De to blinde anmelderne
  leste også −1. Jeg leste først +1 på virkemiddelet og trakk det samme minutt som det ble
  prøvd mot regelen: virkemiddelet — refusjon over egenandel, målrettet mot dem med størst
  utgifter — er den halvdelen alle partier hevder, og søsterraden ev-2025-12-08-rodt-tannhelse-innst11s
  (+1) koder nettopp virkemiddelet og hviler på at Rødt ikke binder seg til 2030, altså på
  fravær. Etter regelen er den raden ikke adgangsberettiget, og den er flagget i LOOP-TRACKS.md.
  Cellens 2025-bein bæres uansett av voteringa i ev-2025-06-04-rodt-tannhelse-universell-mot,
  der Rødt stemte mot et forslag om en bindende 2030-frist, så omslaget hviler ikke på den
  flaggede raden.'
