scan_summary: Rødt vil ha offentlig finansiert gratis tannhelse og sier at målet er å likestille
  tannhelse med andre helsetjenester i løpet av fire år, med 3 mrd. kroner som første skritt.
  Det er en tidsfestet universell målsetting, ikke bare et virkemiddel.
claim_action: «Merknader fra Rødt» i Innst. 2 S (2023–2024), punkt 3.1.2.5, sier at «[d]ette
  medlem jobber for en skikkelig tannhelseform med offentlig finansiert gratis tannhelse»,
  at det «setter av mer enn 3 mrd. kroner til første skritt på veien mot gratis tannhelse
  for alle», og at «[m]ålet er å likestille tannhelse med andre helsetjenester i løpet av
  fire år».
verbatim_excerpt: 'Når tennene ikke behandles som en del av kroppen,

  kommer forskjellene i samfunnet til uttrykk i folks tenner. Regjeringserklæringen har et
  mål om at tannhelse

  bør likestilles med andre helsetjenester, men det gjøres

  ingenting i statsbudsjettet. Det te me dlem jobber for

  en skikkelig tannhelseform med offentlig finansiert gratis tannhelse. Dette medle m foreslår
  at reformen

  innfases ved å ta deler av regningen for de som har størst

  utgifter, med refusjon på 40 pst. av utgiftene over en årlig egenandel på 2 500 kroner.
  Dett e medlem setter

  av mer enn 3 mrd. kroner til første skritt på veien mot

  gratis tannhelse for alle. Målet er å likestille tannhelse

  med andre helsetjenester i løpet av fire år.'
