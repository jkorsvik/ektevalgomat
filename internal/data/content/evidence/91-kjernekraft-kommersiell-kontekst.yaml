source_url: "https://www.stortinget.no/no/Saker-og-publikasjoner/Publikasjoner/Innstillinger/Stortinget/2025-2026/inns-202526-278s/?all=true"
claim_confidence: dokumentert
context_note: >
  Institusjonell kontekst, ikke en partiposisjon i seg selv. Sak_id
  200121 kryssjekket mot data.stortinget.no/eksport/voteringer?sakid=
  200121 (10 voteringer + tilrådingen). Denne evidensfilen og
  partienes egne filer dekker kun votering_id 27722 (forslag 1 og 2),
  fordi det er den ene voteringen som direkte tester dette utsagnets
  konkrete krav: lovendring NÅ for kommersiell/privatfinansiert
  kjernekraft, ikke bare enighet om å skrive en stortingsmelding.
  Merk at H og Venstres egen forslagstekst (forslag 27-28 og en
  identisk formulering senere i innstillingen) uttrykkelig utelukker
  statlig subsidiering eller eierskap — motsatt av Rødts prinsipp i
  utsagn-06 om statlig eierskap. Utsagn-06 (statlig kontroll) og dette
  utsagnet (kommersiell hastighet) tester derfor to forskjellige akser
  i samme sak, og bør ikke slås sammen.
