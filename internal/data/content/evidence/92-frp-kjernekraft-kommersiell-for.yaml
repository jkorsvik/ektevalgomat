claim_action: >
  Dokument 8:191 S, forslag 3-5, nr. 4 (votering_id 27721, FrP 29 for).
  FrP argumenterer med Statnetts kraftbehovsprognoser (180-260 TWt i
  2050), internasjonal utvikling (Finland, Storbritannia, Sverige,
  Polen), og at kjernekraft har lavt arealbehov og høy
  kapasitetsfaktor (92-95 pst i USA) sammenlignet med sol/vind.
verbatim_excerpt: >
  "Stortinget ber regjeringen fremme forslag til nødvendige endringer
  i atomenergiloven, energiloven og strålevernloven, slik at
  regelverket legger til rette for etablering og drift av kommersiell
  kjernekraftproduksjon i Norge."
