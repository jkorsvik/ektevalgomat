scan_summary: >
  Høyre stemte for lovendring nå (sammen med FrP og Venstre), men
  fremmer selv en strengere markedsversjon: kjernekraft skal
  tilrettelegges bare hvis private aktører selv finansierer hele
  utbygging, drift og dekommisjonering — ingen statlig subsidiering
  eller eierskap.
claim_action: >
  Forslag 1 og 2, votering_id 27722, H 14 for. Høyre fremmet i
  tillegg eget forslag (forslag 27-28, votering_id 27717, avvist):
  "Stortinget ber regjeringen legge til rette for utbygging av
  kjernekraft i Norge, dersom private aktører selv finansierer
  utbygging, drift og dekommisjonering."
verbatim_excerpt: >
  "Disse medlemmer på sikt ønsker å tilrettelegge
  for at private kan finansiere og bygge ut kjernekraft i Norge, med
  tre tydelige forbehold: [...] Det er ikke aktuelt med statlige
  subsidier eller eierskap. Det skal ikke kompromisses på sikkerhet."
