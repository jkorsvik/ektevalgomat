scan_summary: >
  Venstre stemte for lovendring nå, i samme merknad som Høyre: vil
  tilrettelegge for privatfinansiert kjernekraft, uttrykkelig uten
  statlig subsidiering eller eierskap, men vil ikke la det bremse
  utbygging av fornybar energi.
claim_action: >
  Forslag 17-26, nr. 17, votering_id 27718, V 2 for. Delt merknad med Høyre:
  "disse medlemmer mener man bør slippe alle kraftformer til og ha en
  mest mulig teknologinøytral tilnærming."
verbatim_excerpt: >
  "Det vises videre til at disse medlemmer på sikt ønsker å
  tilrettelegge for at private kan finansiere og bygge ut kjernekraft
  i Norge, med tre tydelige forbehold: Muligheten for kjernekraft i
  fremtiden må ikke bli en sovepute mot å bygge ut mer fornybar kraft
  og nett i dag [...]. Det er ikke aktuelt med statlige subsidier
  eller eierskap. Det skal ikke kompromisses på sikkerhet."
