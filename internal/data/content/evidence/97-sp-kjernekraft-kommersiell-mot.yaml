verbatim_excerpt: >
  "Komiteens medlem fra Senterpartiet mener en ny stortingsmelding om
  kjernekraft blant annet må dekke følgende tematikk: Kostnader og
  finansiering, herunder ansvarsfordeling mellom stat og privat [...]
  Kartlegging av behovet for statlig forvaltningskostnad og
  subsidier, og potensialet for kommersiell drift. [...] Potensialet
  for styrket samarbeid innenfor kjernekraft i Norden."
