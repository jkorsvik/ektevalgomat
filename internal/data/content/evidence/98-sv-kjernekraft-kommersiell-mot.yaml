verbatim_excerpt: >
  "Komiteens medlem fra Sosialistisk Venstreparti er sjokkert over
  hvor uansvarlige Høyre og Fremskrittspartiet er i denne saken.
  Atomkraftverk er ikke en pølsebu. [...] Atomkraft er den dyreste
  tilgjengelige kraftkilden og vil følgelig kreve betydelige
  subsidier. Fremskrittspartiet og Høyre legger med disse forslagene
  opp til betydelig sløsing med skattebetalernes penger."
