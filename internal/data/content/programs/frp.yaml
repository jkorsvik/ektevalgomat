points:
  - dimension: "Demokratisk åpenhet"
    topic: "Innsyn og meroffentlighet"
    quote: "tilrettelegge for innsyn og at prinsippet om meroffentlighet følges, for å sikre befolkningens mulighet til å se forvaltningen i kortene og bidra til god og effektiv forvaltning"
    where: "Modernisering av offentlig sektor, s. 10"
  - dimension: "Demokratisk åpenhet"
    topic: "Digitale medvirkningsplattformer"
    quote: "Det er nødvendig å utvikle digitale plattformer for medvirkning, slik at innbyggere kan gi tilbakemeldinger, delta i høringer og påvirke politiske beslutninger."
    where: "Digitalisering, s. 108"
  - dimension: "Demokratisk åpenhet"
    topic: "Innsyn i barnevernet"
    quote: "gi mulighet for politisk innsyn og kontroll med barnevernsfeltet"
    where: "Familiepolitikk / Barnevern, s. 125"
  - dimension: "Norsk handlefrihet"
    topic: "Demokratisk kontroll og suverenitet"
    quote: "Det er likevel viktig å ivareta norsk demokratisk kontroll og ikke avgi suverenitet til å avgjøre viktige politiske spørsmål til andre land, organisasjoner, og internasjonale domstoler."
    where: "Norge og verden, s. 13"
  - dimension: "Norsk handlefrihet"
    topic: "Nei til EUs energimarkedspakke"
    quote: "Norge skal si nei til avtaler som eksempelvis EUs fjerde energimarkedspakke som flytter kontroll over energiressursene ut av landet."
    where: "Energi / Kraftutveksling, s. 90"
  - dimension: "Norsk handlefrihet"
    topic: "Bruk av reservasjonsretten"
    quote: "benytte reservasjonsretten for å hindre implementering av direktiver som svekker Norges interesser"
    where: "Norge og Europa, s. 16"
  - dimension: "Norsk handlefrihet"
    topic: "Norsk selvråderett"
    quote: "Vi skal samtidig alltid ivareta norske interesser og norsk selvråderett."
    where: "Mer frihet, s. 5"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Olje- og gassnæringen"
    quote: "Olje- og gassnæringen er Norges desidert største og viktigste industri og svært avgjørende for norsk økonomi og velstand."
    where: "Energi / Olje og gass, s. 84"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Makspris på strøm"
    quote: "Det bør innføres en makspris på strøm, og modellen for prissetting av strøm bør gjennomgås."
    where: "Energi, s. 84"
    statements: ["utsagn-12"]
    # begrunnelse: vil innføre en makspris på strøm
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Ikke Europas grønne batteri"
    quote: "Norge skal ikke være «Europas grønne batteri» og følge etter EU blindt."
    where: "Energi, s. 84"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Utnytte fornybare energiressurser"
    quote: "Offentlige myndigheter må vise vilje til å utnytte landets fornybare energiressurser og sørge for at Norge forblir et land med rikelig, ren og rimelig energi."
    where: "Energi, s. 84"
  - dimension: "Teknologisk kapasitet"
    topic: "Sikring av samfunnskritisk informasjon"
    quote: "Samfunnskritisk informasjon må sikres etter høyeste tilgjengelige standard."
    where: "Digitalisering, s. 108"
  - dimension: "Teknologisk kapasitet"
    topic: "Personvern og datasikkerhet"
    quote: "Det er essensielt å utvikle strenge retningslinjer for personvern og datasikkerhet i offentlig forvaltning for å sikre både innbyggernes data og nasjonalt kritisk informasjon."
    where: "Digitalisering, s. 108"
  - dimension: "Teknologisk kapasitet"
    topic: "Datasikring i offentlig sektor"
    quote: "implementere strenge retningslinjer for sikring av data i offentlig sektor"
    where: "Digitalisering, s. 108"
    statements: ["utsagn-19"]
    # begrunnelse: vil ha strenge retningslinjer for datasikring i offentlig sektor
  - dimension: "Teknologisk kapasitet"
    topic: "Digitalt grenseforsvar"
    quote: "etablere et digitalt grenseforsvar og styrke cyberforsvaret"
    where: "Samfunnssikkerhet og beredskap, s. 33"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Offensiv nyskapingspolitikk"
    quote: "Det må føres en offensiv nyskapingspolitikk, der forskning og utviklingsarbeid, gründervirksomhet og kompetanseutvikling stimuleres."
    where: "Nyskaping, gründerpolitikk og små og mellomstore bedrifter, s. 50"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Innovative offentlige innkjøp"
    quote: "motivere det offentlige til å gjøre innovative innkjøp"
    where: "Nyskaping, gründerpolitikk og små og mellomstore bedrifter, s. 51"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Miljø for KI-innovasjon"
    quote: "skape et miljø for innovasjon og forskning på KI, samtidig som personvern og etikk er i høysetet"
    where: "Kunstig intelligens (KI) i Norge, s. 109"
  - dimension: "Universell grunnmur"
    topic: "Offentlig finansiering av helsetjenester"
    quote: "Tjenestene skal finansieres av det offentlige, uansett om de utføres av det offentlige, ideelle, eller private aktører."
    where: "Helse og omsorg / Sykehus, s. 64"
  - dimension: "Universell grunnmur"
    topic: "Lokalsykehus og nærhet"
    quote: "Lokalsykehusene er viktige for å sikre befolkningens nærhet til basale funksjoner som fødsel og akutthjelp."
    where: "Helse og omsorg / Sykehus, s. 64"
    statements: ["utsagn-28"]
    # begrunnelse: vil bevare lokalsykehus og nærhet
  - dimension: "Universell grunnmur"
    topic: "Offentlig finansiert utdanning"
    quote: "Det offentlige skal finansiere utdanningssystemet, men elevene og deres familier skal fritt kunne velge skole."
    where: "Skole og utdanning, s. 73"
  - dimension: "Barns muligheter"
    topic: "Barns rett til omsorgsfull oppvekst"
    quote: "Alle barn skal ha rett til en god og omsorgsfull oppvekst."
    where: "Familiepolitikk, s. 121"
  - dimension: "Barns muligheter"
    topic: "Tidlig innsats for barn og familier"
    quote: "Vi vil styrke tidlig innsats, forebyggende tiltak og støtte som legger til rette for at flest mulig barn kan vokse opp i sin familie og sitt nærmiljø."
    where: "Familiepolitikk / Barnevern, s. 123"
  - dimension: "Barns muligheter"
    topic: "Lovfestet rett til barnehageplass"
    quote: "Vi vil med dette lovfeste retten til barnehageplass fra barnet er ett år."
    where: "Familiepolitikk / Barnehage, s. 123"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Robuste og fleksible strukturer"
    quote: "Strukturer som er bygget opp, og kapasitetene som er implementert, må derfor være robuste, forberedte og fleksible."
    where: "Forsvar og sikkerhet, s. 20"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Egen evne til krisehåndtering"
    quote: "Norge må med egne ressurser selv kunne håndtere første fase av en krise og konflikt i landet og særlig i nordområdene."
    where: "Forsvar og sikkerhet, s. 20"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Nasjonalt ansvar for samfunnssikkerhet"
    quote: "Det er et overordnet nasjonalt ansvar å sikre det norske samfunnet og gi trygghet til innbyggerne."
    where: "Samfunnssikkerhet og beredskap, s. 32"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Nasjonal lagring av helseutstyr"
    quote: "etablere en nasjonal ordning for lagring av kritisk helseutstyr og medisiner"
    where: "Samfunnssikkerhet og beredskap, s. 33"
  - dimension: "Generasjonsansvar"
    topic: "Naturarv til neste generasjoner"
    quote: "Vi skal ivareta og forvalte naturen vår på en god måte, og overlate den i god stand til neste generasjoner."
    where: "Miljø, s. 93"
  - dimension: "Generasjonsansvar"
    topic: "Generasjonsperspektiv på petroleumsressurser"
    quote: "Vi støtter tankegangen om at utvinning av petroleumsressurser skal ha et generasjonsperspektiv, hvor verdiskapingen skal komme hele landet til gode i et langsiktig perspektiv."
    where: "Finanspolitikk og pengepolitikk, s. 47"
  - dimension: "Generasjonsansvar"
    topic: "Bærekraftig folketrygd"
    quote: "at Folketrygdens ytelser skal være bærekraftige og stimulere til arbeid for de som er arbeidsføre, uavhengige av alder."
    where: "Arbeid og velferd / Folketrygden, s. 117"
