id: "mdg"
source_name: "MDGs arbeidsprogram 2025-2029"
source_url: "https://mdg.no/_service/505809/download/id/1506077/name/MDGs+arbeidsprogram+2025-2029.pdf"
retrieved_at: "2026-10-12"
points:
  # 1. Demokratisk åpenhet
  - dimension: "Demokratisk åpenhet"
    topic: "Lobbyregister"
    quote: "Opprette et åpent tilgjengelig lobbyregister for Stortinget."
    where: "Kap. 4.6 Demokrati, s. 65"
    statements: ["utsagn-01"]
    # begrunnelse: sier åpent lobbyregister for Stortinget
  - dimension: "Demokratisk åpenhet"
    topic: "Offentlighetsloven og sanksjoner"
    quote: "Sikre at offentlighetsloven følges i større grad enn i dag, blant annet utrede nye sanksjoner for grove brudd på loven, og utrede å styrke merinnsynsbestemmelsen."
    where: "Kap. 4.6 Demokrati, s. 65"
  - dimension: "Demokratisk åpenhet"
    topic: "Åpenhet om saksbehandling og stemmegivning"
    quote: "Gjøre sakspapirer og stemmegivning fra både Stortinget, kommunestyrer og fylkesting mer oversiktlig for innbyggere, blant annet gjennom felles digitale løsninger som også er tilgjengelig i maskinlesbart format."
    where: "Kap. 4.6 Demokrati, s. 65"
  - dimension: "Demokratisk åpenhet"
    topic: "Åpenhet om kandidaters gaver"
    quote: "Sikre at kandidater til stortingsvalget må oppgi gaver/verdier de mottar på lik linje med partiene."
    where: "Kap. 4.6 Demokrati, s. 65"
  - dimension: "Demokratisk åpenhet"
    topic: "Partifinansiering og donasjoner"
    quote: "Sikre et levende og medlemsbasert partidemokrati ved at bare norske statsborgere kan donere penger til partier, at partiene får mva-fritak og at deler av den statlige partifinanseringen baseres på medlemstall i partiene."
    where: "Kap. 4.6 Demokrati, s. 65"
  - dimension: "Demokratisk åpenhet"
    topic: "Desinformasjon fra fremmede makter"
    quote: "Innføre en effektiv lovpålagt regulering av sosiale medier i Norge, for å motvirke hatprat, radikalisering og bevisst spredning av desinformasjon fra fremmede makter."
    where: "Kap. 4.8 Medier og offentlighet, s. 68"
    statements: ["utsagn-04"]
    # begrunnelse: vil regulere spredning av desinformasjon fra fremmede makter
  - dimension: "Demokratisk åpenhet"
    topic: "Åpent register over reelle eiere"
    quote: "Etablere et åpent og løpende oppdatert aksjeeierregister med gratis tilgang for pressen og allmennheten, og kreve at alle reelle eiere med mer enn 10 prosent innflytelse får plikt til registrering."
    where: "Kap. 4.8 Medier og offentlighet, s. 68"
    statements: ["utsagn-05"]
    # begrunnelse: vil ha åpent og oppdatert aksjeeierregister

  # 2. Norsk handlefrihet
  - dimension: "Norsk handlefrihet"
    topic: "Norsk EU-medlemskap"
    quote: "Gå inn for nye forhandlinger med EU med sikte på norsk EU-medlemskap, der avtalen må godkjennes ved folkeavstemning."
    where: "Kap. 7.6 Europapolitikk, s. 107"
  - dimension: "Norsk handlefrihet"
    topic: "EØS-avtalen"
    quote: "Frem til dette vil vi bevare EØS-avtalen og ta igjen etterslepet på gjennomføring av EØS-relevante rettsakter."
    where: "Kap. 7.6 Europapolitikk, s. 107"
  - dimension: "Norsk handlefrihet"
    topic: "EUs energipakke i norsk rett"
    quote: "Arbeide for at EUs ren energi-pakke (Clean Energy Package) blir implementert i norsk rett i sin helhet."
    where: "Kap. 7.6 Europapolitikk, s. 107"
  - dimension: "Norsk handlefrihet"
    topic: "Europeisk kraftmarked og sjøkabler"
    quote: "Sikre at Norges energiressurser inngår i et mangfoldig og desentralisert felles kraftmarked med resten av Europa og bidrar til å erstatte fossil med fornybar energi, blant annet med å videreføre sjøkabler til våre naboland."
    where: "Kap. 7.6 Europapolitikk, s. 107"
    statements: ["utsagn-09"]
    # begrunnelse: vil at norsk kraft inngår i et felles europeisk marked
  - dimension: "Norsk handlefrihet"
    topic: "Nasjonalt eierskap til kritisk infrastruktur"
    quote: "Prioritere nasjonalt eierskap til kritisk infrastruktur."
    where: "Kap. 7.1 Beredskap, s. 101"
  - dimension: "Norsk handlefrihet"
    topic: "Norsk eller europeisk eierskap til datasentre"
    quote: "Jobbe for at datasentre som etableres i Norge sikres norsk eller europeisk eierskap, at strømforsyningen til disse baseres på fornybar energi og at overskuddsvarme gjenbrukes."
    where: "Kap. 3.2 Næringspolitikk for sirkulærøkonomi, s. 46"
    statements: ["utsagn-11"]
    # begrunnelse: vil sikre norsk eller europeisk eierskap til datasentre
  - dimension: "Norsk handlefrihet"
    topic: "Oppsigelsesrett i baseringsavtaler"
    quote: "Norge skal alltid ha en utvetydig rett til oppsigelse av slike avtaler."
    where: "Kap. 7.4 Forsvar, s. 105"

  # 3. Forvaltning av fellesskapets ressurser / energi
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Avvikling av norsk olje og gass innen 2040"
    quote: "At Stortinget skal innføre et mål om at norsk olje og gass skal avvikles innen 2040."
    where: "Kap. 3.1 Trygt ut av oljealderen, s. 45"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Stanse leting etter nye olje- og gassforekomster"
    quote: "Umiddelbart stanse all leting etter nye olje- og gassforekomster."
    where: "Kap. 3.1 Trygt ut av oljealderen, s. 45"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Omstillingsavgift på olje og gass"
    quote: "Etablere en omstillingsavgift per utvunnet fat olje og gass som avhenger av utslippsintensitet, i tråd med prinsippet om at forurenser betaler."
    where: "Kap. 3.1 Trygt ut av oljealderen, s. 45"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Avvikle Equinors utenlandske olje- og gassprosjekter"
    quote: "Fase ut Equinors eierskap i prosjekter i olje og gass i utlandet senest innen 2028."
    where: "Kap. 3.1 Trygt ut av oljealderen, s. 45"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Åpenhet om eierskap til samfunnskritisk infrastruktur"
    quote: "Stille strengere åpenhetskrav til eierskap av samfunnskritisk infrastruktur, som veier, baner, kabler, nett, datasentre, vann og avløp."
    where: "Kap. 3.4 En grønn økonomisk kurs, s. 48"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Samfunnskritisk infrastruktur skal som hovedregel være offentlig eid"
    quote: "Slik infrastruktur skal som hovedregel eies av det offentlige eller samvirker."
    where: "Kap. 3.4 En grønn økonomisk kurs, s. 48"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Norsk mineralfordeling og Fensfeltet"
    quote: "Satse på Fensfeltet og eventuelt andre mineralfunn på norsk jord som foregangsfelt for naturvennlig gruvedrift som kan utkonkurrere gruvedrift der menneskerettigheter ikke respekteres."
    where: "Kap. 3.2 Næringspolitikk for sirkulærøkonomi, s. 46"

  # 4. Teknologisk kapasitet
  - dimension: "Teknologisk kapasitet"
    topic: "Åpen kildekode i offentlig sektor"
    quote: "Gjøre programvare utviklet av eller på vegne av det offentlige tilgjengelig under frie lisenser og sikre at det offentlige tilrettelegger for bruk av fri programvare, åpen kildekode, åpne filformater og standarder i sin virksomhet der det er hensiktsmessig."
    where: "Kap. 4.7 Digitalisering og kunstig intelligens, s. 67"
    statements: ["utsagn-23"]
    # begrunnelse: vil gjøre offentlig programvare til åpen kildekode
  - dimension: "Teknologisk kapasitet"
    topic: "Digital kompetanse i offentlig forvaltning"
    quote: "Øke den digitale kompetansen og sikre tydelig ansvarslinjer i offentlig forvaltning på områder hvor digitaliseringsbehovet er stort, som helse, utdanning og justis."
    where: "Kap. 4.7 Digitalisering og kunstig intelligens, s. 67"
  - dimension: "Teknologisk kapasitet"
    topic: "Norsk offentlig KI-infrastruktur"
    quote: "Bidra til en positiv utvikling og mer demokratisk tilgang til kunstig intelligens gjennom å lage norsk offentlig infrastruktur for kunstig intelligens og europeisk samarbeid a la CERN."
    where: "Kap. 4.7 Digitalisering og kunstig intelligens, s. 67"
  - dimension: "Teknologisk kapasitet"
    topic: "Utdanning innen teknologifag"
    quote: "Øke investeringene i utdanning og etterutdanning innen teknologifag, med mål om at flere kommer i arbeid og arbeidsmarkedets behov blir møtt."
    where: "Kap. 4.7 Digitalisering og kunstig intelligens, s. 66"
  - dimension: "Teknologisk kapasitet"
    topic: "Avdekke og håndtere digitale angrep"
    quote: "Styrke Norges evne til å avdekke og håndtere digitale angrep, blant annet ved å bygge sterke fagmiljøer og investere mer i forskning innen digital sikkerhet og utvikling av trygg og robust IT-infrastruktur."
    where: "Kap. 7.1 Beredskap, s. 101"

  # 5. Innovasjon / omstillingsevne
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Sirkulær innovasjon i virkemiddelapparatet"
    quote: "Gjøre innovasjon innen sirkulære forretningsmodeller, på linje med teknologi, til en prioritet i det offentlige virkemiddelapparatet."
    where: "Kap. 3.2 Næringspolitikk for sirkulærøkonomi, s. 46"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Risikokapital til næringslivet"
    quote: "Øke tilgangen på risikokapital gjennom det næringsrettede virkemiddelapparatet, særlig ordninger som også utløser privat kapital."
    where: "Kap. 3.3 Gründere og småbedrifter, s. 47"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Statlig kapital og avvikling av subsidier til ikke-sirkulær industri"
    quote: "Redusere og på sikt avvikle subsidier til ikke-sirkulær industri, og sikre betydelig tilgang til statlig kapital gjennom minoritetseierskap i sirkulære industriprosjekter."
    where: "Kap. 3.2 Næringspolitikk for sirkulærøkonomi, s. 46"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Klimateknologi raskere ut i markedet"
    quote: "Sørge for at norske bedrifter raskere får klimateknologi ut i markedet, gjennom blant annet Innovasjon Norge, Forskningsrådet og Siva."
    where: "Kap. 3.3 Gründere og småbedrifter, s. 47"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Offentlig sektor som testarena for småbedrifter"
    quote: "Styrke programmer der småbedrifter kan bruke offentlig sektor for å teste og skalere nye løsninger, og tilrettelegge for deltagelse i offentlige anskaffelser."
    where: "Kap. 3.3 Gründere og småbedrifter, s. 47"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "SkatteFUNN"
    quote: "Utvide ordninger som SkatteFUNN for å stimulere til investeringer i innovasjon."
    where: "Kap. 3.3 Gründere og småbedrifter, s. 47"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Forskningsinnsats mot 3 % av BNP"
    quote: "Sikre at Norge øker forskningsinnsatsen til 3% av BNP innen 2030 og at det utarbeides en opptrappingsplan frem mot målet der det offentliges andel av innsatsen utgjør 50 %."
    where: "Kap. 2.2.6 Forskning, s. 33"

  # 6. Universell grunnmur
  - dimension: "Universell grunnmur"
    topic: "Gratis skolemåltid"
    quote: "Innføre et gratis, sunt og bærekraftig skolemåltid."
    where: "Kap. 2.2.4 Skole og opplæring, s. 30"
    statements: ["utsagn-35"]
    # begrunnelse: vil innføre et gratis skolemåltid
  - dimension: "Universell grunnmur"
    topic: "Moderasjonsordning for barnehage"
    quote: "Sikre moderasjonsordninger som gjør at familiens økonomi ikke blir et hinder for at barna får gå i barnehage."
    where: "Kap. 2.2.3 Barnehage, s. 29"
    statements: ["utsagn-34"]
    # begrunnelse: vil ha moderasjonsordning så familiens økonomi ikke hindrer barnehage
  - dimension: "Universell grunnmur"
    topic: "Offentlig helsevesen for alle"
    quote: "Sikre et sterkt offentlig helsevesen som alle har tilgang til."
    where: "Kap. 2.3.4 Spesialisthelsetjenesten, s. 38"
  - dimension: "Universell grunnmur"
    topic: "Tannhelse inn i refusjonsordningen"
    quote: "Gå inn for at tannhelse på sikt skal inn i refusjonsordningen slik som andre helsetjenester."
    where: "Kap. 2.3.3 Nære helsetjenester, s. 38"
    statements: ["utsagn-25"]
    # begrunnelse: vil at tannhelse skal inn i refusjonsordningen
  - dimension: "Universell grunnmur"
    topic: "Kommunal finansiering av helse- og omsorgstjenester"
    quote: "Sikre kommunene økonomiske ressurser til å kunne ivareta sitt ansvar for helse- og omsorgstjenester gjennom hele livsløpet."
    where: "Kap. 2.3.3 Nære helsetjenester, s. 37"
  - dimension: "Universell grunnmur"
    topic: "Fastlegeordningen"
    quote: "Styrke og videreføre fastlegeordningen."
    where: "Kap. 2.3.3 Nære helsetjenester, s. 38"
  - dimension: "Universell grunnmur"
    topic: "Trygt drikkevann i hele landet"
    quote: "Sikre trygt drikkevann og vannberedskap over hele landet."
    where: "Kap. 2.3.1 Folkehelse, s. 36"
  - dimension: "Universell grunnmur"
    topic: "Kollektivtransport for familier"
    quote: "Jobbe for at kollektivtransporten har familierabatter, er universelt utformet og tilpasset barn og unge."
    where: "Kap. 2.1.1 Fordeling og fattigdomsbekjempelse, s. 20"
  - dimension: "Universell grunnmur"
    topic: "Universell grunninntekt"
    quote: "På sikt jobbe for en universell grunninntekt så alle får dekket grunnleggende behov."
    where: "Kap. 2.1.1 Fordeling og fattigdomsbekjempelse, s. 21"
  - dimension: "Universell grunnmur"
    topic: "Fullgode alternativer til digitale tjenester for eldre"
    quote: "Sikre at eldre med dårlig digital kapasitet har fullgode alternativer som gir tilgang til alle viktige samfunnstjenester"
    where: "Kap. 2.1.5 Seniorpolitikk, s. 24"

  # 7. Barns muligheter
  - dimension: "Barns muligheter"
    topic: "Halvere familiefattigdommen og doble barnetrygden"
    quote: "Arbeide for å halvere familiefattigdommen i Norge, blant annet ved å doble og skattlegge barnetrygden, øke barnetrygden for enslige forsørgere med 50 prosent, og prisjustere den hvert år."
    where: "Kap. 2.1.1 Fordeling og fattigdomsbekjempelse, s. 20"
    statements: ["utsagn-31"]
    # begrunnelse: vil doble barnetrygden
  - dimension: "Barns muligheter"
    topic: "Barnets beste-prinsippet"
    quote: "At prinsippet om barnets beste skal ligge til grunn for hele tjenestetilbudet gjennom oppveksten og følges tett opp."
    where: "Kap. 2.2.1 God barndom og familieliv, s. 26"
    statements: ["utsagn-36"]
    # begrunnelse: vil at barnets beste skal ligge til grunn for tjenestetilbudet
  - dimension: "Barns muligheter"
    topic: "Barns rett til å bli hørt i barnevernet"
    quote: "Sikre at barns rett til å bli hørt ivaretas i barnevernet."
    where: "Kap. 2.2.2 Barnevern og familievern, s. 27"
  - dimension: "Barns muligheter"
    topic: "Barn under 16 år skal ikke fengsles"
    quote: "Sikre at barn under 16 år ikke fengsles, men ivaretas av profesjonelle omsorgsutøvere som en del av det sivile samfunnet."
    where: "Kap. 2.2.2 Barnevern og familievern, s. 27"
  - dimension: "Barns muligheter"
    topic: "Barn med funksjonsnedsettelser"
    quote: "Sikre at barn med funksjonsnedsettelser, sykdom eller utypisk utvikling får oppfylt sine lovfestede rettigheter til opplæring, helsehjelp, kommunikasjon, omsorg, samvær, lek og deltakelse, på lik linje med andre barn"
    where: "Kap. 2.2.1 God barndom og familieliv, s. 26"
  - dimension: "Barns muligheter"
    topic: "Barnehageplass for asylmottaks- og papirløse barn"
    quote: "Gi barn på asylmottak og papirløse barn rett til plass i ordinær barnehage."
    where: "Kap. 2.2.3 Barnehage, s. 29"
    statements: ["utsagn-34"]
    # begrunnelse: vil gi papirløse barn rett til barnehageplass
  - dimension: "Barns muligheter"
    topic: "Kontantstøtten utvides til 2 år"
    quote: "Bevare kontantstøtten og utvide den til å gjelde frem til barnet er 2 år."
    where: "Kap. 2.2.1 God barndom og familieliv, s. 26"
  - dimension: "Barns muligheter"
    topic: "Lavterskeltilbud for familier i sårbare situasjoner"
    quote: "Sikre flere lavterskeltilbud for familier i sårbare situasjoner, inkludert forebyggende familieråd og foreldreråd som mobiliserer ressurser i nettverket rundt."
    where: "Kap. 2.2.2 Barnevern og familievern, s. 27"

  # 8. Robusthet / adaptabilitet
  - dimension: "Robusthet / adaptabilitet"
    topic: "Beredskapslagring av medisiner, mat og materiell"
    quote: "Styrke landets beredskapslagring av medisiner, medisinsk utstyr, matkorn, matvarer og annet samfunnskritisk materiell, samt produsere mer medisiner i Norge."
    where: "Kap. 7.1 Beredskap, s. 101"
    statements: ["utsagn-38"]
    # begrunnelse: vil styrke beredskapslagring av medisiner, mat og materiell
  - dimension: "Robusthet / adaptabilitet"
    topic: "Regionale klimatilpasningsplaner"
    quote: "Utarbeide regionale klimatilpasningsplaner for hele landet, på tvers av sektorer og forvaltningsnivåer, slik at viktige samfunnsfunksjoner, kritisk infrastruktur og natur blir ivaretatt i møte med et varmere, våtere og villere klima."
    where: "Kap. 7.1 Beredskap, s. 101"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Reservekapasitet ved sykehusene"
    quote: "Sikre god fleksibilitet og reservekapasitet ved sykehusene, inkludert systemer for å øke sengetallet og for å omfordele ressurser ved katastrofer og pandemier."
    where: "Kap. 7.1 Beredskap, s. 102"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Langtidsplanen for forsvaret 2025-2036"
    quote: "Støtte hovedprinsippene i langtidsplanen for forsvaret 2025-2036, med økt bemanning, økt trening, oppgradering av utstyr og infrastruktur, anskaffelser og satsing på å bygge et framtidsrettet forsvar av Norge, Norden og Europa."
    where: "Kap. 7.4 Forsvar, s. 105"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Legemiddelberedskap og selvforsyning"
    quote: "Sikre god legemiddelberedskap, og jobbe for mer selvforsyning i framtida."
    where: "Kap. 2.3.1 Folkehelse, s. 36"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Digital beredskap og begrense masseovervåking"
    quote: "Styrke den digitale beredskapen og begrense sårbarheter ved å reversere vedtak om storskala overvåking og lagring av data om befolkningen uten konkret mistanke hos politiet og etteretningstjenesten."
    where: "Kap. 4.6 Demokrati, s. 65"
    statements: ["utsagn-41"]
    # begrunnelse: vil styrke den digitale beredskapen

  # 9. Generasjonsansvar
  - dimension: "Generasjonsansvar"
    topic: "Langsiktig forvaltning av oljefondet"
    quote: "Forvalte fondet ansvarlig og langsiktig for å sikre overgangen til en grønn fremtid."
    where: "Kap. 7.7 Statens pensjonsfond utland, s. 108"
  - dimension: "Generasjonsansvar"
    topic: "Klimafinansiering fra oljefondet (1 % av BNI)"
    quote: "At et beløp tilsvarende én prosent av nasjonalinntekten (BNI) overføres årlig fra Statens Pensjonsfond Utland til klimatiltak, klimatilpasning og naturbevaring i utviklingsland uavhengig av handlingsregelen."
    where: "Kap. 7.7 Statens pensjonsfond utland, s. 108"
  - dimension: "Generasjonsansvar"
    topic: "Etikkrådets mandat og fondets påvirkningskraft"
    quote: "Gjennomgå etikkrådets mandat og retningslinjer, samt Norges Banks oppfølging av anbefalinger fra rådet, med mål om å styrke fondets påvirkningskraft overfor selskaper investert i fossil energi, våpenindustri, omfattende naturinngrep, alkohol, skatteparadiser, sweatshops, eller som har virksomhet på områder okkupert i strid med folkeretten"
    where: "Kap. 7.7 Statens pensjonsfond utland, s. 108"
  - dimension: "Generasjonsansvar"
    topic: "Femårige utslippsbudsjetter frem til 2050"
    quote: "At Stortinget vedtar femårige utslippsbudsjetter frem til 2050, med rettslig bindende utslippskutt i alle sektorer for de to kommende femårsperiodene."
    where: "Kap. 1.1 Klima, s. 7"
  - dimension: "Generasjonsansvar"
    topic: "Parisavtalen"
    quote: "At Norge skal oppfylle sine internasjonale forpliktelser i Parisavtalen."
    where: "Kap. 1.1 Klima, s. 7"
  - dimension: "Generasjonsansvar"
    topic: "Uavhengig klimaråd"
    quote: "Opprette et uavhengig, faglig fundert klimaråd med mandat til å vurdere måloppnåelse, foreslå nødvendige tiltak og virkemidler for å nå klimamålene og føre uavhengig kontroll med om målene etterleves."
    where: "Kap. 1.1 Klima, s. 7"
