id: rodt
source_name: "Rødts arbeidsprogram 2025-2029"
source_url: "https://roedt.no/fil/7393ab981e025ec77c5c78797892dfc9f020fc17.pdf?dl="
retrieved_at: "2026-10-13"
points:
  - dimension: "Demokratisk åpenhet"
    topic: "Folkestyre og åpenhet"
    quote: "Forsvare, forsterke og fornye folkestyret med mer åpenhet og demokrati slik at det sikrer innsyn og gir vanlige folk mer kollektiv makt."
    where: "Kamp mot Forskjells-Norge (s. 4)"
  - dimension: "Demokratisk åpenhet"
    topic: "Åpenhet om eierskap"
    quote: "Samtidig må åpenhet om både offentlig og privat eierskap utvides."
    where: "Kamp mot Forskjells-Norge (s. 4)"
    statements: ["utsagn-05"]
    # begrunnelse: vil utvide åpenhet om offentlig og privat eierskap
  - dimension: "Demokratisk åpenhet"
    topic: "Offentlighetsloven for velferdsaktører"
    quote: "Kommersielle velferdsaktører som leverer tjenester til det offentlige må omfattes av offentlighetsloven, arkivloven og forvaltningsloven, slik at offentligheten, tillitsvalgte og pårørende kan ha fullt innsyn i hvordan ressursene brukes."
    where: "Profittfri velferd (s. 13)"
  - dimension: "Demokratisk åpenhet"
    topic: "Demokratisk valgte ungdomsråd"
    quote: "Etablere gode retningslinjer som sikrer at Ungdomsråd og Ungdommens fylkesråd blir demokratisk valgt, og at de får reell deltakelse og påvirkningskraft."
    where: "Ungdom (s. 84)"
  - dimension: "Norsk handlefrihet"
    topic: "EØS-avtalen sies opp"
    quote: "At EØS-avtalen sies opp og erstattes med en handelsavtale."
    where: "Et organisert arbeidsliv (s. 11)"
  - dimension: "Norsk handlefrihet"
    topic: "Reservasjonsretten mot EU-direktiver"
    quote: "Før dette skjer, må reservasjonsretten i avtalen benyttes overfor EU-direktiver som svekker fagbevegelsen og faglige rettigheter."
    where: "Et organisert arbeidsliv (s. 11)"
  - dimension: "Norsk handlefrihet"
    topic: "Nasjonalt forsvar, ikke stormaktskriger"
    quote: "Norge må slutte å delta i stormaktenes folkerettsstridige kriger, og heller bygge opp et sterkt, nasjonalt forsvar."
    where: "Mot imperialisme og krig (s. 86)"
  - dimension: "Norsk handlefrihet"
    topic: "Forsvarsallianse uten stormaktsstyring"
    quote: "Rødts mål er en forsvarsallianse som styrker vår nasjonale sikkerhet og selvstendighet, og ikke styres av stormaktsinteresser."
    where: "Mot imperialisme og krig (s. 86)"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Nasjonal kontroll over kraften og makspris"
    quote: "Nasjonal kontroll over kraften vår, og en makspris på strøm for husholdninger, industri og næringsliv."
    where: "Kamp mot Forskjells-Norge (s. 4)"
    statements: ["utsagn-12"]
    # begrunnelse: vil ha nasjonal kontroll over kraften og en makspris på strøm
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Rettferdig grunnrentebeskatning"
    quote: "Arbeide for en mer rettferdig grunnrentebeskatning som sørger for at verdier som skapes basert på fellesskapets ressurser på land og til havs, ikke hentes ut av private eiere, men tilfaller fellesskapet lokalt og nasjonalt."
    where: "Økonomi (s. 5)"
  - dimension: "Barns muligheter"
    topic: "SFO som fritidstilbud med fagfolk"
    quote: "At SFO skal ha en egen daglig leder med relevant pedagogisk utdanning, og SFO skal ha fagutdannet barne- og ungdomsarbeidere."
    where: "Skole (s. 28)"
  - dimension: "Barns muligheter"
    topic: "Barn med funksjonsnedsettelse"
    quote: "At barn- og ungdom med nedsatt funksjonsevne ivaretas spesielt i barnehage, skole og på arbeidsmarkedet."
    where: "Rettigheter for mennesker med funksjonsnedsettelser (s. 83)"
  - dimension: "Barns muligheter"
    topic: "Psykisk lavterskeltilbud for barn og unge"
    quote: "Styrke psykologisk lavterskeltilbud til barn, ungdom og studenter gjennom skole- og studenthelsetjenester."
    where: "Helse (s. 15)"
  - dimension: "Barns muligheter"
    topic: "Tid til pedagogisk arbeid i barnehagen"
    quote: "At barnehagelærere må ha avsatt nok tid til å planlegge og forberede det pedagogiske tilbudet og aktiviteten i barnehagen."
    where: "Barnehage (s. 25)"
    statements: ["utsagn-33"]
    # begrunnelse: vil gi barnehagelærere tid til pedagogisk arbeid
  - dimension: "Teknologisk kapasitet"
    topic: "Lik digital tilgang i skolen"
    quote: "Elevene i skolen må få lik tilgang til og opplæring i de læringsfremmende ressursene som digital teknologi har å tilby."
    where: "Skole (s. 26)"
  - dimension: "Teknologisk kapasitet"
    topic: "Digital kompetanse i utdanningen"
    quote: "At vi har fokus på digital kompetanse i alle ledd i utdanningssektoren."
    where: "Skole (s. 27)"
  - dimension: "Teknologisk kapasitet"
    topic: "Forskning og teknologi for fornybar retning"
    quote: "Gjennom forskning og ny teknologi kan vi være med på å bidra til at verden går i fornybar retning, vi kan sikre norske arbeidsplasser og vi kan bruke teknologien til å sikre at egen kraftproduksjon og utbygging skjer på en minst mulig naturinngripende måte."
    where: "Industri (s. 56)"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Selvforsyning og beredskapslagre"
    quote: "Rødt mener Norge må ha en langt større grad av selvforsyning, samt reetablere beredskapslagre av kritiske varer som mat, medisin og drivstoff, og generelt styrke hele samfunnets motstandskraft i møte med kriser og krig."
    where: "Sivil beredskap (s. 89)"
    statements: ["utsagn-38"]
    # begrunnelse: vil reetablere beredskapslagre av kritiske varer
  - dimension: "Robusthet / adaptabilitet"
    topic: "Styrke sivilforsvaret"
    quote: "Styrke sivilforsvaret, og øke kapasiteten for evakuering av sivilbefolkningen i krise og krig."
    where: "Sivil beredskap (s. 89)"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Sivil beredskap for dårlig"
    quote: "Totalberedskaps-kommisjonen fastslo i sin rapport at den sivile beredskapen er for dårlig til å gi tilstrekkelig beskyttelse til sivilbefolkningen i krise og krig."
    where: "Sivil beredskap (s. 89)"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Nytt verktøy i stedet for Innovasjon Norge"
    quote: "Nedlegge dagens Innovasjon Norge og bygge opp et nytt statlig verktøy for næringsutvikling med fokus på industri og produksjon."
    where: "Industri (s. 54)"
    statements: ["utsagn-21"]
    # begrunnelse: vil legge ned Innovasjon Norge og bygge et nytt statlig verktøy
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Kartlegge kompetansebehov ved grønn omstilling"
    quote: "Staten skal kartlegge kompetansebehovet i en grønn omstilling og muligheter for overføring fra petroleumssektoren."
    where: "Olje og gass (s. 57)"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Kompetanse fra petroleum til leverandørindustri"
    quote: "Videreutvikle kompetanse og arbeidsplasser i industrien som er bygd opp rundt petroleumsnæringen gjennom omstilling til leverandørindustri for grønne næringer"
    where: "Industri (s. 53)"
  - dimension: "Generasjonsansvar"
    topic: "Fondet til klimavennlig infrastruktur"
    quote: "Omplassere deler av fondet til investeringer i klimavennlig infrastruktur for å kutte utslipp, unngå global klimakatastrofe og sikre grunnlaget for verdiskaping for framtidige generasjoner."
    where: "Økonomi (s. 7)"
  - dimension: "Generasjonsansvar"
    topic: "Natur som karbonlager og beskyttelse"
    quote: "Naturen fanger og lagrer karbonutslipp, og skog, våtmark og annen natur bidrar til å beskytte oss mot konsekvenser av klimaendringer som flom og ras."
    where: "Klima (s. 39)"
  - dimension: "Generasjonsansvar"
    topic: "Bærekraftige tiltak mot nullutslipp"
    quote: "Klimapolitikken skal prioritere tiltak som er bærekraftige over tid og som bidrar til omstilling mot nullutslippssamfunnet."
    where: "Klima (s. 39)"
  - dimension: "Universell grunnmur"
    topic: "Eldre skal bo hjemme så lenge de vil"
    quote: "At eldre skal kunne bo i egne hjem så lenge de selv ønsker, men få tilbud om omsorgsbolig med heldøgns omsorg og pleie, eller sykehjemsplass når de føler behov for mer omsorg og hjelp."
    where: "Eldrepolitikk (s. 23)"
  - dimension: "Universell grunnmur"
    topic: "Sykehusene skal eies av staten"
    quote: "At sykehusene skal eies av staten og styres av Helse- og Omsorgsdepartementet og Stortinget med bevilgninger til regionale helsestyrer i tråd med sentralt vedtatt sykehusplan."
    where: "Helse (s. 14)"
  - dimension: "Universell grunnmur"
    topic: "Skattepenger til felles velferd"
    quote: "Skattepengene våre skal gå til felles velferd for å sikre alle innbyggere et godt velferdstilbud slik at vi får gode barnehager, et trygt barnevern, en god skole og en god eldreomsorg."
    where: "Profittfri velferd (s. 13)"
  - dimension: "Universell grunnmur"
    topic: "Arbeidsliv som inkluderer flere"
    quote: "Veien tilbake til arbeidslivet går ikke gjennom trange kår og økonomisk usikkerhet, men gjennom et arbeidsliv som inkluderer flere og ikke støter ut eldre og personer med helseproblemer eller med nedsatt funksjonsevne av andre grunner."
    where: "Et organisert arbeidsliv (s. 9)"
  - dimension: "Universell grunnmur"
    topic: "Opptrappingsplan for helsepersonell"
    quote: "At det lages en nasjonal opptrappingsplan for utdanning av helsefagarbeidere, sykepleiere, vernepleiere, spesialsykepleiere og spesialvernepleiere."
    where: "Helse (s. 15)"
