id: sv
source_name: "SVs arbeidsprogram 2025–2029 (vedtatt av SVs landsmøte 16.3.2025)"
source_url: "https://www.sv.no/wp-content/uploads/2025/10/arbeidsprogram-2025-interaktiv-bokmal.pdf"
retrieved_at: "2026-10-12"
points:
  # --- 1. Demokratisk åpenhet ---
  - dimension: "Demokratisk åpenhet"
    topic: "Mediemangfold og redaktørstyrte medier"
    quote: "sikre folks tilgang til informasjon. Vi vil styrke mediemangfoldet og styrke redaktørstyrte medier gjennom å øke mediestøtten og gjøre momsfritak plattformnøytralt."
    where: "Kap. 2.14 Demokrati, «Offentlighet», s. 84–85"
  - dimension: "Demokratisk åpenhet"
    topic: "Regulering av sosiale medier og teknologiselskaper"
    quote: "innføre langt tøffere regulering av sosiale medier, støtte internasjonalt arbeid for oppsplitting av de store teknologiselskapene"
    where: "Kap. 2.14 Demokrati, «Offentlighet», s. 84–85"
  # --- 2. Norsk handlefrihet ---
  - dimension: "Norsk handlefrihet"
    topic: "EØS-handlingsrom og reservasjonsrett"
    quote: "bruke handlingsrommet og reservasjonsretten i EØS"
    where: "Kap. 2.14 Demokrati, «Utvide demokratiet», s. 84–85"
  - dimension: "Norsk handlefrihet"
    topic: "EU-medlemskap og suverenitet"
    quote: "si nei til norsk EU medlemskap og arbeide for en samarbeidsform med EU som ikke avgir suverenitet slik EØS gjør."
    where: "Kap. 2.14 Demokrati, «Utvide demokratiet», s. 84–85"
  - dimension: "Norsk handlefrihet"
    topic: "Energiunionen og energibyrået ACER"
    quote: "si nei til EUs fjerde energimarkedspakke og fornybardirektivet, og melde Norge ut av EUs energiunion og energibyrået ACER."
    where: "Kap. 1.6 Kraft på folkets og miljøets premisser, s. 13–14"
  - dimension: "Norsk handlefrihet"
    topic: "Nasjonal råderett og utenlandske baser"
    quote: "ha full nasjonal råderett på norsk jord og avvikle utenlandske baser"
    where: "Kap. 2.16 Forsvar og beredskap, s. 92–93"
  # --- 3. Forvaltning av fellesskapets ressurser / energi ---
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Krafta tilbake til demokratisk kontroll"
    quote: "ta krafta av børs og utrede alternative modeller som erstatter dagens markedsstyrte kraftsystem med et demokratisk styrt system"
    where: "Kap. 1.6 Kraft på folkets og miljøets premisser, s. 12–13"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Statlig foretak for kjøp og salg av strøm"
    quote: "opprette et statlig foretak for kjøp og salg av strøm. Foretaket skal ha anledning til å kjøpe strøm direkte fra produsenter og spotmarkedet, og tilby langsiktige og forutsigbare avtaler til husholdningene, industrien og øvrig næringsliv til en rimelig pris over hele landet."
    where: "Kap. 1.6 Kraft på folkets og miljøets premisser, s. 12–13"
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Statlig mineralselskap"
    quote: "opprette et statlig mineralselskap for bærekraftig utvinning av kritiske mineraler i Norge"
    where: "Kap. 2.12 Næring, s. 74–75"
    statements: ["utsagn-17"]
    # begrunnelse: vil opprette et statlig mineralselskap
  - dimension: "Forvaltning av fellesskapets ressurser / energi"
    topic: "Økt matselvforsyning"
    quote: "øke selvforsyningen til minst 50 prosent, korrigert for fôrimport"
    where: "Kap. 1.7 Ta havet tilbake og jorda i bruk, s. 14–15"
  # --- 4. Teknologisk kapasitet ---
  - dimension: "Teknologisk kapasitet"
    topic: "Kritisk IT-infrastruktur plassert i Norge"
    quote: "at kritiske og samfunnsviktige IT-tjenester og IT-infrastruktur er plassert i Norge, med kjente eiere"
    where: "Kap. 2.14 Demokrati, «Fellesskapets digitale makt», s. 86–87"
  - dimension: "Teknologisk kapasitet"
    topic: "Egne skyløsninger for offentlig sektor"
    quote: "utvikle egne skyløsninger for offentlig sektor"
    where: "Kap. 2.14 Demokrati, «Fellesskapets digitale makt», s. 86–87"
    statements: ["utsagn-19"]
    # begrunnelse: vil utvikle egne skyløsninger for offentlig sektor
  - dimension: "Teknologisk kapasitet"
    topic: "Datatilsynet og kunstig intelligens"
    quote: "styrke Datatilsynet for å sikre trygg bruk og ny innføring av teknologier, som kunstig intelligens"
    where: "Kap. 2.14 Demokrati, «Fellesskapets digitale makt», s. 86–87"
  - dimension: "Teknologisk kapasitet"
    topic: "Statlig kontroll over Forsvarets data"
    quote: "arbeide for at alle Forsvarets data skal lagres på servere som er under statlig kontroll"
    where: "Kap. 2.16 Forsvar og beredskap, «En styrket nasjonal forsvarsevne», s. 96"
  # --- 5. Innovasjon / omstillingsevne ---
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Strategiske grønne industrisatsinger"
    quote: "bygge strategiske industrisatsinger på flytende havvind, hydrogenproduksjon, karbonfangst og lagring, helhetlige verdikjede for batterier, grønn skipsfart og bioindustri, hvor det sikres at verdiskapingen skjer i Norge og kommer fellesskapet til gode"
    where: "Kap. 2.12 Næring, s. 72–73"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Statlige kapitalvirkemidler"
    quote: "styrke og oppkapitalisere de statlige kapitalvirkemidlene som Nysnø og Siva"
    where: "Kap. 2.12 Næring, s. 72–73"
  - dimension: "Innovasjon / omstillingsevne"
    topic: "Grønt statlig holdingselskap"
    quote: "opprette et nytt grønt statlig holdingselskap som skal forvalte de viktigste industriselskapene som staten eier, med mandat til å gjennomføre grønn omstilling gjennom aktivt eierskap i eksisterende og nye selskaper"
    where: "Kap. 2.12 Næring, s. 72–73"
  # --- 6. Universell grunnmur ---
  - dimension: "Universell grunnmur"
    topic: "Tannhelsereform"
    quote: "fortsette tannhelsereformen. Ingen skal måtte betale mer for å gå til tannlegen enn for å gå til legen."
    where: "Kap. 1.4 Redd velferdsstaten, s. 10–11"
    statements: ["utsagn-25"]
    # begrunnelse: vil fortsette tannhelsereformen
  - dimension: "Universell grunnmur"
    topic: "Tredje boligsektor"
    quote: "bygge opp en tredje boligsektor. Vi vil bygge flere ikke-kommersielle utleieboliger og prisregulerte selveier- og studentboliger."
    where: "Kap. 1.5 Alle skal ha et trygt hjem, s. 12–13"
  - dimension: "Universell grunnmur"
    topic: "Bostøtte"
    quote: "styrke bostøtteordningen. Vi vil at flere skal få tilgang til bostøtte, og at en større del av boutgiftene dekkes."
    where: "Kap. 1.5 Alle skal ha et trygt hjem, s. 12–13"
  # --- 7. Barns muligheter ---
  - dimension: "Barns muligheter"
    topic: "Gratis skolemåltid"
    quote: "skape en skole med muligheter for alle. Vi vil innføre gratis måltid hver dag på ungdomsskole og videregående skole."
    where: "Kap. 1.8 Et løft for ungdommen, s. 16–17"
    statements: ["utsagn-35"]
    # begrunnelse: vil innføre gratis skolemåltid
  - dimension: "Barns muligheter"
    topic: "Retten til fritidsklubb"
    quote: "lovfeste retten til fritidsklubb."
    where: "Kap. 1.8 Et løft for ungdommen, s. 16–17"
  - dimension: "Barns muligheter"
    topic: "Ungdomsjobber"
    quote: "lage et nasjonalt program med mål om å skape 50 000 ungdomsjobber."
    where: "Kap. 1.8 Et løft for ungdommen, s. 16–17"
  - dimension: "Barns muligheter"
    topic: "Psykisk helsetilbud for barn og unge"
    quote: "sikre et bedre psykisk helsetilbud for barn og unge."
    where: "Kap. 1.8 Et løft for ungdommen, s. 16–17"
  # --- 8. Robusthet / adaptabilitet ---
  - dimension: "Robusthet / adaptabilitet"
    topic: "Tilfluktsrom"
    quote: "sikre at det finnes offentlige, tilgjengelige og funksjonelle tilfluktsrom som dekker befolkningens behov"
    where: "Kap. 2.16 Forsvar og beredskap, «Samfunnssikkerhet og beredskap», s. 94–95"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Lagerplikt for livsviktige medisiner"
    quote: "innføre lagerplikt for livsviktige medisiner og utvide lagerkapasiteten for medisiner, virkestoffer, medisinsk utstyr og smittevernutstyr"
    where: "Kap. 2.16 Forsvar og beredskap, «Samfunnssikkerhet og beredskap», s. 94–95"
  - dimension: "Robusthet / adaptabilitet"
    topic: "Matberedskap"
    quote: "øke selvforsyningen og opprettholde matproduksjon i hele landet, øke beredskapslagring på korn og sørge for at sjømat blir ilandført og videreforedlet i Norge"
    where: "Kap. 2.16 Forsvar og beredskap, «Samfunnssikkerhet og beredskap», s. 94–95"
    statements: ["utsagn-38", "utsagn-39"]
    # begrunnelse: vil øke beredskapslagring på korn og opprettholde matproduksjon
  - dimension: "Robusthet / adaptabilitet"
    topic: "Kritisk infrastruktur"
    quote: "styrke vedlikehold og sikring av kritisk infrastruktur som jernbane, kraftforsyning, vann, avløp og digital infrastruktur"
    where: "Kap. 2.16 Forsvar og beredskap, «Samfunnssikkerhet og beredskap», s. 94–95"
  # --- 9. Generasjonsansvar ---
  - dimension: "Generasjonsansvar"
    topic: "Klimamål 2035 og 2050"
    quote: "omstille norsk økonomi slik at vi oppfyller Klimalovens mål om å kutte norske utslipp med 90–95 prosent innen 2050."
    where: "Kap. 2.10 Miljø, «Kutte klimagassutslipp», s. 62–63"
  - dimension: "Generasjonsansvar"
    topic: "Varig vern og utfasing av petroleum"
    quote: "ikke tillate utbygging av ny petroleumsinfrastruktur på norsk sokkel, og innføre varig vern av Barentshavet og Lofoten, Vesterålen, Senja og Mørebankene"
    where: "Kap. 2.10 Miljø, «Kutte klimagassutslipp», s. 62–63"
  - dimension: "Generasjonsansvar"
    topic: "Oljefondet ut av fossil energi"
    quote: "at oljefondet trekkes ut av fossil energi og at investeringene skal være i tråd med Parisavtalens mål om maks 1,5 graders oppvarming"
    where: "Kap. 2.15 Utenriks og utvikling, «Redusert global ulikhet», s. 92"
