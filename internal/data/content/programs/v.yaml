- dimension: Generasjonsansvar
  topic: Grense for SPU-uttak
  quote: At det settes en øvre grense på 25 prosent for hvor stor del av statens utgifter (unntatt petroleumsvirksomhet) som kan finansieres ved uttak fra SPU.
  where: Kapittel 5 Næring og skatt
- dimension: Generasjonsansvar
  topic: SPU-indekser for klima og natur
  quote: Utvikler nye referanseindekser for SPU, som sikrer en forvaltning i tråd med klima- og naturmålene.
  where: Kapittel 5 Næring og skatt
- dimension: Generasjonsansvar
  topic: Bruk av SPU-avkastningen
  quote: Innføre en regel om at avkastningen fra SPU i statsbudsjettet i all hovedsak skal brukes på vekstfremmende skattelettelser og investeringer i infrastruktur, forskning og innovasjon.
  where: Kapittel 5 Næring og skatt
- dimension: Generasjonsansvar
  topic: Etiske krav til SPU
  quote: At Statens pensjonsfond utland (SPU) ikke skal være investert i selskaper som direkte eller indirekte bidrar til alvorlige brudd på folkeretten, menneskerettighetene eller til å opprettholde ulovlig okkupasjon.
  where: Kapittel 10 Utenriks og forsvar
