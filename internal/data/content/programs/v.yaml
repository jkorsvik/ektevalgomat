  quote: Sikre et totalforsvar som er forberedt på krise og krig, tydeliggjøre sivile myndigheters, næringslivets, industriens og frivillighetens roller, og sikre at vi benytter samfunnets samlede kompetanse best mulig.
  where: Kapittel 6 Justis og beredskap
