  quote: Følge nøye med på spredning, og ta nødvendige tiltak både nasjonalt, sammen med EU, og internasjonalt for å motvirke storskala spredning av desinformasjon, spesielt gjennom algoritmer og sosiale medier.
  where: Kapittel 9 Demokrati og teknologi
