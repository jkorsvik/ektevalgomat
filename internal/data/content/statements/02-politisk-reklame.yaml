id: utsagn-02
number: 2
dimension: "Demokratisk åpenhet"
primary_question: "Kan offentligheten se hvem som påvirker hvem, for hvem og med hvilke penger?"
case_tag: politisk_reklame
short_name: "Regulere anonym finansiering av politisk reklame"
text: >
  Anonym finansiering av politisk reklame og markedsføring bør reguleres.
practical_stakes:
  enig: >
    Regjeringen fremmer lovforslag som regulerer hvem som kan betale for politisk reklame og kampanjer uten å oppgi navn (for eksempel annonser i sosiale medier eller kampanjer fra tredjeparter utenfor partiene). Det blir krav om åpenhet om hvem som finansierer politiske annonser.
  uenig: >
    Ingen slik ny regulering innføres nå. Aktører utenfor de politiske partiene kan fortsatt betale for politiske reklamekampanjer uten krav om å oppgi hvem som står bak pengene.
