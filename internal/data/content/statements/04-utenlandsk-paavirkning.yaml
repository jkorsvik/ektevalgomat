id: utsagn-04
number: 4
dimension: "Demokratisk åpenhet"
codes_on: avvist_alternativ
primary_question: "Kan offentligheten se hvem som påvirker hvem, for hvem og med hvilke penger?"
case_tag: utenlandsk_paavirkning
short_name: "Dagens innsats mot utenlandsk valgpåvirkning er nok"
text: >
  Myndighetenes eksisterende arbeid mot utenlandsk påvirkning av norske
  valg er tilstrekkelig, uten et eget oppdrag om å systematisk kartlegge
  og informere om slik aktivitet.
practical_stakes:
  enig: >
    Etterretningstjenestene og valgdirektoratet fortsetter arbeidet sitt innenfor dagens rammer. Regjeringen får ikke et eget, nytt oppdrag om å systematisk kartlegge og gå ut offentlig med informasjon om utenlandske påvirkningsforsøk mot norske valg.
  uenig: >
    Regjeringen får et eget oppdrag om å systematisk kartlegge og informere offentligheten om forsøk på utenlandsk valgpåvirkning (som desinformasjonskampanjer og koordinerte nettverk i sosiale medier), utover dagens ordinære beredskap.
