id: utsagn-05
number: 5
dimension: "Demokratisk åpenhet"
primary_question: "Kan offentligheten se hvem som påvirker hvem, for hvem og med hvilke penger?"
case_tag: generelt
short_name: "Etterprøvbarhet i åpenhetssaker"
text: >
  Stortinget og partiene bør gjøre det mulig for offentligheten å
  etterprøve hvordan hver enkelt sak om åpenhet og integritet ble
  behandlet og avgjort.
practical_stakes:
  enig: >
    Stortinget og departementene innfører faste rutiner og registre som gjør at innbyggere og presse i etterkant kan sjekke hvordan enkeltsaker om habilitet, aksjehandel og åpenhet faktisk ble vurdert, behandlet og avgjort.
  uenig: >
    Dagens ordning videreføres uten nye felles rutiner for innsyn i enkeltsaker om habilitet og etikk. Hver institusjon håndterer slike saker innenfor dagens regler.
