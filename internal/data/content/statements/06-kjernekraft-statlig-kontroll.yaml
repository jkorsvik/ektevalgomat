id: utsagn-06
number: 6
dimension: "Norsk handlefrihet"
primary_question: "Beholder Norge reell beslutnings- og operasjonsevne?"
case_tag: kjernekraft_statlig_kontroll
short_name: "Statlig kontroll over kjernekraft"
text: >
  Eventuell kjernekraftutbygging i Norge bør skje under fullt statlig
  eierskap og kontroll.
practical_stakes:
  enig: >
    Dersom det skal bygges kjernekraftverk i Norge, må anleggene eies og kontrolleres fullt ut av den norske staten, på samme måte som staten eier hoveddelen av vannkraften, ikke av private selskaper.
  uenig: >
    Det legges ingen begrensning om at staten må eie kjernekraftverk alene. Private og kommersielle selskaper kan eie, finansiere og drifte eventuelle kjernekraftverk i Norge dersom de får konsesjon.
