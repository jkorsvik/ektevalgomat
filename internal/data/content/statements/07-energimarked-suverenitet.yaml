id: utsagn-07
number: 7
dimension: "Norsk handlefrihet"
primary_question: "Beholder Norge reell beslutnings- og operasjonsevne?"
case_tag: energimarked_suverenitet
short_name: "Beholde dagens EØS-tilknytning i energimarkedet"
text: >
  Norge bør beholde dagens EØS-tilknytning til EUs
  energimarkedsregelverk, inkludert ACERs rolle, uten nye nasjonale
  begrensninger.
practical_stakes:
  enig: >
    Norge beholder dagens tilknytning til EUs energimarkedsregelverk og EUs energibyrå (ACER) gjennom EØS-avtalen, uten å innføre nye nasjonale særregler eller begrensninger på krafthandelen over grensene.
  uenig: >
    Norge krever unntak fra deler av EUs energimarkedsregelverk og ACERs myndighet, og innfører sterkere nasjonal politisk styring over kraftmarkedet og utenlandskablene.
