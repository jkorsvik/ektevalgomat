id: utsagn-08
number: 8
dimension: "Norsk handlefrihet"
primary_question: "Beholder Norge reell beslutnings- og operasjonsevne?"
case_tag: krafteksport_styringsmekanisme_statnett
short_name: "Dagens styring av krafteksporten er nok"
text: >
  Statnett bør ikke få en ny fullmakt til å redusere
  krafteksportkapasiteten når fyllingsgraden i vannmagasinene er lav.
practical_stakes:
  enig: >
    Statnett fortsetter å styre utenlandskablene etter dagens handelsavtaler med nabolandene, og får ikke en ny nasjonal fullmakt til å strupe krafteksporten når det er lite vann i norske vannmagasiner.
  uenig: >
    Statnett får en ny, lovfestet fullmakt til å holde igjen kraft og redusere eksportkapasiteten på utenlandskablene når fyllingsgraden i norske vannmagasiner faller under normalt nivå.
