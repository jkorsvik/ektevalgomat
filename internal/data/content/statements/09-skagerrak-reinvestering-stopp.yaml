id: utsagn-09
number: 9
dimension: "Norsk handlefrihet"
primary_question: "Beholder Norge reell beslutnings- og operasjonsevne?"
case_tag: skagerrak_reinvestering_fortsett
short_name: "Fortsette utredning av nye Skagerrak-kabler"
text: >
  Regjeringen bør instruere NVE om å fortsette utredningsprogrammet for
  mulig reinvestering av utenlandskablene Skagerrak 1 og 2 til Danmark.
practical_stakes:
  enig: >
    Norges vassdrags- og energidirektorat (NVE) fullfører den faglige utredningen av om utenlandskablene Skagerrak 1 og 2 mellom Norge og Danmark bør erstattes når levetiden deres går ut.
  uenig: >
    Regjeringen stanser NVEs utredning nå, slik at det ikke arbeides videre med planer om å erstatte eller fornye de to eldste strømkablene til Danmark (Skagerrak 1 og 2).
