id: utsagn-10
number: 10
dimension: "Norsk handlefrihet"
primary_question: "Beholder Norge reell beslutnings- og operasjonsevne?"
case_tag: hurtigspor_forsvarsanlegg_planbygningslov
short_name: "Særskilt lovhjemmel for hurtig forsvarsbygging"
text: >
  Regjeringen bør fremme en egen lovhjemmel for hurtig behandling av
  forsvarsanlegg, uavhengig av plan- og bygningsloven.
practical_stakes:
  enig: >
    Det lages en egen hurtigspor-lov for forsvarsutbygging (skytefelt, baser og kritisk militær infrastruktur), slik at prosjekter kan vedtas raskere uten å følge alle hørings- og saksbehandlingsstegene i den vanlige plan- og bygningsloven.
  uenig: >
    Utbygging av forsvarsanlegg må fortsatt følge den ordinære plan- og bygningsloven, med vanlig kommunal planbehandling, nabovarsel og miljøutredninger.
