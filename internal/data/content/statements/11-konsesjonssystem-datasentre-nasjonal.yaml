id: utsagn-11
number: 11
dimension: "Norsk handlefrihet"
primary_question: "Beholder Norge reell beslutnings- og operasjonsevne?"
case_tag: konsesjonssystem_datasentre_nasjonal
short_name: "Nasjonalt konsesjonssystem for datasentre"
text: >
  Regjeringen bør utrede innføring av et nasjonalt konsesjonssystem for
  datasentre.
practical_stakes:
  enig: >
    Regjeringen utreder en nasjonal konsesjonsordning der nye datasentre må søke statlig tillatelse før de får koble seg på strømnettet, slik at myndighetene kan prioritere hva kraften skal brukes til (for eksempel industri fremfor utvinning av kryptovaluta).
  uenig: >
    Det utredes ikke et eget nasjonalt konsesjonssystem for datasentre. Datasentre får tilgang til strømnettet etter de vanlige reglene for nettilknytning og kommunal regulering.
