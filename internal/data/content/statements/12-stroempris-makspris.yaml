id: utsagn-12
number: 12
dimension: "Forvaltning av fellesskapets ressurser / energi"
primary_question: "Hvem kontrollerer ressursene, risikoen og verdiskapingen?"
case_tag: stroempris_makspris
short_name: "Referanseprisordning fremfor lovbestemt makspris"
text: >
  Staten bør bruke støtte- eller referanseprisordninger, som Norgespris,
  fremfor en lovbestemt nasjonal makspris på strøm.
practical_stakes:
  enig: >
    Staten kompenserer husholdninger gjennom støtte- eller fastprisordninger (som Norgespris eller strømstøtte) når strømprisen er høy, mens selve markedsprisen på kraftbørsen flyter fritt uten et lovpålagt pristak.
  uenig: >
    Staten griper direkte inn i strømmarkedet og lovfester en øvre nasjonal makspris på hva kraftselskaper har lov til å ta betalt for strøm i Norge.
