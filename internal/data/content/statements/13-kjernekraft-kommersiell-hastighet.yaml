id: utsagn-13
number: 13
dimension: "Forvaltning av fellesskapets ressurser / energi"
primary_question: "Hvem kontrollerer ressursene, risikoen og verdiskapingen?"
case_tag: kjernekraft_kommersiell_hastighet
short_name: "Kommersiell kjernekraft nå, ikke senere"
text: >
  Stortinget bør nå vedta lovendringer for privat finansiert, kommersiell
  kjernekraftproduksjon i Norge, ikke vente på en stortingsmelding.
practical_stakes:
  enig: >
    Stortinget endrer lovverket nå slik at private selskaper kan søke om å bygge og finansiere kommersielle kjernekraftverk i Norge, uten å vente flere år på en bred offentlig utredning og stortingsmelding.
  uenig: >
    Stortinget åpner ikke for kommersiell kjernekraft nå. Spørsmålet om sikkerhet, avfall, beredskap og kostnader utredes først gjennom en full stortingsmelding før reglene eventuelt endres.
