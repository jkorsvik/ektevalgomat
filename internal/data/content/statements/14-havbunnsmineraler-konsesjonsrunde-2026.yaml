id: utsagn-14
number: 14
dimension: "Forvaltning av fellesskapets ressurser / energi"
primary_question: "Hvem kontrollerer ressursene, risikoen og verdiskapingen?"
case_tag: havbunnsmineraler_konsesjonsrunde_2026
short_name: "Start konsesjonsrunde for havbunnsmineraler i 2026"
text: >
  Regjeringen bør sette i gang første konsesjonsrunde for
  havbunnsmineraler på norsk kontinentalsokkel.
practical_stakes:
  enig: >
    Norge starter den formelle prosessen mot å dele ut de første
    tillatelsene til å utvinne mineraler fra havbunnen på norsk sokkel,
    slik at selskaper kan søke om lisens. En
    konsesjonsrunde er søknadsprosessen, ikke selve gruvedriften: den
    starter ikke utvinning i seg selv, men den er skrittet som gjør
    utvinning mulig.
  uenig: >
    Denne konsesjonsrunden startes ikke nå. Ingen selskaper kan søke om
    lisens til havbunnsmineraler på norsk sokkel.
