id: utsagn-15
number: 15
dimension: "Forvaltning av fellesskapets ressurser / energi"
primary_question: "Hvem kontrollerer ressursene, risikoen og verdiskapingen?"
case_tag: havbunnsmineraler_moratorium_isa
short_name: "Internasjonalt moratorium på havbunnsmineralutvinning"
text: >
  Regjeringen bør jobbe aktivt internasjonalt for et moratorium på
  havbunnsmineralutvinning fram til det er bevist trygt for
  naturmangfoldet.
practical_stakes:
  enig: >
    Regjeringen arbeider aktivt internasjonalt for et moratorium
    (midlertidig stans) på havbunnsmineralutvinning, fram til det er bevist
    trygt for naturmangfoldet.
  uenig: >
    Regjeringen arbeider ikke for et slikt moratorium internasjonalt.
    Havbunnsmineralutvinning kan fortsette å utvikle seg uten en slik
    midlertidig stans.
