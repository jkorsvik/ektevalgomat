id: utsagn-15
number: 15
dimension: "Forvaltning av fellesskapets ressurser / energi"
primary_question: "Hvem kontrollerer ressursene, risikoen og verdiskapingen?"
case_tag: havbunnsmineraler_moratorium_isa
short_name: "Internasjonalt moratorium på havbunnsmineralutvinning"
text: >
  Regjeringen bør jobbe aktivt internasjonalt for et moratorium på
  havbunnsmineralutvinning fram til det er bevist trygt for
  naturmangfoldet.
practical_stakes:
  enig: >
    Norge jobber aktivt i internasjonale fora (som Den internasjonale havbunnsmyndigheten, ISA) for et internasjonalt moratorium, altså en midlertidig stans i all gruvedrift på dyphavsbunnen, inntil forskningen viser at det kan skje uten alvorlig skade på økosystemene i havet.
  uenig: >
    Norge går ikke inn for en internasjonal frys (moratorium), men mener at kartlegging, regelverksutvikling og mulig utvinning av havbunnsmineraler bør gå videre steg for steg under nasjonal og internasjonal forvaltning.
