id: utsagn-16
number: 16
dimension: "Forvaltning av fellesskapets ressurser / energi"
primary_question: "Hvem kontrollerer ressursene, risikoen og verdiskapingen?"
case_tag: prisradet_havbruk_avvikling
short_name: "Avvikle Prisrådet for havbruk"
text: >
  Regjeringen bør avvikle ordningen med normpris og Prisrådet for havbruk.
practical_stakes:
  enig: >
    Prisrådet for havbruk (normprisrådet) legges ned. Da fastsettes grunnrenteskatten for oppdrettsselskaper ut fra prisene selskapene selv oppgir at de har solgt laksen for, i stedet for at et uavhengig statlig råd setter en beregnet markedspris (normpris).
  uenig: >
    Prisrådet for havbruk består. Et uavhengig statlig råd fortsetter å fastsette en bindende normpris på laks ved skatteberegningen, for å hindre at oppdrettsselskaper reduserer norsk grunnrenteskatt ved å selge laks billig til egne datterselskaper i utlandet.
