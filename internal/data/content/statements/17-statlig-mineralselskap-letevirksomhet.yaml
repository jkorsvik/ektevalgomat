id: utsagn-17
number: 17
dimension: "Forvaltning av fellesskapets ressurser / energi"
primary_question: "Hvem kontrollerer ressursene, risikoen og verdiskapingen?"
case_tag: statlig_mineralselskap_letevirksomhet
short_name: "Statlig mineralselskap for letevirksomhet"
text: >
  Staten bør opprette et eget statlig mineralselskap som kan drive
  letevirksomhet og utvinne strategisk viktige mineralforekomster.
practical_stakes:
  enig: >
    Staten oppretter et eget statseid gruve- og mineralselskap (slik staten tidligere gjorde med olje og vannkraft) som selv leter etter og utvinner kritiske mineraler til batterier, industri og forsvar, slik at eierskap og gevinst blir i offentlig regi.
  uenig: >
    Staten oppretter ikke et eget statlig gruveselskap. Leting og utvinning av mineraler i Norge gjøres fortsatt av private norske og utenlandske selskaper innenfor minerallovens konsesjonsregler.
