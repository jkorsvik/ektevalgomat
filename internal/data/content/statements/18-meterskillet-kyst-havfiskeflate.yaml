id: utsagn-18
number: 18
dimension: "Forvaltning av fellesskapets ressurser / energi"
codes_on: avvist_alternativ
primary_question: "Hvem kontrollerer ressursene, risikoen og verdiskapingen?"
case_tag: meterskillet_kyst_havfiskeflate
short_name: "Hjemmelslengde fremfor strengere meterskille"
text: >
  Regjeringen bør videreføre dagens hjemmelslengde som gruppeinndeling i
  kystfiskeflåten, ikke gjeninnføre et strengere 28-meter meterskille.
practical_stakes:
  enig: >
    Stortinget beholder dagens ordning med «hjemmelslengde» (lengden båten opprinnelig hadde da kvoten ble tildelt), slik at kystfiskebåter som er bygget om eller erstattet med fartøy over 28 meter fortsatt kan fiske på kystflåtens kvoter.
  uenig: >
    Stortinget gjeninnfører en absolutt grense på 28 meter faktisk båtlengde. Fiskebåter som i virkeligheten er 28 meter eller lengre, flyttes ut av kystfiskegruppen over i havfiskeflåten, slik at kystkvotene forbeholdes mindre båter.
