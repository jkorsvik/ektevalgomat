id: utsagn-19
number: 19
dimension: "Teknologisk kapasitet"
primary_question: "Kan kritiske digitale funksjoner og kompetanse opprettholdes under press?"
case_tag: nasjonal_skytjeneste_offentlig_eid
short_name: "Kommersielle skytjenester med strenge krav"
text: >
  Offentlig sektor bør bruke kommersielle skytjenester med strenge
  sikkerhetskrav og flere leverandører, i stedet for å bygge en nasjonal
  skytjeneste eid og driftet av det offentlige.
practical_stakes:
  enig: >
    Stat og kommuner fortsetter å bruke kommersielle skytjenester (som Microsoft, Google og Amazon) med skjerpede sikkerhetskrav og krav om å kunne bytte mellom flere leverandører, i stedet for at staten bygger og drifter sin egen nasjonale skyplattform.
  uenig: >
    Det offentlige bygger og eier sin egen nasjonale skytjeneste på norsk jord, driftet av staten selv, for å lagre og behandle offentlige data uten kommersielle utenlandske skyleverandører.
