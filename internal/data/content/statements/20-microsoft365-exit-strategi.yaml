id: utsagn-20
number: 20
dimension: "Teknologisk kapasitet"
primary_question: "Kan kritiske digitale funksjoner og kompetanse opprettholdes under press?"
case_tag: microsoft365_exit_strategi
short_name: "Flere leverandører fremfor rask exit"
text: >
  Staten bør redusere avhengigheten av store IT-plattformer gjennom flere
  leverandører, ikke en rask, tidfestet exit-strategi fra plattformer som
  Microsoft 365.
practical_stakes:
  enig: >
    Staten reduserer sårbarheten ved å spre IT-kjøpene sine på flere leverandører over tid, uten å vedta en tidfestet plan for å kaste ut store kontor- og skyplattformer som Microsoft 365.
  uenig: >
    Staten vedtar en konkret, tidfestet utfasing («exit-strategi») for å erstatte dominerende utenlandske IT-plattformer som Microsoft 365 i offentlig sektor med uavhengige alternativer.
