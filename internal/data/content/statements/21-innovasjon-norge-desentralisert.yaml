id: utsagn-21
number: 21
dimension: "Innovasjon / omstillingsevne"
codes_on: avvist_alternativ
primary_question: "Bygger staten og markedet ny kapasitet eller bare kjøper ferdige løsninger?"
case_tag: innovasjon_norge_desentralisert_struktur
short_name: "Innovasjon Norge velger selv organisasjonsform"
text: >
  Innovasjon Norge bør selv avgjøre sin organisasjonsform, uten en
  bindende føring fra Stortinget om å beholde dagens desentraliserte
  struktur.
practical_stakes:
  enig: >
    Styret og ledelsen i Innovasjon Norge får selv bestemme hvordan organisasjonen skal organiseres og hvor mange lokalkontorer de skal ha når budsjettet strammes inn, uten at Stortinget pålegger dem å beholde dagens kontorstruktur i fylkene.
  uenig: >
    Stortinget pålegger Innovasjon Norge å beholde sin desentraliserte kontorstruktur med tilstedeværelse i distriktene og fylkene, selv når organisasjonen må gjennomføre nedbemanninger og innsparinger.
