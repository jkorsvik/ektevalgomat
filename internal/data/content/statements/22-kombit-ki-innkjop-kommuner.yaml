id: utsagn-22
number: 22
dimension: "Innovasjon / omstillingsevne"
primary_question: "Bygger staten og markedet ny kapasitet eller bare kjøper ferdige løsninger?"
case_tag: kombit_ki_innkjop_kommuner
short_name: "Felleskommunal innkjøpsordning for KI etter KOMBIT-modell"
text: >
  Regjeringen bør utrede felleskommunale innkjøpsordninger for kunstig
  intelligens, etter modell av Danmarks KOMBIT.
practical_stakes:
  enig: >
    Regjeringen utreder en felles innkjøps- og utviklingsmodell for kommunene (lik det danske kommuneselskapet KOMBIT), slik at norske kommuner kan gå sammen om å bestille og kjøpe kunstig intelligens og IT-systemer i stedet for at 357 kommuner forhandler hver for seg.
  uenig: >
    Det settes ikke i gang noen utredning av et slikt felleskommunalt innkjøpsselskap. Hver enkelt kommune eller frivillige kommunesamarbeid fortsetter å kjøpe inn KI- og IT-løsninger på egen hånd.
