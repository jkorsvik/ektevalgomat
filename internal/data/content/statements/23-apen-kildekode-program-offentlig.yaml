id: utsagn-23
number: 23
dimension: "Innovasjon / omstillingsevne"
primary_question: "Bygger staten og markedet ny kapasitet eller bare kjøper ferdige løsninger?"
case_tag: apen_kildekode_program_offentlig
short_name: "Nasjonalt program for åpen kildekode i offentlig sektor"
text: >
  Regjeringen bør opprette et nasjonalt program for åpen kildekode i
  offentlig sektor, med bevilgninger til kompetanseheving og målrettet
  innføring.
practical_stakes:
  enig: >
    Regjeringen oppretter et eget nasjonalt program med øremerkede penger til opplæring og innføring av åpen kildekode (programvare som alle fritt kan bruke, kontrollere og videreutvikle) i stat og kommune.
  uenig: >
    Det opprettes ikke et eget statlig program med bevilgninger for åpen kildekode. Offentlige virksomheter velger selv mellom lukket kommersiell programvare og åpen kildekode innenfor sine vanlige IT-budsjetter.
