id: utsagn-24
number: 24
dimension: "Teknologisk kapasitet"
primary_question: "Kan kritiske digitale funksjoner og kompetanse opprettholdes under press?"
case_tag: palantir_forbud_offentlig_sektor
short_name: "Utrede Palantir før et eventuelt forbud"
text: >
  Bruken av Palantirs systemer i offentlig sektor bør utredes nærmere,
  i stedet for at Stortinget vedtar et forbud nå.
practical_stakes:
  enig: >
    Norske etater (som Tolletaten og Politiet) kan fortsette å bruke analyseplattformen fra det amerikanske teknologiselskapet Palantir mens regjeringen utreder sikkerhet, personvern og avhengighet nærmere. Det vedtas ikke et politisk forbud mot selskapet nå.
  uenig: >
    Stortinget griper inn og forbyr bruk av programvare fra det amerikanske selskapet Palantir i norsk offentlig sektor umiddelbart, av hensyn til personvern, demokratisk kontroll og utenlandsk teknologiavhengighet.
