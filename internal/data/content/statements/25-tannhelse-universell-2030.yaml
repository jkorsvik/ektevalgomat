id: utsagn-25
number: 25
dimension: "Universell grunnmur"
primary_question: "Fungerer samfunnets grunnleggende tjenester uansett bosted og inntekt?"
case_tag: tannhelse_universell_2030
short_name: "Gradvis og målrettet tannhelsereform"
text: >
  Regjeringen bør utvide det offentlige tannhelsetilbudet gradvis og
  målrettet mot dem som trenger det mest, ikke forplikte seg til en
  universell rett innen 2030.
practical_stakes:
  enig: >
    Offentlig tannhelse bygges ut skritt for skritt for utvalgte grupper (som unge voksne, eldre og syke) etter hvert som det finnes penger på statsbudsjettet, uten å lovfeste at alle voksne skal få tannbehandling på lik linje med annen helsehjelp innen 2030.
  uenig: >
    Stortinget forplikter seg til en full tannhelsereform med mål om at tannhelse innen 2030 skal inn i egenandelsordningen (frikort) for hele befolkningen, på linje med fastlege og sykehus.
