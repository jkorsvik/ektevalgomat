id: utsagn-26
number: 26
dimension: "Universell grunnmur"
primary_question: "Fungerer samfunnets grunnleggende tjenester uansett bosted og inntekt?"
case_tag: mobildekning_offentlige_veier_2030
short_name: "Mobildekning på alle offentlige veier innen 2030"
text: >
  Regjeringen bør sørge for at alle offentlige veier i Norge har
  mobildekning innen 2030, som en bindende frist.
practical_stakes:
  enig: >
    Staten påtar seg en bindende forpliktelse og tidsfrist om at hver eneste offentlige vei i Norge (riksveier, fylkesveier og kommunale veier) skal ha mobildekning senest innen 2030, av hensyn til trafikksikkerhet og beredskap.
  uenig: >
    Det lovfestes ingen bindende 2030-frist for full mobildekning på alle veier. Utbygging av mobilnett langs veiene skjer fortsatt gjennom kommersielle utbyggere og avgrensede statlige støtteordninger der det er samfunnsøkonomisk prioritert.
