id: utsagn-27
number: 27
dimension: "Universell grunnmur"
primary_question: "Fungerer samfunnets grunnleggende tjenester uansett bosted og inntekt?"
case_tag: ambulanse_responstid_alle_kommuner
short_name: "Responstidsmål for ambulanse i alle kommuner"
text: >
  Regjeringen bør komme tilbake til Stortinget med et konkret
  forslag til hvordan responstidsmålene for ambulanse kan nås i alle
  kommuner i landet.
practical_stakes:
  enig: >
    Regjeringen pålegges å legge fram en konkret og forpliktende plan for Stortinget som viser hvordan kravene til utrykningstid for ambulanse (12 minutter i tettbygde strøk og 25 minutter i grisgrendte strøk ved akutte hendelser) faktisk skal nås i hver eneste kommune.
  uenig: >
    Responstidsmålene for ambulanse beholdes som veiledende kvalitetsmål for helseforetakene, uten at regjeringen pålegges å legge fram en ny, særskilt opptrappingsplan for kommunene som ligger bak målet.
