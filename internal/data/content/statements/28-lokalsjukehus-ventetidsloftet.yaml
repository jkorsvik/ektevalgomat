id: utsagn-28
number: 28
dimension: "Universell grunnmur"
primary_question: "Fungerer samfunnets grunnleggende tjenester uansett bosted og inntekt?"
case_tag: lokalsjukehus_ventetidsloftet
short_name: "Bruke lokalsykehus aktivt for å kutte ventelister"
text: >
  Regjeringen bør sikre at lokalsykehus blir brukt aktivt i arbeidet for å
  få ned ventelistene i spesialisthelsetjenesten.
practical_stakes:
  enig: >
    Regjeringen pålegges å styre helseforetakene slik at ledig kapasitet ved mindre lokalsykehus brukes aktivt til å behandle pasienter og kutte helsekøene, i stedet for å samle mer av behandlingen på de store sentralsykehusene.
  uenig: >
    De regionale helseforetakene beholder dagens frihet til å organisere oppgavefordelingen mellom store sykehus og lokalsykehus i arbeidet med å få ned ventetidene, uten et slikt særskilt pålegg fra Stortinget.
