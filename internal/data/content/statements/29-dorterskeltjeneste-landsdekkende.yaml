id: utsagn-29
number: 29
dimension: "Universell grunnmur"
primary_question: "Fungerer samfunnets grunnleggende tjenester uansett bosted og inntekt?"
case_tag: dorterskeltjeneste_landsdekkende
short_name: "Landsdekkende dørterskeltjeneste for post"
text: >
  Regjeringen bør utrede innføring av dørterskeltjenesten (levering
  til dør for ikke-digitale og sårbare mottakere) som en
  landsdekkende posttjeneste.
practical_stakes:
  enig: >
    Regjeringen utreder å gjøre «dørterskeltjenesten» (der postbudet leverer posten helt på døra og ringer på hos eldre, uføre og ikke-digitale innbyggere) til en fast, landsdekkende offentlig tjeneste.
  uenig: >
    Det utredes ikke en fast, landsdekkende dørterskeltjeneste i Posten. Hjemlevering og postomdeling følger de ordinære reglene i postloven og eventuelle lokale prøveordninger.
