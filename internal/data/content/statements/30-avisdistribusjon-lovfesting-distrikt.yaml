id: utsagn-30
number: 30
dimension: "Universell grunnmur"
primary_question: "Fungerer samfunnets grunnleggende tjenester uansett bosted og inntekt?"
case_tag: avisdistribusjon_lovfesting_distrikt
short_name: "Lovfeste avisdistribusjon i distrikt"
text: >
  Regjeringen bør fremme forslag om å lovfeste at staten skal sikre
  avisdistribusjon i områder uten kommersielle avisbudnett, alle
  hverdager og lørdager.
practical_stakes:
  enig: >
    Staten lovfester en plikt til å sørge for at papiraviser blir levert ut alle hverdager og lørdager også i distrikter der kommersielle avisbudnett ikke lenger er lønnsomme.
  uenig: >
    Avisdistribusjon på hverdager og lørdager i distriktene lovfestes ikke som et fast statlig ansvar, men kjøpes inn gjennom tidsbegrensede avtaler og tilskuddsordninger innenfor statsbudsjettet.
