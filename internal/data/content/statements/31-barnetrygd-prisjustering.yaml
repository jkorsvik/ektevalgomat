id: utsagn-31
number: 31
dimension: "Barns muligheter"
codes_on: avvist_alternativ
primary_question: "I hvilken grad kompenserer samfunnet for forhold barn ikke har valgt?"
case_tag: barnetrygd_prisjustering_lovfestet
short_name: "Barnetrygden fastsettes i budsjettet"
text: >
  Barnetrygden bør fortsatt fastsettes i de årlige statsbudsjettene,
  ikke lovfestes med en automatisk årlig prisjustering.
practical_stakes:
  enig: >
    Barnetrygden holdes som en fast kroneytelse som politikerne må vedta å øke i de årlige statsbudsjettene. Hvis Stortinget lar være å øke satsen et år, spises verdien av barnetrygden gradvis opp av prisveksten (inflasjonen).
  uenig: >
    Barnetrygden knyttes ved lov til prisveksten (som pensjoner og grunnbeløpet i folketrygden), slik at den automatisk øker i takt med prisene hvert år uten at barnefamilier er avhengige av nye budsjettforhandlinger.
