id: utsagn-32
number: 32
dimension: "Barns muligheter"
primary_question: "I hvilken grad kompenserer samfunnet for forhold barn ikke har valgt?"
case_tag: sfo_12_timer_lovfesting
short_name: "Lovfestet ubetinget rett til 12 timer gratis SFO"
text: >
  Retten til 12 timer gratis skolefritidsordning (SFO) per uke for elever
  fra 1. til 3. trinn bør lovfestes.
practical_stakes:
  enig: >
    Retten til 12 timer gratis skolefritidsordning (SFO) i uka for alle barn på 1. til 3. trinn skrives direkte inn i opplæringslova, slik at kommuner eller skiftende budsjettflertall ikke kan fjerne eller avgrense ordningen uten en lovendring.
  uenig: >
    Gratis kjernetid i SFO styres gjennom de årlige statsbudsjettene og forskrift i stedet for å være en ubetinget, lovfestet individuell rettighet i opplæringslova.
