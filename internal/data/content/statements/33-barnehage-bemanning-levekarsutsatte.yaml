id: utsagn-33
number: 33
dimension: "Barns muligheter"
primary_question: "I hvilken grad kompenserer samfunnet for forhold barn ikke har valgt?"
case_tag: barnehage_bemanning_levekarsutsatte
short_name: "Økt barnehagebemanning i levekårsutsatte områder"
text: >
  Regjeringen bør legge til rette for økt grunnbemanning i barnehager i
  levekårsutsatte områder.
practical_stakes:
  enig: >
    Staten setter inn målrettede midler og tiltak for at barnehager i områder med lav inntekt, trangboddhet og store levekårsutfordringer får flere ansatte per barn enn den vanlige bemanningsnormen.
  uenig: >
    Staten pålegger eller finansierer ikke en egen, forsterket bemanningsnorm for levekårsutsatte områder utover de generelle nasjonale bemanningsreglene og kommunenes egne prioriteringer.
