id: utsagn-34
number: 34
dimension: "Barns muligheter"
primary_question: "I hvilken grad kompenserer samfunnet for forhold barn ikke har valgt?"
case_tag: gratis_barnehageplass_lavinntekt
short_name: "Gratis barnehageplass for lavinntektsfamilier"
text: >
  Regjeringen bør fremme forslag om å tilby barn i lavinntektsfamilier,
  som i dag har rett til gratis kjernetid i barnehagen, gratis
  barnehageplass i sin helhet.
practical_stakes:
  enig: >
    Barn i familier med lav inntekt, som i dag får 20 timer gratis kjernetid i uka i barnehagen, får hele barnehageplassen (fulltid) helt gratis finansiert av det offentlige.
  uenig: >
    Familier med lav inntekt beholder dagens ordning med 20 timer gratis kjernetid og inntektsgradert foreldrebetaling, men får ikke fulltids barnehageplass helt gratis.
