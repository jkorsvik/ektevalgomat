id: utsagn-35
number: 35
dimension: "Barns muligheter"
primary_question: "I hvilken grad kompenserer samfunnet for forhold barn ikke har valgt?"
case_tag: gratis_skolemat_grunnskolen
short_name: "Gratis skolemat for alle grunnskoleelever"
text: >
  Regjeringen bør legge fram en opptrappingsplan for et daglig, sunt og
  enkelt skolemåltid for alle elever i grunnskolen.
practical_stakes:
  enig: >
    Regjeringen legger fram en konkret, forpliktende opptrappingsplan for å innføre et daglig, gratis og sunt skolemåltid for alle elever i barneskolen og ungdomsskolen i hele landet.
  uenig: >
    Staten legger ikke fram en nasjonal plan for gratis skolemat til alle. Det blir fortsatt opp til den enkelte kommune og foreldrene (matpakke) hvordan skolemåltidet løses.
