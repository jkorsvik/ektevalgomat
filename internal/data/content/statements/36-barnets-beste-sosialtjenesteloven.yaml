id: utsagn-36
number: 36
dimension: "Barns muligheter"
primary_question: "I hvilken grad kompenserer samfunnet for forhold barn ikke har valgt?"
case_tag: barnets_beste_sosialtjenesteloven
short_name: "Lovfeste barnets beste i sosialtjenesteloven"
text: >
  Regjeringen bør komme tilbake til Stortinget med forslag om å
  lovfeste barnets beste som et grunnleggende hensyn i
  sosialtjenesteloven.
practical_stakes:
  enig: >
    Prinsippet om at «barnets beste skal være et grunnleggende hensyn» skrives direkte inn i sosialtjenesteloven (som styrer NAV og økonomisk sosialhjelp), slik at NAV plikter å vurdere barnas behov særskilt når foreldre søker nødhjelp, bolig eller økonomisk støtte.
  uenig: >
    Sosialtjenesteloven endres ikke. Hensynet til barnets beste ivaretas gjennom Grunnloven, barnekonvensjonen og eksisterende rundskriv uten en ny lovbestemmelse i sosialtjenesteloven.
