id: utsagn-37
number: 37
dimension: "Generasjonsansvar"
primary_question: "Synliggjøres konsekvensene 10–30 år frem?"
case_tag: otp_minstesats_okning
short_name: "Gradvis og utredet økning av OTP"
text: >
  En eventuell økning av minstesatsen i obligatorisk tjenestepensjon (OTP)
  bør utredes og skje gradvis, ikke vedtas nå som en økning fra 2 til 4
  prosent.
practical_stakes:
  enig: >
    Dagens lovpålagte minstesats som arbeidsgivere i privat sektor må spare til de ansattes pensjon (OTP), holdes på 2 prosent av lønna mens en eventuell økning utredes i samarbeid med partene i arbeidslivet.
  uenig: >
    Stortinget vedtar nå å doble den lovpålagte minstepensjonssparingen (OTP) fra 2 til 4 prosent av lønna, slik at over en million ansatte i privat sektor med minsteordning får høyere pensjonsopptjening, mot at bedriftenes lønnskostnader øker tilsvarende.
