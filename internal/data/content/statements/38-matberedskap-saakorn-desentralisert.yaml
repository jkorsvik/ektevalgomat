id: utsagn-38
number: 38
dimension: "Robusthet / adaptabilitet"
primary_question: "Tåler systemet bortfall, sjokk og feilantakelser?"
case_tag: matberedskap_saakorn_desentralisert
short_name: "Beredskapslagre for såkorn i desentralisert modell"
text: >
  Regjeringen bør sikre beredskapslagre for såkorn og matkorn i en
  desentralisert modell på gårdene rundt om i landet.
practical_stakes:
  enig: >
    Staten bygger opp beredskapslagrene for såkorn og matkorn desentralisert på gårder over hele landet, slik at kornlagrene er spredt geografisk dersom transportlinjer eller sentrale siloer rammes i en krise eller krig.
  uenig: >
    Kornberedskapen organiseres gjennom avtaler med de store kornhandelsaktørene og sentrale anlegg, uten et politisk krav om desentralisert lagring ute på enkeltgårder.
