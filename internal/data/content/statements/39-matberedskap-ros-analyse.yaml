id: utsagn-39
number: 39
dimension: "Robusthet / adaptabilitet"
primary_question: "Tåler systemet bortfall, sjokk og feilantakelser?"
case_tag: matberedskap_ros_analyse
short_name: "Nasjonal risiko- og sårbarhetsanalyse for matforsyning"
text: >
  Regjeringen bør gjennomføre en helhetlig nasjonal risiko- og
  sårbarhetsanalyse (ROS) for matsikkerhet og matforsyning i Norge.
practical_stakes:
  enig: >
    Regjeringen pålegges å lage én samlet nasjonal risiko- og sårbarhetsanalyse (ROS-analyse) for hele matkjeden i Norge, fra import av gjødsel, drivstoff og fôr til strømbrudd i dagligvarehandelen, for å avdekke hvor matforsyningen svikter ved krise eller krig.
  uenig: >
    Risiko i matforsyningen vurderes løpende gjennom departementenes og direktoratenes eksisterende arbeid, uten at Stortinget bestiller en ny, særskilt nasjonal totalanalyse.
