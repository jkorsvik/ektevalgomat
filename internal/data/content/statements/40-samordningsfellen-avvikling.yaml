id: utsagn-40
number: 40
dimension: "Generasjonsansvar"
primary_question: "Synliggjøres konsekvensene 10–30 år frem?"
case_tag: samordningsfellen_avvikling
short_name: "Utrede opphevelse av samordningsfellen for pensjonsreform-kullene 1944–1962"
text: >
  Regjeringen bør utrede tiltak som sikrer at offentlig ansatte født fra
  og med 1944 ikke taper tjenestepensjon ved å stå lenger i arbeid enn 67
  år.
practical_stakes:
  enig: >
    Regjeringen utreder hvordan «samordningsfellen» kan fjernes for offentlig ansatte (som sykepleiere, lærere og politi) født mellom 1944 og 1962, slik at de ikke mister deler av tjenestepensjonen sin dersom de velger å jobbe videre etter fylte 67 år.
  uenig: >
    Regjeringen setter ikke i gang en utredning for å endre pensjonsreglene tilbakevirkende for 1944–1962-kullene; dagens samordningsregler mellom folketrygd og offentlig tjenestepensjon blir stående.
