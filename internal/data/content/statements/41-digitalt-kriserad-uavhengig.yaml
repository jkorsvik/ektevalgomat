id: utsagn-41
number: 41
dimension: "Robusthet / adaptabilitet"
primary_question: "Tåler systemet bortfall, sjokk og feilantakelser?"
case_tag: digitalt_kriserad_uavhengig
short_name: "Uavhengig nasjonalt digitalt kriseråd"
text: >
  Regjeringen bør utrede etablering av et uavhengig nasjonalt digitalt
  kriseråd med ansvar for strategiske råd om digital sikkerhet,
  suverenitet og personvern.
practical_stakes:
  enig: >
    Regjeringen utreder å opprette et faglig uavhengig nasjonalt digitalt kriseråd som kan gi åpne, uavhengige råd om cybersikkerhet, personvern og teknologisk sårbarhet på tvers av samfunnssektorer.
  uenig: >
    Det utredes ikke et nytt uavhengig digitalt kriseråd. Rådgivning og krisehåndtering på digital sikkerhet skjer fortsatt gjennom eksisterende etater som Nasjonal sikkerhetsmyndighet (NSM), Datatilsynet og departementene.
