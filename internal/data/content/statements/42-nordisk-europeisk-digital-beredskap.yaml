id: utsagn-42
number: 42
dimension: "Robusthet / adaptabilitet"
primary_question: "Tåler systemet bortfall, sjokk og feilantakelser?"
case_tag: nordisk_europeisk_digital_beredskap
short_name: "Nordisk/europeisk samarbeid om digital beredskap"
text: >
  Regjeringen bør samarbeide tettere med nordiske og europeiske land om
  felles digitale løsninger og beredskap, der åpne kildekoder og digital
  suverenitet er førende.
practical_stakes:
  enig: >
    Norge forplikter seg til tettere nordisk og europeisk samarbeid om å bygge felles digitale beredskapsløsninger basert på åpen kildekode og europeisk/nordisk kontroll, for å redusere avhengigheten av amerikanske og kinesiske teknologigiganter.
  uenig: >
    Norge deltar i eksisterende internasjonalt samarbeid uten et nytt mandat som gjør åpen kildekode og digital suverenitet til førende prinsipper for nordisk/europeisk beredskapssamarbeid.
