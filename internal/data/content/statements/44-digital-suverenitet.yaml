id: utsagn-44
number: 44
dimension: "Tillegg (utenfor de 42)"
primary_question: "Beholder Norge reell beslutnings- og operasjonsevne over kritisk infrastruktur og sensitive data?"
case_tag: digital_suverenitet
short_name: "Fortsatt tillate skytjenester utenfor EØS"
text: >
  Offentlige virksomheter bør fortsatt kunne bruke
  skytjenesteleverandører utenfor EØS for kritisk infrastruktur og
  sensitive data, så lenge GDPR og norske sikkerhetskrav følges.
practical_stakes:
  enig: >
    Stat og kommuner kan lagre sensitive opplysninger og drifte samfunnskritisk IT hos skyselskaper med hovedkontor utenfor Europa (som amerikanske Microsoft, Amazon og Google), forutsatt at personvernforordningen (GDPR) og norske sikkerhetskrav følges.
  uenig: >
    Det innføres forbud eller strenge restriksjoner mot å legge samfunnskritisk IT og sensitive innbyggerdata hos skyselskaper utenfor EØS, fordi amerikanske og andre utenlandske eiere kan pålegges å utlevere data etter sitt hjemlands etterretningslover.
