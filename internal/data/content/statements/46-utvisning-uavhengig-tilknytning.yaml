id: utsagn-46
number: 46
dimension: "Tilgang, integrering og rettsstat"
primary_question: "Hvem får tilgang til fellesgodene, på hvilke vilkår, og hvordan håndhever samfunnet loven?"
case_tag: utvisning_uavhengig_tilknytning
short_name: "Utvisning uavhengig av tilknytning til Norge"
text: >
  Utlendinger som dømmes for alvorlig kriminalitet, bør utvises
  uavhengig av hvor lenge de har bodd i Norge eller hvilket
  oppholdsgrunnlag de har.
practical_stakes:
  enig: >
    Botid i Norge og oppholdsgrunnlag (for eksempel flyktningstatus
    eller permanent oppholdstillatelse) teller ikke lenger med når
    myndighetene vurderer om en utlending som er dømt for alvorlig
    kriminalitet, skal utvises. Utvisning blir hovedregelen ved
    alvorlig kriminalitet, uansett hvor lenge personen har bodd i
    Norge.
  uenig: >
    Botid og oppholdsgrunnlag fortsetter å telle med i vurderingen av
    om en utlending dømt for alvorlig kriminalitet skal utvises. Lang
    botid eller et sterkt oppholdsgrunnlag kan fortsatt være en grunn
    til at utvisning ikke skjer.
