id: utsagn-48
number: 48
dimension: "Tilgang, integrering og rettsstat"
primary_question: "Hvem får tilgang til fellesgodene, på hvilke vilkår, og hvordan håndhever samfunnet loven?"
case_tag: statsborgerskap_skjerpede_krav
short_name: "Skjerpede krav for statsborgerskap"
text: >
  Kravene for norsk statsborgerskap bør skjerpes, for eksempel med
  høyere språkkrav og krav om å forsørge seg selv.
practical_stakes:
  enig: >
    Det blir vanskeligere å få norsk statsborgerskap: søkere må
    dokumentere bedre norskkunnskaper enn i dag og vise at de kan
    forsørge seg selv, i tillegg til de kravene som allerede gjelder
    (botid, vandel med mer).
  uenig: >
    Kravene for norsk statsborgerskap holdes som i dag. Verken
    språkkrav eller krav om selvforsørgelse skjerpes.
