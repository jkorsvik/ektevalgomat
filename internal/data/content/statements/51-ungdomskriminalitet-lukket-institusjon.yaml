id: utsagn-51
number: 51
dimension: "Tilgang, integrering og rettsstat"
primary_question: "Hvem får tilgang til fellesgodene, på hvilke vilkår, og hvordan håndhever samfunnet loven?"
case_tag: ungdomskriminalitet_lukket_institusjon
short_name: "Lukket institusjon for ungdomskriminalitet"
text: >
  Det bør være mulig å holde ungdom med alvorlig kriminell atferd i
  lukket institusjon så lenge det er behov for det.
practical_stakes:
  enig: >
    Det innføres en hjemmel for å holde ungdom med alvorlig kriminell
    atferd i lukket institusjon uten en fast øvre tidsgrense —
    oppholdet varer så lenge behovet vurderes å være til stede.
  uenig: >
    Ingen slik hjemmel innføres. Opphold i lukket institusjon for
    denne gruppen ungdom fortsetter å ha de tidsbegrensningene som
    gjelder i dag.
