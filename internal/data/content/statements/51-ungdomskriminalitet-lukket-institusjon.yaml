id: utsagn-51
number: 51
dimension: "Tilgang, integrering og rettsstat"
primary_question: "Hvem får tilgang til fellesgodene, på hvilke vilkår, og hvordan håndhever samfunnet loven?"
case_tag: ungdomskriminalitet_lukket_institusjon
short_name: "Lukket institusjon for ungdomskriminalitet"
text: >
  Det bør være mulig å holde ungdom med alvorlig kriminell atferd i
  lukket institusjon så lenge det er behov for det.
practical_stakes:
  enig: >
    Det innføres lovhjemmel for at mindreårige som begår gjentatt eller svært alvorlig kriminalitet, kan holdes tilbake på lukket institusjon så lenge det vurderes som nødvendig av hensyn til samfunnsvernet og rehabilitering, uten dagens faste øvre tidsgrense.
  uenig: >
    Dagens tidsgrenser for tvangsopphold på institusjon for mindreårige opprettholdes, av hensyn til rettsvern og barns rettigheter.
