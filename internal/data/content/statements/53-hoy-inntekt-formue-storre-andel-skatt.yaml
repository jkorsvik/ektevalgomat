id: utsagn-53
number: 53
dimension: "Finansiering av fellesskapet"
primary_question: "Hvordan betaler vi for fellesgodene, og hvem bærer kostnaden nå og om 30 år?"
case_tag: hoy_inntekt_formue_storre_andel_skatt
short_name: "Høy inntekt og formue betaler mer skatt"
text: >
  Personer med høy inntekt og stor formue bør betale en større andel
  av skatten enn i dag.
practical_stakes:
  enig: >
    Toppskatt (trinnskatt på høye lønninger), utbytteskatt eller formuesskatt økes for dem som tjener og eier mest, mens vanlige lønnstakere og husholdninger med lave eller middels inntekter får lavere skatt eller en mindre del av den samlede skatteregningen.
  uenig: >
    Skattesystemet gjøres ikke mer progressivt enn i dag. Fordelingen mellom høye og vanlige inntekter holdes uendret, eller skattene på kapital, eierskap og høye inntekter senkes.
