- id: budget-lead-2-skatt-niva
  kind: budget
  statement: utsagn-55
  method: method/budget.md
  status: passed
  note: 'Next from staging/scout-alternative-budgets/LEADS.md, lead 2: each party''s own total tax level
    in Innst. 2 S (2025-2026), the finance committee''s comparison table, one column per party. Tier A
    fiscal action with a statement that exists and a document already in the fetch cache. Read the scout''s
