- id: budget-prisradet-h-2026
  kind: budget
  statement: utsagn-16
  party: h
  keywords:
  - Prisråd
  - havbruk
  - normpris
  - Innst. 8 S
  method: method/budget.md
  status: passed
  result: 'Promoted 2026-10-27 as 766-prisradet-post23-null.yaml: Høyre''s own column in Innst. 8 S (2025-2026)
    punkt 3.3.9 sets kap. 917 post 23 «Prisråd for havbruk» to 0 against the government''s 17 900, and
    every other party leaves it. Coded +2, agreeing with the existing Høyre row 303-h-prisradet-for.yaml
    (a merknad plus votering 28077), so the cell now holds two dates, 2025-12-12 and 2026-06-01. gate.py
    PASS; ekv-verifier SUPPORTED after rebuilding the column mapping and reconciling every column''s deviations
    to its own sum line. Two traps worth keeping: the table header string occurs three times in the document
    (rammeområde 9, 10 and 11), so a header-only fragment resolves to the wrong table unless it carries
    the «Utgifter rammeområde 10» anchor; and NO quote from this table can be archived, because 100 normalised
    characters cover 13 572 characters of source whitespace and the window bound is 6 000. The excerpt
    is therefore the merknad sentence that carries the claim, with the table figures in claim_action.
    Measured, in docs/roadmap.md.'
- id: scout-alternative-budgets
  kind: scout
  statement: ''
  method: method/budget.md
  status: passed
  result: 'Scout pass 2026-10-27, leads only, nothing coded: staging/scout-alternative-budgets/LEADS.md,
