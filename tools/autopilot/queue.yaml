    §3.2 row 21 «Skatter og avgifter», coded on the size and direction of each party''s own netto rammevedtak
    against the government''s. frp +2 (51,4 mrd. kroner less revenue), h +2 (15,8 mrd. less), v +2 (6,9
    mrd. less), sv -2 (32,3 mrd. more), rodt -2 (28,6 mrd. more), mdg -2 (38,1 mrd. more). Every figure
    was parsed independently three times (the scout''s cache index, the harvester, and the verifier) and
    agreed digit for digit, and each row is cross-checked against the same party''s rammevedtak nr. 21
    in kroner in chapter 4 «Forslag fra mindretall», which is an independent block in the same document.
    First tier-A evidence utsagn-55 has ever had: before this the cell held seven programme rows only.
    gate.py PASS 6 files; the gate was mutation-tested (a corrupted Venstre quote produced MISS score=79,
