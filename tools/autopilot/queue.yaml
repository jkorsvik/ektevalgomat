- id: gov-composition
  kind: reference
  role: scout-then-harvester
  statement: ''
  method: method/reference.md
  status: passed
  note: 'Who governed when: cabinet, party composition, minister per post, from and to date, for every
    government that overlaps the evidence range (2009-2026). One small authoritative table from regjeringen.no
    and Stortinget. Why it matters more than it looks: every government attribution today rests on prose
    in method/budget.md ("Sp left 2025-02-04"). Without the table, a 2026 proposition can be filed as
    Ap/Sp and a minister can be attributed to the wrong party. Cheap, tier A, prevents a whole class of
    errors, and nothing in the dataset can check it today.

    '
  result: 'Ingested as content/government/{periods,ministers}.yaml: 7 periods of constant cabinet composition,
    245 minister postings, each with its page and read date. Tests assert continuity with a shared change
    date, coverage from 2009-01-01 to the newest evidence date, and that every minister''s party sits
    in the cabinet governing on the day the posting started (all 245 pass).'
