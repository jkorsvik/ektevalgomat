    The acquiescence ratchet was measured before and after in a scratch copy and stayed at 12/12, which
    is its ceiling, not headroom. Ap and Sp got no row: the table gives them no own column, and attributing
    the joint «A, Sp og R» forlik figure (+54 000) to either would be the error the innstilling''s own
    introduction warns about. KrF was withheld, see krf-skatteniva-polarity. verify_excerpts 0 failed
    (344 excerpts), verify_votes 0 mismatch (417 files).

    '
- id: krf-skatteniva-polarity
  kind: budget
  statement: utsagn-55
  party: krf
  method: method/budget.md
  status: blocked
  blocked_on: 'An owner coding decision, not a mechanical wall. The drafted row is staging/budget-lead-2-skatt-niva/not-promoted/krf-skatteniva-innst2s.yaml
    with its REASON.md. KrF''s own budget moves the total by 3,4 mrd. kroner more in revenue on the netto
    rammevedtak (0,18 pst. of the level), and by 1,8 mrd. LESS in KrF''s own påløpt column in the same
    merknad, so the direction is not robust across measurement bases. Coding it -1 would move KrF''s published
    position on utsagn-55 from -2 to -1 as a pure side effect of the cell being a mean, on the strength
    of 0,18 pst., and the same threshold is not applied to Venstre''s 0,37 pst. in the batch that did
    ship. Programme row 548 codes the same stance («holde skatte- og avgiftsnivået om lag på dagens nivå»)
    as -2. RESOLVED BY THE WRITTEN RULE (tools/autopilot/method/position-scale.md): the strongest
    unambiguous own instrument decides the magnitude, and a weaker or self-contradicting document may not
    downgrade it. KrF''s programme point is an instrument written as a goal, so the party is -2 on
    utsagn-55; a figure that changes sign between the netto rammevedtak and KrF''s own påløpt column in
    the same merknad does not state the claim directly, so it cannot earn magnitude 2 and may not pull the
    cell to -1. Nothing moves and the budget row is not added. This is option (1) reached without a
    threshold. The owner only has to ratify the rule. Figures stay in the REASON.

    '
  note: 'Follow-up to budget-lead-2-skatt-niva, which shipped six of the seven party columns from the
    same table.

    '
- id: skatt-niva-ap-sp-merknader
  kind: budget
  statement: utsagn-55
  method: method/budget.md
  status: passed
  result: >
    Promoted 2026-10-28 as evidence 773 and 774, the first tier-A rows utsagn-55 has for Ap and
    Sp. 773 ap merknad 2.1.2.1, coded -2; 774 sp merknad 3.1.2.5, coded +1. Both quotes were
    re-verified as exact substrings of the cached Innst. 2 S after the gate's own normalisation
    (110 and 106 chars). Two corrections to this item's own note: (1) the Ap row does NOT pull
    the cell toward -1. The statement's uenig pole reads «holdes som i dag eller økes», and Ap's
