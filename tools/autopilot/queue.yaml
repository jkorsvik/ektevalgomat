- id: budget-vindkraft-kommune
  kind: budget
  statement: ''
  keywords:
  - vindkraft
  - produksjonsavgift
  - grunnrenteskatt
  - NVE
  - RME
  method: method/budget.md
  status: blocked
  blocked_on: No statement covers vindkraft-kommuneinntekter. The gate rejects an unknown statement_id,
    so this item cannot produce promotable evidence until the owner either names an existing statement
    it bears on or approves a new statement. The statement list has no energy-income or municipal-vindkraft
    statement; utsagn-08 and 09 are about krafteksport and Skagerrak cables, not local revenue.
  note: 'Lead: kommuner get vindkraft income and the production fee is pre-paid; is it enough to trigger
    build-out? Open Prop. 1 S (OED), quote the posts.

    '
- id: excerpt-tail-nonvote
  kind: excerpt
  statement: ''
  method: method/excerpt.md
  status: running
  note: '299 evidence files carry no verbatim_excerpt, but 281 of them are votes where the claim IS the
    action (status forslag_avvist_stemte_mot and siblings) and a quote would be decoration. The tail that
    can be quoted is the ~18 non-vote rows: kontekst (5), ffi_monitorering (2), and one each of vedtak,
    lovendring, mandat, rettsstatus, ffi_attribusjon, effekt, nettverksanalyse, attribusjon, melding_til_stortinget,
    innstilling/innstilt, representantforslag/fremmet. Job: add a verbatim excerpt only where the source
    document actually contains a sentence that carries the claim, and say so plainly where it does not.

    '
- id: mixed-voteringer-review
  kind: verify
  statement: ''
  method: method/mixed.md
  status: running
  note: '23 evidence files are MIXED in verify_votes.py: the party voted differently on two related voterings
    cited by the same file. Not a failure (exit 0), but the coded direction may rest on the wrong vote.
    Concentrations: stroemprismakspris-mot (8 files, 83-90), kjernekraft-kommersiell (5, 95-99), digital
    suverenitet (3, 446/447/451), plus tannhelse, SFO, nasjonal, microsoft365. Job: for each, read both
    voterings and state whether the coded position still follows, or which vote it should cite instead.

    '
