    to the avvikle pole and code the same documents H +2, Sp -2, Ap +2 (60 statements). Full numbers in
    docs/roadmap.md, section «The bredbånd ratchet, measured (2026-10-27)». The ratchet is not lowered,
    so what is left is the owner''s polarity decision, not a mechanical wall. Correction to this item''s
    earlier note: there are two institutional rows, not three, and staging 01 is not a new row - content
